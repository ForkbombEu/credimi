limit.maxIDLength:
  - value: 255
    constraints: {}
system.forceSearchAttributesCacheRefreshOnRead:
  - value: true # Dev setup only. Please don't turn this on in production.
    constraints: {}
# FCAF aggregate validation reports exceed the default 2MB per-event blob limit.
limit.blobSize.error:
  - value: 104857600
    constraints: {}
limit.blobSize.warn:
  - value: 104857600
    constraints: {}
# Pipelines with many wallet actions exceed the default 2KB per search
# attribute value (ActionsID keyword list), which rejects the workflow start.
limit.searchAttributesSizeOfValue:
  - value: 16384
    constraints: {}
