limit.maxIDLength:
  - value: 255
    constraints: {}
system.forceSearchAttributesCacheRefreshOnRead:
  - value: true # Dev setup only. Please don't turn this on in production.
    constraints: {}
# FCAF aggregate validation reports exceed the default 2MB per-event blob limit.
limit.blobSize.error:
  - value: 104857600
    constraints: {}
limit.blobSize.warn:
  - value: 104857600
    constraints: {}
# Pipelines with many wallet actions exceed the default 2KB per search
# attribute value (ActionsID keyword list), which rejects the workflow start.
# Temporal 1.32 registers it as frontend.searchAttributesSizeOfValueLimit and
# ignores the old limit.searchAttributesSizeOfValue name as "unregistered".
frontend.searchAttributesSizeOfValueLimit:
  - value: 16384
    constraints: {}
# Nexus headers a workflow may not set on an operation. This key replaces the
# server defaults, so the first nine entries repeat the Temporal 1.32.2 list
# (components/nexusoperations/config.go). The last four are headers the server
# sets on a dispatch: the server copies user headers over its own, and a
# nexus-link header would replace the caller link the mobile-device operations
# check (requireCredimiCaller). Credimi's own operations set no Nexus header.
component.nexusoperations.disallowedHeaders:
  - value:
      - request-timeout
      - xdc-redirection
      - xdc-redirection-api
      - xdc-redirection-source-cell
      - caller-name
      - caller-type
      - call-initiation
      - temporal-principal-type
      - temporal-principal-name
      - nexus-link
      - nexus-request-id
      - nexus-operation-token
      - temporal-callback-token
    constraints: {}
