services:
  elasticsearch:
    container_name: temporal-elasticsearch
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${CREDIMI_ELASTIC_PASSWORD:?CREDIMI_ELASTIC_PASSWORD is required}
    image: elasticsearch:${ELASTICSEARCH_VERSION}
    expose:
      - 9200
    volumes:
      - esdata:/usr/share/elasticsearch/data
  postgresql:
    container_name: temporal-postgresql
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
    image: postgres:${POSTGRESQL_VERSION}
    expose:
      - 5432
    volumes:
      - /var/lib/postgresql/data
  # The temporalio/server image does not create or upgrade its schemas: this job does,
  # on every start, with the admin-tools image of the same version. Every command is
  # idempotent. The index name must match ES_VIS_INDEX of the temporal service.
  # Credimi registers namespaces and search attributes itself.
  temporal_schema:
    depends_on:
      - postgresql
      - elasticsearch
    environment:
      - SQL_PASSWORD=temporal
      - ES_USER=elastic
      - ES_PWD=${CREDIMI_ELASTIC_PASSWORD:?CREDIMI_ELASTIC_PASSWORD is required}
    image: temporalio/admin-tools:${TEMPORAL_ADMIN_TOOLS_VERSION}
    restart: "no"
    entrypoint: ["/bin/sh", "-euc"]
    command:
      - |
        until nc -z postgresql 5432; do sleep 1; done
        until temporal-elasticsearch-tool --ep http://elasticsearch:9200 ping >/dev/null 2>&1; do sleep 2; done
        temporal-sql-tool --plugin postgres12 --ep postgresql -p 5432 -u temporal --db temporal create
        temporal-sql-tool --plugin postgres12 --ep postgresql -p 5432 -u temporal --db temporal setup-schema -v 0.0
        temporal-sql-tool --plugin postgres12 --ep postgresql -p 5432 -u temporal --db temporal update-schema -d /etc/temporal/schema/postgresql/v12/temporal/versioned
        temporal-elasticsearch-tool --ep http://elasticsearch:9200 setup-schema
        temporal-elasticsearch-tool --ep http://elasticsearch:9200 create-index --index temporal_visibility_v1_dev
        temporal-elasticsearch-tool --ep http://elasticsearch:9200 update-schema --index temporal_visibility_v1_dev
  temporal:
    depends_on:
      temporal_schema:
        condition: service_completed_successfully
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgresql
      - DYNAMIC_CONFIG_FILE_PATH=/etc/temporal/config/dynamicconfig/development-sql.yaml
      - ENABLE_ES=true
      - ES_SEEDS=elasticsearch
      - ES_VERSION=v7
      - ES_USER=elastic
      - ES_PWD=${CREDIMI_ELASTIC_PASSWORD:?CREDIMI_ELASTIC_PASSWORD is required}
      # The index and shard count existing data was created with; never change them.
      - ES_VIS_INDEX=temporal_visibility_v1_dev
      - NUM_HISTORY_SHARDS=4
      # Listen on localhost too, for the healthcheck.
      - BIND_ON_IP=0.0.0.0
      - LOG_LEVEL=info
      # JWT authorization: Credimi signs tokens, public keys come from the jwks volume.
      - TEMPORAL_AUTH_AUTHORIZER=default
      - TEMPORAL_AUTH_CLAIM_MAPPER=default
      - TEMPORAL_JWT_KEY_SOURCE1=file:///etc/temporal/jwks/jwks.json
      - TEMPORAL_JWT_KEY_REFRESH=10s
      # Temporal's own system workers (Schedules, batch) and both UIs carry no
      # token; they use the internal frontend on 7236, never published.
      - USE_INTERNAL_FRONTEND=true
      - TEMPORAL_SERVICES=frontend,internal-frontend,history,matching,worker
    image: temporalio/server:${TEMPORAL_VERSION}
    # Loopback only: clients outside the server use temporal.credimi.io:443 through Caddy.
    ports:
      - 127.0.0.1:${TEMPORAL_PORT:-7233}:7233
    # Caddy serves gRPC at temporal.credimi.io:443 (Coolify domain
    # https://temporal.credimi.io:7233); gRPC needs HTTP/2 to the container.
    # Coolify generates the proxy as caddy_0.handle_path.0_reverse_proxy
    # (Strip Prefixes on); these labels extend that directive.
    labels:
      - caddy_0.handle_path.0_reverse_proxy.transport=http
      - caddy_0.handle_path.0_reverse_proxy.transport.versions=h2c 2
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 60
    volumes:
      - ./deployment/dynamicconfig:/etc/temporal/config/dynamicconfig
      # Public keys Credimi writes at startup (TEMPORAL_JWT_KEY_SOURCE1).
      - ./temporal-jwks:/etc/temporal/jwks:ro
    logging:
      driver: local
      options:
        max-size: "1g"
        max-file: "5"
  temporal_ui:
    container_name: temporal-ui
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7236
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
      - TEMPORAL_UI_PORT=8280
    image: temporalio/ui:${TEMPORAL_UI_VERSION}
    # Loopback only: a published port bypasses Caddy and its basic auth.
    ports:
      - 127.0.0.1:${TEMPORAL_UI_PORT:-8280}:8280
    labels:
      - 'caddy_0.basicauth.admin="${TEMPORAL_BASIC_AUTH_HASH:?}"'
  # Read-only Temporal UI embedded in Credimi run pages. No published port: only
  # Credimi reaches it, through the org-scoped proxy at /temporal-ui (pkg/internal/temporalui).
  temporal_ui_embedded:
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7236
      - TEMPORAL_UI_PORT=8080
      - TEMPORAL_UI_PUBLIC_PATH=/temporal-ui
      - TEMPORAL_DISABLE_WRITE_ACTIONS=true
      - TEMPORAL_DISABLE_NEWS_FETCH=true
      - TEMPORAL_NAV_COLLAPSED_BY_DEFAULT=true
    image: temporalio/ui:${TEMPORAL_UI_VERSION}
  # Agent chat UI embedded in Credimi action author session pages. No published port: only
  # Credimi reaches it, through the session-scoped proxy at /action-author-ui (pkg/internal/actionauthorui).
  action_author_ui:
    build:
      context: ./agents/action-author-ui
      args:
        - PYTHON_VERSION=${ACTION_AUTHOR_UI_PYTHON_VERSION:?ACTION_AUTHOR_UI_PYTHON_VERSION is required}
        - UV_VERSION=${ACTION_AUTHOR_UI_UV_VERSION:?ACTION_AUTHOR_UI_UV_VERSION is required}
        - AGENT_HARNESS_VERSION=${AGENT_HARNESS_VERSION:?AGENT_HARNESS_VERSION is required}
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_TLS=false
      - CREDIMI_TEMPORAL_JWKS_DIR=/etc/credimi/temporal-jwks
    volumes:
      # Public keys Credimi writes at startup; the UI verifies each request's token with them.
      - ./temporal-jwks:/etc/credimi/temporal-jwks:ro
  credimi:
    depends_on:
      temporal:
        condition: service_healthy
      temporal_ui_embedded:
        condition: service_started
      action_author_ui:
        condition: service_started
    stop_grace_period: 30s
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - PUBLIC_TURNSTILE_SITE_KEY=${PUBLIC_TURNSTILE_SITE_KEY:?PUBLIC_TURNSTILE_SITE_KEY is required}
    environment:
      - ADDRESS_GRAFANA=http://grafana:8085
      - ADDRESS_UI=http://localhost:5100
      - ADDRESS_TEMPORAL_UI=http://temporal_ui_embedded:8080
      - ADDRESS_ACTION_AUTHOR_UI=http://action_author_ui:8080
      - ROOT_DIR=/app
      - DATA_DB_PATH=/app/pb_data/data.db
      - MAIL_SENDER=no-reply@credimi.io
      - RUN_STEPCI_PATH=pkg/OpenID4VP/stepci/runStepCI.js
      - SCHEMAS_PATH=schemas
      - TEMPORAL_ADDRESS=temporal:7233
      - PORT=5100
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:?TURNSTILE_SECRET_KEY is required}
      - CREDIMI_RUNNER_CREDENTIAL_SECRET=${CREDIMI_RUNNER_CREDENTIAL_SECRET:?CREDIMI_RUNNER_CREDENTIAL_SECRET is required}
      - CREDIMI_TEMPORAL_SECRETS_ENCRYPTION_KEY=${CREDIMI_TEMPORAL_SECRETS_ENCRYPTION_KEY:?CREDIMI_TEMPORAL_SECRETS_ENCRYPTION_KEY is required}
      - CREDIMI_TEMPORAL_JWT_KEYS=${CREDIMI_TEMPORAL_JWT_KEYS:?CREDIMI_TEMPORAL_JWT_KEYS is required}
      - CREDIMI_TEMPORAL_JWKS_DIR=/app/temporal-jwks
    ports:
      - 8090:8090
    volumes:
      - ./pb_data/:/app/pb_data
      - ./temporal-jwks:/app/temporal-jwks
      - /var/run/docker.sock:/var/run/docker.sock
volumes:
  esdata:
