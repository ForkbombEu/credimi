services:
  elasticsearch:
    container_name: temporal-elasticsearch
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${CREDIMI_ELASTIC_PASSWORD:?CREDIMI_ELASTIC_PASSWORD is required}
    image: elasticsearch:${ELASTICSEARCH_VERSION}
    expose:
      - 9200
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsu elastic:$$ELASTIC_PASSWORD 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
  postgresql:
    container_name: temporal-postgresql
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
    image: postgres:${POSTGRESQL_VERSION}
    expose:
      - 5432
    volumes:
      - temporal-postgresql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 5s
      retries: 60
  # One-shot job: creates or upgrades the Postgres and Elasticsearch schemas
  # (scripts/temporal-schema.sh). Search attributes are registered by Credimi.
  temporal_schema:
    depends_on:
      postgresql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      - SQL_HOST=postgresql
      - SQL_PORT=5432
      - SQL_USER=temporal
      - SQL_PASSWORD=temporal
      - ES_SERVER=http://elasticsearch:9200
      - ES_USER=elastic
      - ES_PWD=${CREDIMI_ELASTIC_PASSWORD:?CREDIMI_ELASTIC_PASSWORD is required}
      - ES_VISIBILITY_INDEX=temporal_visibility_v1_dev
    image: temporalio/admin-tools:${TEMPORAL_ADMIN_TOOLS_VERSION}
    entrypoint: ["/bin/sh", "/scripts/temporal-schema.sh"]
    restart: "no"
    volumes:
      - ./scripts:/scripts:ro
  temporal:
    depends_on:
      temporal_schema:
        condition: service_completed_successfully
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgresql
      - DYNAMIC_CONFIG_FILE_PATH=/etc/temporal/config/dynamicconfig/development-sql.yaml
      - ENABLE_ES=true
      - ES_SEEDS=elasticsearch
      - ES_VERSION=v7
      - ES_USER=elastic
      - ES_PWD=${CREDIMI_ELASTIC_PASSWORD:?CREDIMI_ELASTIC_PASSWORD is required}
      - ES_VIS_INDEX=temporal_visibility_v1_dev
      - BIND_ON_IP=0.0.0.0
      - NUM_HISTORY_SHARDS=4
      # Read only by temporalio/auto-setup (temporal-upgrade hop to 1.29.7).
      - SKIP_DEFAULT_NAMESPACE_CREATION=true
      - SKIP_ADD_CUSTOM_SEARCH_ATTRIBUTES=true
      - LOG_LEVEL=info
    image: ${TEMPORAL_SERVER_IMAGE:-temporalio/server}:${TEMPORAL_VERSION}
    ports:
      - ${TEMPORAL_PORT:-7233}:7233
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 60
    volumes:
      - ./deployment/dynamicconfig:/etc/temporal/config/dynamicconfig
    logging:
      driver: local
      options:
        max-size: "1g"
        max-file: "5"
  temporal_ui:
    container_name: temporal-ui
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
      - TEMPORAL_UI_PORT=8280
    image: temporalio/ui:${TEMPORAL_UI_VERSION}
    ports:
      - ${TEMPORAL_UI_PORT:-8280}:8280
  # Read-only Temporal UI embedded in Credimi run pages. No published port: only
  # Credimi reaches it, through the org-scoped proxy at /temporal-ui (pkg/internal/temporalui).
  temporal_ui_embedded:
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_UI_PORT=8080
      - TEMPORAL_UI_PUBLIC_PATH=/temporal-ui
      - TEMPORAL_DISABLE_WRITE_ACTIONS=true
      - TEMPORAL_DISABLE_NEWS_FETCH=true
      - TEMPORAL_NAV_COLLAPSED_BY_DEFAULT=true
    image: temporalio/ui:${TEMPORAL_UI_VERSION}
  credimi:
    depends_on:
      temporal:
        condition: service_healthy
      temporal_ui_embedded:
        condition: service_started
    stop_grace_period: 30s
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - PUBLIC_TURNSTILE_SITE_KEY=${PUBLIC_TURNSTILE_SITE_KEY:?PUBLIC_TURNSTILE_SITE_KEY is required}
    environment:
      - ADDRESS_GRAFANA=http://grafana:8085
      - ADDRESS_UI=http://localhost:5100
      - ADDRESS_TEMPORAL_UI=http://temporal_ui_embedded:8080
      - ROOT_DIR=/app
      - DATA_DB_PATH=/app/pb_data/data.db
      - MAIL_SENDER=no-reply@credimi.io
      - RUN_STEPCI_PATH=pkg/OpenID4VP/stepci/runStepCI.js
      - SCHEMAS_PATH=schemas
      - TEMPORAL_ADDRESS=temporal:7233
      - PORT=5100
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:?TURNSTILE_SECRET_KEY is required}
      - CREDIMI_RUNNER_CREDENTIAL_SECRET=${CREDIMI_RUNNER_CREDENTIAL_SECRET:?CREDIMI_RUNNER_CREDENTIAL_SECRET is required}
      - CREDIMI_TEMPORAL_SECRETS_ENCRYPTION_KEY=${CREDIMI_TEMPORAL_SECRETS_ENCRYPTION_KEY:?CREDIMI_TEMPORAL_SECRETS_ENCRYPTION_KEY is required}
    ports:
      - 8090:8090
    volumes:
      - ./pb_data/:/app/pb_data
      - /var/run/docker.sock:/var/run/docker.sock
volumes:
  esdata:
  temporal-postgresql-data:
