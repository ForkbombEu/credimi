services:
  elasticsearch:
    container_name: temporal-elasticsearch
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${CREDIMI_ELASTIC_PASSWORD:?CREDIMI_ELASTIC_PASSWORD is required}
    image: elasticsearch:${ELASTICSEARCH_VERSION}
    expose:
      - 9200
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      # Wait until HTTP + auth succeed; yellow is enough for single-node visibility.
      test:
        [
          "CMD-SHELL",
          "curl -fsS -u \"elastic:$${ELASTIC_PASSWORD}\" \"http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s\" >/dev/null",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s
  postgresql:
    container_name: temporal-postgresql
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
    image: postgres:${POSTGRESQL_VERSION}
    expose:
      - 5432
    volumes:
      - /var/lib/postgresql/data
    healthcheck:
      # Probe TCP (-h localhost), not the Unix socket: during initdb pg_isready
      # on the socket can report ready while clients still get "starting up".
      test: ["CMD-SHELL", "pg_isready -h localhost -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
  temporal:
    depends_on:
      postgresql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgresql
      - DYNAMIC_CONFIG_FILE_PATH=/etc/temporal/config/dynamicconfig/development-sql.yaml
      - ENABLE_ES=true
      - ES_SEEDS=elasticsearch
      - ES_VERSION=v7
      - ES_USER=elastic
      - ES_PWD=${CREDIMI_ELASTIC_PASSWORD:?CREDIMI_ELASTIC_PASSWORD is required}
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233
      - LOG_LEVEL=info
    image: temporalio/auto-setup:${TEMPORAL_VERSION}
    ports:
      - ${TEMPORAL_PORT:-7233}:7233
    volumes:
      - ./deployment/dynamicconfig:/etc/temporal/config/dynamicconfig
    # Recover from one-shot schema-setup races if Postgres/ES health still flaps.
    restart: on-failure
    healthcheck:
      # auto-setup listens on the service DNS name (TEMPORAL_ADDRESS), not 127.0.0.1.
      test:
        ["CMD-SHELL", "temporal operator cluster health | grep -Fxq SERVING"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging:
      driver: local
      options:
        max-size: "1g"
        max-file: "5"
  temporal_ui:
    container_name: temporal-ui
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
      - TEMPORAL_UI_PORT=8280
    image: temporalio/ui:${TEMPORAL_UI_VERSION}
    ports:
      - ${TEMPORAL_UI_PORT:-8280}:8280
  temporal_setup:
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    image: temporalio/admin-tools:${TEMPORAL_ADMIN_TOOLS_VERSION}
    entrypoint:
      [
        "/bin/bash",
        "-lc",
        "set -euo pipefail; /scripts/wait-for-it.sh -s -t 0 temporal:7233; /scripts/temporal-search-attributes.sh",
      ]
    restart: "no"
    volumes:
      - ./scripts:/scripts:ro
  credimi:
    depends_on:
      temporal:
        condition: service_healthy
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - PUBLIC_POCKETBASE_URL=${PUBLIC_POCKETBASE_URL:-https://demo.credimi.io}
        - PUBLIC_TURNSTILE_SITE_KEY=${PUBLIC_TURNSTILE_SITE_KEY:?PUBLIC_TURNSTILE_SITE_KEY is required}
    environment:
      - ADDRESS_GRAFANA=http://grafana:8085
      - ADDRESS_UI=http://localhost:5100
      - ROOT_DIR=/app
      - DATA_DB_PATH=/app/pb_data/data.db
      - MAIL_SENDER=no-reply@credimi.io
      - RUN_STEPCI_PATH=pkg/OpenID4VP/stepci/runStepCI.js
      - SCHEMAS_PATH=schemas
      - TEMPORAL_ADDRESS=temporal:7233
      - PORT=5100
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:?TURNSTILE_SECRET_KEY is required}
      - CREDIMI_INTERNAL_APP_URL=${CREDIMI_INTERNAL_APP_URL:?CREDIMI_INTERNAL_APP_URL is required}
      - CREDIMI_INTERNAL_ADMIN_KEY=${CREDIMI_INTERNAL_ADMIN_KEY:?CREDIMI_INTERNAL_ADMIN_KEY is required}
      - CREDIMI_TEMPORAL_SECRETS_ENCRYPTION_KEY=${CREDIMI_TEMPORAL_SECRETS_ENCRYPTION_KEY:?CREDIMI_TEMPORAL_SECRETS_ENCRYPTION_KEY is required}
    ports:
      - 8090:8090
    volumes:
      - ./pb_data/:/app/pb_data
      - /var/run/docker.sock:/var/run/docker.sock
volumes:
  esdata:
