          description: User API key or internal admin API key, depending on the endpoint.
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandlersStartScheduleRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandlersStartScheduleResponse'
          description: Successful response
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApierrorResponse'
          description: An unexpected error occurred.
      summary: Start a new schedule from an existing workflow
  /api/my/workflows/{workflowId}/runs/{runId}:
    get:
      description: Get details of a specific run for a workflow
      operationId: workflowRun.get
      parameters:
      - description: The ID for the workflowId.
        in: path
        name: workflowId
        required: true
        schema:
          description: The ID for the workflowId.
          type: string
      - description: The ID for the runId.
        in: path
        name: runId
        required: true
        schema:
          description: The ID for the runId.
          type: string
      - description: Bearer token for authentication.
        in: header
        name: Authorization
        schema:
          description: Bearer token for authentication.
          type: string
      - description: User API key or internal admin API key, depending on the endpoint.
        in: header
        name: Credimi-Api-Key
        schema:
          description: User API key or internal admin API key, depending on the endpoint.
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandlersGetMyWorkflowRunResponse'
          description: Successful response
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApierrorResponse'
          description: An unexpected error occurred.
      summary: Get details of a specific run for a workflow
  /api/my/workflows/{workflowId}/runs/{runId}/cancel:
    post:
      description: Cancel a specific workflow run
      operationId: workflowRun.cancel
      parameters:
      - description: The ID for the workflowId.
        in: path
        name: workflowId
        required: true
        schema:
          description: The ID for the workflowId.
          type: string
      - description: The ID for the runId.
        in: path
        name: runId
        required: true
        schema:
          description: The ID for the runId.
          type: string
      - description: Bearer token for authentication.
        in: header
        name: Authorization
        schema:
          description: Bearer token for authentication.
          type: string
      - description: User API key or internal admin API key, depending on the endpoint.
        in: header
        name: Credimi-Api-Key
        schema:
          description: User API key or internal admin API key, depending on the endpoint.
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandlersCancelMyWorkflowRunResponse'
          description: Successful response
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApierrorResponse'
          description: An unexpected error occurred.
      summary: Cancel a specific workflow run
components:
  schemas:
    ActionauthorBuildOption:
      properties:
        identifier:
          type: string
        organization_name:
          type: string
        platforms:
          items:
            type: string
          nullable: true
          type: array
        source:
          type: string
        version_tag:
          type: string
