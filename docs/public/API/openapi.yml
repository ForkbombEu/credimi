openapi: 3.0.3
info:
  contact:
    email: support@forkbomb.eu
    name: credimi Support
    url: https://forkbomb.solutions
  description: Credimi API — schedule and run conformance checks, manage pipeline
    automation, orchestrate mobile runners, publish marketplace integrations, and
    inspect end-to-end test results for decentralized identity services.
  title: Credimi API
  version: 1.4.0
servers:
- description: Production server
  url: https://credimi.io
- description: Localhost server
  url: http://localhost:8090/
paths:
  /api/action-author/devices:
    get:
      description: 'List the Android devices and iOS simulators the caller''s organization
        can author on: devices of its own enabled runners, and of enabled runners
        of other organizations that offer the agent to other organizations (`agent_others_daily_tokens`
        above 0) and are shared with the caller''s organization as for pipelines (`mobilerunner.SharedWith`:
        published, and admin-managed unless the caller''s organization is published),
        with the authoring platform each device implies. namespace is the caller''s
        organization namespace, where every session runs. agent_available reports
        whether the runner''s action author polled its task queue in that namespace
        in the last two minutes (false when Temporal is unreachable); only devices
        with is_online and agent_available can start a session. Sorted by runner name,
        then device name. A caller without an organization gets an empty list.'
      operationId: actionAuthor.listDevices
      parameters:
      - description: Bearer token for authentication.
        in: header
        name: Authorization
        schema:
          description: Bearer token for authentication.
          type: string
      - description: User API key or internal admin API key, depending on the endpoint.
        in: header
        name: Credimi-Api-Key
        schema:
          description: User API key or internal admin API key, depending on the endpoint.
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandlersActionAuthorDevicesResponse'
          description: Successful response
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApierrorResponse'
          description: An unexpected error occurred.
      summary: List devices available for authoring
  /api/action-author/reviews:
    post:
      description: 'Deliver the human decision on the pending save review tool_id
        of the agent workflow author_workflow_id in the organization namespace. Only
        the user who started the session can review it (403 forbidden otherwise);
        a namespace of an organization the caller is not a member of, or a workflow
        that is not the agent of a running session, answers 404 session_not_found.
        plan is the plan the save card shows; Credimi checks it again and binds the
        approval to it: for an acceptance, a missing or invalid plan answers 400 invalid_request;
        a refusal never reads the plan. An acceptance carries a Credimi-signed approval
        of candidate_sha256 and of the plan''s hash (plan_sha256) that the save activity
        verifies (valid for 30 minutes); the agent cannot save without it, nor with
        another plan. A review that is no longer pending (unknown or settled tool_id)
        answers 409 review_not_pending.'
      operationId: actionAuthor.reviewCandidate
      parameters:
      - description: Bearer token for authentication.
        in: header
        name: Authorization
        schema:
          description: Bearer token for authentication.
          type: string
      - description: User API key or internal admin API key, depending on the endpoint.
        in: header
        name: Credimi-Api-Key
        schema:
          description: User API key or internal admin API key, depending on the endpoint.
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandlersActionAuthorReviewRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandlersActionAuthorReviewResponse'
          description: Successful response
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApierrorResponse'
          description: An unexpected error occurred.
      summary: Accept or refuse a candidate action of an authoring session
  /api/action-author/sessions:
    get:
      description: List the ten latest authoring sessions the caller started in their
        organization namespace on the wallet organization/wallet (its Play Store build
        and every version), newest first, with their Temporal status (for example
        Running or Completed), start time (RFC 3339), build, device path and device
        name (empty when the device no longer exists). A session Temporal cannot describe
        is left out.
      operationId: actionAuthor.listSessions
      parameters:
      - description: 'Wallet of the sessions: organization/wallet (canonified names).'
        in: query
        name: wallet
        required: true
        schema:
          description: 'Wallet of the sessions: organization/wallet (canonified names).'
          type: string
      - description: Bearer token for authentication.
        in: header
        name: Authorization
        schema:
          description: Bearer token for authentication.
          type: string
      - description: User API key or internal admin API key, depending on the endpoint.
        in: header
        name: Credimi-Api-Key
        schema:
          description: User API key or internal admin API key, depending on the endpoint.
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandlersActionAuthorSessionsResponse'
          description: Successful response
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApierrorResponse'
          description: An unexpected error occurred.
      summary: List a wallet's recent authoring sessions
    post:
      description: 'Queue an authoring session for a member of an organization (the
        user''s first organization, as for pipeline runs) on the selected device through
        the mobile-device semaphore. The session runs in the caller''s organization
        namespace. The device type decides the platform (Android devices: android,
        iOS simulators: ios). wallet_version_identifier is organization/wallet/version
        for an uploaded installer of that platform of the caller''s organization,
        or, on an Android device only, organization/wallet for its wallet installed
        from the Play Store at session start (the device needs the Play Store with
        a signed-in account; otherwise the agent reports the failure in the chat and
        closes the session); GET /api/action-author/wallet-versions lists both. The
        iOS simulator has no App Store: organization/wallet on an iOS simulator answers
        400 invalid_request before anything is queued. A wallet of another organization
        answers 403 forbidden. The device must belong to an enabled, online runner
        of the caller''s organization, or to a published runner of another organization
        that offers the agent to other organizations; any other device answers 404
        device_not_found, and a disabled runner answers like an offline one (503).
        A caller who is not a member of any organization answers 403 forbidden. A
        runner whose action author has not polled <runner_id>-ActionAuthor in the
        caller''s namespace in the last two minutes answers 503 agent_unavailable.
        The agent sets each action''s plan in the chat and Credimi checks it on every
        call that uses it; the session can save several actions. The runner owner
        sets two daily limits of model tokens (UTC day) in the runner''s configuration:
        one for sessions of the runner''s own organization (0: no limit) and one shared
        by every other organization (0: the agent is not offered to them). A start
        after the day''s tokens of the caller''s pool reach its limit answers 429
        quota_exceeded. Poll GET /api/pipeline/queue/{ticket_id}?device_ids=<device_id>:
        once running, its workflow_id is the session and <workflow_id>-author is the
        chat workflow. This endpoint does not save an action: the session''s user
        accepts or refuses each candidate through POST /api/action-author/reviews.'
      operationId: actionAuthor.startSession
      parameters:
      - description: Bearer token for authentication.
        in: header
        name: Authorization
        schema:
          description: Bearer token for authentication.
          type: string
      - description: User API key or internal admin API key, depending on the endpoint.
        in: header
        name: Credimi-Api-Key
        schema:
          description: User API key or internal admin API key, depending on the endpoint.
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandlersActionAuthorStartRequest'
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandlersActionAuthorStartResponse'
          description: Successful response
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApierrorResponse'
          description: An unexpected error occurred.
      summary: Queue a wallet-action authoring session on a runner device
  /api/action-author/sessions/{session_id}:
    get:
      description: 'Read the authoring session session_id (ActionAuthorSession-<ticket
        uuid>, the session_id of the start response) that the caller started in their
        organization namespace, running or closed: its run, agent chat workflow (chat_workflow_id),
        Temporal status, times, build, device, runner and model. live_view is true
        while a session runs on an Android device that streams its screen (POST /api/pipeline/live-view
        opens it with the session ID and run). For a running session, chat_ready reports
        whether the agent chat has started its first turn, closes_at (RFC 3339, empty
        while a turn runs or when unknown) when the idle session closes to free the
        device, and pending_review the candidate action waiting for the caller''s
        review (POST /api/action-author/reviews), null otherwise. A session that has
        not started yet, an unknown session and one another user started all answer
        404 session_not_found (follow a queued session''s ticket in the device queue).'
      operationId: actionAuthor.getSession
      parameters:
      - description: The ID for the session_id.
        in: path
        name: session_id
        required: true
        schema:
          description: The ID for the session_id.
          type: string
      - description: Bearer token for authentication.
        in: header
        name: Authorization
        schema:
          description: Bearer token for authentication.
          type: string
      - description: User API key or internal admin API key, depending on the endpoint.
        in: header
        name: Credimi-Api-Key
        schema:
          description: User API key or internal admin API key, depending on the endpoint.
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandlersActionAuthorSessionResponse'
          description: Successful response
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApierrorResponse'
          description: An unexpected error occurred.
      summary: Read an authoring session
  /api/action-author/sessions/{session_id}/close:
    post:
      description: 'End the running authoring session session_id that the caller started:
        Credimi asks the agent chat to close, or cancels the session while its device
        is still being prepared. The session then cleans and releases its device.
        A session that has already ended answers 409 session_not_running; an unknown
        session, or one another user started, answers 404 session_not_found as GET
        /api/action-author/sessions/{session_id} does.'
      operationId: actionAuthor.closeSession
      parameters:
      - description: The ID for the session_id.
        in: path
        name: session_id
        required: true
        schema:
          description: The ID for the session_id.
          type: string
      - description: Bearer token for authentication.
        in: header
        name: Authorization
        schema:
          description: Bearer token for authentication.
          type: string
      - description: User API key or internal admin API key, depending on the endpoint.
        in: header
        name: Credimi-Api-Key
        schema:
          description: User API key or internal admin API key, depending on the endpoint.
          type: string
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandlersActionAuthorSessionCloseResponse'
          description: Successful response
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApierrorResponse'
          description: An unexpected error occurred.
      summary: End an authoring session
  /api/action-author/wallet-versions:
    get:
      description: List the builds of the authenticated caller's organization (the
        user's first organization, as for pipeline runs) available for authoring,
        with the platforms each build supports and its source. A build is a wallet
        version with an Android APK or iOS simulator app (source installer, identifier
        organization/wallet/version), or, for Android only, a wallet with a Play Store
        app (google_app_id, or the id of its play.google.com playstore_url), installed
        from the Play Store at session start (source store, identifier organization/wallet,
        version_tag "store install", platforms [android]). The iOS simulator has no
        App Store, so iOS builds are only wallet versions with an iOS simulator app.
        These are the only builds accepted by the session start endpoint. A caller
        without an organization gets an empty list.
      operationId: actionAuthor.listWalletVersions
      parameters:
      - description: Bearer token for authentication.
        in: header
        name: Authorization
        schema:
          description: Bearer token for authentication.
          type: string
      - description: User API key or internal admin API key, depending on the endpoint.
        in: header
        name: Credimi-Api-Key
        schema:
          description: User API key or internal admin API key, depending on the endpoint.
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandlersActionAuthorWalletVersionsResponse'
          description: Successful response
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApierrorResponse'
          description: An unexpected error occurred.
      summary: List wallet versions available for authoring
  /api/apikey/authenticate:
    get:
      description: Authenticate an API key and return Bearer token
      operationId: apiKey.authenticate
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandlersAuthenticateApiKeyResponse'
          description: Successful response
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApierrorResponse'
          description: An unexpected error occurred.
      summary: Authenticate API Key
  /api/apikey/authenticate-internal-admin:
    get:
      description: Authenticate an internal-admin API key.
      operationId: apiKey.authenticateInternalAdmin
      parameters:
      - description: Internal admin API key.
        in: header
        name: Credimi-Api-Key
        required: true
        schema:
          description: Internal admin API key.
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandlersAuthenticateInternalAdminAPIKeyResponse'
          description: Successful response
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApierrorResponse'
          description: An unexpected error occurred.
      summary: Authenticate Internal Admin API Key
  /api/apikey/generate:
    post:
      description: Generate a new API key for the authenticated user or superuser.
      operationId: apiKey.generate
      parameters:
      - description: Bearer token for authentication.
        in: header
        name: Authorization
        schema:
          description: Bearer token for authentication.
          type: string
      - description: User API key or internal admin API key, depending on the endpoint.
        in: header
        name: Credimi-Api-Key
        schema:
          description: User API key or internal admin API key, depending on the endpoint.
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandlersGenerateApiKeyRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandlersGenerateApiKeyResponse'
          description: Successful response
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApierrorResponse'
          description: An unexpected error occurred.
      summary: Generate API Key
  /api/custom-integrations/run:
    post:
      description: Run a custom integration
      operationId: custom-integration.run
      parameters:
      - description: Bearer token for authentication.
        in: header
        name: Authorization
        schema:
          description: Bearer token for authentication.
          type: string
      - description: User API key or internal admin API key, depending on the endpoint.
        in: header
        name: Credimi-Api-Key
        schema:
          description: User API key or internal admin API key, depending on the endpoint.
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandlersRunCustomIntegrationRequestInput'
        required: true
      responses:
        "200":
          description: Successful response without a body
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApierrorResponse'
          description: An unexpected error occurred.
      summary: Run a custom integration
  /api/mobile-devices:
    get:
      description: Lists independently schedulable mobile devices visible to the caller,
        grouped by their hosting runner through runner context fields.
      operationId: listMobileDevices
      parameters:
      - description: Bearer token for authentication.
        in: header
        name: Authorization
        schema:
          description: Bearer token for authentication.
          type: string
      - description: User API key or internal admin API key, depending on the endpoint.
        in: header
        name: Credimi-Api-Key
        schema:
          description: User API key or internal admin API key, depending on the endpoint.
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandlersListMobileDevicesPublicResponseSchema'
          description: Successful response
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApierrorResponse'
          description: An unexpected error occurred.
      summary: List available mobile devices
  /api/mobile-runners:
    get:
      description: Lists mobile runners visible to the caller, including health, devices,
        and queue length for online runners.
      operationId: listMobileRunners
      parameters:
      - description: Optional response view. Use 'selector' to return the lightweight
          runner selector shape and skip queue/device details.
        in: query
        name: view
        schema:
          description: Optional response view. Use 'selector' to return the lightweight
            runner selector shape and skip queue/device details.
          type: string
      - description: Bearer token for authentication.
        in: header
        name: Authorization
        schema:
          description: Bearer token for authentication.
          type: string
      - description: User API key or internal admin API key, depending on the endpoint.
        in: header
        name: Credimi-Api-Key
        schema:
          description: User API key or internal admin API key, depending on the endpoint.
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandlersListMobileRunnersPublicResponseSchema'
          description: Successful response
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApierrorResponse'
          description: An unexpected error occurred.
      summary: List available mobile runners
  /api/my/schedules:
    get:
      description: List all schedules for the authenticated user
      operationId: schedules.list
      parameters:
      - description: Bearer token for authentication.
        in: header
        name: Authorization
        schema:
          description: Bearer token for authentication.
          type: string
      - description: User API key or internal admin API key, depending on the endpoint.
        in: header
        name: Credimi-Api-Key
        schema:
          description: User API key or internal admin API key, depending on the endpoint.
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandlersListMySchedulesResponse'
          description: Successful response
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApierrorResponse'
          description: An unexpected error occurred.
      summary: Get a list of all schedules for the authenticated user
  /api/my/schedules/{scheduleId}/cancel:
    post:
      description: Cancel a specific schedule
      operationId: schedule.cancel
      parameters:
      - description: The ID for the scheduleId.
        in: path
        name: scheduleId
        required: true
        schema:
          description: The ID for the scheduleId.
          type: string
      - description: Bearer token for authentication.
        in: header
        name: Authorization
        schema:
          description: Bearer token for authentication.
          type: string
      - description: User API key or internal admin API key, depending on the endpoint.
        in: header
        name: Credimi-Api-Key
        schema:
          description: User API key or internal admin API key, depending on the endpoint.
          type: string
      responses:
