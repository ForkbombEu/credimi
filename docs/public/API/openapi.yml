          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandlersCancelScheduleResponse'
          description: Successful response
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApierrorResponse'
          description: An unexpected error occurred.
      summary: Cancel a specific schedule
  /api/my/schedules/{scheduleId}/pause:
    post:
      description: Pause a specific schedule
      operationId: schedule.pause
      parameters:
      - description: The ID for the scheduleId.
        in: path
        name: scheduleId
        required: true
        schema:
          description: The ID for the scheduleId.
          type: string
      - description: Bearer token for authentication.
        in: header
        name: Authorization
        schema:
          description: Bearer token for authentication.
          type: string
      - description: User API key or internal admin API key, depending on the endpoint.
        in: header
        name: Credimi-Api-Key
        schema:
          description: User API key or internal admin API key, depending on the endpoint.
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandlersPauseScheduleResponse'
          description: Successful response
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApierrorResponse'
          description: An unexpected error occurred.
      summary: Pause a specific schedule
  /api/my/schedules/{scheduleId}/resume:
    post:
      description: Resume a specific schedule
      operationId: schedule.resume
      parameters:
      - description: The ID for the scheduleId.
        in: path
        name: scheduleId
        required: true
        schema:
          description: The ID for the scheduleId.
          type: string
      - description: Bearer token for authentication.
        in: header
        name: Authorization
        schema:
          description: Bearer token for authentication.
          type: string
      - description: User API key or internal admin API key, depending on the endpoint.
        in: header
        name: Credimi-Api-Key
        schema:
          description: User API key or internal admin API key, depending on the endpoint.
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandlersResumeScheduleResponse'
          description: Successful response
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApierrorResponse'
          description: An unexpected error occurred.
      summary: Resume a specific schedule
  /api/my/schedules/start:
    post:
      description: Start a new schedule from an existing workflow
      operationId: schedule.start
      parameters:
      - description: Bearer token for authentication.
        in: header
        name: Authorization
        schema:
          description: Bearer token for authentication.
          type: string
      - description: User API key or internal admin API key, depending on the endpoint.
        in: header
        name: Credimi-Api-Key
