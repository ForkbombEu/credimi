<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="t"><title id="t">A manual interoperability flow on the Hub, from Hub page to QR code or deeplink to wallet to comparison, moved to automation as a pipeline of StepCI issuer, Maestro wallet and StepCI verifier steps that produces evidence</title><style>
.flow{stroke-dasharray:4 6;animation:dash 1.6s linear infinite}
.glow{animation:glow 10s ease-in-out infinite}
.slide{animation:slide 2.4s ease-in-out infinite}
@keyframes dash{to{stroke-dashoffset:-20}}
@keyframes glow{0%,20%,100%{stroke:#e2e8f0;stroke-width:1}5%,15%{stroke:#220e7c;stroke-width:2}}
@keyframes slide{0%{transform:translateX(0);opacity:0}15%,85%{opacity:1}100%{transform:translateX(110px);opacity:0}}
@media (prefers-reduced-motion:reduce){.flow,.glow,.slide{animation:none}.motion{display:none}}
</style><rect width="1200" height="440" rx="16" fill="#eeeaff"/><rect x="40" y="30" width="480" height="380" rx="10" fill="#fff" stroke="#e2e8f0"/><text x="70" y="72" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="500" fill="#220e7c" letter-spacing="1.7">MANUAL, ON THE HUB</text><text x="70" y="102" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" fill="#220e7c">Try a flow by hand:</text><rect class="glow" style="animation-delay:0.0s" x="70" y="126" width="420" height="54" rx="10" fill="#fff" stroke="#e2e8f0"/><circle cx="100" cy="153" r="14" fill="#220e7c"/><text x="100" y="158" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="128" y="149" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#0f172a">Open a Hub page</text><text x="128" y="168" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="400" fill="#64748b">A credential or a verification use case</text><path class="flow" d="M100 182v10" stroke="#220e7c" stroke-width="2"/><rect class="glow" style="animation-delay:2.5s" x="70" y="194" width="420" height="54" rx="10" fill="#fff" stroke="#e2e8f0"/><circle cx="100" cy="221" r="14" fill="#220e7c"/><text x="100" y="226" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="128" y="217" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#0f172a">Generate the QR code or deeplink</text><text x="128" y="236" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="400" fill="#64748b">The working flow the entry exposes</text><path class="flow" d="M100 250v10" stroke="#220e7c" stroke-width="2"/><rect class="glow" style="animation-delay:5.0s" x="70" y="262" width="420" height="54" rx="10" fill="#fff" stroke="#e2e8f0"/><circle cx="100" cy="289" r="14" fill="#220e7c"/><text x="100" y="294" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="128" y="285" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#0f172a">Continue in the target wallet</text><text x="128" y="304" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="400" fill="#64748b">On your phone, step by step</text><path class="flow" d="M100 318v10" stroke="#220e7c" stroke-width="2"/><rect class="glow" style="animation-delay:7.5s" x="70" y="330" width="420" height="54" rx="10" fill="#fff" stroke="#e2e8f0"/><circle cx="100" cy="357" r="14" fill="#220e7c"/><text x="100" y="362" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="128" y="353" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#0f172a">Compare outcomes</text><text x="128" y="372" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="400" fill="#64748b">Across issuer, wallet and verifier</text><rect x="680" y="30" width="480" height="380" rx="10" fill="#fff" stroke="#e2e8f0"/><text x="710" y="72" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="500" fill="#220e7c" letter-spacing="1.7">AUTOMATED, IN A PIPELINE</text><text x="710" y="102" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" fill="#220e7c">Same steps, composed:</text><rect class="glow" style="animation-delay:0.0s" x="710" y="126" width="420" height="54" rx="10" fill="#fff" stroke="#e2e8f0"/><rect x="724" y="140" width="86" height="26" rx="13" fill="#eeeaff"/><text x="767.0" y="158" font-family="'Source Code Pro', ui-monospace, monospace" font-size="13" font-weight="600" fill="#220e7c" text-anchor="middle">StepCI</text><text x="826" y="149" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#0f172a">Issuer step</text><text x="826" y="168" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="400" fill="#64748b">Live issuer sends a credential offer</text><path class="flow" d="M767 182v10" stroke="#220e7c" stroke-width="2"/><rect class="glow" style="animation-delay:2.5s" x="710" y="194" width="420" height="54" rx="10" fill="#fff" stroke="#e2e8f0"/><rect x="724" y="208" width="86" height="26" rx="13" fill="#eeeaff"/><text x="767.0" y="226" font-family="'Source Code Pro', ui-monospace, monospace" font-size="13" font-weight="600" fill="#220e7c" text-anchor="middle">Maestro</text><text x="826" y="217" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#0f172a">Wallet steps</text><text x="826" y="236" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="400" fill="#64748b">Drives your wallet app on a device</text><path class="flow" d="M767 250v10" stroke="#220e7c" stroke-width="2"/><rect class="glow" style="animation-delay:5.0s" x="710" y="262" width="420" height="54" rx="10" fill="#fff" stroke="#e2e8f0"/><rect x="724" y="276" width="86" height="26" rx="13" fill="#eeeaff"/><text x="767.0" y="294" font-family="'Source Code Pro', ui-monospace, monospace" font-size="13" font-weight="600" fill="#220e7c" text-anchor="middle">StepCI</text><text x="826" y="285" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#0f172a">Verifier step</text><text x="826" y="304" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="400" fill="#64748b">Live verifier sends a request</text><path class="flow" d="M767 318v10" stroke="#220e7c" stroke-width="2"/><rect class="glow" style="animation-delay:7.5s" x="710" y="330" width="420" height="54" rx="10" fill="#fff" stroke="#e2e8f0"/><rect x="724" y="344" width="86" height="26" rx="13" fill="#eeeaff"/><text x="767.0" y="362" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#220e7c" text-anchor="middle">Evidence</text><text x="826" y="353" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#0f172a">Run evidence</text><text x="826" y="372" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="400" fill="#64748b">Temporal history, video, logs</text><text x="600" y="186" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#220e7c" text-anchor="middle">Move to</text><text x="600" y="204" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#220e7c" text-anchor="middle">automation</text><path class="flow" d="M538 222H650" stroke="#220e7c" stroke-width="2"/><polygon points="650,215 664,222 650,229" fill="#220e7c"/><circle class="motion slide" cx="542" cy="222" r="5" fill="#220e7c"/><text x="600" y="250" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="middle">Keep StepCI,</text><text x="600" y="268" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="middle">add Maestro</text></svg>