<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="t"><title id="t">A credential issuer sends a credential offer over OpenID4VCI to a wallet on a phone, the wallet accepts it, then presents it over OpenID4VP to a verifier that checks it</title><style>
.flow{stroke-dasharray:4 6;animation:dash 1.6s linear infinite}
.offer{animation:offer 8s ease-in-out infinite}
.pres{animation:pres 8s ease-in-out infinite}
.accept{animation:accept 8s ease-in-out infinite}
.check{animation:check 8s ease-in-out infinite}
@keyframes dash{to{stroke-dashoffset:-20}}
@keyframes offer{0%{transform:translateX(0);opacity:0}5%{opacity:1}30%{transform:translateX(200px);opacity:1}34%,100%{transform:translateX(200px);opacity:0}}
@keyframes pres{0%,50%{transform:translateX(0);opacity:0}55%{opacity:1}80%{transform:translateX(200px);opacity:1}84%,100%{transform:translateX(200px);opacity:0}}
@keyframes accept{0%,30%{opacity:.15}36%,100%{opacity:1}}
@keyframes check{0%,80%{opacity:.15}86%,96%{opacity:1}100%{opacity:.15}}
@media (prefers-reduced-motion:reduce){.flow,.offer,.pres,.accept,.check{animation:none}.motion{display:none}}
</style><rect width="1200" height="420" rx="16" fill="#eeeaff"/>
<g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
<rect x="60" y="120" width="280" height="180" rx="10" fill="#fff" stroke="#e2e8f0"/><text x="88" y="156" font-size="12" font-weight="500" letter-spacing="1.7" fill="#220e7c">CREDENTIAL ISSUER</text><text x="88" y="190" font-size="18" font-weight="600" fill="#0f172a">Live issuer</text><text x="88" y="216" font-size="14" fill="#64748b">Sends a fresh credential offer</text>
<rect x="88" y="244" width="92" height="28" rx="14" fill="#eeeaff"/><text x="134" y="263" font-size="13" text-anchor="middle" fill="#220e7c">SD-JWT VC</text><rect x="190" y="244" width="70" height="28" rx="14" fill="#eeeaff"/><text x="225" y="263" font-size="13" text-anchor="middle" fill="#220e7c">mDoc</text>
<line x1="350" y1="210" x2="530" y2="210" stroke="#220e7c" stroke-width="2" class="flow"/><text x="440" y="190" font-size="14" font-weight="600" text-anchor="middle" font-family="'Source Code Pro', ui-monospace, monospace" fill="#220e7c">OpenID4VCI</text><text x="440" y="240" font-size="13" text-anchor="middle" fill="#64748b">credential offer</text>
<circle cx="340" cy="210" r="7" fill="#220e7c" class="offer motion"/>
<rect x="540" y="70" width="120" height="280" rx="18" fill="#fff" stroke="#220e7c" stroke-width="2"/><rect x="585" y="80" width="30" height="5" rx="2.5" fill="#220e7c" opacity=".35"/><text x="600" y="120" font-size="12" font-weight="500" letter-spacing="1.7" text-anchor="middle" fill="#220e7c">WALLET</text>
<rect x="556" y="140" width="88" height="56" rx="8" fill="#220e7c"/><text x="600" y="164" font-size="13" text-anchor="middle" fill="#fff">PID</text><text x="600" y="184" font-size="13" text-anchor="middle" fill="#fff" opacity=".8">credential</text>
<g class="accept"><rect x="556" y="214" width="88" height="30" rx="15" fill="#16a34a"/><text x="600" y="234" font-size="13" text-anchor="middle" fill="#fff">Accepted</text></g>
<text x="600" y="330" font-size="13" text-anchor="middle" fill="#64748b">Real device</text>
<line x1="670" y1="210" x2="850" y2="210" stroke="#220e7c" stroke-width="2" class="flow"/><text x="760" y="190" font-size="14" font-weight="600" text-anchor="middle" font-family="'Source Code Pro', ui-monospace, monospace" fill="#220e7c">OpenID4VP</text><text x="760" y="240" font-size="13" text-anchor="middle" fill="#64748b">presentation</text>
<circle cx="660" cy="210" r="7" fill="#220e7c" class="pres motion"/>
<rect x="860" y="120" width="280" height="180" rx="10" fill="#fff" stroke="#e2e8f0"/><text x="888" y="156" font-size="12" font-weight="500" letter-spacing="1.7" fill="#220e7c">VERIFIER</text><text x="888" y="190" font-size="18" font-weight="600" fill="#0f172a">Live verifier</text><text x="888" y="216" font-size="14" fill="#64748b">Requests and checks with DCQL</text>
<g class="check"><circle cx="1100" cy="258" r="18" fill="#16a34a"/><path d="M1091 258l6 6 12-12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="1070" y="263" font-size="14" text-anchor="end" fill="#16a34a">Presentation checked</text></g>
</g></svg>
