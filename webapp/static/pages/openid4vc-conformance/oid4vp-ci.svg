<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="t"><title id="t">Left: a verifier sends an OpenID4VP presentation request with DCQL, the wallet answers with a vp_token and the verifier validates it. Right: a CI lane where a pull request calls run-verifier, which runs the OpenID Foundation and WE BUILD / EWC suites and returns a result</title><style>
.flow{stroke-dasharray:4 6;animation:dash 1.6s linear infinite}
.step{animation:step 6s ease-in-out infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes dash{to{stroke-dashoffset:-20}}
@keyframes step{0%,100%{opacity:.35}5%,28%{opacity:1}36%{opacity:.35}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.6)}}
@media (prefers-reduced-motion:reduce){.flow,.step,.pulse{animation:none}.motion{display:none}}
</style><rect width="1200" height="440" rx="16" fill="#eeeaff"/><g font-family="Inter, ui-sans-serif, system-ui, sans-serif"><rect x="40" y="40" width="580" height="360" rx="10" fill="#fff" stroke="#e2e8f0"/><text x="64" y="72" font-size="12" font-weight="500" letter-spacing="1.7" fill="#220e7c">OPENID4VP</text><rect x="70" y="96" width="150" height="44" rx="10" fill="#220e7c"/><text x="145" y="124" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">Verifier</text><rect x="440" y="96" width="150" height="44" rx="10" fill="#fff" stroke="#220e7c" stroke-width="2"/><text x="515" y="124" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Wallet</text><path class="flow" d="M145 140V370M515 140V370" stroke="#220e7c" stroke-width="1.5" opacity=".5"/><g class="step"><path d="M145 190H505" stroke="#220e7c" stroke-width="2"/><path d="M495 184l10 6-10 6" fill="none" stroke="#220e7c" stroke-width="2"/><text x="330" y="180" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Presentation request</text><text x="330" y="210" text-anchor="middle" font-size="13" fill="#64748b">DCQL query</text></g><g class="step" style="animation-delay:2s"><path d="M515 260H155" stroke="#220e7c" stroke-width="2"/><path d="M165 254l-10 6 10 6" fill="none" stroke="#220e7c" stroke-width="2"/><text x="330" y="250" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Response</text><text x="330" y="280" text-anchor="middle" font-family="'Source Code Pro', ui-monospace, monospace" font-size="13" fill="#64748b">vp_token</text></g><g class="step" style="animation-delay:4s"><rect x="70" y="318" width="270" height="44" rx="8" fill="#eeeaff"/><circle cx="96" cy="340" r="11" fill="#16a34a"/><path d="M91 340l3.5 3.5 7-7" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="116" y="345" font-size="14" font-weight="600" fill="#0f172a">Verifier validates</text></g><rect x="660" y="40" width="500" height="360" rx="10" fill="#fff" stroke="#220e7c" stroke-width="2" stroke-dasharray="6 6"/><text x="684" y="72" font-size="12" font-weight="500" letter-spacing="1.7" fill="#220e7c">CI LANE</text><path d="M760 112V352" stroke="#220e7c" stroke-width="2"/><circle cx="760" cy="112" r="9" fill="#fff" stroke="#220e7c" stroke-width="2"/><text x="790" y="117" font-size="14" font-weight="600" fill="#0f172a">Pull request</text><circle cx="760" cy="182" r="9" fill="#fff" stroke="#220e7c" stroke-width="2"/><text x="790" y="187" font-family="'Source Code Pro', ui-monospace, monospace" font-size="14" fill="#220e7c">run-verifier</text><circle cx="760" cy="262" r="9" fill="#fff" stroke="#220e7c" stroke-width="2"/><rect x="790" y="240" width="170" height="44" rx="8" fill="#eeeaff"/><text x="875" y="267" text-anchor="middle" font-size="13" fill="#220e7c">OpenID Foundation</text><rect x="970" y="240" width="160" height="44" rx="8" fill="#eeeaff"/><text x="1050" y="267" text-anchor="middle" font-size="13" fill="#220e7c">WE BUILD / EWC</text><circle cx="760" cy="352" r="9" fill="#16a34a"/><circle class="pulse" cx="760" cy="352" r="4" fill="#fff"/><text x="790" y="357" font-size="14" font-weight="600" fill="#0f172a">Result</text><text x="850" y="357" font-size="13" fill="#64748b">pass / fail with evidence</text></g><g class="motion"><circle opacity="0" r="6" fill="#220e7c" stroke="#fff" stroke-width="2"><animateMotion dur="4s" repeatCount="indefinite" path="M760 112V352" keyPoints="0;1;1" keyTimes="0;0.8;1" calcMode="linear"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.75;0.8;1" dur="4s" repeatCount="indefinite"/></circle></g></svg>
