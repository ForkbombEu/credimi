<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="t"><title id="t">OpenID4VCI sequence between a wallet and a credential issuer: credential offer, token request, credential request and credential in SD-JWT VC or mDoc, with a conformance check for each step</title><style>
.flow{stroke-dasharray:4 6;animation:dash 1.6s linear infinite}
.step{animation:step 8s ease-in-out infinite}
.tick{animation:tick 8s ease-in-out infinite}
@keyframes dash{to{stroke-dashoffset:-20}}
@keyframes step{0%,100%{opacity:.35}5%,22%{opacity:1}30%{opacity:.35}}
@keyframes tick{0%,4%{opacity:.2}10%,92%{opacity:1}100%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.flow,.step,.tick{animation:none}.motion{display:none}}
</style><rect width="1200" height="440" rx="16" fill="#eeeaff"/><g font-family="Inter, ui-sans-serif, system-ui, sans-serif"><text x="60" y="52" font-size="12" font-weight="500" letter-spacing="1.7" fill="#220e7c">OPENID4VCI 1.0</text><rect x="90" y="72" width="180" height="48" rx="10" fill="#fff" stroke="#220e7c" stroke-width="2"/><text x="180" y="102" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Wallet</text><rect x="640" y="72" width="200" height="48" rx="10" fill="#220e7c"/><text x="740" y="102" text-anchor="middle" font-size="16" font-weight="600" fill="#fff">Credential issuer</text><path class="flow" d="M180 120V400M740 120V400" stroke="#220e7c" stroke-width="1.5" opacity=".5"/><g class="step"><path d="M740 160H190" stroke="#220e7c" stroke-width="2"/><path d="M200 154l-10 6 10 6" fill="none" stroke="#220e7c" stroke-width="2"/><text x="460" y="150" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">1 · Credential offer</text><text x="460" y="180" text-anchor="middle" font-size="13" fill="#64748b">QR code or deeplink</text></g><g class="step" style="animation-delay:2s"><path d="M180 230H730" stroke="#220e7c" stroke-width="2"/><path d="M720 224l10 6-10 6" fill="none" stroke="#220e7c" stroke-width="2"/><text x="460" y="220" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">2 · Token request</text><text x="460" y="250" text-anchor="middle" font-size="13" fill="#64748b">pre-authorized or authorization code</text></g><g class="step" style="animation-delay:4s"><path d="M180 300H730" stroke="#220e7c" stroke-width="2"/><path d="M720 294l10 6-10 6" fill="none" stroke="#220e7c" stroke-width="2"/><text x="460" y="290" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">3 · Credential request</text><text x="460" y="320" text-anchor="middle" font-size="13" fill="#64748b">access token and key proof</text></g><g class="step" style="animation-delay:6s"><path d="M740 370H190" stroke="#220e7c" stroke-width="2"/><path d="M200 364l-10 6 10 6" fill="none" stroke="#220e7c" stroke-width="2"/><text x="460" y="360" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">4 · Credential</text><text x="460" y="390" text-anchor="middle" font-family="'Source Code Pro', ui-monospace, monospace" font-size="13" fill="#64748b">SD-JWT VC · mDoc</text></g><rect x="880" y="72" width="270" height="328" rx="10" fill="#fff" stroke="#e2e8f0"/><text x="904" y="104" font-size="12" font-weight="500" letter-spacing="1.7" fill="#220e7c">CONFORMANCE CHECK</text><g class="tick"><circle cx="918" cy="160" r="12" fill="#16a34a"/><path d="M912 160l4 4 8-8" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="942" y="165" font-size="14" fill="#0f172a">Credential offer</text></g><g class="tick" style="animation-delay:2s"><circle cx="918" cy="230" r="12" fill="#16a34a"/><path d="M912 230l4 4 8-8" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="942" y="235" font-size="14" fill="#0f172a">Token request</text></g><g class="tick" style="animation-delay:4s"><circle cx="918" cy="300" r="12" fill="#16a34a"/><path d="M912 300l4 4 8-8" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="942" y="305" font-size="14" fill="#0f172a">Credential request</text></g><g class="tick" style="animation-delay:6s"><circle cx="918" cy="370" r="12" fill="#16a34a"/><path d="M912 370l4 4 8-8" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="942" y="375" font-size="14" fill="#0f172a">Credential</text></g></g></svg>
