<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="t"><title id="t">One Credimi pipeline drives issuer, wallet and verifier, validates the run and keeps the evidence</title><style>
.flow{stroke-dasharray:4 6;animation:dash 1.6s linear infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.glow{animation:glow 10s ease-in-out infinite}
.scan{animation:scan 7.5s ease-in-out infinite}
@keyframes dash{to{stroke-dashoffset:-20}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.6)}}
@keyframes glow{0%,14%,100%{stroke:#e2e8f0;stroke-width:1}4%,10%{stroke:#220e7c;stroke-width:2}}
@keyframes scan{0%{transform:translateY(0)}100%{transform:translateY(210px)}}
@media (prefers-reduced-motion:reduce){.flow,.pulse,.glow,.scan{animation:none}.motion{display:none}}
</style><rect width="1200" height="430" rx="16" fill="#eeeaff"/><rect x="40" y="40" width="1120" height="56" rx="8" fill="#220e7c"/><text x="70" y="75" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#fff">Credimi pipeline</text><text x="1130" y="75" text-anchor="end" font-family="Source Code Pro, ui-monospace, monospace" font-size="13" fill="#fff" opacity=".75">orchestrated and timestamped by Temporal</text><path class="flow" d="M140.0 96v34" stroke="#220e7c" stroke-width="2"/><rect class="glow" style="animation-delay:0s" x="40" y="130" width="200" height="250" rx="10" fill="#fff" stroke="#e2e8f0"/><circle cx="140.0" cy="190" r="34" fill="#eeeaff"/><g transform="translate(126.0 176)" fill="none" stroke="#220e7c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="22" height="18" rx="3"/><path d="M8 11h12M8 16h7"/><circle cx="21" cy="19" r="3" fill="#fff"/></g><text x="60" y="160" font-family="Source Code Pro, ui-monospace, monospace" font-size="12" fill="#6b6880">01</text><text x="140.0" y="256" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700" fill="#220e7c">Issuer</text><text x="140.0" y="284" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13.5" fill="#6b6880">StepCI asks a live</text><text x="140.0" y="304" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13.5" fill="#6b6880">issuer for a fresh</text><text x="140.0" y="324" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13.5" fill="#6b6880">offer</text><path d="M244 255h20" stroke="#220e7c" stroke-width="2"/><path d="M258 249l7 6-7 6" fill="none" stroke="#220e7c" stroke-width="2"/><path class="flow" d="M368.0 96v34" stroke="#220e7c" stroke-width="2"/><rect class="glow" style="animation-delay:2s" x="268" y="130" width="200" height="250" rx="10" fill="#fff" stroke="#e2e8f0"/><circle cx="368.0" cy="190" r="34" fill="#eeeaff"/><g transform="translate(354.0 176)" fill="none" stroke="#220e7c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="14" height="24" rx="3"/><path d="M12 21h4"/><rect x="10" y="7" width="8" height="6" rx="1"/></g><text x="288" y="160" font-family="Source Code Pro, ui-monospace, monospace" font-size="12" fill="#6b6880">02</text><text x="368.0" y="256" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700" fill="#220e7c">Wallet</text><text x="368.0" y="284" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13.5" fill="#6b6880">Maestro accepts the</text><text x="368.0" y="304" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13.5" fill="#6b6880">credential on a real</text><text x="368.0" y="324" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13.5" fill="#6b6880">device</text><path d="M472 255h20" stroke="#220e7c" stroke-width="2"/><path d="M486 249l7 6-7 6" fill="none" stroke="#220e7c" stroke-width="2"/><path class="flow" d="M596.0 96v34" stroke="#220e7c" stroke-width="2"/><rect class="glow" style="animation-delay:4s" x="496" y="130" width="200" height="250" rx="10" fill="#fff" stroke="#e2e8f0"/><circle cx="596.0" cy="190" r="34" fill="#eeeaff"/><g transform="translate(582.0 176)" fill="none" stroke="#220e7c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3l9 4v6c0 6-4 10-9 12-5-2-9-6-9-12V7z"/><path d="M10 14l3 3 5-6"/></g><text x="516" y="160" font-family="Source Code Pro, ui-monospace, monospace" font-size="12" fill="#6b6880">03</text><text x="596.0" y="256" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700" fill="#220e7c">Verifier</text><text x="596.0" y="284" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13.5" fill="#6b6880">The verifier requests</text><text x="596.0" y="304" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13.5" fill="#6b6880">a presentation</text><path d="M700 255h20" stroke="#220e7c" stroke-width="2"/><path d="M714 249l7 6-7 6" fill="none" stroke="#220e7c" stroke-width="2"/><path class="flow" d="M824.0 96v34" stroke="#220e7c" stroke-width="2"/><rect class="glow" style="animation-delay:6s" x="724" y="130" width="200" height="250" rx="10" fill="#fff" stroke="#e2e8f0"/><circle cx="824.0" cy="190" r="34" fill="#eeeaff"/><g transform="translate(810.0 176)" fill="none" stroke="#220e7c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l2 2 4-4M3 17l2 2 4-4M13 6h12M13 12h12M13 18h12"/></g><text x="744" y="160" font-family="Source Code Pro, ui-monospace, monospace" font-size="12" fill="#6b6880">04</text><text x="824.0" y="256" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700" fill="#220e7c">Validate</text><text x="824.0" y="284" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13.5" fill="#6b6880">FCAF and protocol</text><text x="824.0" y="304" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13.5" fill="#6b6880">checks judge the run</text><path d="M928 255h20" stroke="#220e7c" stroke-width="2"/><path d="M942 249l7 6-7 6" fill="none" stroke="#220e7c" stroke-width="2"/><path class="flow" d="M1052.0 96v34" stroke="#220e7c" stroke-width="2"/><rect class="glow" style="animation-delay:8s" x="952" y="130" width="200" height="250" rx="10" fill="#fff" stroke="#e2e8f0"/><circle cx="1052.0" cy="190" r="34" fill="#eeeaff"/><g transform="translate(1038.0 176)" fill="none" stroke="#220e7c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h10l5 5v17H7z"/><path d="M17 3v5h5M11 14h7M11 18h7"/></g><text x="972" y="160" font-family="Source Code Pro, ui-monospace, monospace" font-size="12" fill="#6b6880">05</text><text x="1052.0" y="256" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700" fill="#220e7c">Evidence</text><text x="1052.0" y="284" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13.5" fill="#6b6880">Every input, output</text><text x="1052.0" y="304" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13.5" fill="#6b6880">and artifact is kept</text></svg>
