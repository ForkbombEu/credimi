<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="t"><title id="t">Your own devices, emulators and simulators connect to Credimi through a credimi-runner</title><style>
.flow{stroke-dasharray:4 6;animation:dash 1.6s linear infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.glow{animation:glow 10s ease-in-out infinite}
.scan{animation:scan 7.5s ease-in-out infinite}
@keyframes dash{to{stroke-dashoffset:-20}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.6)}}
@keyframes glow{0%,14%,100%{stroke:#e2e8f0;stroke-width:1}4%,10%{stroke:#220e7c;stroke-width:2}}
@keyframes scan{0%{transform:translateY(0)}100%{transform:translateY(210px)}}
@media (prefers-reduced-motion:reduce){.flow,.pulse,.glow,.scan{animation:none}.motion{display:none}}
