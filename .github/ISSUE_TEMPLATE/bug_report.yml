name: Bug report
description: Report a bug in Credimi.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. The more detail you
        provide, the faster we can fix it.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Numbered steps to trigger the bug.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The Credimi version, commit, or deployment you observed this on.
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Paste relevant logs or error output, and attach screenshots.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - API / backend
        - Webapp / UI
        - Pipeline engine
        - Mobile runners
        - Documentation
        - Other
