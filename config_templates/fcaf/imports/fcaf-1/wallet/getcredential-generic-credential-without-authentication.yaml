appId: eu.europa.ec.euidi
name: "getCredential: generic credential without authentication"
tags:
  - ws_rp
  - ws_ap
  - wallet
  - credential
  - generic
---
# Start from a deterministic wallet state: a previous step can leave the app on
# a half-finished screen with the PIN keyboard still up, which hides the
# credential-offer action bar and makes the offer unacceptable.
#
# `launch` and `offer` are stored before the commands that can fail, so a step
# that stops early still shows the screen the Wallet stopped on. `credential-added`
# stays after the `View details` assertion, so its presence still means the
# credential was stored. Names stay within 20 characters, the budget the longest
# step id that binds this action leaves under PocketBase's 100-character cap on
# the snake-cased `<step id>-<name>` stem.
- launchApp:
    stopApp: true
    clearState: false
- waitForAnimationToEnd: { timeout: 3000 }
- takeScreenshot: launch
- openLink:
    link: ${deeplink}
    autoVerify: false
    browser: false
- waitForAnimationToEnd: { timeout: 3000 }
- runFlow:
    when:
      visible: "Welcome back"
    commands:
      - inputText: "12345"
      - tapOn: "6"
- waitForAnimationToEnd: { timeout: 3000 }
# The offer screen, or the error screen the Wallet shows for a malformed offer.
- extendedWaitUntil:
    visible: "Issuance request|Accept|Oups! Something went wrong|invalid request"
    timeout: 30000
    optional: true
- takeScreenshot: offer
- scrollUntilVisible:
    element: "Accept"
- tapOn: "Accept"
- waitForAnimationToEnd: { timeout: 1000 }
# The outcome screen, or wherever the Wallet stopped: optional wait, then the
# screenshot, then the assertion that decides.
- extendedWaitUntil:
    visible: "View details|Oups! Something went wrong|invalid request"
    timeout: 30000
    optional: true
- takeScreenshot: outcome
- assertVisible: "View details"
- tapOn: "View details"
- waitForAnimationToEnd: { timeout: 1000 }
- takeScreenshot: credential-added
