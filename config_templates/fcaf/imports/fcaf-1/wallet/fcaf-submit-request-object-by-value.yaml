appId: eu.europa.ec.euidi
name: FCAF submit request object by value
tags:
  - fcaf
  - ws_rp
  - request-object
  - by-value
---
# Every wait that can fail comes after a screenshot: the screen the link landed on,
# the consent screen and the result screen are stored first, so a step that fails
# on any of them still shows the screen the Wallet stopped on.
- "stopApp"
- openLink:
    link: "${deeplink}"
    autoVerify: false
    browser: false
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible: "Welcome back|Share|Cancel|Close|Oups! Something went wrong|invalid request|Presentation blocked"
    timeout: 100000
    optional: true
- takeScreenshot: fcaf-by-value-open
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible: "Welcome back"
    commands:
      - extendedWaitUntil:
          visible: "1"
          timeout: 30000
      - inputText: "12345"
      - tapOn: "6"
# The consent screen, or whatever the Wallet shows instead: optional wait, then the
# screenshot, then the strict wait on the requested data, which only the consent
# screen lists (never on the Share control the flow taps).
- extendedWaitUntil:
    visible: "Requested data|Share|Oups! Something went wrong|invalid request|Presentation blocked"
    timeout: 100000
    optional: true
- takeScreenshot: fcaf-by-value-request
- extendedWaitUntil:
    visible: "Requested data"
    timeout: 100000
- takeScreenshot: fcaf-request-object-by-value-consent
- tapOn:
    text: "Share"
    enabled: true
- extendedWaitUntil:
    visible: "1"
    timeout: 30000
- inputText: "12345"
- tapOn: "6"
# The result screen, or the error screen a Wallet that refused ends on: optional
# wait, then the screenshot, then the strict assertion.
- extendedWaitUntil:
    visible: "Close|.*successfully shared.*|Oups! Something went wrong|invalid request"
    timeout: 30000
    optional: true
- takeScreenshot: fcaf-request-object-by-value-accepted
- assertVisible: "Close"
