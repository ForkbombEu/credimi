appId: eu.europa.ec.euidi
name: FCAF observe request - engagement only
tags:
  - fcaf
  - ws_rp
  - observe
  - engagement
---
# Records the Wallet's reaction to a request without selecting or sharing a
# credential: whichever screen it ends on, a consent screen included, is
# screenshotted and left unanswered. The action never fails on the Wallet's
# outcome, so only `openLink` can end it early; `observe-launch` is stored first,
# so even that exit shows the Wallet's screen. The calling test proves engagement
# from the Verifier's capture.
- launchApp:
    stopApp: true
    clearState: false
    permissions:
      camera: allow
      notifications: allow
- extendedWaitUntil:
    visible: "Welcome back|Home|Documents|Add document|Welcome, .*"
    timeout: 30000
    optional: true
- takeScreenshot: observe-launch
- waitForAnimationToEnd:
    timeout: 3000
# The keypad is entered only while it is up: this flow must reach its terminal
# screenshot even when the unlock sequence does not complete.
- runFlow:
    when:
      visible: "Welcome back"
    commands:
      - extendedWaitUntil:
          visible: "1"
          timeout: 30000
          optional: true
      - runFlow:
          when:
            visible: "1"
          commands:
            - inputText: "12345"
            - tapOn: "6"
- extendedWaitUntil:
    visible: "Home|Documents|Add document|Welcome, .*"
    timeout: 30000
    optional: true
- openLink:
    link: "${deeplink}"
    autoVerify: false
    browser: false
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible: "Welcome back|Requested data|The requested document is not available.*|invalid request|Oups! Something went wrong|Presentation blocked"
    timeout: 30000
    optional: true
- runFlow:
    when:
      visible: "Welcome back"
    commands:
      - extendedWaitUntil:
          visible: "1"
          timeout: 30000
          optional: true
      - runFlow:
          when:
            visible: "1"
          commands:
            - inputText: "12345"
            - tapOn: "6"
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible: "Requested data|The requested document is not available.*|invalid request|Oups! Something went wrong|Presentation blocked"
    timeout: 100000
    optional: true
- extendedWaitUntil:
    visible: "Requested data|The requested document is not available.*|invalid request|Oups! Something went wrong|Presentation blocked|Home|Documents|Add document|Welcome, .*"
    timeout: 30000
    optional: true
- takeScreenshot: request-observed
