appId: eu.europa.ec.euidi
name: FCAF present same credential multiple queries
tags:
  - fcaf
  - ws_rp
---
- launchApp:
    stopApp: true
    clearState: false
# Optional, so a Wallet that is slow to launch cannot end the step before it has
# stored anything: the screenshot records the launch screen and the strict waits
# below still fail a run that never reached a request screen.
- extendedWaitUntil:
    visible: "Welcome back|Home|Documents|Add document|Welcome, .*"
    timeout: 30000
    optional: true
- takeScreenshot: fcaf-087-launch
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible: "Welcome back"
    commands:
    - extendedWaitUntil:
        visible: "1"
        timeout: 30000
    - inputText: "12345"
    - tapOn: "6"
- extendedWaitUntil:
    visible: "Home|Documents|Add document|Welcome, .*"
    timeout: 30000
- openLink:
    link: "${deeplink}"
    autoVerify: false
    browser: false
# Phase 1: a bounded, optional probe for the Wallet's reaction. A second
# `Welcome back` lock screen counts as a reaction even though it says nothing yet
# about the outcome.
- extendedWaitUntil:
    visible: "Welcome back|Data sharing request|The requested document is not available.*|invalid request|Oups! Something went wrong|Presentation blocked"
    timeout: 30000
    optional: true
- runFlow:
    when:
      visible: "Welcome back"
    commands:
    - extendedWaitUntil:
        visible: "1"
        timeout: 30000
    - inputText: "12345"
    - tapOn: "6"
    - waitForAnimationToEnd:
        timeout: 3000
# Phase 2: the decisive screens only, optional and long, so a slow Wallet gets the
# whole window to render its request screen. The screenshot that follows is the
# step's evidence whenever the Wallet stops anywhere else, and the assertion below
# is what fails the step.
- extendedWaitUntil:
    visible: "Data sharing request|The requested document is not available.*|invalid request|Oups! Something went wrong|Presentation blocked"
    timeout: 100000
    optional: true
- takeScreenshot: fcaf-087-request
- assertVisible: "Data sharing request"
- assertVisible:
    id: "eu.europa.ec.euidi:id/request_screen_requested_document_0"
- assertVisible:
    id: "eu.europa.ec.euidi:id/request_screen_requested_document_1"
- tapOn: "Share"
- extendedWaitUntil:
    visible: "PIN"
    timeout: 30000
- extendedWaitUntil:
    visible: "1"
    timeout: 30000
- inputText: "12345"
- tapOn: "6"
# The result screen, or the error screen a Wallet that refused ends on: the
# optional wait and the screenshot come before the strict wait, so a step that
# fails on the outcome still stores it.
- extendedWaitUntil:
    visible: ".*successfully shared.*|Oups! Something went wrong|invalid request"
    timeout: 30000
    optional: true
- takeScreenshot: "fcaf-087-same-credential-multiple-queries"
- extendedWaitUntil:
    visible: ".*successfully shared.*"
    timeout: 30000
- tapOn: "Close"
