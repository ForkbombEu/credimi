name: EUDIW (v.06.38) PID issue X2 and verify X1 (issuer.eudiw.dev)

runtime:
  temporal:
    activity_options:
      schedule_to_close_timeout: 20m
      start_to_close_timeout: 20m
      retry_policy:
        maximum_attempts: 3

steps:
  - use: mobile-automation
    id: onboarding-1-0001
    continue_on_error: false
    with:
      action_id: forkbomb-bv-andrea/eudiw-beta-wallet/onboarding-1
      version_id: forkbomb-bv-andrea/eudiw-beta-wallet/2026-06-38-demo

  - use: credential-offer
    id: eudiw-pid-pid-vc-sd-jwt-haip-vci-0002
    continue_on_error: false
    with:
      credential_id: /forkbomb-bv-andrea/misc-issuer-integration-demo/eudiw-pid-pid-vc-sd-jwt-haip-vci

  - use: mobile-automation
    id: getcredential-pid-formeu-issuer-eudiw-dev-0003
    continue_on_error: false
    with:
      action_id: forkbomb-bv-andrea/eudiw-beta-wallet/getcredential-pid-formeu-issuer-eudiw-dev
      version_id: forkbomb-bv-andrea/eudiw-beta-wallet/2026-06-38-demo
      parameters:
        deeplink: ${{eudiw-pid-pid-vc-sd-jwt-haip-vci-0002.outputs}}

  - use: credential-offer
    id: eudiw-pid-mdoc-haip-vci-0004
    continue_on_error: false
    with:
      credential_id: /forkbomb-bv-andrea/misc-issuer-integration-demo/eudiw-pid-mdoc-haip-vci

  - use: mobile-automation
    id: getcredential-pid-formeu-issuer-eudiw-dev-0005
    continue_on_error: false
    with:
      action_id: forkbomb-bv-andrea/eudiw-beta-wallet/getcredential-pid-formeu-issuer-eudiw-dev
      version_id: forkbomb-bv-andrea/eudiw-beta-wallet/2026-06-38-demo
      parameters:
        deeplink: ${{eudiw-pid-mdoc-haip-vci-0004.outputs}}

  - use: use-case-verification-deeplink
    id: eudiw-pid-verifier-dc-sd-jwt-0006
    continue_on_error: false
    with:
      use_case_id: /forkbomb-bv-andrea/misc-verifiers-interop/eudiw-pid-verifier-dc-sd-jwt

  - use: mobile-automation
    id: verifycredential-pid-formeu-issuer-eudiw-dev-0007
    continue_on_error: false
    with:
      action_id: forkbomb-bv-andrea/eudiw-beta-wallet/verifycredential-pid-formeu-issuer-eudiw-dev
      version_id: forkbomb-bv-andrea/eudiw-beta-wallet/2026-06-38-demo
      parameters:
        deeplink: ${{eudiw-pid-verifier-dc-sd-jwt-0006.outputs}}

  - use: use-case-verification-deeplink
    id: eudiw-pid-verifier-mdoc-0008
    continue_on_error: false
    with:
      use_case_id: /forkbomb-bv-andrea/misc-verifiers-interop/eudiw-pid-verifier-mdoc
