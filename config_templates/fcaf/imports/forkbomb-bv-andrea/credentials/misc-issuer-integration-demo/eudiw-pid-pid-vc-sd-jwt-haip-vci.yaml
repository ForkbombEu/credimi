name: EUDIW | PID pid_vc_sd_jwt haip-vci
canonified_name: eudiw-pid-pid-vc-sd-jwt-haip-vci
description: |
  # EUDIW test credential

  eu.europa.ec.eudi.pid_vc_sd_jwt

  From https://issuer.eudiw.dev/
logo_url: https://eudiw.dev/ic-logo.svg
published: true
imported: false
conformant: false
yaml: |
  version: "1.1"
  name: eudiw PID SD-JWT VC
  env:
    host: https://backend.issuer.eudiw.dev/credential_offer_create
    credential_configuration_id: eu.europa.ec.eudi.pid_vc_sd_jwt
  tests:
    credential_offer:
      steps:
        - name: create credential offer
          http:
            url: ${{ env.host }}
            method: GET
            params:
              credential_configuration_id: ${{ env.credential_configuration_id }}
            captures:
              cred_offer:
                body: true
            check:
              status: /^20/
        - name: Transform capture
          plugin:
            id: capture-plugin
            params:
              values:
                deeplink: haip-vci://?credential_offer=${{ captures.cred_offer | url_encode }}
