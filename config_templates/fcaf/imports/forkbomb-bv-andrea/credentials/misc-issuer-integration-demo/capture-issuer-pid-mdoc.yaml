name: Capture issuer PID mDoc
canonified_name: capture-issuer-pid-mdoc
description: |
  PID mDoc issued by the Credimi beta capture issuer.
  From https://capture-wallet.credimi.io/
logo_url: https://credimi.io/logos/credimi_logo.svg
published: true
imported: false
conformant: false
yaml: |
  version: "1.1"
  name: capture issuer PID mDoc
  env:
    host: https://capture-wallet.credimi.io/sessions
    credential_configuration_id: urn:eu.europa.ec.eudi:pid:1.mdoc.jwt
  tests:
    credential_offer:
      steps:
        - name: create capture issuer mDoc session
          http:
            url: ${{ env.host }}
            method: POST
            headers:
              Content-Type: application/json
            body: '{"credential_configuration_id":"${{ env.credential_configuration_id }}"}'
            captures:
              deeplink:
                jsonpath: $.deeplink
            check:
              status: 201
