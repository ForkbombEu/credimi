appId: eu.europa.ec.euidi
name: FCAF exercise non-JSON response - wallet error screen evidence
tags:
  - fcaf
  - ws_rp
---
- launchApp:
    stopApp: true
    clearState: false
    permissions:
      camera: allow
      notifications: allow
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible: "Welcome back"
    commands:
      - inputText: "12345"
      - tapOn: "6"
- waitForAnimationToEnd:
    timeout: 3000
- openLink:
    link: "${deeplink}"
    autoVerify: false
    browser: false
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible: "Requested data"
    commands:
      - tapOn: "Share"
      - waitForAnimationToEnd:
          timeout: 3000
      - inputText: "12345"
      - tapOn: "6"
- extendedWaitUntil:
    visible: "Oups! Something went wrong|invalid request|Verifier rejected the response|Presentation blocked"
    timeout: 60000
    optional: true
- runFlow:
    when:
      visible: "Oups! Something went wrong|invalid request|Verifier rejected the response|Presentation blocked"
    commands:
      - takeScreenshot: "non-json-wallet-error"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: "exercise-wallet"
