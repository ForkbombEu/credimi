appId: eu.europa.ec.euidi
name: FCAF exercise wallet - wallet error screen evidence
tags:
  - fcaf
  - ws_rp
---
# Shares the presentation, then waits for the Wallet's error screen after a
# Verifier response it must not accept. `wallet-error` is taken only while that
# screen is up, so a Wallet that stays on its success screen stores no such
# file and fails the test's evidence.screenshot_named assertion.
- launchApp:
    stopApp: true
    clearState: false
    permissions:
      camera: allow
      notifications: allow
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible: "Welcome back"
    commands:
      - inputText: "12345"
      - tapOn: "6"
- waitForAnimationToEnd:
    timeout: 3000
- openLink:
    link: "${deeplink}"
    autoVerify: false
    browser: false
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible: "Requested data"
    commands:
      - tapOn: "Share"
      - waitForAnimationToEnd:
          timeout: 3000
      - inputText: "12345"
      - tapOn: "6"
- extendedWaitUntil:
    visible: "Oups! Something went wrong|invalid request|Verifier rejected the response|Presentation blocked"
    timeout: 60000
    optional: true
- runFlow:
    when:
      visible: "Oups! Something went wrong|invalid request|Verifier rejected the response|Presentation blocked"
    commands:
      - takeScreenshot: "wallet-error"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: "exercise-wallet"
