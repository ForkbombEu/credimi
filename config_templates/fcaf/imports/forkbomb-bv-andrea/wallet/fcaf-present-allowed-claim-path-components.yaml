appId: eu.europa.ec.euidi
name: FCAF present allowed claim path components
tags:
  - fcaf
  - ws_rp
---
- launchApp:
    stopApp: true
    clearState: false
- extendedWaitUntil:
    visible: "Welcome back|Home|Documents|Welcome, .*"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible: "Welcome back"
    commands:
    - extendedWaitUntil:
        visible: "1"
        timeout: 30000
    - inputText: "12345"
    - tapOn: "6"
- extendedWaitUntil:
    visible: "Home|Documents|Welcome, .*"
    timeout: 30000
- openLink:
    link: "${deeplink}"
    autoVerify: false
    browser: false
- extendedWaitUntil:
    visible: "Welcome back|Data sharing request"
    timeout: 100000
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible: "Welcome back"
    commands:
    - extendedWaitUntil:
        visible: "1"
        timeout: 30000
    - inputText: "12345"
    - tapOn: "6"
- extendedWaitUntil:
    visible: "Data sharing request"
    timeout: 100000
- assertVisible:
    id: "eu.europa.ec.euidi:id/request_screen_requested_document_0"
- tapOn:
    id: "eu.europa.ec.euidi:id/request_screen_requested_document_0"
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 0
- runFlow:
    when:
      visible:
        id: "eu.europa.ec.euidi:id/request_screen_requested_document_1"
    commands:
    - tapOn:
        id: "eu.europa.ec.euidi:id/request_screen_requested_document_1"
        retryTapIfNoChange: false
        waitToSettleTimeoutMs: 0
- assertVisible: "Given Name"
- takeScreenshot: "fcaf-118-allowed-claim-path-components"
- assertVisible: "Nationalities"
- tapOn: "Share"
- extendedWaitUntil:
    visible: "PIN"
    timeout: 30000
- extendedWaitUntil:
    visible: "1"
    timeout: 30000
- inputText: "12345"
- tapOn: "6"
- extendedWaitUntil:
    visible: ".*successfully shared.*"
    timeout: 30000
- assertVisible:
    id: "eu.europa.ec.euidi:id/document_success_screen_document_0"
- tapOn:
    id: "eu.europa.ec.euidi:id/document_success_screen_document_0"
- runFlow:
    when:
      visible:
        id: "eu.europa.ec.euidi:id/document_success_screen_document_1"
    commands:
    - tapOn:
        id: "eu.europa.ec.euidi:id/document_success_screen_document_1"
- assertVisible: "Given Name"
- takeScreenshot: "fcaf-118-allowed-claim-path-components-shared"
- assertVisible: "Nationalities"
- tapOn: "Close"
