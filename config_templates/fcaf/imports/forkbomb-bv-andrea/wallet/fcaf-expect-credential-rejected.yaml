appId: eu.europa.ec.euidi
name: FCAF expect credential rejected - issuance error or discontinuation
tags:
  - fcaf
  - expect
  - rejected
  - credential
---
# Terminal flow for negative issuance cases, where the Wallet must refuse to
# store the offered credential. It accepts the offer like
# getcredential-generic-credential-without-authentication, then passes only on
# an error screen or a return to Home, and fails when the Wallet shows the
# "View details" success screen. The Wallet-side proof that nothing was stored
# is the follow-up DCQL probe, not this screenshot.
- launchApp:
    stopApp: true
    clearState: false
- openLink:
    link: ${deeplink}
    autoVerify: false
    browser: false
- extendedWaitUntil: { visible: "Welcome back|Accept", timeout: 100000 }
- waitForAnimationToEnd: { timeout: 3000 }
- runFlow:
    when:
      visible: "Welcome back"
    commands:
      - extendedWaitUntil:
          visible: "1"
          timeout: 30000
      - inputText: "12345"
      - tapOn: "6"
- extendedWaitUntil: { visible: "Accept", timeout: 100000 }
- tapOn: "Accept"
- extendedWaitUntil:
    visible: "View details|Error|invalid request|Oups! Something went wrong|Home|Documents"
    timeout: 100000
- waitForAnimationToEnd: { timeout: 3000 }
- assertNotVisible: "View details"
- takeScreenshot: credential-rejected
