appId: eu.europa.ec.euidi
name: FCAF expect credential rejected - issuance error or discontinuation
tags:
  - fcaf
  - ws_rp
  - ws_ap
  - expect
  - rejected
  - credential
---
# Terminal flow for negative issuance cases, where the Wallet must refuse to
# store the offered credential. It accepts the offer like
# getcredential-generic-credential-without-authentication, then passes only on
# an error screen or a return to Home, and fails when the Wallet shows the
# "View details" success screen. The Wallet-side proof that nothing was stored
# is the follow-up DCQL probe, not this screenshot.
#
# Every wait that can fail comes after a screenshot: `launch` after starting the
# app, `offer` after the link, and `outcome` before the assertion that decides.
# `credential-rejected` stays after that assertion, so its presence still means
# the Wallet showed no success screen. Names stay within 8 characters, the budget
# the longest step id that binds this action leaves under PocketBase's
# 100-character cap on the snake-cased `<step id>-<name>` stem.
- launchApp:
    stopApp: true
    clearState: false
- waitForAnimationToEnd: { timeout: 3000 }
- takeScreenshot: launch
- openLink:
    link: ${deeplink}
    autoVerify: false
    browser: false
- extendedWaitUntil:
    visible: "Welcome back|Accept|Home|Documents|Oups! Something went wrong|invalid request"
    timeout: 100000
    optional: true
- takeScreenshot: offer
- extendedWaitUntil: { visible: "Welcome back|Accept", timeout: 100000 }
- waitForAnimationToEnd: { timeout: 3000 }
- runFlow:
    when:
      visible: "Welcome back"
    commands:
      - extendedWaitUntil:
          visible: "1"
          timeout: 30000
      - inputText: "12345"
      - tapOn: "6"
- extendedWaitUntil: { visible: "Accept", timeout: 100000 }
- tapOn: "Accept"
# The outcome screen, or whatever the Wallet shows instead: optional wait, then
# the screenshot, then the assertions.
- extendedWaitUntil:
    visible: "View details|invalid request|Oups! Something went wrong|Home|Documents|Welcome, .*"
    timeout: 100000
    optional: true
- waitForAnimationToEnd: { timeout: 3000 }
- takeScreenshot: outcome
- assertNotVisible: "View details"
- takeScreenshot: credential-rejected
