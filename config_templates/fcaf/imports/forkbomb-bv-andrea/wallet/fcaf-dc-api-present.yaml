appId: com.android.chrome
name: FCAF invoke the wallet through the Digital Credentials API
tags:
  - fcaf
  - dc-api
  - present
---
# DC API presentation is browser-mediated, not deeplink-mediated: the capture
# service serves an HTTPS page and the wallet is invoked only from a button
# press on it, through navigator.credentials.get({ digital: ... }).
#
# This flow passes only on a completed presentation that the page reports as
# accepted. Cases whose expected outcome is a refusal use
# fcaf-dc-api-expect-rejected instead, so neither flow is green on the other
# outcome.
- launchApp:
    appId: com.android.chrome
    stopApp: true
    clearState: false
    # Naming one permission keeps Maestro from granting or resetting every
    # Chrome permission on launch, which costs several seconds per step.
    permissions:
      notifications: allow
- openLink:
    link: "${presentation_url}"
    autoVerify: false
    browser: true
- extendedWaitUntil:
    visible: "Present credential"
    timeout: 60000
- tapOn: "Present credential"
- extendedWaitUntil:
    visible: "Continue|Agree and continue|Welcome back|Share|Cancel|.*(did not complete|answered without a presentation|Presentation accepted).*"
    timeout: 120000
# Chrome asks once per origin whether the site may read the wallet.
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn:
          text: "Continue"
          optional: true
      - extendedWaitUntil:
          visible: "Agree and continue|Welcome back|Share|Cancel"
          timeout: 60000
# Platform credential picker listing the matching wallet documents.
- runFlow:
    when:
      visible: "Agree and continue"
    commands:
      - tapOn:
          text: "Agree and continue"
          optional: true
      - extendedWaitUntil:
          visible: "Welcome back|Share|Cancel"
          timeout: 60000
# The Wallet runs inside the credential-manager window, where hideKeyboard
# leaves the Wallet, so the PIN is typed on the keypad.
- runFlow:
    when:
      visible: "Welcome back"
    commands:
      - extendedWaitUntil:
          visible: "1"
          timeout: 30000
      - inputText: "12345"
      - tapOn: "6"
- extendedWaitUntil:
    visible: "Share"
    timeout: 30000
- assertVisible: "Share"
- tapOn:
    text: "Share"
    waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    visible: "PIN"
    timeout: 30000
- runFlow:
    when:
      visible: "PIN"
    commands:
      - extendedWaitUntil:
          visible: "1"
          timeout: 30000
      - inputText: "12345"
      - tapOn: "6"
- waitForAnimationToEnd:
    timeout: 1000
- extendedWaitUntil:
    visible: ".*successfully shared.*"
    timeout: 30000
- tapOn: "View details"
- takeScreenshot: dc-api-wallet-outcome
# The Wallet hands the response back to Chrome only when its result screen
# closes; until then the verifier has received nothing.
- tapOn: "Close"
- extendedWaitUntil:
    visible: ".*(Presentation accepted|did not complete the presentation|answered without a presentation|could not be submitted|rejected the presentation).*"
    timeout: 120000
- assertVisible: ".*Presentation accepted.*"
- takeScreenshot: dc-api-invocation-outcome
