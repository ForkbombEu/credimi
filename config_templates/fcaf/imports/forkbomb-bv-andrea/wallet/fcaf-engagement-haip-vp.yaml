appId: eu.europa.ec.euidi
name: FCAF engagement - HAIP VP
tags:
  - fcaf
  - engagement
  - haip-vp
---
- openLink:
    link: ${deeplink}
    autoVerify: false
    browser: false
- runFlow:
    when:
      visible: "EUDI Wallet"
    commands:
      - tapOn:
          text: "EUDI Wallet"
          optional: true
- runFlow:
    when:
      visible: "Just once"
    commands:
      - tapOn:
          text: "Just once"
          optional: true
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible: "Welcome back|Share|Cancel|Close"
    timeout: 100000
- runFlow:
    when:
      visible: "Welcome back"
    commands:
      - tapOn:
          point: "11%,40%"
      - inputText: "123456"
      - hideKeyboard
      - tapOn:
          point: "50%,10%"
- extendedWaitUntil:
    visible: "Share"
    timeout: 30000
- assertVisible: "Share"
- takeScreenshot: fcaf-engagement-haip-vp-invoked
- tapOn:
    text: "Share"
    waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    visible: "Welcome back|To approve the transaction you need to verify your identity."
    timeout: 100000
- assertNotVisible: "Share"
- runFlow:
    when:
      visible: "Welcome back|To approve the transaction you need to verify your identity."
    commands:
      - tapOn:
          point: "11%,40%"
      - inputText: "123456"
      - hideKeyboard
      - tapOn:
          point: "50%,10%"
- waitForAnimationToEnd:
    timeout: 1000
- extendedWaitUntil:
    visible: ".*successfully shared.*"
    timeout: 30000
- assertVisible: "EUDI Remote Verifier"
- takeScreenshot: fcaf-engagement-haip-vp-shared
