appId: eu.europa.ec.euidi
name: FCAF engagement - HAIP VP
tags:
  - fcaf
  - engagement
  - haip-vp
---
- openLink:
    link: ${deeplink}
    autoVerify: false
    browser: false
- waitForAnimationToEnd: { timeout: 3000 }
- runFlow:
    when:
      visible: "Welcome back"
    commands:
      - inputText: "12345"
      - tapOn: "6"
- waitForAnimationToEnd: { timeout: 3000 }
- scrollUntilVisible:
    element: "Share"
- takeScreenshot: fcaf-engagement-haip-vp-invoked
- tapOn:
    text: "Share"
    waitToSettleTimeoutMs: 1000
# A Wallet may ask for a second PIN after Share, or may settle directly on its
# terminal screen. Neither outcome may prevent the terminal screenshot below:
# validators decide the protocol verdict from Capture's session evidence.
- extendedWaitUntil:
    visible: "PIN"
    timeout: 30000
    optional: true
- runFlow:
    when:
      visible: "PIN"
    commands:
      - inputText: "12345"
      - tapOn: "6"
- extendedWaitUntil:
    visible: ".*successfully shared.*"
    timeout: 30000
    optional: true
- runFlow:
    when:
      visible: "View details"
    commands:
      - tapOn: "View details"
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: fcaf-engagement-haip-vp-shared
