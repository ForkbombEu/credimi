appId: eu.europa.ec.euidi
name: FCAF engagement - HAIP VP
tags:
  - fcaf
  - engagement
  - haip-vp
---
- openLink:
    link: ${deeplink}
    autoVerify: false
    browser: false
- waitForAnimationToEnd: { timeout: 3000 }
- runFlow:
    when:
      visible: "Welcome back"
    commands:
      - inputText: "12345"
      - tapOn: "6"
- waitForAnimationToEnd: { timeout: 3000 }
- scrollUntilVisible:
    element: "Share"
- takeScreenshot: fcaf-engagement-haip-vp-invoked
- tapOn:
    text: "Share"
    waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    visible: "PIN"
    timeout: 3000
- runFlow:
    when:
      visible: "PIN"
    commands:
      - inputText: "12345"
      - tapOn: "6"
- waitForAnimationToEnd:
    timeout: 1000
- scrollUntilVisible:
    element: ".*successfully shared.*"
- tapOn: "View details"
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: fcaf-engagement-haip-vp-shared
