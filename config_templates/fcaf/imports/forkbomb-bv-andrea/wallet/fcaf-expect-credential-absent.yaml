appId: eu.europa.ec.euidi
name: FCAF expect no credential to satisfy a scenario-pinned request
tags:
  - fcaf
  - ws_rp
  - ws_ap
  - expect
  - no-match
  - absent
---
# Probe whose request pins a value only a credential of the scenario itself
# carries, or no credential at all, so after the scenario's wallet reset the only
# passing outcome is the Wallet's no-match notice: a PID issued under a
# constraint it fails (the under-18 PID asked for age_over_18 true), a credential
# the issuer denied, or an engagement control pinned to a number no credential
# carries. Any other screen, above all the consent screen listing Requested data,
# means the Wallet would present that credential: the flow then fails without
# sharing it.
#
# Unlike fcaf-expect-no-matching-document it never taps Share, so
# cmd/fcaf-pipeline-gen issues no PID before it: no PID the generator issues can
# satisfy the pinned value, and the scenario's own credential, when it holds
# one, stays unspent for any later presentation.
#
# Both screenshots are taken before the final assertion, so a failed step still
# stores what the Wallet showed. Names must fit PocketBase's 100-character cap on
# the snake-cased `<stepID>-<screenshot name>` stem: the longest step id using
# this action is 80 characters, which leaves 19 for a name; `no-match-notice`
# (15) and `absence-probe` (13) fit.
- launchApp:
    stopApp: true
    clearState: false
    permissions:
      camera: allow
      notifications: allow
- extendedWaitUntil:
    visible: "Welcome back|Home|Documents|Add document|Welcome, .*"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible: "Welcome back"
    commands:
      - extendedWaitUntil:
          visible: "1"
          timeout: 30000
      - inputText: "12345"
      - tapOn: "6"
- extendedWaitUntil:
    visible: "Home|Documents|Add document|Welcome, .*"
    timeout: 30000
- openLink:
    link: "${deeplink}"
    autoVerify: false
    browser: false
- waitForAnimationToEnd:
    timeout: 3000
# A second `Welcome back` lock screen counts as a reaction to the link even
# though it says nothing yet about the request's outcome.
- extendedWaitUntil:
    visible: "Welcome back|The requested document is not available.*|Requested data|invalid request|Oups! Something went wrong|Presentation blocked"
    timeout: 30000
    optional: true
- runFlow:
    when:
      visible: "Welcome back"
    commands:
      - extendedWaitUntil:
          visible: "1"
          timeout: 30000
      - inputText: "12345"
      - tapOn: "6"
      - waitForAnimationToEnd:
          timeout: 3000
# Decisive screens only, so a slow Wallet gets the whole window before the
# assertion below reads the screen it settled on.
- extendedWaitUntil:
    visible: "The requested document is not available.*|Requested data|invalid request|Oups! Something went wrong|Presentation blocked"
    timeout: 100000
    optional: true
- runFlow:
    when:
      visible: "The requested document is not available.*"
    commands:
      - takeScreenshot: no-match-notice
- takeScreenshot: absence-probe
- assertVisible: "The requested document is not available.*"
