appId: eu.europa.ec.euidi
name: FCAF user authentication failed
tags:
  - fcaf
  - ws_rp
---
- launchApp:
    stopApp: true
    clearState: false
- extendedWaitUntil:
    visible: "Welcome back|Home|Documents|Add document|Welcome, .*"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible: "Welcome back"
    commands:
    - extendedWaitUntil:
        visible: "1"
        timeout: 30000
    - inputText: "12345"
    - tapOn: "6"
- extendedWaitUntil:
    visible: "Home|Documents|Add document|Welcome, .*"
    timeout: 30000
- openLink:
    link: "${deeplink}"
    autoVerify: false
    browser: false
- extendedWaitUntil:
    visible: "Welcome back|Data sharing request"
    timeout: 100000
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible: "Welcome back"
    commands:
    - extendedWaitUntil:
        visible: "1"
        timeout: 30000
    - inputText: "12345"
    - tapOn: "6"
- extendedWaitUntil:
    visible: "Data sharing request"
    timeout: 100000
- assertVisible:
    id: "eu.europa.ec.euidi:id/request_screen_requested_document_0"
- tapOn:
    id: "eu.europa.ec.euidi:id/request_screen_requested_document_0"
    retryTapIfNoChange: false
- assertVisible: "Given Name"
- takeScreenshot: "fcaf-149-consent-screen-before-authentication"
- tapOn: "Share"
- extendedWaitUntil:
    visible: "PIN|To approve the transaction you need to verify your identity."
    timeout: 30000
- extendedWaitUntil:
    visible: "1"
    timeout: 30000
- inputText: "11111"
- tapOn: "1"
- extendedWaitUntil:
    visible: "Invalid pin"
    timeout: 30000
- assertNotVisible: ".*successfully shared.*"
- takeScreenshot: "fcaf-149-user-authentication-failed"
- tapOn: "Go Back"
- extendedWaitUntil:
    visible: "Data sharing request"
    timeout: 30000
- tapOn: "Go Back"
- extendedWaitUntil:
    visible: "Home|Welcome, .*"
    timeout: 30000
