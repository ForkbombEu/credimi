appId: eu.europa.ec.euidi
---
- openLink:
    link: ${deeplink}
    autoVerify: false
    browser: false
- tapOn:
    text: "EUDI Wallet"
    optional: true
- tapOn:
    text: "Just once"
    optional: true
- tapOn:
    text: "Always"
    optional: true
- tapOn:
    text: "Use without an account"
    optional: true
- tapOn:
    text: "No thanks"
    optional: true
# user link below for debugging
# - openLink: https://credimi.io/api/credential/deeplink?id=forkbomb-bv-andrea/misc-issuer-integration-demo/eudiw-pid-pid-vc-sd-jwt-haip-vci&redirect=true
- extendedWaitUntil:
   visible: "Add"
- takeScreenshot: credential-offer-received
- tapOn:
    point: "50%,98%"
- waitForAnimationToEnd:
    timeout: 5000
- assertNotVisible: "Add"
- takeScreenshot: credential-added
