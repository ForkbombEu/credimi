appId: eu.europa.ec.euidi
name: FCAF precondition - EUDIW onboarding
tags:
  - fcaf
  - precondition
  - onboarding
---
- launchApp:
    stopApp: true
    clearState: false
    permissions:
      camera: allow
      notifications: allow
- extendedWaitUntil:
    visible: "Welcome to your Wallet|Welcome back|Home|Documents|Add document"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible: "Welcome to your Wallet"
    commands:
      - inputText: "123456"
      - extendedWaitUntil:
          visible: "Confirm PIN"
          timeout: 15000
      - inputText: "123456"
- runFlow:
    when:
      visible: "Welcome back"
    commands:
      - inputText: "123456"
- scrollUntilVisible:
    element: "GO TO HOME|Home|Documents|Add document"
- runFlow:
    when:
      visible: "GO TO HOME"
    commands:
      - tapOn: "GO TO HOME"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: fcaf-onboarding-complete
