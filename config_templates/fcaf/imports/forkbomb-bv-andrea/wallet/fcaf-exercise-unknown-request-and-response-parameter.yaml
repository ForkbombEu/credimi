appId: eu.europa.ec.euidi
name: FCAF exercise unknown request and response parameter - ignore both members and follow redirect
tags:
  - fcaf
  - ws_rp
---
- launchApp:
    stopApp: true
    clearState: false
    permissions:
      camera: allow
      notifications: allow
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible: "Welcome back"
    commands:
      - inputText: "12345"
      - tapOn: "6"
- waitForAnimationToEnd:
    timeout: 3000
- openLink:
    link: "${deeplink}"
    autoVerify: false
    browser: false
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible: "Requested data"
    commands:
      - tapOn: "Share"
      - waitForAnimationToEnd:
          timeout: 3000
      - inputText: "12345"
      - tapOn: "6"
- extendedWaitUntil:
    visible: ".*successfully shared.*"
    timeout: 30000
    optional: true
- extendedWaitUntil:
    visible: "Close"
    timeout: 30000
    optional: true
- takeScreenshot: "unknown-request-and-response-parameter-wallet-success"
# `Close` is the reference Wallet's own dismiss control. The tap is
# conditional because the source says nothing about the Wallet's screen
# wording: a Wallet with a different terminal screen must still reach the
# visit screenshot below.
- runFlow:
    when:
      visible: "Close"
    commands:
      - tapOn: "Close"
- extendedWaitUntil:
    visible: "Presentation complete"
    timeout: 30000
    optional: true
- takeScreenshot: "unknown-request-and-response-parameter-visit"
