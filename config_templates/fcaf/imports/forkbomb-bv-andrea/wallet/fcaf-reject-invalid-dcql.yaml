appId: eu.europa.ec.euidi
name: FCAF reject invalid DCQL
tags:
  - fcaf
  - ws_rp
---
- launchApp:
    stopApp: true
    clearState: false
    permissions:
      camera: allow
      notifications: allow
- extendedWaitUntil:
    visible: "Welcome back|Home|Documents|Add document|Welcome, .*"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible: "Welcome back"
    commands:
      - extendedWaitUntil:
          visible: "1"
          timeout: 30000
      - inputText: "12345"
      - tapOn: "6"
- extendedWaitUntil:
    visible: "Home|Documents|Add document|Welcome, .*"
    timeout: 30000
- openLink:
    link: "${deeplink}"
    autoVerify: false
    browser: false
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible: "Welcome back|Requested data|The requested document is not available.*|invalid request|Oups! Something went wrong|Presentation blocked"
    timeout: 60000
    optional: true
- runFlow:
    when:
      visible: "Welcome back"
    commands:
      - extendedWaitUntil:
          visible: "1"
          timeout: 30000
      - inputText: "12345"
      - tapOn: "6"
      - waitForAnimationToEnd:
          timeout: 3000
# A tolerant Wallet that lists the request has accepted it; share so the
# Verifier records the Authorization Response the source test must
# refute.
- runFlow:
    when:
      visible: "Requested data"
    commands:
      - tapOn: "Share"
      - waitForAnimationToEnd:
          timeout: 3000
      - inputText: "12345"
      - tapOn: "6"
      - extendedWaitUntil:
          visible: ".*successfully shared.*|Oups! Something went wrong|invalid request"
          timeout: 30000
          optional: true
# The decisive refusal screen, captured under its own name for the run
# report. No assertion requires this name: the source also accepts a
# silent discontinuation, which leaves no screen to capture.
- runFlow:
    when:
      visible: "Oups! Something went wrong|invalid request|Presentation blocked|The requested document is not available.*"
    commands:
      - takeScreenshot: wallet-refused
- takeScreenshot: request-refused
