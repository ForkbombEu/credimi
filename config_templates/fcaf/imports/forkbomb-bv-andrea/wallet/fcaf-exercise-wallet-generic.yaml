appId: eu.europa.ec.euidi
name: FCAF exercise wallet - generic capture session flow
tags:
  - fcaf
  - exercise
  - generic
---
- launchApp:
    stopApp: true
    clearState: false
    permissions:
      camera: allow
      notifications: allow
      all: unset
- extendedWaitUntil:
    visible: "Welcome back|Home|Documents|Add document|Welcome, .*"
    timeout: 30000
- runFlow:
    when:
      visible: "Welcome back"
    commands:
      - tapOn:
          point: "11%,40%"
      - inputText: "123456"
      - hideKeyboard
      - tapOn:
          point: "50%,10%"
- extendedWaitUntil:
    visible: "Home|Documents|Add document|Welcome, .*"
    timeout: 30000
- openLink:
    link: "${deeplink}"
    autoVerify: false
    browser: false
- runFlow:
    when:
      visible: "EUDI Wallet"
    commands:
      - tapOn:
          text: "EUDI Wallet"
          optional: true
- runFlow:
    when:
      visible: "Just once"
    commands:
      - tapOn:
          text: "Just once"
          optional: true
- runFlow:
    when:
      visible: "Always"
    commands:
      - tapOn:
          text: "Always"
          optional: true
- extendedWaitUntil:
    visible: "Welcome back|Error|invalid request|Something went wrong|DATA SHARING REQUEST"
    timeout: 100000
- runFlow:
    when:
      visible: "DATA SHARING REQUEST"
    commands:
      - tapOn: "Share"
      - extendedWaitUntil:
          visible: "PIN"
          timeout: 30000
      - tapOn:
          point: "11%,39%"
      - inputText: "123456"
      - tapOn:
          point: "50%,10%"
      - extendedWaitUntil:
          visible: ".*successfully shared.*|Welcome back"
          timeout: 30000
- runFlow:
    when:
      visible: "Welcome back"
    commands:
      - tapOn:
          point: "11%,40%"
      - inputText: "123456"
- extendedWaitUntil:
    visible: "Error|invalid request|Something went wrong|Home|Documents"
    timeout: 30000
- takeScreenshot: exercise-wallet
- back
