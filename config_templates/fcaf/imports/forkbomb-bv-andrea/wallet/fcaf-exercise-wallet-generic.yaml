appId: eu.europa.ec.euidi
name: FCAF exercise wallet - generic capture session flow
tags:
  - fcaf
  - exercise
  - generic
---
- launchApp:
    stopApp: true
    clearState: false
    permissions:
      camera: allow
      notifications: allow
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 30000
# A wait that ends on a screen still being composed leaves the next `when`
# check no lookup time; settling first restarts Maestro's lookup window.
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible: "Welcome back"
    commands:
      - inputText: "12345"
      - tapOn: "6"
- waitForAnimationToEnd: { timeout: 3000 }
- openLink:
    link: "${deeplink}"
    autoVerify: false
    browser: false
- waitForAnimationToEnd: { timeout: 3000 }
- runFlow:
    when:
      visible: "Requested data"
    commands:
      - tapOn: "Share"
      - waitForAnimationToEnd: { timeout: 3000 }
      - inputText: "12345"
      - tapOn: "6"
      # A verifier that rejects the Authorization Response or replies with an
      # HTTP error leaves the Wallet on its error screen instead.
- extendedWaitUntil:
    visible: "The requested document is not available.*|invalid request|Oups! Something went wrong|.*successfully shared.*|Home|Documents"
    timeout: 30000
- takeScreenshot: exercise-wallet
