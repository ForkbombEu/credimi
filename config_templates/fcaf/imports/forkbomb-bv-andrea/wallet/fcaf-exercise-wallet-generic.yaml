appId: eu.europa.ec.euidi
name: FCAF exercise wallet - generic capture session flow
tags:
  - fcaf
  - exercise
  - generic
---
- launchApp:
    stopApp: true
    clearState: false
    permissions:
      camera: allow
      notifications: allow
      all: unset
- extendedWaitUntil:
    visible: "Welcome back|Home|Documents|Add document|Welcome, .*"
    timeout: 30000
- runFlow:
    when:
      visible: "Welcome back"
    commands:
      - extendedWaitUntil:
          visible: "1"
          timeout: 30000
      - inputText: "12345"
      - tapOn: "6"
- extendedWaitUntil:
    visible: "Home|Documents|Add document|Welcome, .*"
    timeout: 30000
- openLink:
    link: "${deeplink}"
    autoVerify: false
    browser: false
- extendedWaitUntil:
    visible: "Error|invalid request|Oups! Something went wrong|Data sharing request"
    timeout: 100000
- runFlow:
    when:
      visible: "Data sharing request"
    commands:
      - tapOn: "Share"
      - extendedWaitUntil:
          visible: "1"
          timeout: 30000
      - inputText: "12345"
      - tapOn: "6"
      # A verifier that rejects the Authorization Response or replies with an
      # HTTP error leaves the Wallet on its error screen instead.
      - extendedWaitUntil:
          visible: ".*successfully shared.*|Oups! Something went wrong"
          timeout: 30000
- extendedWaitUntil:
    visible: "Error|invalid request|Oups! Something went wrong|.*successfully shared.*|Home|Documents"
    timeout: 30000
- takeScreenshot: exercise-wallet
- back
