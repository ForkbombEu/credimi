appId: eu.europa.ec.euidi
name: FCAF exercise wallet - generic capture session flow
tags:
  - fcaf
  - ws_rp
  - exercise
  - generic
---
# The flow accepts any final screen, so it proves no outcome: only the Share tap
# and the PIN entry can fail it. Both waits are therefore optional, and each
# screenshot comes before the next step, so a run that stops early still stores
# what the Wallet showed. `consent` is taken only while the consent screen lists
# Requested data, so a test can bind a screenshot of the consent request alone.
- launchApp:
    stopApp: true
    clearState: false
    permissions:
      camera: allow
      notifications: allow
- extendedWaitUntil:
    visible: "Welcome back|Home|Documents|Welcome, .*"
    timeout: 30000
    optional: true
- takeScreenshot: exercise-wallet-launch
# A wait that ends on a screen still being composed leaves the next `when`
# check no lookup time; settling first restarts Maestro's lookup window.
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible: "Welcome back"
    commands:
      - inputText: "12345"
      - tapOn: "6"
- waitForAnimationToEnd: { timeout: 3000 }
- openLink:
    link: "${deeplink}"
    autoVerify: false
    browser: false
- waitForAnimationToEnd: { timeout: 3000 }
- runFlow:
    when:
      visible: "Requested data"
    commands:
      - takeScreenshot: consent
      - tapOn: "Share"
      - waitForAnimationToEnd: { timeout: 3000 }
      - inputText: "12345"
      - tapOn: "6"
      # A verifier that rejects the Authorization Response or replies with an
      # HTTP error leaves the Wallet on its error screen instead.
- extendedWaitUntil:
    visible: "The requested document is not available.*|invalid request|Oups! Something went wrong|.*successfully shared.*|Home|Documents|Presentation blocked|Welcome back"
    timeout: 30000
    optional: true
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: exercise-wallet
