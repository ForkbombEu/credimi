appId: eu.europa.ec.euidi
name: FCAF submit request object by value
tags:
  - fcaf
  - request-object
  - by-value
---
- stopApp
- openLink:
    link: "${deeplink}"
    autoVerify: false
    browser: false
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible: "Welcome back|Share|Cancel|Close"
    timeout: 100000
- runFlow:
    when:
      visible: "Welcome back"
    commands:
      - extendedWaitUntil:
          visible: "1"
          timeout: 30000
      - inputText: "12345"
      - tapOn: "6"
- extendedWaitUntil:
    visible: "Share"
    timeout: 100000
- takeScreenshot: fcaf-request-object-by-value-consent
- tapOn:
    text: "Share"
    enabled: true
- extendedWaitUntil:
    visible: "1"
    timeout: 30000
- inputText: "12345"
- tapOn: "6"
- extendedWaitUntil:
    visible: "Close"
    timeout: 30000
- assertVisible: "Close"
- takeScreenshot: fcaf-request-object-by-value-accepted
