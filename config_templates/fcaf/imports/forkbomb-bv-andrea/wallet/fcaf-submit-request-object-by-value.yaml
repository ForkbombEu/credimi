appId: eu.europa.ec.euidi
name: FCAF submit request object by value
tags:
  - fcaf
  - request-object
  - by-value
---
- stopApp
- openLink:
    link: "${deeplink}"
    autoVerify: false
    browser: false
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "EUDI Wallet"
    optional: true
- tapOn:
    text: "Just once"
    optional: true
- extendedWaitUntil:
    visible: "Welcome back|Share|Cancel|Close"
    timeout: 100000
- runFlow:
    when:
      visible: "Welcome back"
    commands:
      - tapOn:
          point: "11%,40%"
      - inputText: "123456"
      - hideKeyboard
      - tapOn:
          point: "50%,10%"
- extendedWaitUntil:
    visible: "Share"
    timeout: 100000
- tapOn:
    text: "Share"
    enabled: true
- extendedWaitUntil:
    visible: "verify your identity|PIN"
    timeout: 30000
- tapOn:
    point: "11%,39%"
- inputText: "123456"
- hideKeyboard
- tapOn:
    point: "50%,10%"
- extendedWaitUntil:
    visible: "Close"
    timeout: 30000
- assertVisible: "Close"
- takeScreenshot: fcaf-request-object-by-value-accepted
