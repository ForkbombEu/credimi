appId: eu.europa.ec.euidi
name: FCAF expect request rejected - error or interaction discontinuation
tags:
  - fcaf
  - expect
  - rejected
---
# Shared terminal flow for negative cases whose accepted outcome is an error
# screen OR a silent return to Home. It deliberately differs from
# fcaf-exercise-wallet-generic, whose post-openLink wait excludes Home and
# Documents so that positive flows cannot skip the consent screen. Do not add
# Home or Documents to that action; use this one instead.
- launchApp:
    stopApp: true
    clearState: false
    permissions:
      camera: allow
      notifications: allow
      all: unset
- extendedWaitUntil:
    visible: "Welcome back|Home|Documents|Add document|Welcome, .*"
    timeout: 30000
- runFlow:
    when:
      visible: "Welcome back"
    commands:
      - tapOn:
          point: "11%,40%"
      - inputText: "123456"
      - hideKeyboard
      - tapOn:
          point: "50%,10%"
- extendedWaitUntil:
    visible: "Home|Documents|Add document|Welcome, .*"
    timeout: 30000
- openLink:
    link: "${deeplink}"
    autoVerify: false
    browser: false
- runFlow:
    when:
      visible: "EUDI Wallet"
    commands:
      - tapOn:
          text: "EUDI Wallet"
          optional: true
- runFlow:
    when:
      visible: "Just once"
    commands:
      - tapOn:
          text: "Just once"
          optional: true
- runFlow:
    when:
      visible: "Always"
    commands:
      - tapOn:
          text: "Always"
          optional: true
- extendedWaitUntil:
    visible: "Welcome back|Error|invalid request|Something went wrong|Home|Documents"
    timeout: 100000
- runFlow:
    when:
      visible: "Welcome back"
    commands:
      - tapOn:
          point: "11%,40%"
      - inputText: "123456"
      - hideKeyboard
      - tapOn:
          point: "50%,10%"
- extendedWaitUntil:
    visible: "Error|invalid request|Something went wrong|Home|Documents"
    timeout: 30000
- takeScreenshot: expect-request-rejected
