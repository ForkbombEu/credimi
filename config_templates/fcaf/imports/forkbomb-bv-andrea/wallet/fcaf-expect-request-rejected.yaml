appId: eu.europa.ec.euidi
name: FCAF expect request rejected - error or interaction discontinuation
tags:
  - fcaf
  - ws_rp
  - expect
  - rejected
---
# Shared terminal flow for negative cases whose accepted outcome is an error
# screen, a no-match notice, or a silent return to Home. It deliberately differs
# from fcaf-exercise-wallet-generic, whose post-openLink wait excludes Home and
# Documents so that positive flows cannot skip the consent screen. Do not add
# Home or Documents to that action; use this one instead.
#
# The Wallet is still showing Home the instant after openLink, so a screenshot
# taken then is not evidence that it reacted: only a decisive screen (consent
# request, no-match notice, Wallet error, blocked presentation) proves the
# request reached the Wallet. Home/Documents is therefore accepted only after
# two bounded, optional waits for a decisive screen: a 30 s probe and, when that
# finds nothing, a further 100 s window, so a Wallet slower than 33 s is not
# The consent screen is captured, then answered with Share and the PIN so the
# Verifier records the Authorization Response. The action fails afterwards:
# reaching consent is itself a failure for every caller of this strict
# rejection action.
- launchApp:
    stopApp: true
    clearState: false
    permissions:
      camera: allow
      notifications: allow
- extendedWaitUntil:
    visible: "Welcome back|Home|Documents|Add document|Welcome, .*"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible: "Welcome back"
    commands:
      - extendedWaitUntil:
          visible: "1"
          timeout: 30000
      - inputText: "12345"
      - tapOn: "6"
- extendedWaitUntil:
    visible: "Home|Documents|Add document|Welcome, .*"
    timeout: 30000
- openLink:
    link: "${deeplink}"
    autoVerify: false
    browser: false
# A settle wait so every `when`-style lookup below starts from a screen that is
# no longer being composed.
- waitForAnimationToEnd:
    timeout: 3000
# Phase 1: bounded, optional wait for a decisive Wallet screen. A second
# `Welcome back` lock screen counts as a reaction to the link even though it says
# nothing yet about the request's outcome.
- extendedWaitUntil:
    visible: "Welcome back|Requested data|The requested document is not available.*|invalid request|Oups! Something went wrong|Presentation blocked"
    timeout: 30000
    optional: true
# A second lock screen after openLink is unlocked with the shared unlock
# sequence before the request screen is awaited again.
- runFlow:
    when:
      visible: "Welcome back"
    commands:
      - extendedWaitUntil:
          visible: "1"
          timeout: 30000
      - inputText: "12345"
      - tapOn: "6"
      - waitForAnimationToEnd:
          timeout: 3000
# Phase 2: the decisive screens only, optional and long, so a slow Wallet gets
# the whole window to render its reaction before Home/Documents counts as a
# discontinuation. While this wait accepted Home/Documents it returned the
# instant phase 1 timed out, so a Wallet that needed longer than phase 1's
# window was recorded as having discontinued.
- extendedWaitUntil:
    visible: "Requested data|The requested document is not available.*|invalid request|Oups! Something went wrong|Presentation blocked"
    timeout: 100000
    optional: true
# Phase 3: only now accept the discontinuation outcomes. It is optional too, so
# a Wallet parked on a screen this flow does not know still reaches the
# screenshot instead of failing the step and with it the evidence.
- extendedWaitUntil:
    visible: "Requested data|The requested document is not available.*|invalid request|Oups! Something went wrong|Presentation blocked|Home|Documents|Add document|Welcome, .*"
    timeout: 30000
    optional: true
# Phase 4: a consent screen means the Wallet accepted a request it had to
# reject. Capture both the consent and post-Share state so the Verifier records
# its response, then fail this Wallet action regardless of that response.
- runFlow:
    when:
      visible: "Requested data"
    commands:
    - takeScreenshot: consent
    - tapOn: "Share"
    - waitForAnimationToEnd:
        timeout: 3000
    - inputText: "12345"
    - tapOn: "6"
    - extendedWaitUntil:
        visible: ".*successfully shared.*|Oups! Something went wrong|invalid request"
        timeout: 30000
        optional: true
    - takeScreenshot: post-share
    - assertNotVisible:
        text: ".*successfully shared.*"
        label: "Wallet must not complete a presentation for a rejected request"
    - assertTrue:
        condition: "false"
        label: "Wallet displayed consent for a request it must reject"
# When the Wallet never presented a consent screen, preserve its terminal state
# for the protocol assertion to classify.
- takeScreenshot: request-refused
