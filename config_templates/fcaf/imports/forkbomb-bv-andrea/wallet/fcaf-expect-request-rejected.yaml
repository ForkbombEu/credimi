appId: eu.europa.ec.euidi
name: FCAF expect request rejected - error or interaction discontinuation
tags:
  - fcaf
  - expect
  - rejected
---
# Shared terminal flow for negative cases whose accepted outcome is an error
# screen OR a silent return to Home. It deliberately differs from
# fcaf-exercise-wallet-generic, whose post-openLink wait excludes Home and
# Documents so that positive flows cannot skip the consent screen. Do not add
# Home or Documents to that action; use this one instead.
- launchApp:
    stopApp: true
    clearState: false
    permissions:
      camera: allow
      notifications: allow
      all: unset
- extendedWaitUntil:
    visible: "Welcome back|Home|Documents|Add document|Welcome, .*"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible: "Welcome back"
    commands:
      - extendedWaitUntil:
          visible: "1"
          timeout: 30000
      - inputText: "12345"
      - tapOn: "6"
- extendedWaitUntil:
    visible: "Home|Documents|Add document|Welcome, .*"
    timeout: 30000
- openLink:
    link: "${deeplink}"
    autoVerify: false
    browser: false
- extendedWaitUntil:
    visible: "Error|invalid request|Oups! Something went wrong|Home|Documents"
    timeout: 100000
- takeScreenshot: expect-request-rejected
