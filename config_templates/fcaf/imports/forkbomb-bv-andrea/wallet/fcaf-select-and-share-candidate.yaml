appId: eu.europa.ec.euidi
name: FCAF select and share a matching PID
tags:
  - fcaf
  - ws_rp
---
# Every wait that can fail comes after a screenshot, so a step that fails on any
# of them still shows the screen the Wallet stopped on.
- launchApp:
    stopApp: true
    clearState: false
- extendedWaitUntil:
    visible: "Welcome back|Home|Documents|Add document|Welcome, .*"
    timeout: 30000
    optional: true
- takeScreenshot: pid-candidates-launch
- runFlow:
    when:
      visible: "1"
    commands:
      - inputText: "12345"
      - tapOn: "6"
- extendedWaitUntil:
    visible: "Home|Documents|Add document|Welcome, .*"
    timeout: 30000
- openLink:
    link: "${deeplink}"
    autoVerify: false
    browser: false
- tapOn:
    text: "Just once"
    optional: true
# Phase 1: a bounded, optional probe, because a second `Welcome back` lock screen
# after openLink counts as a reaction even though it says nothing yet.
- extendedWaitUntil:
    visible: "Welcome back|Data sharing request|The requested document is not available.*|invalid request|Oups! Something went wrong|Presentation blocked"
    timeout: 30000
    optional: true
- takeScreenshot: pid-candidates-open
- runFlow:
    when:
      visible: "Welcome back"
    commands:
      - extendedWaitUntil:
          visible: "1"
          timeout: 30000
      - inputText: "12345"
      - tapOn: "6"
# Phase 2: the decisive screens only, optional and long, so a slow Wallet gets the
# whole window to render its candidate list.
- extendedWaitUntil:
    visible: "Data sharing request|The requested document is not available.*|invalid request|Oups! Something went wrong|Presentation blocked"
    timeout: 100000
    optional: true
- takeScreenshot: pid-candidates-request
# M >= 2 proves several candidates are offered; reading "Option 2 of M"
# after the tap proves the user could select the second one.
- assertVisible: "Option 1 of [2-9][0-9]*"
- takeScreenshot: pid-candidates-offered
- tapOn:
    point: "15%,53%"
- assertVisible: "Option 2 of [2-9][0-9]*"
- takeScreenshot: pid-candidate-selected
- tapOn: "Share"
- extendedWaitUntil:
    visible: "1"
    timeout: 30000
- inputText: "12345"
- tapOn: "6"
# The result screen, or the error screen a Wallet that refused ends on: optional
# wait, then the screenshot, then the strict wait.
- extendedWaitUntil:
    visible: ".*successfully shared.*|Oups! Something went wrong|invalid request"
    timeout: 30000
    optional: true
- takeScreenshot: pid-candidate-shared
- extendedWaitUntil:
    visible: ".*successfully shared.*"
    timeout: 30000
