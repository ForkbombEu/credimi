appId: eu.europa.ec.euidi
name: "getCredential: generic credential without authentication"
tags:
  - wallet
  - credential
  - generic
---
# Start from a deterministic wallet state: a previous step can leave the app on
# a half-finished screen with the PIN keyboard still up, which hides the
# credential-offer action bar and makes the offer unacceptable.
- launchApp:
    stopApp: true
    clearState: false
- openLink:
    link: ${deeplink}
    autoVerify: false
    browser: false
- tapOn: { text: "EUDI Wallet", optional: true }
- tapOn: { text: "Just once", optional: true }
- tapOn: { text: "Always", optional: true }
- tapOn: { text: "Use without an account", optional: true }
- tapOn: { text: "No thanks", optional: true }
- extendedWaitUntil: { visible: "Welcome back|Accept", timeout: 100000 }
- runFlow:
    when:
      visible: "Welcome back"
    commands:
      - tapOn:
          point: "11%,40%"
      - inputText: "123456"
      - hideKeyboard
      - tapOn:
          point: "50%,10%"
- extendedWaitUntil: { visible: "Accept", timeout: 100000 }
- takeScreenshot: credential-offer-received
- tapOn: "Accept"
- waitForAnimationToEnd: { timeout: 5000 }
- assertNotVisible: "Accept"
- tapOn: { text: "View details", optional: true }
- waitForAnimationToEnd: { timeout: 1000 }
- takeScreenshot: credential-added
