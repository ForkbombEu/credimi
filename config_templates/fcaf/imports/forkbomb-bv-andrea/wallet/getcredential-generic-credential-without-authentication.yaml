appId: eu.europa.ec.euidi
name: "getCredential: generic credential without authentication"
tags:
  - wallet
  - credential
  - generic
---
# Start from a deterministic wallet state: a previous step can leave the app on
# a half-finished screen with the PIN keyboard still up, which hides the
# credential-offer action bar and makes the offer unacceptable.
- launchApp:
    stopApp: true
    clearState: false
- openLink:
    link: ${deeplink}
    autoVerify: false
    browser: false
- extendedWaitUntil: { visible: "Welcome back|Accept", timeout: 100000 }
- waitForAnimationToEnd: { timeout: 3000 }
- runFlow:
    when:
      visible: "Welcome back"
    commands:
      - extendedWaitUntil:
          visible: "1"
          timeout: 30000
      - inputText: "12345"
      - tapOn: "6"
- extendedWaitUntil: { visible: "Accept", timeout: 100000 }
- tapOn: "Accept"
- extendedWaitUntil: { visible: "View details", timeout: 100000 }
- tapOn: "View details"
- waitForAnimationToEnd: { timeout: 1000 }
- takeScreenshot: credential-added
