appId: eu.europa.ec.euidi
name: FCAF user denied consent
tags:
  - fcaf
  - ws_rp
---
- launchApp:
    stopApp: true
    clearState: false
- extendedWaitUntil:
    visible: "Welcome back|Home|Documents|Add document|Welcome, .*"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible: "Welcome back"
    commands:
    - extendedWaitUntil:
        visible: "1"
        timeout: 30000
    - inputText: "12345"
    - tapOn: "6"
- extendedWaitUntil:
    visible: "Home|Documents|Add document|Welcome, .*"
    timeout: 30000
- openLink:
    link: "${deeplink}"
    autoVerify: false
    browser: false
- extendedWaitUntil:
    visible: "Welcome back|Data sharing request"
    timeout: 100000
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible: "Welcome back"
    commands:
    - extendedWaitUntil:
        visible: "1"
        timeout: 30000
    - inputText: "12345"
    - tapOn: "6"
- extendedWaitUntil:
    visible: "Data sharing request"
    timeout: 100000
- assertVisible:
    id: "eu.europa.ec.euidi:id/request_screen_requested_document_0"
- tapOn:
    id: "eu.europa.ec.euidi:id/request_screen_requested_document_0"
    retryTapIfNoChange: false
- assertVisible: "Given Name"
- takeScreenshot: "fcaf-148-consent-screen-before-denial"
- tapOn: "Go Back"
- runFlow:
    when:
      visible: "Cancel the process|Are you sure"
    commands:
    - tapOn:
        text: "Cancel|Yes|Confirm"
        index: 1
- extendedWaitUntil:
    visible: "Home|Welcome, .*|Oups! Something went wrong"
    timeout: 30000
- takeScreenshot: "fcaf-148-after-consent-denial"
