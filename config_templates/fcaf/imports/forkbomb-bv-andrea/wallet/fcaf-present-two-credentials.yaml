appId: eu.europa.ec.euidi
name: FCAF present two credentials
tags:
  - fcaf
  - ws_rp
---
# Same unlock and share sequence as fcaf-submit-request-object-by-value,
# plus the check that both requested credentials are listed.
- stopApp
- openLink:
    link: "${deeplink}"
    autoVerify: false
    browser: false
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible: "Welcome back|Share|Cancel|Close"
    timeout: 100000
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible: "Welcome back"
    commands:
      - extendedWaitUntil:
          visible: "1"
          timeout: 30000
      - inputText: "12345"
      - tapOn: "6"
- extendedWaitUntil:
    visible: "Data sharing request"
    timeout: 100000
- assertVisible: { id: "eu.europa.ec.euidi:id/request_screen_requested_document_0" }
- assertVisible: { id: "eu.europa.ec.euidi:id/request_screen_requested_document_1" }
- takeScreenshot: fcaf-main-interaction-039-two-credentials
- tapOn:
    text: "Share"
    enabled: true
- extendedWaitUntil:
    visible: "1"
    timeout: 30000
- inputText: "12345"
- tapOn: "6"
- extendedWaitUntil:
    visible: ".*successfully shared.*"
    timeout: 30000
- takeScreenshot: fcaf-main-interaction-039-shared
- tapOn: "Close"
