appId: eu.europa.ec.euidi
name: FCAF present two credentials
tags:
  - fcaf
  - ws_rp
---
# Same unlock and share sequence as fcaf-submit-request-object-by-value, plus the
# check that both requested credentials are listed. Every wait that can fail comes
# after a screenshot, so a step that fails on any of them still shows the screen the
# Wallet stopped on.
- "stopApp"
- openLink:
    link: "${deeplink}"
    autoVerify: false
    browser: false
- waitForAnimationToEnd:
    timeout: 5000
# The lock screen, the consent screen, or an error screen: optional, then the
# screenshot, then the strict waits below.
- extendedWaitUntil:
    visible: "Welcome back|Share|Cancel|Close|Oups! Something went wrong|invalid request|Presentation blocked"
    timeout: 100000
    optional: true
- takeScreenshot: fcaf-039-open
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible: "Welcome back"
    commands:
      - extendedWaitUntil:
          visible: "1"
          timeout: 30000
      - inputText: "12345"
      - tapOn: "6"
- extendedWaitUntil:
    visible: "Data sharing request|The requested document is not available.*|invalid request|Oups! Something went wrong|Presentation blocked"
    timeout: 100000
    optional: true
- takeScreenshot: fcaf-039-request
- assertVisible:
    id: "eu.europa.ec.euidi:id/request_screen_requested_document_0"
- assertVisible:
    id: "eu.europa.ec.euidi:id/request_screen_requested_document_1"
- takeScreenshot: fcaf-main-interaction-039-two-credentials
- tapOn:
    text: "Share"
    enabled: true
- extendedWaitUntil:
    visible: "1"
    timeout: 30000
- inputText: "12345"
- tapOn: "6"
# The result screen, or the error screen a Wallet that refused ends on: optional
# wait, then the screenshot, then the strict wait.
- extendedWaitUntil:
    visible: ".*successfully shared.*|Oups! Something went wrong|invalid request"
    timeout: 30000
    optional: true
- takeScreenshot: fcaf-main-interaction-039-shared
- extendedWaitUntil:
    visible: ".*successfully shared.*"
    timeout: 30000
- tapOn: "Close"
