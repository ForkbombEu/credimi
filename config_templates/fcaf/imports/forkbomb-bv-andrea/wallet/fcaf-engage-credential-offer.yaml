appId: eu.europa.ec.euidi
name: FCAF engage a Credential Offer from the issuer's engagement page
tags:
  - fcaf
  - engagement
  - credential
---
# The End-user engages a Credential Offer the way the attestation-provider
# sources describe it: the User-agent shows the issuer's page with the offer
# link, and the End-user follows it. `engage_url` is Capture's
# /ui/sessions/{id}/engage page, whose only action is "Open in wallet" on the
# session's delivered deeplink.
#
# The screenshots are the evidence oid4vci.offer_engagement reads:
# - offer-link-presented: the User-agent presents the option to engage;
# - ua-engage-prompt: Chrome asks to hand the link to a wallet app;
# - wallet-invoked: the Wallet's screen replaced the page;
# - wallet-not-invoked: the page is still shown, so the platform resolved the
#   link's scheme to no Wallet;
# - issuance-offer / issuance-outcome: the Wallet's offer screen and the screen
#   it ends on after Accept.
# When the Wallet shows the offer it is accepted, also for a malformed offer, so
# a tolerant Wallet makes the requests the negative tests must not see. The
# flow never asserts an outcome: the Capture session decides the verdict.
- launchApp:
    appId: com.android.chrome
    stopApp: true
- openLink:
    link: ${engage_url}
    browser: true
- extendedWaitUntil:
    visible: "Open in wallet"
    timeout: 60000
- takeScreenshot: offer-link-presented
- tapOn: "Open in wallet"
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible: "Do you trust this site with your data?"
    commands:
      - takeScreenshot: ua-engage-prompt
      - tapOn: "Continue"
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible: "Welcome back|Issuance request|Oups! Something went wrong"
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible: "Open in wallet"
    commands:
      - takeScreenshot: wallet-not-invoked
- runFlow:
    when:
      visible: "Welcome back|Issuance request|Oups! Something went wrong"
    commands:
      - takeScreenshot: wallet-invoked
      - runFlow:
          when:
            visible: "Welcome back"
          commands:
            - extendedWaitUntil:
                visible: "1"
                timeout: 30000
            - inputText: "12345"
            - tapOn: "6"
            - hideKeyboard
            - extendedWaitUntil:
                visible: "Issuance request|Oups! Something went wrong"
                timeout: 30000
                optional: true
      - runFlow:
          when:
            visible: "Issuance request"
          commands:
            - takeScreenshot: issuance-offer
            - scrollUntilVisible:
                element: "Accept"
            - tapOn: "Accept"
            - extendedWaitUntil:
                visible: "View details|Oups! Something went wrong|invalid request"
                timeout: 100000
                optional: true
            - waitForAnimationToEnd:
                timeout: 3000
            - takeScreenshot: issuance-outcome
