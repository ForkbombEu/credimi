name: FCAF attestation provider Credential Offer by value
runtime:
  fixture:
    issuer_url: https://capture-wallet.credimi.io
    log_checker: capture-wallet
  temporal:
    activity_options:
      schedule_to_close_timeout: 50m
      start_to_close_timeout: 50m
      retry_policy:
        maximum_attempts: 1
steps:
  # Three issuer-initiated Credential Offers by value with the eu-eaa-offer://
  # scheme, each engaged from Capture's engagement page
  # (fcaf-engage-credential-offer): a valid offer (WS_AP_MS_ProtocolMessages_033a),
  # one without credential_issuer (033b_UF) and one without
  # credential_configuration_ids (033c_UF). offer_mutation edits only the
  # delivered offer; raw.credential_offer_delivered records what the Wallet got.
  # 033b_UF also requires that the Wallet fetches no metadata, including from
  # the engagement page's own origin, so it is judged on the session window's
  # unattributed requests and assumes no other client used the deployment.
  - id: create-valid-offer-session
    use: http-request
    with:
      method: POST
      url: ${fixture.issuer_url}/sessions
      expected_status: 201
      headers:
        Content-Type: application/json
      body:
        issuer_configuration_id: eu-pid-device-bound
        credential_configuration_id: urn:eu.europa.ec.eudi:pid:1.sd-jwt.key-attestation-required
        flow: authorization_code
        evidence_mode: full
        offer_scheme: eu-eaa-offer://

  - id: engage-valid-offer
    use: mobile-automation
    with:
      action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-engage-credential-offer
      version_id: installed_from_external_source
      parameters:
        engage_url: ${fixture.issuer_url}/ui/sessions/${{ create-valid-offer-session.outputs.body.session_id }}/engage

  - id: fetch-valid-offer-session
    use: http-request
    with:
      method: GET
      url: ${fixture.issuer_url}/sessions/${{ create-valid-offer-session.outputs.body.session_id }}
      expected_status: 200

  - id: fetch-valid-offer-requests
    use: http-request
    with:
      method: GET
      url: ${fixture.issuer_url}/sessions/${{ create-valid-offer-session.outputs.body.session_id }}/requests
      expected_status: 200

  - id: create-offer-without-issuer-session
    use: http-request
    with:
      method: POST
      url: ${fixture.issuer_url}/sessions
      expected_status: 201
      headers:
        Content-Type: application/json
      body:
        issuer_configuration_id: eu-pid-device-bound
        credential_configuration_id: urn:eu.europa.ec.eudi:pid:1.sd-jwt.key-attestation-required
        flow: authorization_code
        evidence_mode: full
        offer_scheme: eu-eaa-offer://
        offer_mutation:
          unset:
            - /credential_issuer

  - id: engage-offer-without-issuer
    use: mobile-automation
    with:
      action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-engage-credential-offer
      version_id: installed_from_external_source
      parameters:
        engage_url: ${fixture.issuer_url}/ui/sessions/${{ create-offer-without-issuer-session.outputs.body.session_id }}/engage

  - id: fetch-offer-without-issuer-session
    use: http-request
    with:
      method: GET
      url: ${fixture.issuer_url}/sessions/${{ create-offer-without-issuer-session.outputs.body.session_id }}
      expected_status: 200

  - id: fetch-offer-without-issuer-requests
    use: http-request
    with:
      method: GET
      url: ${fixture.issuer_url}/sessions/${{ create-offer-without-issuer-session.outputs.body.session_id }}/requests
      expected_status: 200

  - id: create-offer-without-ids-session
    use: http-request
    with:
      method: POST
      url: ${fixture.issuer_url}/sessions
      expected_status: 201
      headers:
        Content-Type: application/json
      body:
        issuer_configuration_id: eu-pid-device-bound
        credential_configuration_id: urn:eu.europa.ec.eudi:pid:1.sd-jwt.key-attestation-required
        flow: authorization_code
        evidence_mode: full
        offer_scheme: eu-eaa-offer://
        offer_mutation:
          unset:
            - /credential_configuration_ids

  - id: engage-offer-without-ids
    use: mobile-automation
    with:
      action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-engage-credential-offer
      version_id: installed_from_external_source
      parameters:
        engage_url: ${fixture.issuer_url}/ui/sessions/${{ create-offer-without-ids-session.outputs.body.session_id }}/engage

  - id: fetch-offer-without-ids-session
    use: http-request
    with:
      method: GET
      url: ${fixture.issuer_url}/sessions/${{ create-offer-without-ids-session.outputs.body.session_id }}
      expected_status: 200

  - id: fetch-offer-without-ids-requests
    use: http-request
    with:
      method: GET
      url: ${fixture.issuer_url}/sessions/${{ create-offer-without-ids-session.outputs.body.session_id }}/requests
      expected_status: 200

  - id: run-fcaf-validators
    use: fcaf-validation
    with:
      suite: wallet_solution/attestation_provider
      test_ids:
        - WS_AP_MS_ProtocolMessages_033a
        - WS_AP_MS_ProtocolMessages_033b_UF
        - WS_AP_MS_ProtocolMessages_033c_UF
      pipeline_outputs:
        pipeline.ap.credential-offer-by-value:
          output:
            valid_offer_engagement:
              session_creation: ${{ create-valid-offer-session.outputs.body }}
              capture_session: ${{ fetch-valid-offer-session.outputs.body }}
              session_requests: ${{ fetch-valid-offer-requests.outputs.body }}
              screenshots: ${{ engage-valid-offer.outputs.flow_output.maestro_screenshot_urls }}
            valid_offer_visual_evidence: ${{ engage-valid-offer.outputs.flow_output.maestro_screenshot_urls }}
            offer_without_issuer_engagement:
              session_creation: ${{ create-offer-without-issuer-session.outputs.body }}
              capture_session: ${{ fetch-offer-without-issuer-session.outputs.body }}
              session_requests: ${{ fetch-offer-without-issuer-requests.outputs.body }}
              screenshots: ${{ engage-offer-without-issuer.outputs.flow_output.maestro_screenshot_urls }}
            offer_without_issuer_visual_evidence: ${{ engage-offer-without-issuer.outputs.flow_output.maestro_screenshot_urls }}
            offer_without_ids_engagement:
              session_creation: ${{ create-offer-without-ids-session.outputs.body }}
              capture_session: ${{ fetch-offer-without-ids-session.outputs.body }}
              session_requests: ${{ fetch-offer-without-ids-requests.outputs.body }}
              screenshots: ${{ engage-offer-without-ids.outputs.flow_output.maestro_screenshot_urls }}
            offer_without_ids_visual_evidence: ${{ engage-offer-without-ids.outputs.flow_output.maestro_screenshot_urls }}
