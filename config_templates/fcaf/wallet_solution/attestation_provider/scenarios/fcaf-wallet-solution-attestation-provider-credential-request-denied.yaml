name: FCAF attestation provider Credential Request denied
runtime:
  fixture:
    issuer_url: https://capture-wallet.credimi.io
    verifier_url: https://capture-wallet.credimi.io
    log_checker: capture-wallet
  temporal:
    activity_options:
      schedule_to_close_timeout: 50m
      start_to_close_timeout: 50m
      retry_policy:
        maximum_attempts: 1
steps:
  # WS_AP_IA_MainInteraction_031b_UF: every Credential Request of the session
  # is answered with the Credential Error Response
  # {"error":"credential_request_denied"} (issuance_response_scenario.credential).
  # Credo still issues behind it, so the session status is not evidence; the
  # Wallet's requests after the denial and a follow-up presentation are.
  - id: create-issuance-session
    use: http-request
    with:
      method: POST
      url: ${fixture.issuer_url}/sessions
      expected_status: 201
      headers:
        Content-Type: application/json
      body:
        issuer_configuration_id: eu-pid-device-bound
        credential_configuration_id: urn:eu.europa.ec.eudi:pid:1.sd-jwt.key-attestation-required
        flow: authorization_code
        evidence_mode: full
        fixture_id: pid_person_b
        issuance_response_scenario:
          credential:
            status: 400
            content_type: application/json
            body: '{"error":"credential_request_denied"}'

  - id: accept-offer
    use: mobile-automation
    with:
      action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-expect-credential-rejected
      version_id: installed_from_external_source
      parameters:
        deeplink: ${{ create-issuance-session.outputs.body.deeplink }}

  # Leaves the Wallet 20 s to retry or continue the issuance before the
  # session's requests are read. Waits without touching the Wallet: the text
  # never appears and the wait is optional.
  - id: observe-wallet-after-denial
    use: mobile-automation
    with:
      version_id: installed_from_external_source
      action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-observe-wallet-after-denial

  - id: fetch-issuance-session
    use: http-request
    with:
      method: GET
      url: ${fixture.issuer_url}/sessions/${{ create-issuance-session.outputs.body.session_id }}
      expected_status: 200

  - id: fetch-issuance-requests
    use: http-request
    with:
      method: GET
      url: ${fixture.issuer_url}/sessions/${{ create-issuance-session.outputs.body.session_id }}/requests
      expected_status: 200

  # The denied credential was issued as pid_person_b, the only fixture with
  # family_name Bianchi. The Wallet holds another PID before this request (the
  # generator injects one), so a no-match proves the denied credential was not
  # stored, not that the Wallet is empty.
  - id: create-stored-credential-probe
    use: http-request
    with:
      method: POST
      url: ${fixture.verifier_url}/openid4vp/sessions
      expected_status: 201
      headers:
        Content-Type: application/json
      body:
        scheme: haip-vp://
        request_delivery: by_reference
        request_uri_method: post
        response_type: vp_token
        response_mode: direct_post.jwt
        presentation_request:
          nonce: fcaf-ws-ap-main-interaction-031b-uf
          dcql_query:
            credentials:
              - id: denied_pid
                format: dc+sd-jwt
                meta:
                  vct_values:
                    - urn:eudi:pid:1
                claims:
                  - path:
                      - family_name
                    values:
                      - Bianchi

  - id: probe-stored-credential
    use: mobile-automation
    with:
      action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-expect-no-matching-document
      version_id: installed_from_external_source
      parameters:
        deeplink: ${{ create-stored-credential-probe.outputs.body.deeplink }}

  - id: fetch-stored-credential-probe
    use: http-request
    with:
      method: GET
      url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-stored-credential-probe.outputs.body.session_id }}
      expected_status: 200

  - id: run-fcaf-validators
    use: fcaf-validation
    with:
      suite: wallet_solution/attestation_provider
      test_ids:
        - WS_AP_IA_MainInteraction_031b_UF
      pipeline_outputs:
        pipeline.ap.credential-request-denied:
          output:
            issuance_exchange:
              capture_session: ${{ fetch-issuance-session.outputs.body }}
              session_requests: ${{ fetch-issuance-requests.outputs.body }}
            stored_credential_probe: ${{ fetch-stored-credential-probe.outputs.body }}
            issuance_visual_evidence: ${{ accept-offer.outputs.flow_output.maestro_screenshot_urls }}
