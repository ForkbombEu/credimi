name: FCAF attestation provider authorization-code issuance
runtime:
  fixture:
    issuer_url: https://capture-wallet.credimi.io
    verifier_url: https://capture-wallet.credimi.io
    log_checker: capture-wallet
  temporal:
    activity_options:
      schedule_to_close_timeout: 50m
      start_to_close_timeout: 50m
      retry_policy:
        maximum_attempts: 1
steps:
  # One authorization-code issuance from the device-bound PID issuer, whose
  # metadata requires key attestations for both proof types.
  # evidence_mode "full" keeps the session's own requests in clear: the Client
  # Attestation and PoP headers, the PAR body bytes and response, the
  # Authorization Request's request_uri, and the Credential Request proofs as
  # received (raw.credential_request_proofs, recorded before Credo verifies
  # anything). The deployment must set FCAF_SCENARIOS_ENABLED; otherwise the
  # session is refused with evidence_mode_not_enabled and every test of this
  # scenario is blocked. `pid_person_b` (family_name Bianchi) makes the issued
  # credential addressable by the presentation below.
  - id: create-issuance-session
    use: http-request
    with:
      method: POST
      url: ${fixture.issuer_url}/sessions
      expected_status: 201
      headers:
        Content-Type: application/json
      body:
        issuer_configuration_id: eu-pid-device-bound
        credential_configuration_id: urn:eu.europa.ec.eudi:pid:1.sd-jwt.key-attestation-required
        flow: authorization_code
        evidence_mode: full
        fixture_id: pid_person_b

  - id: obtain-issued-credential
    use: mobile-automation
    with:
      action_id: forkbomb-bv-andrea/eudiw-beta-wallet/getcredential-generic-credential-without-authentication
      version_id: installed_from_external_source
      parameters:
        deeplink: ${{ create-issuance-session.outputs.body.deeplink }}

  # Read right after the issuance: the ledger behind the capture keeps only
  # its latest 1,000 entries.
  - id: fetch-issuance-session
    use: http-request
    with:
      method: GET
      url: ${fixture.issuer_url}/sessions/${{ create-issuance-session.outputs.body.session_id }}
      expected_status: 200

  - id: fetch-issuer-metadata
    use: http-request
    with:
      method: GET
      url: ${fixture.issuer_url}/.well-known/openid-credential-issuer/issuers/eu-pid-device-bound
      expected_status: 200

  - id: fetch-authorization-server-metadata
    use: http-request
    with:
      method: GET
      url: ${fixture.issuer_url}/.well-known/oauth-authorization-server/issuers/eu-pid-device-bound
      expected_status: 200

  # WS_AP_IA_MainInteraction_031a: the stored credential must be presentable.
  # Only the pid_person_b credential matches family_name Bianchi.
  - id: create-presentation-session
    use: http-request
    with:
      method: POST
      url: ${fixture.verifier_url}/openid4vp/sessions
      expected_status: 201
      headers:
        Content-Type: application/json
      body:
        scheme: haip-vp://
        request_delivery: by_reference
        request_uri_method: post
        response_type: vp_token
        response_mode: direct_post.jwt
        presentation_request:
          nonce: fcaf-ws-ap-main-interaction-031a
          dcql_query:
            credentials:
              - id: issued_pid
                format: dc+sd-jwt
                meta:
                  vct_values:
                    - urn:eudi:pid:1
                claims:
                  - path:
                      - family_name
                    values:
                      - Bianchi
                  - path:
                      - given_name

  - id: present-issued-credential
    use: mobile-automation
    with:
      action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-engagement-haip-vp
      version_id: installed_from_external_source
      parameters:
        deeplink: ${{ create-presentation-session.outputs.body.deeplink }}

  - id: fetch-presentation-session
    use: http-request
    with:
      method: GET
      url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-presentation-session.outputs.body.session_id }}
      expected_status: 200

  - id: run-fcaf-validators
    use: fcaf-validation
    with:
      suite: wallet_solution/attestation_provider
      test_ids:
        - WS_AP_IA_Supportive_010a
        - WS_AP_IA_Supportive_011a
        - WS_AP_IA_MainInteraction_010a
        - WS_AP_IA_MainInteraction_010b
        - WS_AP_IA_MainInteraction_010c
        - WS_AP_IA_MainInteraction_030a
        - WS_AP_IA_MainInteraction_030b
        - WS_AP_IA_MainInteraction_031a
        - WS_AP_MS_ProtocolMessages_034a
        - WS_AP_MS_ProtocolMessages_034b
        - WS_AP_MS_ProtocolMessages_034c
        - WS_AP_MS_ProtocolMessages_034d
        - WS_AP_MS_ProtocolMessages_035a
        - WS_AP_MS_ProtocolMessages_035b
        - WS_AP_MS_ProtocolMessages_036a
        - WS_AP_MS_ProtocolMessages_036b
        - WS_AP_MS_ProtocolMessages_037a
        - WS_AP_MS_ProtocolMessages_037b
        - WS_AP_MS_ProtocolMessages_037c
        - WS_AP_MS_ProtocolMessages_038a
        - WS_AP_MS_ProtocolMessages_039a
        - WS_AP_MS_ProtocolMessages_039b
        - WS_AP_MS_ProtocolMessages_040a
        - WS_AP_MS_ProtocolMessages_040b
        - WS_AP_MS_ProtocolMessages_050a
        - WS_AP_MS_ProtocolMessages_050b
        - WS_AP_MS_ProtocolMessages_050c
        - WS_AP_MS_ProtocolMessages_050d
        - WS_AP_MS_ProtocolMessages_050e
        - WS_AP_MS_ProtocolMessages_051a
        - WS_AP_MS_ProtocolMessages_051b
        - WS_AP_MS_ProtocolMessages_051c
        - WS_AP_MS_ProtocolMessages_052a
        - WS_AP_MS_ProtocolMessages_052b
        - WS_AP_MS_ProtocolMessages_052c
        - WS_AP_MS_ProtocolMessages_053a
        - WS_AP_MS_ProtocolMessages_053b
        - WS_AP_MS_ProtocolMessages_053c
        - WS_AP_MS_ProtocolMessages_053d
        - WS_AP_SM_DeviceBinding_001a
        - WS_AP_SM_DeviceBinding_001b
        - WS_AP_SM_DeviceBinding_002a
        - WS_AP_SM_DeviceBinding_002b
        - WS_AP_SM_DeviceBinding_003a
        - WS_AP_SM_DeviceBinding_003b
        - WS_AP_SM_DeviceBinding_010a
        - WS_AP_SM_DeviceBinding_010b
        - WS_AP_SM_DeviceBinding_010c
        - WS_AP_SM_DeviceBinding_011a
        - WS_AP_SM_DeviceBinding_011b
        - WS_AP_SM_DeviceBinding_012a
        - WS_AP_SM_DeviceBinding_013a
      pipeline_outputs:
        pipeline.ap.authorization-code-issuance:
          output:
            issuance_exchange:
              capture_session: ${{ fetch-issuance-session.outputs.body }}
              issuer_metadata: ${{ fetch-issuer-metadata.outputs.body }}
              authorization_server_metadata: ${{ fetch-authorization-server-metadata.outputs.body }}
            issued_credential_presentation:
              issuance_session: ${{ fetch-issuance-session.outputs.body }}
              presentation_session: ${{ fetch-presentation-session.outputs.body }}
              screenshots: ${{ obtain-issued-credential.outputs.flow_output.maestro_screenshot_urls }}
