id: WS_AP_IA_MainInteraction_031a
title: Store the credential of a valid Credential Response and present it.
source:
  path: Interaction/MainInteraction/WS_AP_IA_MainInteraction_031a.md
suite:
  sut: wallet_solution
  role: attestation_provider
  section: interaction.main_interaction
applicability:
  profile: EUDI_generic
  issuance_flow: authorization_code
normative_references:
- title: ETSI TS 119 472-3
  section: '4.1'
- title: OpenID4VC High Assurance Interoperability Profile 1.0
  section: '4'
  url: https://openid.net/specs/openid4vc-high-assurance-interoperability-profile-1_0.html
- title: OpenID for Verifiable Credential Issuance 1.0
  section: '8.3'
  url: https://openid.net/specs/openid-4-verifiable-credential-issuance-1_0.html
evidence:
  issued_credential_presentation:
    from: pipeline.ap.authorization-code-issuance.outputs.issued_credential_presentation
  issuance_visual_evidence:
    from: pipeline.ap.authorization-code-issuance.outputs.issuance_visual_evidence
assertions:
# The presented SD-JWT VC must carry the issuer and the holder key Capture verified at
# issuance, so a credential the Wallet held before cannot stand in for this one.
- id: issued_credential_is_presented
  validator: oid4vci.issued_credential_presented
  input: evidence.issued_credential_presentation
- id: wallet_informs_the_user
  validator: evidence.screenshot_named
  input: evidence.issuance_visual_evidence
  params:
    name: credential-added
verdict:
  pass_when: all_assertions_pass
