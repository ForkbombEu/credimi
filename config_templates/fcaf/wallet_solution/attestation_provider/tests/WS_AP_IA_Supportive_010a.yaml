id: WS_AP_IA_Supportive_010a
title: Send the Pushed Authorization Request as a TLS POST to the pushed authorization request endpoint.
source:
  path: Interaction/Supportive/WS_AP_IA_Supportive_010a.md
suite:
  sut: wallet_solution
  role: attestation_provider
  section: interaction.supportive
applicability:
  profile: EUDI_generic
  issuance_flow: authorization_code
normative_references:
- title: ETSI TS 119 472-3
  section: '4.1'
- title: OpenID4VC High Assurance Interoperability Profile 1.0
  section: '4'
  url: https://openid.net/specs/openid4vc-high-assurance-interoperability-profile-1_0.html
- title: OpenID for Verifiable Credential Issuance 1.0
  section: '5.1.4'
  url: https://openid.net/specs/openid-4-verifiable-credential-issuance-1_0.html
- title: RFC 9126 OAuth 2.0 Pushed Authorization Requests
  section: '2'
  url: https://www.rfc-editor.org/rfc/rfc9126
evidence:
  issuance_exchange:
    from: pipeline.ap.authorization-code-issuance.outputs.issuance_exchange
assertions:
- id: par_targets_the_par_endpoint
  validator: oid4vci.wallet_request
  input: evidence.issuance_exchange
  params:
    path_suffix: '/par'
    methods: [POST]
    endpoint: {metadata: authorization_server_metadata, field: pushed_authorization_request_endpoint}
    require_tls: true
    forbid_query: true
verdict:
  pass_when: all_assertions_pass
