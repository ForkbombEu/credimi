id: WS_AP_MS_ProtocolMessages_038a
title: Carry iss, aud, jti and iat in the Client Attestation PoP.
source:
  path: MessageStructure/ProtocolMessages/WS_AP_MS_ProtocolMessages_038a.md
suite:
  sut: wallet_solution
  role: attestation_provider
  section: message_structure.protocol_messages
applicability:
  profile: EUDI_generic
  issuance_flow: authorization_code
normative_references:
- title: Commission Implementing Regulation (EU) 2024/2979, as amended
  section: 'annex Ib'
- title: ETSI TS 119 472-3
  section: '4.4'
- title: OpenID4VC High Assurance Interoperability Profile 1.0
  section: '4.3'
  url: https://openid.net/specs/openid4vc-high-assurance-interoperability-profile-1_0.html
- title: OpenID for Verifiable Credential Issuance 1.0
  section: 'E'
  url: https://openid.net/specs/openid-4-verifiable-credential-issuance-1_0.html
- title: RFC 9126 OAuth 2.0 Pushed Authorization Requests
  section: '2.1'
  url: https://www.rfc-editor.org/rfc/rfc9126
- title: OAuth 2.0 Attestation-Based Client Authentication
  section: '5.2'
  url: https://datatracker.ietf.org/doc/draft-ietf-oauth-attestation-based-client-auth/
evidence:
  issuance_exchange:
    from: pipeline.ap.authorization-code-issuance.outputs.issuance_exchange
assertions:
# challenge and nbf are optional, so they are not asserted.
- id: client_attestation_pop_claims_are_present
  validator: jose.member
  input: evidence.issuance_exchange
  params:
    select:
      request: /par
      path: raw_headers[OAuth-Client-Attestation-PoP]
    part: payload
    required:
    - iss
    - aud
    - jti
    - iat
verdict:
  pass_when: all_assertions_pass
