id: WS_AP_IA_MainInteraction_031b_UF
title: Abort issuance and store nothing after a credential_request_denied error.
source:
  path: Interaction/MainInteraction/WS_AP_IA_MainInteraction_031b_UF.md
suite:
  sut: wallet_solution
  role: attestation_provider
  section: interaction.main_interaction
applicability:
  profile: EUDI_generic
  issuance_flow: authorization_code
normative_references:
- title: ETSI TS 119 472-3
  section: '4.1'
- title: OpenID4VC High Assurance Interoperability Profile 1.0
  section: '4'
  url: https://openid.net/specs/openid4vc-high-assurance-interoperability-profile-1_0.html
- title: OpenID for Verifiable Credential Issuance 1.0
  section: '8.3.1.2'
  url: https://openid.net/specs/openid-4-verifiable-credential-issuance-1_0.html
evidence:
  issuance_exchange:
    from: pipeline.ap.credential-request-denied.outputs.issuance_exchange
  stored_credential_probe:
    from: pipeline.ap.credential-request-denied.outputs.stored_credential_probe
  issuance_visual_evidence:
    from: pipeline.ap.credential-request-denied.outputs.issuance_visual_evidence
assertions:
# Credo issues behind the denial, so the session status is no evidence. The probe asks for
# family_name Bianchi, which only the denied pid_person_b credential carries, while the
# Wallet holds another PID. Informing the user is "if applicable" and not asserted.
- id: issuer_denies_the_credential_request
  validator: oid4vci.issuer_response
  input: evidence.issuance_exchange
  params:
    request: /credential
    status: 400
    media_type: application/json
    members_equal:
      error: credential_request_denied
- id: no_further_request_follows
  validator: oid4vci.no_request_after
  input: evidence.issuance_exchange
  params:
    after: /credential
    observe_seconds: 15
- id: denied_credential_is_not_stored
  validator: oid4vp.no_presentation_returned
  input: evidence.stored_credential_probe
verdict:
  pass_when: all_assertions_pass
