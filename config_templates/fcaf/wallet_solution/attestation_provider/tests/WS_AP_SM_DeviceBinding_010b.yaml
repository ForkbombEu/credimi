id: WS_AP_SM_DeviceBinding_010b
title: Sign the jwt proof with ES256, ES384 or ES512.
source:
  path: SecurityMechanisms/DeviceBinding/WS_AP_SM_DeviceBinding_010b.md
suite:
  sut: wallet_solution
  role: attestation_provider
  section: security_mechanisms.device_binding
applicability:
  profile: EUDI_specific
  issuance_flow: authorization_code
normative_references:
- title: Commission Implementing Regulation (EU) 2024/2979, as amended
  section: 'annex Ia, Ib'
- title: ETSI TS 119 472-3
  section: '4.6.1.2'
- title: OpenID4VC High Assurance Interoperability Profile 1.0
  section: '4.5.1'
  url: https://openid.net/specs/openid4vc-high-assurance-interoperability-profile-1_0.html
- title: OpenID for Verifiable Credential Issuance 1.0
  section: '8.2, F.1'
  url: https://openid.net/specs/openid-4-verifiable-credential-issuance-1_0.html
- title: ECCG Agreed Cryptographic Mechanisms
  section: '5.2'
evidence:
  issuance_exchange:
    from: pipeline.ap.authorization-code-issuance.outputs.issuance_exchange
assertions:
# The issuer advertises ES256 only (proof_signing_alg_values_supported); the source asks for
# the ECCG and ES256/ES384/ES512 lists and leaves the advertised list as a TODO.
- id: jwt_proof_alg_is_acceptable
  validator: jose.signature_algorithm
  input: evidence.issuance_exchange
  params:
    select:
      path: raw.credential_request_proofs.jwt[].compact
      require: raw.credential_request_proofs
      absent: not_applicable
      reason: the Wallet sent no jwt proof; the source applies to a Wallet that uses the jwt proof type
        to convey a key attestation
verdict:
  pass_when: all_assertions_pass
