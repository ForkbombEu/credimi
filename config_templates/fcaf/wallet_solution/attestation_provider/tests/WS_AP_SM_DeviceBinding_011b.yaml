id: WS_AP_SM_DeviceBinding_011b
title: Sign the key attestation of a jwt proof with the key of its x5c certificate.
source:
  path: SecurityMechanisms/DeviceBinding/WS_AP_SM_DeviceBinding_011b.md
suite:
  sut: wallet_solution
  role: attestation_provider
  section: security_mechanisms.device_binding
applicability:
  profile: EUDI_specific
  issuance_flow: authorization_code
normative_references:
- title: Commission Implementing Regulation (EU) 2024/2979, as amended
  section: 'annex Ib'
- title: ETSI TS 119 472-3
  section: '4.6.1.2'
- title: OpenID4VC High Assurance Interoperability Profile 1.0
  section: '4.5.1'
  url: https://openid.net/specs/openid4vc-high-assurance-interoperability-profile-1_0.html
- title: OpenID for Verifiable Credential Issuance 1.0
  section: 'F.1'
  url: https://openid.net/specs/openid-4-verifiable-credential-issuance-1_0.html
evidence:
  issuance_exchange:
    from: pipeline.ap.jwt-key-attestation-issuance.outputs.issuance_exchange
assertions:
# DB_011b is missing from baseline-tests.md but has a source; it is implemented.
- id: key_attestation_signature_verifies
  validator: jose.signature_valid
  input: evidence.issuance_exchange
  params:
    select:
      path: raw.credential_request_proofs.jwt[].header.key_attestation
      require: raw.credential_request_proofs
      absent: not_applicable
      reason: the Wallet sent no jwt proof carrying a key_attestation; the source applies to a Wallet
        that uses the jwt proof type to convey a key attestation
    key:
      source: x5c
verdict:
  pass_when: all_assertions_pass
