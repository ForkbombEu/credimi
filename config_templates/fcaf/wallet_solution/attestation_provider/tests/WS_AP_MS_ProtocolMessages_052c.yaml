id: WS_AP_MS_ProtocolMessages_052c
title: Type the jwt proof as openid4vci-proof+jwt.
source:
  path: MessageStructure/ProtocolMessages/WS_AP_MS_ProtocolMessages_052c.md
suite:
  sut: wallet_solution
  role: attestation_provider
  section: message_structure.protocol_messages
applicability:
  profile: EUDI_generic
  issuance_flow: authorization_code
normative_references:
- title: Commission Implementing Regulation (EU) 2024/2979, as amended
  section: 'annex Ib'
- title: ETSI TS 119 472-3
  section: '4.6.1.2'
- title: OpenID4VC High Assurance Interoperability Profile 1.0
  section: '4.5.1'
  url: https://openid.net/specs/openid4vc-high-assurance-interoperability-profile-1_0.html
- title: OpenID for Verifiable Credential Issuance 1.0
  section: 'F.1'
  url: https://openid.net/specs/openid-4-verifiable-credential-issuance-1_0.html
- title: RFC 7515 JSON Web Signature (JWS)
  section: '4.1.9'
  url: https://www.rfc-editor.org/rfc/rfc7515
evidence:
  proof_headers:
    from: pipeline.ap.authorization-code-issuance.outputs.proof_headers
assertions:
# Profile applicability: a Wallet that conveys a key attestation in a jwt proof. Capture
# records proof headers only after Credo accepted the proof (inconclusive otherwise);
# a Wallet that sent attestation proofs only is not applicable.
- id: jwt_proof_typ_is_openid4vci_proof_jwt
  validator: oid4vci.proof_jwt_header
  input: evidence.proof_headers
  params:
    member_equals: {typ: openid4vci-proof+jwt}
verdict:
  pass_when: all_assertions_pass
