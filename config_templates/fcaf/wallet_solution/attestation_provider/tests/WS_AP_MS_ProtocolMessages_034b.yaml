id: WS_AP_MS_ProtocolMessages_034b
title: Send a request parameter in the Pushed Authorization Request when using JAR.
source:
  path: MessageStructure/ProtocolMessages/WS_AP_MS_ProtocolMessages_034b.md
suite:
  sut: wallet_solution
  role: attestation_provider
  section: message_structure.protocol_messages
applicability:
  profile: EUDI_generic
  issuance_flow: authorization_code
normative_references:
- title: ETSI TS 119 472-3
  section: '4.4'
- title: OpenID4VC High Assurance Interoperability Profile 1.0
  section: '4.3'
  url: https://openid.net/specs/openid4vc-high-assurance-interoperability-profile-1_0.html
- title: OpenID for Verifiable Credential Issuance 1.0
  section: '5.1.4'
  url: https://openid.net/specs/openid-4-verifiable-credential-issuance-1_0.html
- title: RFC 9126 OAuth 2.0 Pushed Authorization Requests
  section: '2'
  url: https://www.rfc-editor.org/rfc/rfc9126
evidence:
  issuance_exchange:
    from: pipeline.ap.authorization-code-issuance.outputs.issuance_exchange
assertions:
# Only a request parameter shows that a Wallet uses JAR during PAR; without it the test is
# not applicable. Credo rejects a PAR carrying request (400), so a JAR Wallet is blocked
# after the PAR; this test reads the captured PAR only.
- id: par_carries_request
  validator: json.value_shape
  input: evidence.issuance_exchange
  params:
    select:
      request: /par
      path: body.request
      absent: not_applicable
      reason: the PAR carries no request parameter, so the Wallet does not use JAR; the source applies
        to a Wallet that uses JAR during PAR
verdict:
  pass_when: all_assertions_pass
