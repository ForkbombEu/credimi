id: WS_AP_IA_MainInteraction_010a
title: Send the Authorization Request to the authorization endpoint after pushing it.
source:
  path: Interaction/MainInteraction/WS_AP_IA_MainInteraction_010a.md
suite:
  sut: wallet_solution
  role: attestation_provider
  section: interaction.main_interaction
applicability:
  profile: EUDI_generic
  issuance_flow: authorization_code
normative_references:
- title: ETSI TS 119 472-3
  section: '4.1'
- title: OpenID4VC High Assurance Interoperability Profile 1.0
  section: '4'
  url: https://openid.net/specs/openid4vc-high-assurance-interoperability-profile-1_0.html
- title: OpenID for Verifiable Credential Issuance 1.0
  section: '5.1'
  url: https://openid.net/specs/openid-4-verifiable-credential-issuance-1_0.html
- title: RFC 8414 OAuth 2.0 Authorization Server Metadata
  section: '2'
  url: https://www.rfc-editor.org/rfc/rfc8414
evidence:
  issuance_exchange:
    from: pipeline.ap.authorization-code-issuance.outputs.issuance_exchange
assertions:
- id: authorization_request_targets_the_authorization_endpoint
  validator: oid4vci.wallet_request
  input: evidence.issuance_exchange
  params:
    path_suffix: /authorize
    methods:
    - GET
    - POST
    endpoint:
      metadata: authorization_server_metadata
      field: authorization_endpoint
verdict:
  pass_when: all_assertions_pass
