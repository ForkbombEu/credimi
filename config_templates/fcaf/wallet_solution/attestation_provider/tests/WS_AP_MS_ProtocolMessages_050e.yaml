id: WS_AP_MS_ProtocolMessages_050e
title: Send proofs with either a jwt or an attestation member, not both.
source:
  path: MessageStructure/ProtocolMessages/WS_AP_MS_ProtocolMessages_050e.md
suite:
  sut: wallet_solution
  role: attestation_provider
  section: message_structure.protocol_messages
applicability:
  profile: EUDI_generic
  issuance_flow: authorization_code
normative_references:
- title: ETSI TS 119 472-3
  section: '4.6.1'
- title: OpenID4VC High Assurance Interoperability Profile 1.0
  section: '4.5.1'
  url: https://openid.net/specs/openid4vc-high-assurance-interoperability-profile-1_0.html
- title: OpenID for Verifiable Credential Issuance 1.0
  section: '8.2'
  url: https://openid.net/specs/openid-4-verifiable-credential-issuance-1_0.html
evidence:
  credential_request:
    from: pipeline.ap.authorization-code-issuance.outputs.credential_request
assertions:
# Capture redacts the proof values; a member counts as present when its redaction
# marker records it present.
- id: proofs_has_exactly_one_proof_type
  validator: json.object_exactly_one_member
  input: evidence.credential_request
  params:
    field: proofs
    members: [jwt, attestation]
verdict:
  pass_when: all_assertions_pass
