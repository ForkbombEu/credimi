id: WS_AP_MS_ProtocolMessages_040a
title: Send the required parameters in the Pushed Authorization Request.
source:
  path: MessageStructure/ProtocolMessages/WS_AP_MS_ProtocolMessages_040a.md
suite:
  sut: wallet_solution
  role: attestation_provider
  section: message_structure.protocol_messages
applicability:
  profile: EUDI_generic
  issuance_flow: authorization_code
normative_references:
- title: ETSI TS 119 472-3
  section: '4.4'
- title: OpenID4VC High Assurance Interoperability Profile 1.0
  section: '4.3'
  url: https://openid.net/specs/openid4vc-high-assurance-interoperability-profile-1_0.html
- title: OpenID for Verifiable Credential Issuance 1.0
  section: '5.1.2, 5.1.3'
  url: https://openid.net/specs/openid-4-verifiable-credential-issuance-1_0.html
- title: RFC 6749 The OAuth 2.0 Authorization Framework
  section: '4.1.1'
  url: https://www.rfc-editor.org/rfc/rfc6749
- title: RFC 7636 Proof Key for Code Exchange
  section: '4.3'
  url: https://www.rfc-editor.org/rfc/rfc7636
evidence:
  issuance_exchange:
    from: pipeline.ap.authorization-code-issuance.outputs.issuance_exchange
assertions:
# issuer_state and resource are optional, so they are not asserted.
- id: par_parameters_are_present
  validator: oid4vci.wallet_request
  input: evidence.issuance_exchange
  params:
    path_suffix: /par
    parameters:
      in: body
      required:
      - scope
      - response_type
      - client_id
      - redirect_uri
      - code_challenge
      - code_challenge_method
verdict:
  pass_when: all_assertions_pass
