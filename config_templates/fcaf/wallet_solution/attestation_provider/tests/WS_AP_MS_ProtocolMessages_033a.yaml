id: WS_AP_MS_ProtocolMessages_033a
title: Handle a valid Credential Offer by value and reach the authorization endpoint.
source:
  path: MessageStructure/ProtocolMessages/WS_AP_MS_ProtocolMessages_033a.md
suite:
  sut: wallet_solution
  role: attestation_provider
  section: message_structure.protocol_messages
applicability:
  profile: EUDI_generic
  issuance_flow: authorization_code
normative_references:
- title: ETSI TS 119 472-3
  section: '4.1'
- title: OpenID4VC High Assurance Interoperability Profile 1.0
  section: '4.2'
  url: https://openid.net/specs/openid4vc-high-assurance-interoperability-profile-1_0.html
- title: OpenID for Verifiable Credential Issuance 1.0
  section: '4.1'
  url: https://openid.net/specs/openid-4-verifiable-credential-issuance-1_0.html
evidence:
  valid_offer_engagement:
    from: pipeline.ap.credential-offer-by-value.outputs.valid_offer_engagement
  valid_offer_visual_evidence:
    from: pipeline.ap.credential-offer-by-value.outputs.valid_offer_visual_evidence
assertions:
# Precondition 2 is a Wallet invoked through eu-eaa-offer://: a Wallet that is not invoked
# leaves this test blocked (WS_AP_IA_Engagement_007b reports the missing scheme).
- id: user_agent_presents_the_offer_link
  validator: evidence.screenshot_named
  input: evidence.valid_offer_visual_evidence
  params:
    name: offer-link-presented
- id: wallet_requests_authorization
  validator: oid4vci.offer_engagement
  input: evidence.valid_offer_engagement
  params:
    scheme: eu-eaa-offer://
    offer_present:
    - credential_issuer
    - credential_configuration_ids
    when_not_invoked: blocked
    expect_requests:
    - /authorize
verdict:
  pass_when: all_assertions_pass
