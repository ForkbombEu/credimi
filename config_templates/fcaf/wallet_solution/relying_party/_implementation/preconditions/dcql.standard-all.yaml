id: pipeline.dcql.standard-all
kind: pipeline
description: Standard DCQL query for all shareable FCAF tests
pipeline_id: forkbomb-bv-andrea/fcaf-standard-dcql-all-shareable-tests
required_steps:
- create-capture-session
- exercise-wallet
- fetch-capture-session
outputs:
  dcql_exchange:
    path: $.output.dcql_exchange
    decoder: raw
  visual_evidence:
    path: $.output.exercise-wallet.flow_output.maestro_screenshot_urls
    decoder: raw
failure_policy: fail_dependent_preconditions_and_tests
