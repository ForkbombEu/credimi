id: pipeline.credential-formats.mdoc-presentation
kind: pipeline
description: Request and receive one PID presentation in ISO mdoc format.
pipeline_id: forkbomb-bv-andrea/fcaf-wallet-solution-relying-party-credential-format-mso-mdoc
required_steps:
  - onboard-reference-wallet
  - create-pid-mdoc-offer
  - obtain-pid-mdoc
  - create-capture-session
  - present-pid-mdoc
  - fetch-capture-session
outputs:
  dcql_exchange:
    path: $.output.fetch-capture-session.body
    decoder: raw
  pid_mdoc:
    path: $.output.fetch-capture-session.body.observed.wallet_response.value.vp_token
    decoder: mdoc.vp_token_json
  visual_evidence:
    path: $.output.present-pid-mdoc.flow_output.maestro_screenshot_urls
    decoder: raw
failure_policy: fail_dependent_preconditions_and_tests
