id: pipeline.pid.presentation.sdjwt.all-claims
kind: pipeline
description: Request and receive a PID presentation in SD-JWT VC format with all mandatory and ICS-present claims.
pipeline_id: forkbomb-bv-andrea/fcaf-wallet-solution-relying-party-pid-sdjwt-mdoc-combined
required_steps:
  - onboard-reference-wallet
  - create-pid-sdjwt-offer
  - obtain-pid-sdjwt
  - create-sdjwt-capture-session
  - invoke-wallet-with-sdjwt
  - fetch-sdjwt-capture-session
outputs:
  pid_sdjwt:
    path: $.output.fetch-sdjwt-capture-session.body.observed.wallet_response.value.vp_token
    decoder: sdjwt.vp_token_json
  pid_sdjwt_presentations:
    path: $.output.fetch-sdjwt-capture-session.body.observed.wallet_response.value.vp_token
    decoder: sdjwt.vp_token_presentations_json
  visual_evidence:
    path: $.output.invoke-wallet-with-sdjwt.flow_output.maestro_screenshot_urls
    decoder: raw
failure_policy: fail_dependent_preconditions_and_tests
