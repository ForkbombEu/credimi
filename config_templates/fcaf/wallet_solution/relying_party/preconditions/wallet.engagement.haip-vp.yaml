id: pipeline.wallet.engagement.haip-vp
kind: pipeline
description: Onboard the wallet, obtain a PID, invoke it through the haip-vp custom URL scheme, and reach the data-sharing request screen.
pipeline_id: forkbomb-bv-andrea/fcaf-wallet-solution-relying-party-engagement-haip-vp
required_steps:
  - onboard-reference-wallet
  - create-pid-sdjwt-offer
  - obtain-pid-sdjwt
  - create-capture-session
  - invoke-wallet-with-haip-vp
  - fetch-capture-session
outputs:
  wallet_engagement:
    path: $.output.fetch-capture-session.body
    decoder: raw
failure_policy: fail_dependent_preconditions_and_tests
