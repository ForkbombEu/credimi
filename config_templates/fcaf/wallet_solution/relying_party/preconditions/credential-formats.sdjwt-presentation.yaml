id: pipeline.credential-formats.sdjwt-presentation
kind: pipeline
description: Request and receive one PID presentation in IETF SD-JWT VC format.
pipeline_id: forkbomb-bv-andrea/fcaf-wallet-solution-relying-party-credential-format-dc-sd-jwt
required_steps:
  - onboard-reference-wallet
  - create-pid-sdjwt-offer
  - obtain-pid-sdjwt
  - create-capture-session
  - present-pid-sdjwt
  - fetch-capture-session
outputs:
  dcql_exchange:
    path: $.output.fetch-capture-session.body
    decoder: raw
  pid_sdjwt:
    path: $.output.fetch-capture-session.body.observed.wallet_response.value.vp_token
    decoder: sdjwt.vp_token_json
  visual_evidence:
    path: $.output.present-pid-sdjwt.flow_output.maestro_screenshot_urls
    decoder: raw
failure_policy: fail_dependent_preconditions_and_tests
