id: pipeline.dcql.credentials-match
kind: pipeline
description: Execute a presentation request containing multiple DCQL credentials entries.
pipeline_id: forkbomb-bv-andrea/fcaf-wallet-relying-party-dcql-credentials-match
required_steps:
- present-with-reference-implementation
- fetch-capture-session
outputs:
  dcql_exchange:
    path: $.output.fetch-capture-session.body
    decoder: raw
  visual_evidence:
    path: $.output.present-with-reference-implementation.flow_output.maestro_screenshot_urls
    decoder: raw
failure_policy: fail_dependent_preconditions_and_tests
