id: pipeline.dcql.claim-sets-non-array
kind: pipeline
description: Reject every JSON type family that is invalid for the DCQL claim_sets array.
pipeline_id: forkbomb-bv-andrea/fcaf-wallet-relying-party-dcql-claim-sets-non-array
required_steps:
- exercise-non-array-claim-sets
outputs:
  null_value:
    path: $.output.null_value
    decoder: raw
  true_value:
    path: $.output.true_value
    decoder: raw
  false_value:
    path: $.output.false_value
    decoder: raw
  zero_value:
    path: $.output.zero_value
    decoder: raw
  random_number:
    path: $.output.random_number
    decoder: raw
  string_value:
    path: $.output.string_value
    decoder: raw
  object_value:
    path: $.output.object_value
    decoder: raw
  visual_evidence:
    path: $.output.exercise-non-array-claim-sets.flow_output.maestro_screenshot_urls
    decoder: raw
failure_policy: fail_dependent_preconditions_and_tests
