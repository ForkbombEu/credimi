id: pipeline.pid.presentation.mdoc.all-claims-elements
kind: pipeline
description: Request and receive a PID presentation in ISO mdoc format with all mandatory and ICS-present elements.
pipeline_id: forkbomb-bv-andrea/fcaf-wallet-solution-relying-party-pid-sdjwt-mdoc-combined
required_steps:
  - onboard-reference-wallet
  - create-pid-mdoc-offer
  - obtain-pid-mdoc
  - create-capture-session
  - invoke-wallet-with-haip-vp
  - fetch-capture-session
outputs:
  pid_mdoc:
    path: $.output.fetch-capture-session.body.observed.wallet_response.value.vp_token
    decoder: mdoc.vp_token_json
  visual_evidence:
    path: $.output.invoke-wallet-with-haip-vp.flow_output.maestro_screenshot_urls
    decoder: raw
failure_policy: fail_dependent_preconditions_and_tests
