id: pipeline.dcql.trusted-authorities-match
kind: pipeline
description: Match credentials when the DCQL query includes valid trusted_authorities. Upstream requires the wallet holds
  more than one credential from the issuer specified in trusted_authorities.
pipeline_id: forkbomb-bv-andrea/fcaf-wallet-relying-party-dcql-trusted-authorities-match
required_steps:
- present-with-reference-implementation
- fetch-capture-session
outputs:
  dcql_exchange:
    path: $.output.fetch-capture-session.body
    decoder: raw
  visual_evidence:
    path: $.output.present-with-reference-implementation.flow_output.maestro_screenshot_urls
    decoder: raw
failure_policy: fail_dependent_preconditions_and_tests
