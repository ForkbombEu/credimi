id: pipeline.dcql.no-matching-credentials
kind: pipeline
description: Execute a DCQL request for which the wallet holds no matching credential.
pipeline_id: forkbomb-bv-andrea/fcaf-wallet-relying-party-dcql-no-matching-credentials
required_steps:
- present-with-reference-implementation
- fetch-capture-session
outputs:
  dcql_exchange:
    path: $.output.fetch-capture-session.body
    decoder: raw
  visual_evidence:
    path: $.output.present-with-reference-implementation.flow_output.maestro_screenshot_urls
    decoder: raw
failure_policy: fail_dependent_preconditions_and_tests
