name: FCAF wallet solution relying-party PID SDJWT mDoc combined
runtime:
  fixture:
    issuer_url: https://capture-wallet.credimi.io
    verifier_url: https://capture-wallet.credimi.io
    log_checker: capture-wallet
  global_runner_id: ""
  temporal:
    activity_options:
      schedule_to_close_timeout: 50m
      start_to_close_timeout: 50m
      heartbeat_timeout: 10m
      retry_policy:
        maximum_attempts: 1

steps:
  - id: onboard-reference-wallet
    use: mobile-automation
    with:
      action_id: forkbomb-bv-andrea/eudiw-beta-wallet/onboarding-1
      version_id: forkbomb-bv-andrea/eudiw-beta-wallet/2026-06-38-demo

  - id: create-pid-sdjwt-offer
    use: credential-offer
    with:
      credential_id: /forkbomb-bv-andrea/misc-issuer-integration-demo/capture-issuer-pid-dc-sd-jwt

  - id: obtain-pid-sdjwt
    use: mobile-automation
    with:
      action_id: forkbomb-bv-andrea/eudiw-beta-wallet/getcredential-generic-credential-without-authentication
      version_id: forkbomb-bv-andrea/eudiw-beta-wallet/2026-06-38-demo
      parameters:
        deeplink: ${{ create-pid-sdjwt-offer.outputs }}

  - id: create-sdjwt-capture-session
    use: http-request
    with:
      method: POST
      url: https://capture-wallet.credimi.io/openid4vp/sessions
      expected_status: 201
      headers:
        Content-Type: application/json
      body:
        scheme: haip-vp://
        request_uri_method: post
        request_delivery: by_reference
        response_type: vp_token
        response_mode: direct_post
        presentation_request:
          nonce: fcaf-pid-sdjwt-mdoc-combined-sdjwt
          dcql_query:
            credentials:
              - id: pid_sdjwt
                format: dc+sd-jwt
                meta:
                  vct_values:
                    - urn:eudi:pid:1
                claims:
                  - path: [given_name]
                  - path: [family_name]
                  - path: [birthdate]
                  - path: [place_of_birth]
                  - path: [birth_family_name]
                  - path: [birth_given_name]
                  - path: [email]
                  - path: [phone_number]
                  - path: [address, formatted]
                  - path: [address, country]
                  - path: [address, locality]
                  - path: [address, region]
                  - path: [address, street_address]
                  - path: [address, house_number]
                  - path: [address, postal_code]
                  - path: [date_of_expiry]
                  - path: [date_of_issuance]
                  - path: [document_number]
                  - path: [issuing_authority]
                  - path: [issuing_country]
                  - path: [issuing_jurisdiction]
                  - path: [nationalities]
                  - path: [personal_administrative_number]
                  - path: [picture]
                  - path: [sex]

  - id: invoke-wallet-with-sdjwt
    use: mobile-automation
    with:
      action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-engagement-haip-vp
      version_id: forkbomb-bv-andrea/eudiw-beta-wallet/2026-06-38-demo
      parameters:
        deeplink: ${{ create-sdjwt-capture-session.outputs.body.deeplink }}

  - id: fetch-sdjwt-capture-session
    use: http-request
    with:
      method: GET
      url: https://capture-wallet.credimi.io/openid4vp/sessions/${{ create-sdjwt-capture-session.outputs.body.session_id }}
      expected_status: 200

  - id: create-pid-mdoc-offer
    use: credential-offer
    with:
      credential_id: /forkbomb-bv-andrea/misc-issuer-integration-demo/capture-issuer-pid-mdoc

  - id: obtain-pid-mdoc
    use: mobile-automation
    with:
      action_id: forkbomb-bv-andrea/eudiw-beta-wallet/getcredential-generic-credential-without-authentication
      version_id: forkbomb-bv-andrea/eudiw-beta-wallet/2026-06-38-demo
      parameters:
        deeplink: ${{ create-pid-mdoc-offer.outputs }}

  - id: create-capture-session
    use: http-request
    with:
      method: POST
      url: https://capture-wallet.credimi.io/openid4vp/sessions
      expected_status: 201
      headers:
        Content-Type: application/json
      body:
        scheme: haip-vp://
        request_uri_method: post
        request_delivery: by_reference
        response_type: vp_token
        response_mode: direct_post
        presentation_request:
          nonce: fcaf-pid-mdoc-data-model
          dcql_query:
            credentials:
              - id: pid_mdoc
                format: mso_mdoc
                meta:
                  doctype_value: eu.europa.ec.eudi.pid.1
                claims:
                  - path: [eu.europa.ec.eudi.pid.1, birth_date]
                  - path: [eu.europa.ec.eudi.pid.1, document_number]
                  - path: [eu.europa.ec.eudi.pid.1, email_address]
                  - path: [eu.europa.ec.eudi.pid.1, expiry_date]
                  - path: [eu.europa.ec.eudi.pid.1, family_name]
                  - path: [eu.europa.ec.eudi.pid.1, family_name_birth]
                  - path: [eu.europa.ec.eudi.pid.1, given_name]
                  - path: [eu.europa.ec.eudi.pid.1, given_name_birth]
                  - path: [eu.europa.ec.eudi.pid.1, issuance_date]
                  - path: [eu.europa.ec.eudi.pid.1, issuing_authority]
                  - path: [eu.europa.ec.eudi.pid.1, issuing_country]
                  - path: [eu.europa.ec.eudi.pid.1, issuing_jurisdiction]
                  - path: [eu.europa.ec.eudi.pid.1, mobile_phone_number]
                  - path: [eu.europa.ec.eudi.pid.1, nationality]
                  - path: [eu.europa.ec.eudi.pid.1, personal_administrative_number]
                  - path: [eu.europa.ec.eudi.pid.1, place_of_birth]
                  - path: [eu.europa.ec.eudi.pid.1, portrait]
                  - path: [eu.europa.ec.eudi.pid.1, resident_address]
                  - path: [eu.europa.ec.eudi.pid.1, resident_city]
                  - path: [eu.europa.ec.eudi.pid.1, resident_country]
                  - path: [eu.europa.ec.eudi.pid.1, resident_house_number]
                  - path: [eu.europa.ec.eudi.pid.1, resident_postal_code]
                  - path: [eu.europa.ec.eudi.pid.1, resident_state]
                  - path: [eu.europa.ec.eudi.pid.1, resident_street]
                  - path: [eu.europa.ec.eudi.pid.1, sex]

  - id: invoke-wallet-with-haip-vp
    use: mobile-automation
    with:
      action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-engagement-haip-vp
      version_id: forkbomb-bv-andrea/eudiw-beta-wallet/2026-06-38-demo
      parameters:
        deeplink: ${{ create-capture-session.outputs.body.deeplink }}

  - id: fetch-capture-session
    use: http-request
    with:
      method: GET
      url: https://capture-wallet.credimi.io/openid4vp/sessions/${{ create-capture-session.outputs.body.session_id }}
      expected_status: 200
