name: FCAF wallet solution relying-party broken combined 3
runtime:
  global_runner_id: forkbomb-bv-andrea/usb
  temporal:
    activity_options:
      schedule_to_close_timeout: 50m
      start_to_close_timeout: 50m
      retry_policy:
        maximum_attempts: 1

steps:
  - id: onboard-reference-wallet
    use: mobile-automation
    with:
      action_id: forkbomb-bv-andrea/eudiw-beta-wallet/onboarding-1
      version_id: forkbomb-bv-andrea/eudiw-beta-wallet/2026-06-38-demo

  - id: protocol-messages-14-create-capture-session-2
    use: http-request
    with:
      method: POST
      url: https://capture-wallet.credimi.io/openid4vp/sessions
      expected_status: 201
      headers:
        Content-Type: application/json
      body:
        response_mode: direct_post
        presentation_request:
          nonce: fcaf-142
  - id: protocol-messages-14-exercise-wallet-2
    use: mobile-automation
    with:
      version_id: installed_from_external_source
      parameters:
        DEEPLINK: ${{ protocol-messages-14-create-capture-session-2.outputs.body.deeplink }}
      action_code: "appId: eu.europa.ec.euidi\n---\n- launchApp:\n    stopApp: true\n    clearState:\
        \ false\n    permissions:\n      camera: allow\n      notifications: allow\n      all: unset\n- extendedWaitUntil:\n\
        \    visible: \"Welcome back|Home|Documents|Add document|Welcome, .*\"\n    timeout: 30000\n- runFlow:\n    when:\n\
        \      visible: \"Welcome back\"\n    commands:\n      - tapOn:\n          point: \"11%,40%\"\n      - inputText: \"\
        123456\"\n      - hideKeyboard\n      - tapOn:\n          point: \"50%,10%\"\n- extendedWaitUntil:\n    visible: \"\
        Home|Documents|Add document|Welcome, .*\"\n    timeout: 30000\n- openLink:\n    link: \"${DEEPLINK}\"\n    autoVerify:\
        \ false\n    browser: false\n- runFlow:\n    when:\n      visible: \"EUDI Wallet\"\n    commands:\n      - tapOn:\n\
        \          text: \"EUDI Wallet\"\n          optional: true\n- runFlow:\n    when:\n      visible: \"Just once\"\n  \
        \  commands:\n      - tapOn:\n          text: \"Just once\"\n          optional: true\n- runFlow:\n    when:\n     \
        \ visible: \"Always\"\n    commands:\n      - tapOn:\n          text: \"Always\"\n          optional: true\n- extendedWaitUntil:\n\
        \    visible: \"Welcome back|Error|invalid request|Something went wrong|DATA SHARING REQUEST\"\n    timeout: 100000\n\
        - runFlow:\n    when:\n      visible: \"DATA SHARING REQUEST\"\n    commands:\n      - tapOn: \"Share\"\n      - extendedWaitUntil:\n\
        \          visible: \"PIN\"\n          timeout: 30000\n      - tapOn:\n          point: \"11%,39%\"\n      - inputText:\
        \ \"123456\"\n      - tapOn:\n          point: \"50%,10%\"\n      - extendedWaitUntil:\n          visible: \".*successfully\
        \ shared.*|Welcome back\"\n          timeout: 30000\n- runFlow:\n    when:\n      visible: \"Welcome back\"\n    commands:\n\
        \      - tapOn:\n          point: \"11%,40%\"\n      - inputText: \"123456\"\n- extendedWaitUntil:\n    visible: \"\
        Error|invalid request|Something went wrong|Home|Documents\"\n    timeout: 30000\n- takeScreenshot: protocol-messages-142\n\
        - back"
  - id: protocol-messages-14-fetch-capture-session-2
    use: http-request
    with:
      method: GET
      url: https://capture-wallet.credimi.io/openid4vp/sessions/${{ protocol-messages-14-create-capture-session-2.outputs.body.session_id }}
      expected_status: 200
  - id: protocol-messages-14-run-fcaf-validators-2
    use: fcaf-validation
    with:
      test_ids:
      - WS_RP_MS_ProtocolMessages__142
      suite: wallet_solution/relying_party
      pipeline_outputs:
        pipeline.dcql.protocol-messages-142:
          output:
            dcql_exchange: ${{ protocol-messages-14-fetch-capture-session-2.outputs.body }}
            visual_evidence: ${{ protocol-messages-14-exercise-wallet-2.outputs.flow_output.maestro_screenshot_urls }}
  
