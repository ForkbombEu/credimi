name: FCAF wallet relying-party DCQL claim sets
runtime:
  global_runner_id: forkbomb-bv-andrea/usb
  fixture:
    verifier_url: https://capture-wallet.credimi.io
  temporal:
    activity_options:
      schedule_to_close_timeout: 50m
      start_to_close_timeout: 50m
      retry_policy:
        maximum_attempts: 1

steps:
  - id: create-presentation
    use: http-request
    with:
      method: POST
      url: ${fixture.verifier_url}/openid4vp/sessions
      expected_status: 201
      headers:
        Content-Type: application/json
      body:
        response_type: vp_token
        nonce: fcaf-dcql-claim-sets
        dcql_query:
          credentials:
            - id: pid
              format: dc+sd-jwt
              meta:
                vct_values:
                  - urn:eu.europa.ec.eudi:pid:1
              claims:
                - id: identity_name
                  path:
                    - given_name
                - id: identity_family_name
                  path:
                    - family_name
                - id: postal_code
                  path:
                    - resident_postal_code
              claim_sets:
                - - identity_name
                - - identity_family_name
                - - postal_code

  - id: present-with-reference-implementation
    use: mobile-automation
    with:
      version_id: installed_from_external_source
      parameters:
        DEEPLINK: ${{ create-presentation.outputs.body.deeplink }}
      action_code: |
        appId: eu.europa.ec.euidi
        ---
        - launchApp:
            stopApp: false
            clearState: false
            permissions:
              camera: allow
              notifications: allow
              all: unset
        - openLink:
            link: ${env.DEEPLINK}
            autoVerify: false
            browser: false
        - waitForAnimationToEnd:
            timeout: 5000
        - tapOn:
            text: "(?i)(continue|accept|authorize|share|present)"
            optional: true
        - waitForAnimationToEnd:
            timeout: 5000
        - tapOn:
            text: "(?i)(continue|accept|authorize|share|present)"
            optional: true
        - waitForAnimationToEnd:
            timeout: 5000
        - takeScreenshot: fcaf-dcql-claim-sets

  - id: fetch-capture-session
    use: http-request
    with:
      method: GET
      url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-presentation.outputs.body.session_id }}
      expected_status: 200

  - id: run-fcaf-validators
    use: fcaf-validation
    with:
      test_ids:
        - WS_RP_DM_CredentialMetadata_CredentialStructure_010
        - WS_RP_IA_MainInteraction__019
      suite: wallet_solution/relying_party
      pipeline_outputs:
        pipeline.dcql.claim-sets:
          output:
            dcql_exchange: ${{ fetch-capture-session.outputs.body }}
            visual_evidence: ${{ present-with-reference-implementation.outputs.flow_output.maestro_screenshot_urls }}
            create-presentation: ${{ create-presentation.outputs }}
            present-with-reference-implementation: ${{ present-with-reference-implementation.outputs }}
            fetch-capture-session: ${{ fetch-capture-session.outputs }}
