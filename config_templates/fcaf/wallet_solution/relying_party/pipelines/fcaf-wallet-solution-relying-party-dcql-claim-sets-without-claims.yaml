name: FCAF DCQL claim sets without claims
runtime:
  global_runner_id: forkbomb-bv-andrea/usb
  fixture:
    verifier_url: https://capture-wallet.credimi.io
steps:
  - id: create-presentation
    use: http-request
    with:
      method: POST
      url: ${fixture.verifier_url}/openid4vp/sessions
      expected_status: 201
      headers:
        Content-Type: application/json
      body:
        response_type: vp_token
        nonce: fcaf-ia-022
        dcql_query:
          credentials:
            - id: pid
              format: dc+sd-jwt
              meta:
                vct_values:
                  - urn:eu.europa.ec.eudi:pid:1
              claim_sets:
                - - missing_claim

  - id: reject-claim-sets-without-claims
    use: mobile-automation
    with:
      version_id: installed_from_external_source
      parameters:
        DEEPLINK: ${{ create-presentation.outputs.body.deeplink }}
      action_code: |
        appId: eu.europa.ec.euidi
        ---
        - launchApp:
            stopApp: true
            clearState: false
        - openLink:
            link: ${env.DEEPLINK}
            autoVerify: false
            browser: false
        - extendedWaitUntil:
            visible: "Error|invalid request|Something went wrong|Home|Documents"
            timeout: 100000
        - takeScreenshot: fcaf-ia-022

  - id: fetch-result
    use: http-request
    with:
      method: GET
      url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-presentation.outputs.body.session_id }}
      expected_status: 200

  - id: run-fcaf-validators
    use: fcaf-validation
    with:
      test_ids:
        - WS_RP_IA_MainInteraction__022
      suite: wallet_solution/relying_party
      pipeline_outputs:
        pipeline.dcql.claim-sets-without-claims:
          output:
            dcql_exchange: ${{ fetch-result.outputs.body }}
            visual_evidence: ${{ reject-claim-sets-without-claims.outputs.flow_output.maestro_screenshot_urls }}
