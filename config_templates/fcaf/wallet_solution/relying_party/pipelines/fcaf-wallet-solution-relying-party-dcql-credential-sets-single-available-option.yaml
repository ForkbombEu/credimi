name: FCAF DCQL single available credential-set option
runtime:
  global_runner_id: forkbomb-bv-andrea/usb
  fixture:
    issuer_url: https://capture-wallet.credimi.io
    verifier_url: https://capture-wallet.credimi.io
steps:
  - id: onboard-reference-wallet
    use: mobile-automation
    with:
      action_id: forkbomb-bv-andrea/eudiw-beta-wallet/onboarding-1
      version_id: forkbomb-bv-andrea/eudiw-beta-wallet/2026-06-38-demo
  - id: create-pid-sdjwt-offer
    use: credential-offer
    with:
      credential_id: /forkbomb-bv-andrea/misc-issuer-integration-demo/capture-issuer-pid-dc-sd-jwt
  - id: obtain-pid-sdjwt
    use: mobile-automation
    with:
      action_id: forkbomb-bv-andrea/eudiw-beta-wallet/getcredential-generic-credential-without-authentication
      version_id: forkbomb-bv-andrea/eudiw-beta-wallet/2026-06-38-demo
      parameters:
        deeplink: ${{ create-pid-sdjwt-offer.outputs }}
  - id: create-presentation
    use: http-request
    with:
      method: POST
      url: ${fixture.verifier_url}/openid4vp/sessions
      expected_status: 201
      headers:
        Content-Type: application/json
      body:
        response_type: vp_token
        nonce: fcaf-ia-030
        dcql_query:
          credentials:
            - id: available_pid
              format: dc+sd-jwt
              meta:
                vct_values:
                  - urn:eudi:pid:1
            - id: unavailable_pid
              format: dc+sd-jwt
              meta:
                vct_values:
                  - urn:eudi:unavailable:1
          credential_sets:
            - options:
                - - available_pid
  - id: present-available-option
    use: mobile-automation
    with:
      action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-engagement-haip-vp
      version_id: forkbomb-bv-andrea/eudiw-beta-wallet/2026-06-38-demo
      parameters:
        deeplink: ${{ create-presentation.outputs.body.deeplink }}
  - id: fetch-result
    use: http-request
    with:
      method: GET
      url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-presentation.outputs.body.session_id }}
      expected_status: 200
  - id: run-fcaf-validators
    use: fcaf-validation
    with:
      test_ids:
        - WS_RP_IA_MainInteraction__030
      suite: wallet_solution/relying_party
      pipeline_outputs:
        pipeline.dcql.credential-sets-single-available-option:
          output:
            dcql_exchange: ${{ fetch-result.outputs.body }}
            visual_evidence: ${{ present-available-option.outputs.flow_output.maestro_screenshot_urls }}
