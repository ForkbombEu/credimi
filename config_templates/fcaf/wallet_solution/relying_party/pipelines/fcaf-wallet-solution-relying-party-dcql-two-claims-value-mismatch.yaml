name: FCAF DCQL two claims with a value mismatch
runtime:
  global_runner_id: forkbomb-bv-andrea/usb
  fixture:
    verifier_url: https://capture-wallet.credimi.io
steps:
  - id: create-presentation
    use: http-request
    with:
      method: POST
      url: ${fixture.verifier_url}/openid4vp/sessions
      expected_status: 201
      headers:
        Content-Type: application/json
      body:
        response_type: vp_token
        nonce: fcaf-ia-027
        dcql_query:
          credentials:
            - id: pid
              format: dc+sd-jwt
              meta:
                vct_values:
                  - urn:eu.europa.ec.eudi:pid:1
              claims:
                - path:
                    - given_name
                - path:
                    - family_name
                  values:
                    - value-that-does-not-match
  - id: exercise-no-match
    use: mobile-automation
    with:
      version_id: installed_from_external_source
      parameters:
        DEEPLINK: ${{ create-presentation.outputs.body.deeplink }}
      action_code: |
        appId: eu.europa.ec.euidi
        ---
        - launchApp:
            stopApp: true
            clearState: false
        - openLink:
            link: ${env.DEEPLINK}
            autoVerify: false
            browser: false
        - extendedWaitUntil:
            visible: "Error|Home|Documents|No matching"
            timeout: 100000
        - takeScreenshot: fcaf-ia-027
  - id: fetch-result
    use: http-request
    with:
      method: GET
      url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-presentation.outputs.body.session_id }}
      expected_status: 200
