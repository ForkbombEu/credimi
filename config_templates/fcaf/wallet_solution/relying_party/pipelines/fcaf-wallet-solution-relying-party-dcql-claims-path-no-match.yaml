name: FCAF DCQL unmatched claim path
runtime:
  global_runner_id: forkbomb-bv-andrea/usb
  fixture:
    verifier_url: https://capture-wallet.credimi.io
steps:
  - id: create-presentation
    use: http-request
    with:
      method: POST
      url: ${fixture.verifier_url}/openid4vp/sessions
      expected_status: 201
      headers:
        Content-Type: application/json
      body:
        response_type: vp_token
        nonce: fcaf-106
        dcql_query:
          credentials:
            - id: pid
              format: dc+sd-jwt
              meta:
                vct_values:
                  - urn:eu.europa.ec.eudi:pid:1
              claims:
                - id: missing_claim
                  path:
                    - claim_that_does_not_exist
              claim_sets:
                - - missing_claim

  - id: reject-unmatched-claim-path
    use: mobile-automation
    with:
      version_id: installed_from_external_source
      parameters:
        DEEPLINK: ${{ create-presentation.outputs.body.deeplink }}
      action_code: |
        appId: eu.europa.ec.euidi
        ---
        - launchApp:
            stopApp: true
            clearState: false
        - openLink:
            link: ${env.DEEPLINK}
            autoVerify: false
            browser: false
        - waitForAnimationToEnd:
            timeout: 5000
        - takeScreenshot: fcaf-106

  - id: fetch-result
    use: http-request
    with:
      method: GET
      url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-presentation.outputs.body.session_id }}
      expected_status: 200

  - id: run-fcaf-validators
    use: fcaf-validation
    with:
      test_ids:
        - WS_RP_MS_ProtocolMessages__106
        - WS_RP_IA_MainInteraction__021
      suite: wallet_solution/relying_party
      pipeline_outputs:
        pipeline.dcql.claims-path-no-match:
          output:
            dcql_exchange: ${{ fetch-result.outputs.body }}
            visual_evidence: ${{ reject-unmatched-claim-path.outputs.flow_output.maestro_screenshot_urls }}
            create-presentation: ${{ create-presentation.outputs }}
            reject-unmatched-claim-path: ${{ reject-unmatched-claim-path.outputs }}
            fetch-result: ${{ fetch-result.outputs }}
