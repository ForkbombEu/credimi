name: FCAF DCQL claim_sets second satisfiable option
runtime:
  global_runner_id: forkbomb-bv-andrea/usb
  fixture:
    verifier_url: https://capture-wallet.credimi.io
steps:
  - id: create-presentation
    use: http-request
    with:
      method: POST
      url: ${fixture.verifier_url}/openid4vp/sessions
      expected_status: 201
      headers:
        Content-Type: application/json
      body:
        response_type: vp_token
        nonce: fcaf-ia-020
        dcql_query:
          credentials:
            - id: pid
              format: dc+sd-jwt
              meta:
                vct_values:
                  - urn:eu.europa.ec.eudi:pid:1
              claims:
                - id: unavailable
                  path:
                    - claim_that_does_not_exist
                - id: second
                  path:
                    - given_name
                - id: third
                  path:
                    - family_name
              claim_sets:
                - - unavailable
                - - second
                - - third

  - id: present-second-preferred-option
    use: mobile-automation
    with:
      version_id: installed_from_external_source
      parameters:
        DEEPLINK: ${{ create-presentation.outputs.body.deeplink }}
      action_code: |
        appId: eu.europa.ec.euidi
        ---
        - launchApp:
            stopApp: true
            clearState: false
        - openLink:
            link: ${env.DEEPLINK}
            autoVerify: false
            browser: false
        - extendedWaitUntil:
            visible: "Welcome back|DATA SHARING REQUEST"
            timeout: 100000
        - runFlow:
            when:
              visible: "Welcome back"
            commands:
              - tapOn:
                  point: "11%,39%"
              - inputText: "123456"
              - tapOn:
                  point: "50%,10%"
        - extendedWaitUntil:
            visible: "DATA SHARING REQUEST"
            timeout: 100000
        - tapOn: "Share"
        - extendedWaitUntil:
            visible: "PIN"
            timeout: 30000
        - tapOn:
            point: "11%,39%"
        - inputText: "123456"
        - tapOn:
            point: "50%,10%"
        - extendedWaitUntil:
            visible: ".*successfully shared.*"
            timeout: 30000
        - takeScreenshot: fcaf-ia-020
        - tapOn: "Close"
  - id: fetch-result
    use: http-request
    with:
      method: GET
      url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-presentation.outputs.body.session_id }}
      expected_status: 200
  - id: run-fcaf-validators
    use: fcaf-validation
    with:
      test_ids:
        - WS_RP_IA_MainInteraction__020
      suite: wallet_solution/relying_party
      pipeline_outputs:
        pipeline.dcql.claim-sets-second-preferred:
          output:
            dcql_exchange: ${{ fetch-result.outputs.body }}
            visual_evidence: ${{ present-second-preferred-option.outputs.flow_output.maestro_screenshot_urls }}
