name: FCAF wallet relying-party IETF SD-JWT VC presentation format
runtime:
  fixture:
    issuer_url: https://capture-wallet.credimi.io
    verifier_url: https://capture-wallet.credimi.io
    log_checker: capture-wallet
  global_runner_id: ""
  temporal:
    activity_options:
      schedule_to_close_timeout: 50m
      start_to_close_timeout: 50m
      heartbeat_timeout: 10m
      retry_policy:
        maximum_attempts: 1

steps:
  - id: onboard-reference-wallet
    use: mobile-automation
    with:
      action_id: forkbomb-bv-andrea/eudiw-beta-wallet/onboarding-1
      version_id: forkbomb-bv-andrea/eudiw-beta-wallet/2026-06-38-demo

  - id: create-pid-sdjwt-offer
    use: credential-offer
    with:
      credential_id: /forkbomb-bv-andrea/misc-issuer-integration-demo/capture-issuer-pid-dc-sd-jwt

  - id: obtain-pid-sdjwt
    use: mobile-automation
    with:
      action_id: forkbomb-bv-andrea/eudiw-beta-wallet/getcredential-generic-credential-without-authentication
      version_id: forkbomb-bv-andrea/eudiw-beta-wallet/2026-06-38-demo
      parameters:
        deeplink: ${{ create-pid-sdjwt-offer.outputs }}

  - id: create-capture-session
    use: http-request
    with:
      method: POST
      url: https://capture-wallet.credimi.io/openid4vp/sessions
      expected_status: 201
      headers:
        Content-Type: application/json
      body:
        scheme: haip-vp://
        request_uri_method: post
        request_delivery: by_reference
        response_type: vp_token
        response_mode: direct_post
        presentation_request:
          nonce: fcaf-credential-format-dc-sd-jwt
          dcql_query:
            credentials:
              - id: pid_sdjwt
                format: dc+sd-jwt
                meta:
                  vct_values:
                    - urn:eudi:pid:1
                claims:
                  - path: [given_name]

  - id: present-pid-sdjwt
    use: mobile-automation
    with:
      action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-engagement-haip-vp
      version_id: forkbomb-bv-andrea/eudiw-beta-wallet/2026-06-38-demo
      parameters:
        deeplink: ${{ create-capture-session.outputs.body.deeplink }}

  - id: fetch-capture-session
    use: http-request
    with:
      method: GET
      url: "https://capture-wallet.credimi.io/openid4vp/sessions/${{ create-capture-session.outputs.body.session_id }}"
      expected_status: 200

  - id: run-fcaf-validators
    use: fcaf-validation
    with:
      test_ids:
        - WS_RP_MS_CredentialFormats__036
      suite: wallet_solution/relying_party
      pipeline_outputs:
        pipeline.credential-formats.sdjwt-presentation:
          output:
            dcql_exchange: ${{ fetch-capture-session.outputs.body }}
            pid_sdjwt: ${{ fetch-capture-session.outputs.body.observed.wallet_response.value.vp_token }}
            visual_evidence: ${{ present-pid-sdjwt.outputs.flow_output.maestro_screenshot_urls }}
            onboard-reference-wallet: ${{ onboard-reference-wallet.outputs }}
            create-pid-sdjwt-offer: ${{ create-pid-sdjwt-offer.outputs }}
            obtain-pid-sdjwt: ${{ obtain-pid-sdjwt.outputs }}
            create-capture-session: ${{ create-capture-session.outputs }}
            present-pid-sdjwt: ${{ present-pid-sdjwt.outputs }}
            fetch-capture-session: ${{ fetch-capture-session.outputs }}
