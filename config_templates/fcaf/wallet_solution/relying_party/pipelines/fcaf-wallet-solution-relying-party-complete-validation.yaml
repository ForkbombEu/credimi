name: FCAF wallet relying-party complete validation
runtime:
    global_runner_id: forkbomb-bv-andrea/usb
    temporal:
        activity_options:
            heartbeat_timeout: 10m
            retry_policy:
                maximum_attempts: 1
            schedule_to_close_timeout: 50m
            start_to_close_timeout: 50m
steps:
    - id: onboard-reference-wallet
      use: mobile-automation
      with:
        action_id: forkbomb-bv-andrea/eudiw-beta-wallet/onboarding-1
        version_id: forkbomb-bv-andrea/eudiw-beta-wallet/2026-06-38-demo
    - continue_on_error: true
      id: dcql-all-credentials-without-credent-5818b47e-create-presentation
      use: http-request
      with:
        body:
            dcql_query:
                credentials:
                    - claims:
                        - path:
                            - given_name
                      format: dc+sd-jwt
                      id: pid-given-name
                      meta:
                        vct_values:
                            - urn:eudi:pid:1
                    - claims:
                        - path:
                            - given_name
                      format: dc+sd-jwt
                      id: pid-given-name-copy
                      meta:
                        vct_values:
                            - urn:eudi:pid:1
            nonce: fcaf-117
            type: vp_token
        expected_status: 200
        headers:
            Content-Type: application/json
        method: POST
        url: ${fixture.verifier_url}/ui/presentations
    - continue_on_error: true
      id: dcql-all-credentials-without-credent-5818b47e-present-all-credentials
      use: mobile-automation
      with:
        action_code: |
            appId: eu.europa.ec.euidi
            ---
                    - launchApp: { stopApp: true, clearState: false }
            - extendedWaitUntil: { visible: "Welcome back|Home|Documents|Welcome, .*", timeout: 30000 }
            - runFlow:
                when: { visible: "Welcome back" }
                commands:
                  - tapOn: { point: "11%,40%" }
                  - inputText: "123456"
                  - tapOn: { point: "50%,10%" }
            - extendedWaitUntil: { visible: "Home|Documents|Welcome, .*", timeout: 30000 }
            - evalScript: ${output.authorizationRequest = 'eudi-openid4vp://?client_id=' + encodeURIComponent(env.CLIENT_ID) + '&request_uri=' + encodeURIComponent(env.REQUEST_URI)}
            - openLink: { link: ${output.authorizationRequest}, autoVerify: false, browser: false }
            - runFlow:
                when: { visible: "EUDI Wallet" }
                commands:
                  - tapOn: { text: "EUDI Wallet", optional: true }
            - runFlow:
                when: { visible: "Just once" }
                commands:
                  - tapOn: { text: "Just once", optional: true }
            - extendedWaitUntil: { visible: "Welcome back|DATA SHARING REQUEST", timeout: 100000 }
            - runFlow:
                when: { visible: "Welcome back" }
                commands:
                  - tapOn: { point: "11%,39%" }
                  - tapOn: { text: "1", retryTapIfNoChange: false }
                  - tapOn: { text: "2", retryTapIfNoChange: false }
                  - tapOn: { text: "3", retryTapIfNoChange: false }
                  - tapOn: { text: "4", retryTapIfNoChange: false }
                  - tapOn: { text: "5", retryTapIfNoChange: false }
                  - tapOn: { text: "6", retryTapIfNoChange: false, waitToSettleTimeoutMs: 0 }
            - extendedWaitUntil: { visible: "DATA SHARING REQUEST", timeout: 100000 }
            - assertVisible: { id: eu.europa.ec.euidi:id/request_screen_requested_document_0 }
            - assertVisible: { id: eu.europa.ec.euidi:id/request_screen_requested_document_1 }
            - tapOn: { id: eu.europa.ec.euidi:id/request_screen_requested_document_0, retryTapIfNoChange: false, waitToSettleTimeoutMs: 0 }
            - assertVisible: { text: "Given Name(s)", index: 0 }
            - assertVisible: { text: "Given Name(s)", index: 1 }
            - takeScreenshot: fcaf-117-all-credentials-required-bundle
            - tapOn: "Share"
            - extendedWaitUntil: { visible: "PIN", timeout: 30000 }
            - tapOn: { point: "11%,39%" }
            - inputText: "123456"
            - tapOn: { point: "50%,10%" }
            - extendedWaitUntil: { visible: ".*successfully shared.*", timeout: 30000 }
            - assertVisible: "EUDI Remote Verifier"
            - assertVisible: { id: eu.europa.ec.euidi:id/document_success_screen_document_0 }
            - assertVisible: { id: eu.europa.ec.euidi:id/document_success_screen_document_1 }
            - tapOn: { id: eu.europa.ec.euidi:id/document_success_screen_document_0 }
            - assertVisible: { text: "Given Name(s)", index: 0 }
            - assertVisible: { text: "Given Name(s)", index: 1 }
            - takeScreenshot: fcaf-117-all-credentials-shared
            - tapOn: "Close"
        parameters:
            CLIENT_ID: ${{ dcql-all-credentials-without-credent-5818b47e-create-presentation.outputs.body.client_id }}
            REQUEST_URI: ${{ dcql-all-credentials-without-credent-5818b47e-create-presentation.outputs.body.request_uri }}
