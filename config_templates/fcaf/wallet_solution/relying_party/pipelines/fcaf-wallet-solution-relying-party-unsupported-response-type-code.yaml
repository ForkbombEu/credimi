name: FCAF wallet relying-party unsupported code response type
runtime:
  fixture:
    verifier_url: https://capture-wallet.credimi.io
    log_checker: capture-wallet
  global_runner_id: ""
  temporal:
    activity_options:
      schedule_to_close_timeout: 50m
      start_to_close_timeout: 50m
      heartbeat_timeout: 10m
      retry_policy:
        maximum_attempts: 1

steps:
  - id: create-capture-session
    use: http-request
    with:
      method: POST
      url: ${fixture.verifier_url}/openid4vp/sessions
      expected_status: 201
      headers:
        Content-Type: application/json
      body:
        scheme: haip-vp://
        request_uri_method: post
        request_delivery: by_reference
        response_type: code
        response_mode: direct_post
        presentation_request:
          nonce: fcaf-credential-formats-040
          dcql_query:
            credentials:
              - id: pid_mdoc
                format: mso_mdoc
                meta:
                  doctype_value: eu.europa.ec.eudi.pid.1
                claims:
                  - path: [eu.europa.ec.eudi.pid.1, given_name]

  - id: exercise-wallet
    use: mobile-automation
    with:
      version_id: installed_from_external_source
      parameters:
        DEEPLINK: ${{ create-capture-session.outputs.body.deeplink }}
      action_code: |
        appId: eu.europa.ec.euidi
        ---
        - stopApp
        - launchApp: { clearState: false }
        - extendedWaitUntil: { visible: "Welcome back|Home|Documents|Add document|Welcome, .*", timeout: 30000 }
        - runFlow:
            when: { visible: "Welcome back" }
            commands:
              - tapOn: { point: "11%,40%" }
              - inputText: "123456"
              - tapOn: { point: "50%,10%" }
        - openLink: { link: "${DEEPLINK}", autoVerify: false, browser: false }
        - runFlow:
            when: { visible: "EUDI Wallet" }
            commands:
              - tapOn: { text: "EUDI Wallet", optional: true }
        - runFlow:
            when: { visible: "Just once" }
            commands:
              - tapOn: { text: "Just once", optional: true }
        - runFlow:
            when: { visible: "Welcome back" }
            commands:
              - tapOn: { point: "11%,40%" }
              - inputText: "123456"
              - tapOn: { point: "50%,10%" }
        - extendedWaitUntil: { visible: "unsupported_response_type|Oups! Something went wrong|Error|Home|Documents|Welcome, .*", timeout: 100000 }
        - takeScreenshot: fcaf-credential-formats-040-response-type-rejected

  - id: fetch-capture-session
    use: http-request
    with:
      method: GET
      url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-capture-session.outputs.body.session_id }}
      expected_status: 200

  - id: run-fcaf-validators
    use: fcaf-validation
    with:
      test_ids:
        - WS_RP_MS_CredentialFormats__040
      suite: wallet_solution/relying_party
      pipeline_outputs:
        pipeline.credential-formats.unsupported-response-type-code:
          output:
            oid4vp_exchange: ${{ fetch-capture-session.outputs.body }}
            visual_evidence: ${{ exercise-wallet.outputs.flow_output.maestro_screenshot_urls }}
            create-capture-session: ${{ create-capture-session.outputs }}
            exercise-wallet: ${{ exercise-wallet.outputs }}
            fetch-capture-session: ${{ fetch-capture-session.outputs }}

