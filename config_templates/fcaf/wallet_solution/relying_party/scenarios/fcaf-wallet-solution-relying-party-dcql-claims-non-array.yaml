- id: exercise-non-array-claims
  use: mobile-automation
  with:
    version_id: installed_from_external_source
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-exercise-non-array-claims
    parameters:
      deeplink_NULL: ${{ create-null.outputs.body.deeplink }}
      deeplink_TRUE: ${{ create-true.outputs.body.deeplink }}
      deeplink_FALSE: ${{ create-false.outputs.body.deeplink }}
      deeplink_ZERO: ${{ create-zero.outputs.body.deeplink }}
      deeplink_NUMBER: ${{ create-number.outputs.body.deeplink }}
      deeplink_STRING: ${{ create-string.outputs.body.deeplink }}
      deeplink_OBJECT: ${{ create-object.outputs.body.deeplink }}
- id: fetch-null
  use: http-request
  with:
    method: GET
    url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-null.outputs.body.session_id }}
    expected_status: 200
- id: fetch-true
  use: http-request
  with:
    method: GET
    url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-true.outputs.body.session_id }}
    expected_status: 200
- id: fetch-false
  use: http-request
  with:
