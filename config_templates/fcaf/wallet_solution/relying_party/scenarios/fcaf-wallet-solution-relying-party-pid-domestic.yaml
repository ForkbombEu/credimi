name: FCAF PID domestic namespace
runtime:
  fixture:
    issuer_url: https://capture-wallet.credimi.io
    log_checker: capture-wallet
  global_device_id: forkbomb-bv-andrea/usb/device
  temporal:
    activity_options:
      schedule_to_close_timeout: 50m
      start_to_close_timeout: 50m
      retry_policy:
        maximum_attempts: 1
steps:
- id: create-domestic-sdjwt-issuance
  use: http-request
  with:
    method: POST
    url: ${fixture.issuer_url}/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      issuer_configuration_id: eu-pid-device-bound
      credential_configuration_id: urn:eudi:pid:xx:1.sd-jwt.key-attestation-required
- id: obtain-domestic-sdjwt
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/getcredential-generic-credential-without-authentication
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-domestic-sdjwt-issuance.outputs.body.deeplink }}
- id: fetch-domestic-sdjwt-issuance
  use: http-request
  with:
    method: GET
    url: ${fixture.issuer_url}/sessions/${{ create-domestic-sdjwt-issuance.outputs.body.session_id }}
    expected_status: 200
- id: create-domestic-sdjwt-presentation
  use: http-request
  with:
    method: POST
    url: ${fixture.verifier_url}/openid4vp/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      scheme: haip-vp://
      request_uri_method: post
      request_delivery: by_reference
      response_type: vp_token
      response_mode: direct_post.jwt
      presentation_request:
        nonce: fcaf-pid-domestic-sdjwt
        dcql_query:
          credentials:
          - id: pid_sdjwt
            format: dc+sd-jwt
            meta:
              vct_values:
              - urn:eudi:pid:xx:1
            claims:
            - path: [family_name]
            - path: [given_name]
            - path: [birthdate]
            - path: [place_of_birth]
            - path: [nationalities]
            - path: [date_of_expiry]
            - path: [issuing_authority]
            - path: [issuing_country]
            - path: [credimi_domestic_claim]
- id: present-domestic-sdjwt
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-engagement-haip-vp
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-domestic-sdjwt-presentation.outputs.body.deeplink }}
- id: fetch-domestic-sdjwt-presentation
  use: http-request
  with:
    method: GET
    url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-domestic-sdjwt-presentation.outputs.body.session_id }}
    expected_status: 200
- id: create-domestic-mdoc-issuance
  use: http-request
  with:
    method: POST
    url: ${fixture.issuer_url}/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      issuer_configuration_id: eu-pid-device-bound
      credential_configuration_id: urn:eudi:pid:xx:1.mdoc.key-attestation-required
- id: obtain-domestic-mdoc
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/getcredential-generic-credential-without-authentication
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-domestic-mdoc-issuance.outputs.body.deeplink }}
- id: fetch-domestic-mdoc-issuance
  use: http-request
  with:
    method: GET
    url: ${fixture.issuer_url}/sessions/${{ create-domestic-mdoc-issuance.outputs.body.session_id }}
    expected_status: 200
- id: create-domestic-mdoc-presentation
  use: http-request
  with:
    method: POST
    url: ${fixture.verifier_url}/openid4vp/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      scheme: haip-vp://
      request_uri_method: post
      request_delivery: by_reference
      response_type: vp_token
      response_mode: direct_post.jwt
      presentation_request:
        nonce: fcaf-pid-domestic-mdoc
        dcql_query:
          credentials:
          - id: pid_mdoc
            format: mso_mdoc
            meta:
              doctype_value: eu.europa.ec.eudi.pid.1
            claims:
            - path: [eu.europa.ec.eudi.pid.1, family_name]
            - path: [eu.europa.ec.eudi.pid.1, given_name]
            - path: [eu.europa.ec.eudi.pid.1, birth_date]
            - path: [eu.europa.ec.eudi.pid.1, place_of_birth]
            - path: [eu.europa.ec.eudi.pid.1, nationality]
            - path: [eu.europa.ec.eudi.pid.1, expiry_date]
            - path: [eu.europa.ec.eudi.pid.1, issuing_authority]
            - path: [eu.europa.ec.eudi.pid.1, issuing_country]
            - path: [eu.europa.ec.eudi.pid.xx.1, credimi_domestic_claim]
- id: present-domestic-mdoc
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-engagement-haip-vp
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-domestic-mdoc-presentation.outputs.body.deeplink }}
- id: fetch-domestic-mdoc-presentation
  use: http-request
  with:
    method: GET
    url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-domestic-mdoc-presentation.outputs.body.session_id }}
    expected_status: 200
- id: run-fcaf-validators
  use: fcaf-validation
  with:
    test_ids:
    - WS_RP_DM_Credentialmetadata_Domestic_PID_IETF-sd-jwt-vc_001
    - WS_RP_DM_Credentialmetadata_Domestic_PID_IETF-sd-jwt-vc_002
    - WS_RP_DM_Credentialmetadata_Domestic_PID_ISO-mdoc_001
    - WS_RP_DM_Credentialmetadata_Domestic_PID_ISO-mdoc_002
    suite: wallet_solution/relying_party
    pipeline_outputs:
      pipeline.pid.presentation.sdjwt.domestic:
        output:
          issuance_session: ${{ fetch-domestic-sdjwt-issuance.outputs.body }}
          dcql_exchange: ${{ fetch-domestic-sdjwt-presentation.outputs.body }}
          pid_sdjwt: ${{ fetch-domestic-sdjwt-presentation.outputs.body.raw.presentation_response_decrypted.vp_token }}
          visual_evidence: ${{ present-domestic-sdjwt.outputs.flow_output.maestro_screenshot_urls }}
      pipeline.pid.presentation.mdoc.domestic:
        output:
          issuance_session: ${{ fetch-domestic-mdoc-issuance.outputs.body }}
          dcql_exchange: ${{ fetch-domestic-mdoc-presentation.outputs.body }}
          pid_mdoc: ${{ fetch-domestic-mdoc-presentation.outputs.body.raw.presentation_response_decrypted.vp_token }}
          visual_evidence: ${{ present-domestic-mdoc.outputs.flow_output.maestro_screenshot_urls }}
