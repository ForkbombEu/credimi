name: FCAF wallet relying-party Request URI method GET
runtime:
  temporal:
    activity_options:
      schedule_to_close_timeout: 50m
      start_to_close_timeout: 50m
      retry_policy:
        maximum_attempts: 1

steps:
  - id: create-presentation
    use: http-request
    with:
      method: POST
      url: ${fixture.verifier_url}/openid4vp/sessions
      expected_status: 201
      headers:
        Content-Type: application/json
      body:
        scheme: openid4vp://
        request_uri_method: get
        request_delivery: by_reference
        response_type: vp_token
        response_mode: direct_post.jwt
        presentation_request:
          nonce: fcaf-request-uri-method-get
          dcql_query:
            credentials:
              - id: pid_mdoc
                format: mso_mdoc
                meta:
                  doctype_value: eu.europa.ec.eudi.pid.1
                claims:
                  - path:
                      - eu.europa.ec.eudi.pid.1
                      - given_name
                  - path:
                      - eu.europa.ec.eudi.pid.1
                      - family_name

  - id: submit-request-uri-method-get
    use: mobile-automation
    with:
      version_id: installed_from_external_source
      parameters:
        DEEPLINK: ${{ create-presentation.outputs.body.deeplink }}
      action_code: |
        appId: eu.europa.ec.euidi
        ---
        - stopApp
        - openLink: { link: "${DEEPLINK}", autoVerify: false, browser: false }
        - waitForAnimationToEnd:
            timeout: 5000
        - tapOn:
            text: "EUDI Wallet"
            optional: true
        - tapOn:
            text: "Just once"
            optional: true
        - extendedWaitUntil:
            visible: "Welcome back|Share|Cancel|Close"
            timeout: 100000
        - runFlow:
            when:
              visible: "Welcome back"
            commands:
              - tapOn:
                  point: "11%,40%"
              - inputText: "123456"
              - hideKeyboard
        - extendedWaitUntil:
            visible: "Share"
            timeout: 30000
        - tapOn:
            text: "Share"
            enabled: true
        - extendedWaitUntil:
            visible: "verify your identity|PIN"
            timeout: 30000
        - inputText: "123456"
        - hideKeyboard
        - extendedWaitUntil:
            visible: "Close"
            timeout: 30000
        - assertVisible: "Close"
        - takeScreenshot: fcaf-request-uri-method-get-submitted
  - id: get-presentation-result
    use: http-request
    with:
      method: GET
      url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-presentation.outputs.body.session_id }}
      expected_status: 200

  - id: run-fcaf-validators
    use: fcaf-validation
    with:
      test_ids:
        - WS_RP_MS_ProtocolMessages__022
        - WS_RP_IA_ProtocolFlow__002a
      suite: wallet_solution/relying_party
      pipeline_outputs:
        pipeline.wallet.protocol.request-uri-method-get:
          output:
            dcql_exchange: ${{ get-presentation-result.outputs.body }}
            capture_session: ${{ get-presentation-result.outputs.body }}
            signed_request_object: ${{ get-presentation-result.outputs.body.raw.authorization_request_jwt }}
            session_checks: ${{ get-presentation-result.outputs.body.checks }}
            presentation_request: ${{ create-presentation.outputs.body }}
            wallet_response: ${{ get-presentation-result.outputs.body }}
            visual_evidence: ${{ submit-request-uri-method-get.outputs.flow_output.maestro_screenshot_urls }}
            create-presentation: ${{ create-presentation.outputs }}
            submit-request-uri-method-get: ${{ submit-request-uri-method-get.outputs }}
            get-presentation-result: ${{ get-presentation-result.outputs }}
