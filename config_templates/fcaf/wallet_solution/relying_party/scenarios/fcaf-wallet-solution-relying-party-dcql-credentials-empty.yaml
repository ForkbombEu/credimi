name: FCAF DCQL credentials empty
runtime:

steps:
  - id: create-capture-session
    use: http-request
    with:
      method: POST
      url: ${fixture.verifier_url}/openid4vp/sessions
      expected_status: 201
      headers: { Content-Type: application/json }
      body: { presentation_request: { dcql_query: { credentials: [] } } }
  - id: reject-empty-credentials
    use: mobile-automation
    with:
      action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-expect-request-rejected
      version_id: installed_from_external_source
      parameters:
        deeplink: "${{ create-capture-session.outputs.body.deeplink }}"
  - id: fetch-capture-session
    use: http-request
    with:
      method: GET
      url: "${fixture.verifier_url}/openid4vp/sessions/${{ create-capture-session.outputs.body.session_id }}"
      expected_status: 200
  - id: run-fcaf-validators
    use: fcaf-validation
    with:
      test_ids: [WS_RP_MS_ProtocolMessages__055]
      suite: wallet_solution/relying_party
      pipeline_outputs:
        pipeline.dcql.credentials-empty:
          output:
            dcql_exchange: ${{ fetch-capture-session.outputs.body }}
            visual_evidence: ${{ reject-empty-credentials.outputs.flow_output.maestro_screenshot_urls }}
