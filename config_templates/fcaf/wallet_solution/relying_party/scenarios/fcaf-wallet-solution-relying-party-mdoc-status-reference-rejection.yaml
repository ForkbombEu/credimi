# ISO mdoc counterpart of status-reference-rejection. Each case issues one
# malformed Mobile Security Object status on its own claim-set fixture, then
# probes for that fixture's document_number with an mso_mdoc query: SD-JWT VC
# copies of the same fixtures cannot answer it, and a Wallet that rejected the
# mdoc holds nothing the probe can return.
name: FCAF malformed mdoc status reference rejection
runtime:
  fixture:
    issuer_url: https://capture-wallet.credimi.io
    log_checker: capture-wallet
  global_device_id: forkbomb-bv-andrea/usb/device
  temporal:
    activity_options:
      schedule_to_close_timeout: 50m
      start_to_close_timeout: 50m
      retry_policy:
        maximum_attempts: 1
steps:
- id: create-mdoc-status-without-status-list-issuance
  use: http-request
  with:
    method: POST
    url: ${fixture.issuer_url}/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      issuer_configuration_id: eu-pid-device-bound
      credential_configuration_id: urn:eu.europa.ec.eudi:pid:1.mdoc.key-attestation-required
      status_list_enabled: true
      status_reference: status_without_status_list
      fixture_id: pid_family_name_uppercase
- id: offer-mdoc-status-without-status-list-credential
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-expect-credential-rejected
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-mdoc-status-without-status-list-issuance.outputs.body.deeplink }}
  continue_on_error: true
- id: fetch-mdoc-status-without-status-list-issuance
  use: http-request
  with:
    method: GET
    url: ${fixture.issuer_url}/sessions/${{ create-mdoc-status-without-status-list-issuance.outputs.body.session_id }}
    expected_status: 200
- id: create-mdoc-status-without-status-list-probe
  use: http-request
  with:
    method: POST
    url: ${fixture.verifier_url}/openid4vp/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      request_uri_method: post
      response_mode: direct_post.jwt
      presentation_request:
        nonce: mdoc-status-reference-status-without-status-list
        dcql_query:
          credentials:
          - id: pid_mdoc
            format: mso_mdoc
            multiple: true
            meta:
              doctype_value: eu.europa.ec.eudi.pid.1
            claims:
            - path:
              - eu.europa.ec.eudi.pid.1
              - document_number
              values:
              - CREDIMI-DEMO-CASE
- id: probe-mdoc-status-without-status-list
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-expect-no-matching-document
    version_id: installed_from_external_source
    parameters:
      deeplink: "${{ create-mdoc-status-without-status-list-probe.outputs.body.deeplink }}"
- id: fetch-mdoc-status-without-status-list-probe
  use: http-request
  with:
    method: GET
    url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-mdoc-status-without-status-list-probe.outputs.body.session_id }}
    expected_status: 200
