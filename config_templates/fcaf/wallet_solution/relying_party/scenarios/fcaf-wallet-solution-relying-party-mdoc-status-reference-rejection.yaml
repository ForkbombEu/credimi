- id: run-fcaf-validators
  use: fcaf-validation
  with:
    test_ids:
    - WS_RP_MS_Metadata__092
    - WS_RP_MS_Metadata__094
    - WS_RP_MS_Metadata__096
    - WS_RP_MS_Metadata__097
    - WS_RP_MS_Metadata__099
    - WS_RP_MS_Metadata__100
    suite: wallet_solution/relying_party
    pipeline_outputs:
      pipeline.fixtures.status-reference.mdoc:
        output:
          status_without_status_list_issuance: ${{ fetch-mdoc-status-without-status-list-issuance.outputs.body }}
          status_without_status_list_probe: ${{ fetch-mdoc-status-without-status-list-probe.outputs.body }}
          status_without_status_list_visual_evidence: ${{ probe-mdoc-status-without-status-list.outputs.flow_output.maestro_screenshot_urls }}
          negative_index_issuance: ${{ fetch-mdoc-negative-index-issuance.outputs.body }}
          negative_index_probe: ${{ fetch-mdoc-negative-index-probe.outputs.body }}
          negative_index_visual_evidence: ${{ probe-mdoc-negative-index.outputs.flow_output.maestro_screenshot_urls }}
          missing_index_issuance: ${{ fetch-mdoc-missing-index-issuance.outputs.body }}
          missing_index_probe: ${{ fetch-mdoc-missing-index-probe.outputs.body }}
          missing_index_visual_evidence: ${{ probe-mdoc-missing-index.outputs.flow_output.maestro_screenshot_urls }}
          malformed_uri_issuance: ${{ fetch-mdoc-malformed-uri-issuance.outputs.body }}
          malformed_uri_probe: ${{ fetch-mdoc-malformed-uri-probe.outputs.body }}
          malformed_uri_visual_evidence: ${{ probe-mdoc-malformed-uri.outputs.flow_output.maestro_screenshot_urls }}
          missing_uri_issuance: ${{ fetch-mdoc-missing-uri-issuance.outputs.body }}
