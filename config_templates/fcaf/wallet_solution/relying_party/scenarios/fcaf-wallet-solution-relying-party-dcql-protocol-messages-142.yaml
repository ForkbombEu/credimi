name: 'FCAF ProtocolMessages 142: Missing both dcql_query and scope causes invalid_request'
runtime:
  temporal:
    activity_options:
      schedule_to_close_timeout: 50m
      start_to_close_timeout: 50m
      retry_policy:
        maximum_attempts: 1
steps:
- id: create-capture-session
  use: http-request
  with:
    method: POST
    url: ${fixture.verifier_url}/openid4vp/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      response_mode: direct_post.jwt
      presentation_request:
        nonce: fcaf-142
        dcql_query: null
- id: exercise-wallet
  use: mobile-automation
  with:
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-capture-session.outputs.body.deeplink }}
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-exercise-wallet-generic
- id: fetch-capture-session
  use: http-request
  with:
    method: GET
    url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-capture-session.outputs.body.session_id }}
    expected_status: 200
- id: run-fcaf-validators
  use: fcaf-validation
  with:
    test_ids:
      - WS_RP_MS_ProtocolMessages__142
    suite: wallet_solution/relying_party
    pipeline_outputs:
      pipeline.dcql.protocol-messages-142:
        output:
          dcql_exchange: ${{ fetch-capture-session.outputs.body }}
          visual_evidence: ${{ exercise-wallet.outputs.flow_output.maestro_screenshot_urls }}
