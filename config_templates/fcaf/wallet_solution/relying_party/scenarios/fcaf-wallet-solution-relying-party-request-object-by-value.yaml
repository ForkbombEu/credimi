name: FCAF wallet relying-party Request Object by value
runtime:
    global_runner_id: ""
    temporal:
        activity_options:
            retry_policy:
                maximum_attempts: 1
            schedule_to_close_timeout: 50m
            start_to_close_timeout: 50m
steps:
    - id: create-presentation
      use: http-request
      with:
        body:
            dcql_query:
                credentials:
                    - claims:
                        - path:
                            - eu.europa.ec.eudi.pid.1
                            - given_name
                        - path:
                            - eu.europa.ec.eudi.pid.1
                            - family_name
                      format: mso_mdoc
                      id: pid_mdoc
                      meta:
                        doctype_value: eu.europa.ec.eudi.pid.1
            request_delivery: by_value
            nonce: fcaf-request-object-by-value
            type: vp_token
        expected_status: 200
        headers:
            Content-Type: application/json
        method: POST
        url: ${fixture.verifier_url}/ui/presentations
    - id: submit-request-object-by-value
      use: mobile-automation
      with:
        action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-submit-request-object-by-value
        parameters:
            CLIENT_ID: ${{ create-presentation.outputs.body.client_id }}
            REQUEST_OBJECT: ${{ create-presentation.outputs.body.request }}
        version_id: installed_from_external_source
    - id: get-presentation-result
      use: http-request
      with:
        expected_status: 200
        method: GET
        url: ${fixture.verifier_url}/ui/presentations/${{ create-presentation.outputs.body.transaction_id }}
    - id: run-fcaf-validators
      use: fcaf-validation
      with:
        pipeline_outputs:
            pipeline.wallet.protocol.request-object-by-value:
                output:
                    create-presentation: ${{ create-presentation.outputs }}
                    dcql_exchange: ${{ get-presentation-result.outputs.body }}
                    get-presentation-result: ${{ get-presentation-result.outputs }}
                    request_object: ${{ create-presentation.outputs.body.request }}
                    submit-request-object-by-value: ${{ submit-request-object-by-value.outputs }}
                    visual_evidence: ${{ submit-request-object-by-value.outputs.flow_output.maestro_screenshot_urls }}
                    wallet_response: ${{ get-presentation-result.outputs.body }}
        suite: wallet_solution/relying_party
        test_ids:
            - WS_RP_MS_Metadata__104
            - WS_RP_MS_ProtocolMessages__003
            - WS_RP_MS_ProtocolMessages__004
            - WS_RP_MS_ProtocolMessages__008
            - WS_RP_MS_ProtocolMessages__019
            - WS_RP_MS_ProtocolMessages__032
            - WS_RP_MS_ProtocolMessages__035
            - WS_RP_MS_ProtocolMessages__036
            - WS_RP_MS_ProtocolMessages__037
