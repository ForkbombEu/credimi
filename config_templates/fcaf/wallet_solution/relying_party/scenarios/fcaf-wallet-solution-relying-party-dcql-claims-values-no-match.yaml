name: FCAF DCQL mismatched claim values
runtime:
    fixture:
        verifier_url: https://capture-wallet.credimi.io
    global_runner_id: forkbomb-bv-andrea/usb
steps:
    - id: create-presentation
      use: http-request
      with:
        body:
            dcql_query:
                credentials:
                    - claims:
                        - path:
                            - given_name
                          values:
                            - value-that-does-not-match
                      format: dc+sd-jwt
                      id: pid
                      meta:
                        vct_values:
                            - urn:eu.europa.ec.eudi:pid:1
            nonce: fcaf-107
            response_type: vp_token
        expected_status: 201
        headers:
            Content-Type: application/json
        method: POST
        url: ${fixture.verifier_url}/openid4vp/sessions
    - id: reject-mismatched-claim-values
      use: mobile-automation
      with:
        action_code: |
            appId: eu.europa.ec.euidi
            ---
            - launchApp:
                stopApp: true
                clearState: false
            - openLink:
                link: ${env.DEEPLINK}
                autoVerify: false
                browser: false
            - extendedWaitUntil:
                visible: "Error|invalid request|Something went wrong|Home|Documents"
                timeout: 100000
            - takeScreenshot: fcaf-107
        parameters:
            DEEPLINK: ${{ create-presentation.outputs.body.deeplink }}
        version_id: installed_from_external_source
    - id: fetch-result
      use: http-request
      with:
        expected_status: 200
        method: GET
        url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-presentation.outputs.body.session_id }}
    - id: run-fcaf-validators
      use: fcaf-validation
      with:
        pipeline_outputs:
            pipeline.dcql.claims-values-no-match:
                output:
                    create-presentation: ${{ create-presentation.outputs }}
                    dcql_exchange: ${{ fetch-result.outputs.body }}
                    fetch-result: ${{ fetch-result.outputs }}
                    reject-mismatched-claim-values: ${{ reject-mismatched-claim-values.outputs }}
                    visual_evidence: ${{ reject-mismatched-claim-values.outputs.flow_output.maestro_screenshot_urls }}
        suite: wallet_solution/relying_party
        test_ids:
            - WS_RP_MS_ProtocolMessages__107
