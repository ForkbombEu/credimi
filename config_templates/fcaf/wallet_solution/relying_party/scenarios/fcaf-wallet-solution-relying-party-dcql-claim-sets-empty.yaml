name: FCAF wallet relying-party DCQL claim_sets empty
runtime:
  temporal:
    activity_options:
      schedule_to_close_timeout: 50m
      start_to_close_timeout: 50m
      retry_policy:
        maximum_attempts: 1
steps:
- id: create-empty-claim-sets-request
  use: http-request
  with:
    method: POST
    url: ${fixture.verifier_url}/openid4vp/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      scheme: haip-vp://
      request_delivery: by_reference
      request_uri_method: post
      response_type: vp_token
      response_mode: direct_post.jwt
      presentation_request:
        nonce: fcaf-085-claim-sets-empty
        dcql_query:
          credentials:
          - id: pididentity01
            format: dc+sd-jwt
            meta:
              vct_values:
              - urn:eudi:pid:1
            claims:
            - path:
              - given_name
      request_mutation:
        request_object:
          set:
            /dcql_query:
              credentials:
              - id: pididentity01
                format: dc+sd-jwt
                meta:
                  vct_values:
                  - urn:eudi:pid:1
                claims:
                - path:
                  - given_name
                claim_sets: []
        verification_applies: false
- id: reject-empty-claim-sets
  use: mobile-automation
  with:
    version_id: installed_from_external_source
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-exercise-wallet-generic
    parameters:
      deeplink: ${{ create-empty-claim-sets-request.outputs.body.deeplink }}
- id: fetch-empty-claim-sets-request
  use: http-request
  with:
    method: GET
    url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-empty-claim-sets-request.outputs.body.session_id }}
    expected_status: 200
- id: run-fcaf-validators
  use: fcaf-validation
  with:
    test_ids:
    - WS_RP_MS_ProtocolMessages__085
    suite: wallet_solution/relying_party
    pipeline_outputs:
      pipeline.dcql.claim-sets-empty:
        output:
          dcql_exchange: ${{ fetch-empty-claim-sets-request.outputs.body.raw.authorization_request_delivered }}
          visual_evidence: ${{ reject-empty-claim-sets.outputs.flow_output.maestro_screenshot_urls }}
          fetch-empty-claim-sets-request: ${{ fetch-empty-claim-sets-request.outputs.body.raw.authorization_request_delivered }}
          reject-empty-claim-sets: ${{ reject-empty-claim-sets.outputs }}
          dcql_exchange_session: ${{ fetch-empty-claim-sets-request.outputs.body }}
