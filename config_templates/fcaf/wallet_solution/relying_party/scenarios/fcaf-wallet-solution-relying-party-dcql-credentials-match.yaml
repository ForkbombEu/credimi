name: FCAF wallet relying-party DCQL credentials match
runtime:
  global_runner_id: forkbomb-bv-andrea/fcaf
  temporal:
    activity_options:
      schedule_to_close_timeout: 50m
      start_to_close_timeout: 50m
      retry_policy:
        maximum_attempts: 1

steps:
  - id: onboard-reference-wallet
    use: mobile-automation
    with:
      action_id: forkbomb-bv-andrea/eudiw-beta-wallet/onboarding-1
      version_id: forkbomb-bv-andrea/eudiw-beta-wallet/2026-06-38-demo

  - id: create-pid-sdjwt-offer
    use: credential-offer
    with:
      credential_id: /forkbomb-bv-andrea/misc-issuer-integration-demo/capture-issuer-pid-dc-sd-jwt

  - id: obtain-pid-sdjwt
    use: mobile-automation
    with:
      action_id: forkbomb-bv-andrea/eudiw-beta-wallet/getcredential-generic-credential-without-authentication
      version_id: forkbomb-bv-andrea/eudiw-beta-wallet/2026-06-38-demo
      parameters:
        deeplink: ${{ create-pid-sdjwt-offer.outputs }}

  - id: create-presentation
    use: http-request
    activity_options:
      start_to_close_timeout: 2m
      retry_policy:
        maximum_attempts: 3
        initial_interval: 5s
        backoff_coefficient: 2
        maximum_interval: 30s
    with:
      method: POST
      url: https://capture-wallet.credimi.io/openid4vp/sessions
      expected_status: 201
      headers:
        Content-Type: application/json
      body:
        type: vp_token
        nonce: fcaf-dcql-credentials-match
        dcql_query:
          fcaf_unknown_top_level: ignored
          credentials:
            - id: pid_identity
              fcaf_unknown_nested: ignored
              format: dc+sd-jwt
              meta:
                vct_values:
                  - urn:eudi:pid:1
              claims:
                - path:
                    - given_name
                - path:
                    - family_name

  - id: present-with-reference-implementation
    use: mobile-automation
    with:
      action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-engagement-haip-vp
      version_id: forkbomb-bv-andrea/eudiw-beta-wallet/2026-06-38-demo
      parameters:
        deeplink: ${{ create-presentation.outputs.body.deeplink }}

  - id: fetch-capture-session
    use: http-request
    activity_options:
      start_to_close_timeout: 2m
      retry_policy:
        maximum_attempts: 3
        initial_interval: 5s
        backoff_coefficient: 2
        maximum_interval: 30s
    with:
      method: GET
      url: https://capture-wallet.credimi.io/openid4vp/sessions/${{ create-presentation.outputs.body.session_id }}
      expected_status: 200

  - id: run-fcaf-validators
    use: fcaf-validation
    with:
      test_ids:
        - WS_RP_DM_CredentialMetadata_CredentialStructure_008
        - WS_RP_MS_ProtocolMessages__012
        - WS_RP_MS_ProtocolMessages__052
        - WS_RP_MS_ProtocolMessages__057

        - WS_RP_MS_ProtocolMessages__059
        - WS_RP_MS_ProtocolMessages__060
        - WS_RP_MS_ProtocolMessages__070
        - WS_RP_MS_ProtocolMessages__105
      suite: wallet_solution/relying_party
      pipeline_outputs:
        pipeline.dcql.credentials-match:
          output:
            dcql_exchange: ${{ fetch-capture-session.outputs.body }}
            visual_evidence: ${{ present-with-reference-implementation.outputs.flow_output.maestro_screenshot_urls }}
            create-presentation: ${{ create-presentation.outputs }}
            present-with-reference-implementation: ${{ present-with-reference-implementation.outputs }}
            fetch-capture-session: ${{ fetch-capture-session.outputs }}
