name: 'FCAF ProtocolMessages 154: Unknown transaction_data field causes error'
runtime:
  temporal:
    activity_options:
      schedule_to_close_timeout: 50m
      start_to_close_timeout: 50m
      retry_policy:
        maximum_attempts: 1
steps:
- id: create-capture-session
  use: http-request
  with:
    method: POST
    url: ${fixture.verifier_url}/openid4vp/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      response_mode: direct_post.jwt
      presentation_request:
        nonce: fcaf-154
        # The entry carries the two OpenID4VP-defined members (type and
        # credential_ids) plus the transaction type's own payload, so the only
        # defect is the unknown field. The suite defines no transaction data
        # type, so `supported_type` stands in for a type whose schema a Wallet
        # knows; without such a schema the defect cannot be exercised, which is
        # why the test reports not applicable rather than a pass.
        transaction_data:
        - type: supported_type
          data: dGVzdA==
          credential_ids:
          - pid
          unknown_field: bad
        dcql_query:
          credentials:
          - id: pid
            format: dc+sd-jwt
            meta:
              vct_values:
              - urn:eudi:pid:1
            claims:
            - path:
              - given_name
- id: exercise-wallet
  use: mobile-automation
  with:
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-capture-session.outputs.body.deeplink }}
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-expect-request-rejected
- id: fetch-capture-session
  use: http-request
  with:
    method: GET
    url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-capture-session.outputs.body.session_id }}
    expected_status: 200
- id: fetch-signed-request-object
  use: http-request
  with:
    method: GET
    url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-capture-session.outputs.body.session_id }}/request
    expected_status: 200
- id: run-fcaf-validators
  use: fcaf-validation
  with:
    test_ids:
      - WS_RP_MS_ProtocolMessages__154
    suite: wallet_solution/relying_party
    pipeline_outputs:
      pipeline.dcql.protocol-messages-154:
        output:
          request_object: ${{ fetch-signed-request-object.outputs.body }}
          dcql_exchange: ${{ fetch-capture-session.outputs.body }}
          visual_evidence: ${{ exercise-wallet.outputs.flow_output.maestro_screenshot_urls }}
