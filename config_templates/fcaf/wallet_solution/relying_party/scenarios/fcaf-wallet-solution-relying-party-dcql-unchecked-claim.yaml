name: FCAF DCQL unchecked claim is omitted
runtime:
steps:
  - id: create-presentation
    use: http-request
    with:
      method: POST
      url: ${fixture.verifier_url}/openid4vp/sessions
      expected_status: 201
      headers: { Content-Type: application/json }
      body:
        scheme: haip-vp://
        request_delivery: by_reference
        response_type: vp_token
        response_mode: direct_post.jwt
        presentation_request:
          nonce: fcaf-013-unchecked-claim
          dcql_query:
            credentials:
              - id: pid
                format: dc+sd-jwt
                meta: { vct_values: ["urn:eudi:pid:1"] }
                claims:
                  - { path: [given_name] }
                  - { path: [address] }
  - id: present-with-unchecked-address
    use: mobile-automation
    with:
      version_id: installed_from_external_source
      parameters: { deeplink: "${{ create-presentation.outputs.body.deeplink }}" }
      action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-present-unchecked-claim
  - id: fetch-result
    use: http-request
    with: { method: GET, url: "${fixture.verifier_url}/openid4vp/sessions/${{ create-presentation.outputs.body.session_id }}", expected_status: 200 }

  - id: run-fcaf-validators
    use: fcaf-validation
    with:
      test_ids:
        - WS_RP_IA_MainInteraction__013
      suite: wallet_solution/relying_party
      pipeline_outputs:
        pipeline.dcql.unchecked-claim:
          output:
            dcql_exchange: ${{ fetch-result.outputs.body }}
            wallet_response: ${{ fetch-result.outputs.body.raw.presentation_response_decrypted.vp_token }}
            visual_evidence: ${{ present-with-unchecked-address.outputs.flow_output.maestro_screenshot_urls }}
            create-presentation: ${{ create-presentation.outputs }}
            present-with-unchecked-address: ${{ present-with-unchecked-address.outputs }}
            fetch-result: ${{ fetch-result.outputs }}
