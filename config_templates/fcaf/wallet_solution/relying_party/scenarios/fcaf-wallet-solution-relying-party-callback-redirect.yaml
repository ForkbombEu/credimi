name: FCAF response endpoint callback redirect
runtime:
  global_device_id: forkbomb-bv-andrea/usb/device
  temporal:
    activity_options:
      schedule_to_close_timeout: 50m
      start_to_close_timeout: 50m
      retry_policy: {maximum_attempts: 1}
steps:
  - id: create-callback-session
    use: http-request
    with:
      method: POST
      url: ${fixture.verifier_url}/openid4vp/sessions
      expected_status: 201
      headers: {Content-Type: application/json}
      body:
        scheme: haip-vp://
        response_type: vp_token
        response_mode: direct_post.jwt
        redirect_uri: ${fixture.verifier_url}/openid4vp/redirect
        presentation_request:
          nonce: fcaf-callback-redirect
          dcql_query: {credentials: [{id: pid, format: dc+sd-jwt, meta: {vct_values: ['urn:eudi:pid:1']}, claims: [{path: [given_name]}]}]}
  # 057, 061 and 067 each require the Wallet to open the redirect_uri the
  # Response Endpoint returns. The reference Wallet follows it only once the
  # user dismisses its terminal `Authentication successful … Close` screen, so
  # this flow dismisses that screen when it is there and waits for Capture's
  # `Presentation complete` page in the browser before the screenshot. The
  # source says nothing about the wording of the Wallet's own screens, so every
  # wait on Wallet-specific text is `optional` and the dismiss tap is
  # conditional: a Wallet that never follows the redirect leaves the missing
  # visit to `oid4vp.redirect_uri_visited` instead of failing this step and
  # losing the screenshot that assertion is read with.
  - id: exercise-wallet
    use: mobile-automation
    with:
      version_id: installed_from_external_source
      parameters: {DEEPLINK: "${{ create-callback-session.outputs.body.deeplink }}"}
      action_code: |
        appId: eu.europa.ec.euidi
        ---
        - launchApp:
            stopApp: true
            clearState: false
            permissions:
              camera: allow
              notifications: allow
        - extendedWaitUntil:
            visible: "Welcome back"
            timeout: 30000
        - waitForAnimationToEnd:
            timeout: 3000
        - runFlow:
            when:
              visible: "Welcome back"
            commands:
              - inputText: "12345"
              - tapOn: "6"
        - waitForAnimationToEnd:
            timeout: 3000
        - openLink:
            link: "${DEEPLINK}"
            autoVerify: false
            browser: false
        - waitForAnimationToEnd:
            timeout: 3000
        - runFlow:
            when:
              visible: "Requested data"
            commands:
              - tapOn: "Share"
              - waitForAnimationToEnd:
                  timeout: 3000
              - inputText: "12345"
              - tapOn: "6"
        - extendedWaitUntil:
            visible: ".*successfully shared.*"
            timeout: 30000
            optional: true
        - extendedWaitUntil:
            visible: "Close"
            timeout: 30000
            optional: true
        - takeScreenshot: "callback-redirect-wallet-success"
        # `Close` is the reference Wallet's own dismiss control. The tap is
        # conditional because the source says nothing about the Wallet's screen
        # wording: a Wallet with a different terminal screen must still reach the
        # visit screenshot below.
        - runFlow:
            when:
              visible: "Close"
            commands:
              - tapOn: "Close"
        - extendedWaitUntil:
            visible: "Presentation complete"
            timeout: 30000
            optional: true
        - takeScreenshot: "callback-redirect-visit"
  - id: fetch-callback-session
    use: http-request
    with: {method: GET, url: "${fixture.verifier_url}/openid4vp/sessions/${{ create-callback-session.outputs.body.session_id }}", expected_status: 200}
  - id: run-fcaf-validators
    use: fcaf-validation
    with:
      test_ids: [WS_RP_IA_MainInteraction__057, WS_RP_IA_MainInteraction__061, WS_RP_IA_MainInteraction__067]
      suite: wallet_solution/relying_party
      pipeline_outputs:
        pipeline.callback.redirect:
          output:
            callback_evidence:
              verifier_http: "${{ fetch-callback-session.outputs.body.raw.presentation_response_verifier_http }}"
              configured_redirect_uri: "${{ create-callback-session.outputs.body.redirect_uri }}"
            capture_session: "${{ fetch-callback-session.outputs.body }}"
            visual_evidence: "${{ exercise-wallet.outputs.flow_output.maestro_screenshot_urls }}"
