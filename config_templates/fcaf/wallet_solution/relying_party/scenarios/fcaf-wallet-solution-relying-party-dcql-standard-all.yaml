name: FCAF standard DCQL — all shareable tests
runtime:
  fixture:
    issuer_url: https://capture-wallet.credimi.io
    log_checker: capture-wallet
  global_device_id: forkbomb-bv-andrea/usb/device
  temporal:
    activity_options:
      schedule_to_close_timeout: 50m
      start_to_close_timeout: 50m
      heartbeat_timeout: 10m
      retry_policy:
        maximum_attempts: 1
steps:
- id: create-pid-sdjwt-offer
  use: credential-offer
  with:
    credential_id: /forkbomb-bv-andrea/misc-issuer-integration-demo/capture-issuer-pid-dc-sd-jwt
- id: obtain-pid-sdjwt
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/getcredential-generic-credential-without-authentication
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-pid-sdjwt-offer.outputs }}
# credential_sets: one set whose only option is the available PID query. The
# second credential query is not part of any option, so a Wallet that applies
# the constraint returns the available PID and nothing for the other query.
- id: create-credential-sets-session
  use: http-request
  with:
    method: POST
    url: ${fixture.verifier_url}/openid4vp/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      scheme: haip-vp://
      request_uri_method: post
      request_delivery: by_reference
      response_type: vp_token
      response_mode: direct_post.jwt
      presentation_request:
        nonce: fcaf-standard-all-credential-sets
        dcql_query:
          credential_sets:
          - options:
            - - available_pid
          credentials:
          - id: available_pid
            format: dc+sd-jwt
            meta:
              vct_values:
              - urn:eudi:pid:1
            claims:
            - path:
              - given_name
          - id: unavailable_pid
            format: dc+sd-jwt
            meta:
              vct_values:
              - urn:eudi:unavailable:1
- id: exercise-credential-sets
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-engagement-haip-vp
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-credential-sets-session.outputs.body.deeplink }}
- id: fetch-credential-sets-session
  use: http-request
  with:
    method: GET
    url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-credential-sets-session.outputs.body.session_id }}
    expected_status: 200
# claim_sets: the first set asks for a claim the PID does not carry, so a
# Wallet that applies Section 6.4.1 selection discloses the second set only.
- id: create-claim-sets-session
  use: http-request
  with:
    method: POST
    url: ${fixture.verifier_url}/openid4vp/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      scheme: haip-vp://
      request_uri_method: post
      request_delivery: by_reference
      response_type: vp_token
      response_mode: direct_post.jwt
      presentation_request:
        nonce: fcaf-standard-all-claim-sets
        dcql_query:
          credentials:
          - id: pid
            format: dc+sd-jwt
            meta:
              vct_values:
              - urn:eudi:pid:1
            claims:
            - id: unavailable
              path:
              - claim_that_does_not_exist
            - id: given_name_claim
              path:
              - given_name
            claim_sets:
            - - unavailable
            - - given_name_claim
- id: exercise-claim-sets
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-exercise-wallet-generic
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-claim-sets-session.outputs.body.deeplink }}
- id: fetch-claim-sets-session
  use: http-request
  with:
    method: GET
    url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-claim-sets-session.outputs.body.session_id }}
    expected_status: 200
- id: run-fcaf-validators
  use: fcaf-validation
  with:
    test_ids:
      - WS_RP_DM_CredentialMetadata_CredentialStructure_007
      - WS_RP_DM_CredentialMetadata_CredentialStructure_010
    suite: wallet_solution/relying_party
    pipeline_outputs:
      pipeline.dcql.standard-all:
        output:
          credential_sets_dcql_exchange: ${{ fetch-credential-sets-session.outputs.body }}
          credential_sets_visual_evidence: ${{ exercise-credential-sets.outputs.flow_output.maestro_screenshot_urls }}
          claim_sets_dcql_exchange: ${{ fetch-claim-sets-session.outputs.body }}
          claim_sets_visual_evidence: ${{ exercise-claim-sets.outputs.flow_output.maestro_screenshot_urls }}
