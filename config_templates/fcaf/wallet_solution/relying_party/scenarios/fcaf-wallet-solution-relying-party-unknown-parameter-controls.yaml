name: FCAF unrecognized parameter controls
runtime:
  fixture:
    issuer_url: https://beta-capture-wallet.credimi.io
  global_device_id: forkbomb-bv-andrea/usb/device
  temporal:
    activity_options:
      schedule_to_close_timeout: 50m
      start_to_close_timeout: 50m
      retry_policy: { maximum_attempts: 1 }
steps:
- id: create-unknown-request-parameter
  use: http-request
  with:
    method: POST
    url: ${fixture.verifier_url}/openid4vp/sessions
    expected_status: 201
    headers: { Content-Type: application/json }
    body:
      request_delivery: by_reference
      response_type: vp_token
      response_mode: direct_post.jwt
      presentation_request:
        nonce: unknown-request-parameter
        dcql_query:
          credentials:
          - id: pid
            format: dc+sd-jwt
            meta: { vct_values: ["urn:eudi:pid:1"] }
            claims: [{ path: [given_name] }]
      request_mutation:
        request_object:
          set: { /fcaf_unrecognized_parameter: "ignored-by-the-wallet" }
        verification_applies: false
- id: exercise-unknown-request-parameter
  use: mobile-automation
  with:
    version_id: installed_from_external_source
    parameters: { deeplink: "${{ create-unknown-request-parameter.outputs.body.deeplink }}" }
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-exercise-wallet-generic
- id: fetch-unknown-request-parameter
  use: http-request
  with:
    method: GET
    url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-unknown-request-parameter.outputs.body.session_id }}
    expected_status: 200
- id: create-unknown-response-parameter
  use: http-request
  with:
    method: POST
    url: ${fixture.verifier_url}/openid4vp/sessions
    expected_status: 201
    headers: { Content-Type: application/json }
    body:
      request_delivery: by_reference
      response_type: vp_token
      response_mode: direct_post.jwt
      redirect_uri: ${fixture.verifier_url}/openid4vp/redirect
      presentation_request:
        nonce: unknown-response-parameter
        dcql_query:
          credentials:
          - id: pid
            format: dc+sd-jwt
            meta: { vct_values: ["urn:eudi:pid:1"] }
            claims: [{ path: [given_name] }]
      response_scenario:
        extra_parameters:
          fcaf_unrecognized_response_parameter: ignored-by-the-wallet
- id: exercise-unknown-response-parameter
  use: mobile-automation
  with:
    version_id: installed_from_external_source
    parameters: { deeplink: "${{ create-unknown-response-parameter.outputs.body.deeplink }}" }
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-exercise-wallet-generic
- id: fetch-unknown-response-parameter
  use: http-request
  with:
    method: GET
    url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-unknown-response-parameter.outputs.body.session_id }}
    expected_status: 200
- id: create-unknown-request-and-response-parameter
  use: http-request
  with:
    method: POST
    url: ${fixture.verifier_url}/openid4vp/sessions
    expected_status: 201
    headers: { Content-Type: application/json }
    body:
      request_delivery: by_reference
      response_type: vp_token
      response_mode: direct_post.jwt
      redirect_uri: ${fixture.verifier_url}/openid4vp/redirect
      presentation_request:
        nonce: unknown-request-and-response-parameter
        dcql_query:
          credentials:
          - id: pid
            format: dc+sd-jwt
            meta: { vct_values: ["urn:eudi:pid:1"] }
            claims: [{ path: [given_name] }]
      request_mutation:
        request_object:
          set: { /fcaf_unrecognized_parameter: "ignored-by-the-wallet" }
        verification_applies: false
      response_scenario:
        extra_parameters:
          fcaf_unrecognized_response_parameter: ignored-by-the-wallet
- id: exercise-unknown-request-and-response-parameter
  use: mobile-automation
  with:
    version_id: installed_from_external_source
    parameters: { deeplink: "${{ create-unknown-request-and-response-parameter.outputs.body.deeplink }}" }
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-exercise-wallet-generic
- id: fetch-unknown-request-and-response-parameter
  use: http-request
  with:
    method: GET
    url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-unknown-request-and-response-parameter.outputs.body.session_id }}
    expected_status: 200
- id: run-fcaf-validators
  use: fcaf-validation
  with:
    test_ids:
    - WS_RP_MS_ProtocolMessages__124
    - WS_RP_MS_ProtocolMessages__127
    - WS_RP_MS_ProtocolMessages__128
    suite: wallet_solution/relying_party
    pipeline_outputs:
      pipeline.protocol.unknown-parameter-controls:
        output:
          unknown_request_parameter_session: ${{ fetch-unknown-request-parameter.outputs.body }}
          unknown_request_parameter_request_object: ${{ fetch-unknown-request-parameter.outputs.body.raw.authorization_request_jwt }}
          unknown_request_parameter_visual_evidence: ${{ exercise-unknown-request-parameter.outputs.flow_output.maestro_screenshot_urls }}
          unknown_response_parameter_session: ${{ fetch-unknown-response-parameter.outputs.body }}
          unknown_response_parameter_callback:
            verifier_http: ${{ fetch-unknown-response-parameter.outputs.body.raw.presentation_response_verifier_http }}
            configured_redirect_uri: ${{ create-unknown-response-parameter.outputs.body.redirect_uri }}
          unknown_response_parameter_visual_evidence: ${{ exercise-unknown-response-parameter.outputs.flow_output.maestro_screenshot_urls }}
          unknown_request_and_response_parameter_session: ${{ fetch-unknown-request-and-response-parameter.outputs.body }}
          unknown_request_and_response_parameter_request_object: ${{ fetch-unknown-request-and-response-parameter.outputs.body.raw.authorization_request_jwt }}
          unknown_request_and_response_parameter_callback:
            verifier_http: ${{ fetch-unknown-request-and-response-parameter.outputs.body.raw.presentation_response_verifier_http }}
            configured_redirect_uri: ${{ create-unknown-request-and-response-parameter.outputs.body.redirect_uri }}
          unknown_request_and_response_parameter_visual_evidence: ${{ exercise-unknown-request-and-response-parameter.outputs.flow_output.maestro_screenshot_urls }}
