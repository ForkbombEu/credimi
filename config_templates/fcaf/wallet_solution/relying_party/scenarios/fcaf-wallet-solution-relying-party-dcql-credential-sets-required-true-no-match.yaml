name: FCAF DCQL credential_sets required true no match
runtime:
  global_device_id: forkbomb-bv-andrea/usb/device
  fixture:
    issuer_url: https://capture-wallet.credimi.io
    verifier_url: https://capture-wallet.credimi.io
    log_checker: capture-wallet
steps:
  - id: create-capture-session
    use: http-request
    with:
      method: POST
      url: "https://capture-wallet.credimi.io/openid4vp/sessions"
      expected_status: 201
      headers: { Content-Type: application/json }
      body: { response_mode: direct_post, presentation_request: { nonce: fcaf-102, dcql_query: { credentials: [{ id: missing_pid, format: dc+sd-jwt, meta: { vct_values: [urn:missing] } }], credential_sets: [{ required: true, options: [[missing_pid]] }] } } }
  - id: reject-required-credential-set
    use: mobile-automation
    with:
      version_id: installed_from_external_source
      parameters: { DEEPLINK: "${{ create-capture-session.outputs.body.deeplink }}" }
      action_code: |
        appId: eu.europa.ec.euidi
        ---
                - launchApp: { stopApp: true, clearState: false, permissions: { camera: allow, notifications: allow, all: unset } }
        - extendedWaitUntil:
            visible: "Welcome back|Home|Documents|Add document|Welcome, .*"
            timeout: 30000
        - runFlow:
            when:
              visible: "Welcome back"
            commands:
              - tapOn:
                  point: "11%,40%"
              - inputText: "123456"
              - hideKeyboard
              - tapOn: { point: "50%,10%" }
        - extendedWaitUntil:
            visible: "Home|Documents|Add document|Welcome, .*"
            timeout: 30000
        - openLink: { link: "${DEEPLINK}", autoVerify: false, browser: false }
        - runFlow:
            when:
              visible: "EUDI Wallet"
            commands:
              - tapOn: { text: "EUDI Wallet", optional: true }
        - runFlow:
            when:
              visible: "Just once"
            commands:
              - tapOn: { text: "Just once", optional: true }
        - runFlow:
            when:
              visible: "Always"
            commands:
              - tapOn: { text: "Always", optional: true }
        - extendedWaitUntil: { visible: "Oups! Something went wrong|Error|invalid request|Something went wrong|Home|Documents", timeout: 100000 }
        - takeScreenshot: fcaf-102
  - id: fetch-capture-session
    use: http-request
    with: { method: GET, url: "https://capture-wallet.credimi.io/openid4vp/sessions/${{ create-capture-session.outputs.body.session_id }}", expected_status: 200 }
  - id: run-fcaf-validators
    use: fcaf-validation
    with:
      test_ids:
        - WS_RP_MS_ProtocolMessages__102
      suite: wallet_solution/relying_party
      pipeline_outputs:
        pipeline.dcql.credential-sets-required-true-no-match:
          output:
            dcql_exchange: ${{ fetch-capture-session.outputs.body }}
            visual_evidence: ${{ reject-required-credential-set.outputs.flow_output.maestro_screenshot_urls }}
            create-capture-session: ${{ create-capture-session.outputs }}
            reject-required-credential-set: ${{ reject-required-credential-set.outputs }}
            fetch-capture-session: ${{ fetch-capture-session.outputs }}
