name: FCAF wallet solution relying-party engagement HAIP VP
runtime:
    fixture:
        issuer_url: https://capture-wallet.credimi.io
        log_checker: capture-wallet
        verifier_url: https://capture-wallet.credimi.io
    global_runner_id: ""
    temporal:
        activity_options:
            heartbeat_timeout: 10m
            retry_policy:
                maximum_attempts: 1
            schedule_to_close_timeout: 50m
            start_to_close_timeout: 50m
steps:
    - id: create-pid-sdjwt-offer
      use: credential-offer
      with:
        credential_id: /forkbomb-bv-andrea/misc-issuer-integration-demo/capture-issuer-pid-dc-sd-jwt
    - id: obtain-pid-sdjwt
      use: mobile-automation
      with:
        action_id: forkbomb-bv-andrea/eudiw-beta-wallet/getcredential-generic-credential-without-authentication
        parameters:
            deeplink: ${{ create-pid-sdjwt-offer.outputs }}
        version_id: forkbomb-bv-andrea/eudiw-beta-wallet/2026-06-38-demo
    - id: create-capture-session
      use: http-request
      with:
        body:
            presentation_request:
                dcql_query:
                    credentials:
                        - claims:
                            - path:
                                - given_name
                            - path:
                                - family_name
                            - path:
                                - address
                                - country
                            - path:
                                - address
                                - formatted
                            - path:
                                - address
                                - house_number
                            - path:
                                - address
                                - locality
                            - path:
                                - address
                                - postal_code
                            - path:
                                - address
                                - region
                            - path:
                                - address
                                - street_address
                            - path:
                                - birth_family_name
                            - path:
                                - birth_given_name
                            - path:
                                - birthdate
                            - path:
                                - date_of_expiry
                            - path:
                                - date_of_issuance
                            - path:
                                - document_number
                            - path:
                                - email
                            - path:
                                - issuing_authority
                            - path:
                                - issuing_country
                            - path:
                                - issuing_jurisdiction
                            - path:
                                - nationalities
                            - path:
                                - personal_administrative_number
                            - path:
                                - phone_number
                            - path:
                                - picture
                            - path:
                                - place_of_birth
                            - path:
                                - sex
                          format: dc+sd-jwt
                          id: pid_sdjwt
                          meta:
                            vct_values:
                                - urn:eudi:pid:1
                nonce: fcaf-engagement-haip-vp
            request_delivery: by_reference
            request_uri_method: post
            response_mode: direct_post
            response_type: vp_token
            scheme: haip-vp://
        expected_status: 201
        headers:
            Content-Type: application/json
        method: POST
        url: https://capture-wallet.credimi.io/openid4vp/sessions
    - id: invoke-wallet-with-haip-vp
      use: mobile-automation
      with:
        action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-engagement-haip-vp
        parameters:
            deeplink: ${{ create-capture-session.outputs.body.deeplink }}
        version_id: forkbomb-bv-andrea/eudiw-beta-wallet/2026-06-38-demo
    - id: fetch-capture-session
      use: http-request
      with:
        expected_status: 200
        method: GET
        url: https://capture-wallet.credimi.io/openid4vp/sessions/${{ create-capture-session.outputs.body.session_id }}
    - id: run-fcaf-validators
      use: fcaf-validation
      with:
        pipeline_outputs:
            forkbomb-bv-andrea/fcaf-wallet-solution-relying-party-engagement-haip-vp:
                output:
                    create-capture-session: ${{ create-capture-session.outputs }}
                    create-pid-sdjwt-offer: ${{ create-pid-sdjwt-offer.outputs }}
                    fetch-capture-session: ${{ fetch-capture-session.outputs }}
                    invoke-wallet-with-haip-vp: ${{ invoke-wallet-with-haip-vp.outputs }}
                    obtain-pid-sdjwt: ${{ obtain-pid-sdjwt.outputs }}
                    onboard-reference-wallet: ${{ onboard-reference-wallet.outputs }}
                    visual_evidence: ${{ invoke-wallet-with-haip-vp.outputs.flow_output.maestro_screenshot_urls }}
            pipeline.pid.presentation.sdjwt.all-claims:
                output:
                    create-capture-session: ${{ create-capture-session.outputs }}
                    create-pid-sdjwt-offer: ${{ create-pid-sdjwt-offer.outputs }}
                    fetch-capture-session: ${{ fetch-capture-session.outputs }}
                    invoke-wallet-with-haip-vp: ${{ invoke-wallet-with-haip-vp.outputs }}
                    obtain-pid-sdjwt: ${{ obtain-pid-sdjwt.outputs }}
                    onboard-reference-wallet: ${{ onboard-reference-wallet.outputs }}
                    pid_sdjwt: ${{ fetch-capture-session.outputs.body.observed.wallet_response.value.vp_token }}
                    pid_sdjwt_presentations: ${{ fetch-capture-session.outputs.body.observed.wallet_response.value.vp_token }}
                    visual_evidence: ${{ invoke-wallet-with-haip-vp.outputs.flow_output.maestro_screenshot_urls }}
            pipeline.wallet.engagement.haip-vp:
                output:
                    create-capture-session: ${{ create-capture-session.outputs }}
                    create-pid-sdjwt-offer: ${{ create-pid-sdjwt-offer.outputs }}
                    fetch-capture-session: ${{ fetch-capture-session.outputs }}
                    invoke-wallet-with-haip-vp: ${{ invoke-wallet-with-haip-vp.outputs }}
                    obtain-pid-sdjwt: ${{ obtain-pid-sdjwt.outputs }}
                    onboard-reference-wallet: ${{ onboard-reference-wallet.outputs }}
                    visual_evidence: ${{ invoke-wallet-with-haip-vp.outputs.flow_output.maestro_screenshot_urls }}
                    wallet_engagement: ${{ fetch-capture-session.outputs.body }}
        suite: wallet_solution/relying_party
        test_ids:
            - WS_RP_DM_AddressData_Emailaddress_PID_IETF-sd-jwt-vc_001
            - WS_RP_DM_AddressData_Emailaddress_PID_IETF-sd-jwt-vc_002
