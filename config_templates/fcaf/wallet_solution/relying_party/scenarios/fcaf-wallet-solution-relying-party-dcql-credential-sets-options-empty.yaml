name: FCAF DCQL credential_sets options empty
runtime: { global_device_id: forkbomb-bv-andrea/usb/device }
steps:
  - id: create-capture-session
    use: http-request
    with:
      method: POST
      url: https://capture-wallet.credimi.io/openid4vp/sessions
      expected_status: 201
      headers: { Content-Type: application/json }
      body: { response_mode: direct_post, presentation_request: { nonce: fcaf-097, dcql_query: { credentials: [{ id: pid, format: dc+sd-jwt, meta: { vct_values: [urn:eudi:pid:1] } }], credential_sets: [{ options: [] }] } } }
  - id: reject-empty-credential-sets-options
    use: mobile-automation
    with:
      version_id: installed_from_external_source
      parameters:
        DEEPLINK: "${{ create-capture-session.outputs.body.deeplink }}"
      action_code: |
        appId: eu.europa.ec.euidi
        ---
                - launchApp: { stopApp: true, clearState: false, permissions: { camera: allow, notifications: allow, all: unset } }
        - extendedWaitUntil:
            visible: "Welcome back|Home|Documents|Add document|Welcome, .*"
            timeout: 30000
        - runFlow:
            when:
              visible: "Welcome back"
            commands:
              - tapOn:
                  point: "11%,40%"
              - inputText: "123456"
              - hideKeyboard
              - tapOn: { point: "50%,10%" }
        - extendedWaitUntil:
            visible: "Home|Documents|Add document|Welcome, .*"
            timeout: 30000
        - openLink: { link: "${DEEPLINK}", autoVerify: false, browser: false }
        - runFlow:
            when:
              visible: "EUDI Wallet"
            commands:
              - tapOn: { text: "EUDI Wallet", optional: true }
        - runFlow:
            when:
              visible: "Just once"
            commands:
              - tapOn: { text: "Just once", optional: true }
        - runFlow:
            when:
              visible: "Always"
            commands:
              - tapOn: { text: "Always", optional: true }
        - extendedWaitUntil: { visible: "Welcome back|Error|invalid request|Something went wrong", timeout: 100000 }
        - runFlow:
            when: { visible: "Welcome back" }
            commands:
              - tapOn: { point: "11%,40%" }
              - inputText: { text: "123456", waitToSettleTimeoutMs: 0 }
        - extendedWaitUntil: { visible: "Error|invalid request|Something went wrong", timeout: 30000 }
        - takeScreenshot: fcaf-097
        - tapOn: "TRY AGAIN"
  - id: fetch-capture-session
    use: http-request
    with:
      method: GET
      url: "https://capture-wallet.credimi.io/openid4vp/sessions/${{ create-capture-session.outputs.body.session_id }}"
      expected_status: 200

  - id: run-fcaf-validators
    use: fcaf-validation
    with:
      test_ids:
        - WS_RP_MS_ProtocolMessages__097
      suite: wallet_solution/relying_party
      pipeline_outputs:
        pipeline.dcql.credential-sets-options-empty:
          output:
            dcql_exchange: ${{ fetch-capture-session.outputs.body }}
            visual_evidence: ${{ reject-empty-credential-sets-options.outputs.flow_output.maestro_screenshot_urls }}
            create-capture-session: ${{ create-capture-session.outputs }}
            reject-empty-credential-sets-options: ${{ reject-empty-credential-sets-options.outputs }}
            fetch-capture-session: ${{ fetch-capture-session.outputs }}
