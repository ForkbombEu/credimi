    decoder: raw
  string_value:
    path: $.output.fetch-string.outputs.body.raw.authorization_request_delivered
    decoder: raw
  object_value:
    path: $.output.fetch-object.outputs.body.raw.authorization_request_delivered
    decoder: raw
  visual_evidence:
