- id: run-fcaf-validators
  use: fcaf-validation
  with:
    test_ids:
    - WS_RP_MS_ProtocolMessages__092
    suite: wallet_solution/relying_party
    pipeline_outputs:
      pipeline.dcql.trusted-authorities-values-non-array:
        output:
          null_value: ${{ fetch-null.outputs.body.raw.authorization_request_delivered }}
          true_value: ${{ fetch-true.outputs.body.raw.authorization_request_delivered }}
          false_value: ${{ fetch-false.outputs.body.raw.authorization_request_delivered }}
          zero_value: ${{ fetch-zero.outputs.body.raw.authorization_request_delivered }}
          random_number: ${{ fetch-number.outputs.body.raw.authorization_request_delivered }}
          string_value: ${{ fetch-string.outputs.body.raw.authorization_request_delivered }}
          object_value: ${{ fetch-object.outputs.body.raw.authorization_request_delivered }}
          visual_evidence: ${{ exercise-trusted-authorities-values-non-array.outputs.screenshot_urls }}
          null_value_session: ${{ fetch-null.outputs.body }}
          true_value_session: ${{ fetch-true.outputs.body }}
          false_value_session: ${{ fetch-false.outputs.body }}
          zero_value_session: ${{ fetch-zero.outputs.body }}
          random_number_session: ${{ fetch-number.outputs.body }}
          string_value_session: ${{ fetch-string.outputs.body }}
          object_value_session: ${{ fetch-object.outputs.body }}
outputs:
  null_value:
    path: $.output.fetch-null.outputs.body.raw.authorization_request_delivered
    decoder: raw
  true_value:
    path: $.output.fetch-true.outputs.body.raw.authorization_request_delivered
    decoder: raw
  false_value:
    path: $.output.fetch-false.outputs.body.raw.authorization_request_delivered
    decoder: raw
  zero_value:
    path: $.output.fetch-zero.outputs.body.raw.authorization_request_delivered
