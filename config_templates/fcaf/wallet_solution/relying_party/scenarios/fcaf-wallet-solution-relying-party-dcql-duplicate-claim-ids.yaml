name: FCAF DCQL duplicate claim ids
runtime:
  temporal:
    activity_options:
      schedule_to_close_timeout: 50m
      start_to_close_timeout: 50m
      retry_policy:
        maximum_attempts: 1
steps:
- id: create-capture-session
  use: http-request
  with:
    method: POST
    url: ${fixture.verifier_url}/openid4vp/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      response_mode: direct_post
      presentation_request:
        nonce: fcaf-110
        dcql_query:
          credentials:
          - id: pid
            format: dc+sd-jwt
            meta:
              vct_values:
              - urn:eu.europa.ec.eudi:pid:1
            claims:
            - id: duplicated_name
              path:
              - given_name
            - id: duplicated_name
              path:
              - family_name
- id: exercise-wallet
  use: mobile-automation
  with:
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-capture-session.outputs.body.deeplink }}
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-exercise-wallet-generic
- id: fetch-capture-session
  use: http-request
  with:
    method: GET
    url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-capture-session.outputs.body.session_id }}
    expected_status: 200
- id: run-fcaf-validators
  use: fcaf-validation
  with:
    test_ids:
      - WS_RP_MS_ProtocolMessages__110
    suite: wallet_solution/relying_party
    pipeline_outputs:
      pipeline.dcql.duplicate-claim-ids:
        output:
          dcql_exchange: ${{ fetch-capture-session.outputs.body }}
          visual_evidence: ${{ exercise-wallet.outputs.flow_output.maestro_screenshot_urls }}
          create-capture-session: ${{ create-capture-session.outputs }}
          exercise-wallet: ${{ exercise-wallet.outputs }}
          fetch-capture-session: ${{ fetch-capture-session.outputs }}
