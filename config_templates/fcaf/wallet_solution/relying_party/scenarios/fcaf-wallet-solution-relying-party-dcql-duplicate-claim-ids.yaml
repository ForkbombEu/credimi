name: FCAF DCQL duplicate claim ids
runtime:
  global_runner_id: forkbomb-bv-andrea/usb
  temporal:
    activity_options:
      schedule_to_close_timeout: 50m
      start_to_close_timeout: 50m
      retry_policy:
        maximum_attempts: 1
steps:
- id: create-capture-session
  use: http-request
  with:
    method: POST
    url: https://capture-wallet.credimi.io/openid4vp/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      response_mode: direct_post
      presentation_request:
        nonce: fcaf-110
        dcql_query:
          credentials:
          - id: pid
            format: dc+sd-jwt
            meta:
              vct_values:
              - urn:eu.europa.ec.eudi:pid:1
            claims:
            - id: duplicated_name
              path:
              - given_name
            - id: duplicated_name
              path:
              - family_name
- id: exercise-wallet
  use: mobile-automation
  with:
    version_id: installed_from_external_source
    parameters:
      DEEPLINK: ${{ create-capture-session.outputs.body.deeplink }}
    action_code: "appId: eu.europa.ec.euidi\n---\n- launchApp:\n    stopApp: true\n    clearState:\
      \ false\n    permissions:\n      camera: allow\n      notifications: allow\n      all: unset\n- extendedWaitUntil:\n\
      \    visible: \"Welcome back|Home|Documents|Add document|Welcome, .*\"\n    timeout: 30000\n- runFlow:\n    when:\n\
      \      visible: \"Welcome back\"\n    commands:\n      - tapOn: { point: \"11%,40%\" }\n      - inputText: \"123456\"\
      \n      - hideKeyboard\n      - tapOn: { point: \"50%,10%\" }\n- extendedWaitUntil:\n    visible: \"Home|Documents|Add\
      \ document|Welcome, .*\"\n    timeout: 30000\n- openLink:\n    link: \"${DEEPLINK}\"\n    autoVerify: false\n    browser:\
      \ false\n- runFlow:\n    when:\n      visible: \"EUDI Wallet\"\n    commands:\n      - tapOn: { text: \"EUDI Wallet\"\
      , optional: true }\n- runFlow:\n    when:\n      visible: \"Just once\"\n    commands:\n      - tapOn: { text: \"Just\
      \ once\", optional: true }\n- runFlow:\n    when:\n      visible: \"Always\"\n    commands:\n      - tapOn: { text:\
      \ \"Always\", optional: true }\n- extendedWaitUntil:\n    visible: \"Welcome back|Error|invalid request|Something went\
      \ wrong|DATA SHARING REQUEST\"\n    timeout: 100000\n- runFlow:\n    when:\n      visible: \"DATA SHARING REQUEST\"\n\
      \    commands:\n      - tapOn: \"Share\"\n      - extendedWaitUntil:\n          visible: \"PIN\"\n          timeout:\
      \ 30000\n      - tapOn: { point: \"11%,39%\" }\n      - inputText: \"123456\"\n      - tapOn: { point: \"50%,10%\" }\n\
      \      - extendedWaitUntil:\n          visible: \".*successfully shared.*|Welcome back\"\n          timeout: 30000\n\
      - runFlow:\n    when:\n      visible: \"Welcome back\"\n    commands:\n      - tapOn: { point: \"11%,40%\" }\n     \
      \ - inputText: \"123456\"\n- extendedWaitUntil:\n    visible: \"Error|invalid request|Something went wrong|Home|Documents\"\
      \n    timeout: 30000\n- takeScreenshot: fcaf-110\n- back"
- id: fetch-capture-session
  use: http-request
  with:
    method: GET
    url: https://capture-wallet.credimi.io/openid4vp/sessions/${{ create-capture-session.outputs.body.session_id }}
    expected_status: 200
- id: run-fcaf-validators
  use: fcaf-validation
  with:
    test_ids:
      - WS_RP_MS_ProtocolMessages__110
    suite: wallet_solution/relying_party
    pipeline_outputs:
      pipeline.dcql.duplicate-claim-ids:
        output:
          dcql_exchange: ${{ fetch-capture-session.outputs.body }}
          visual_evidence: ${{ exercise-wallet.outputs.flow_output.maestro_screenshot_urls }}
          create-capture-session: ${{ create-capture-session.outputs }}
          exercise-wallet: ${{ exercise-wallet.outputs }}
          fetch-capture-session: ${{ fetch-capture-session.outputs }}
