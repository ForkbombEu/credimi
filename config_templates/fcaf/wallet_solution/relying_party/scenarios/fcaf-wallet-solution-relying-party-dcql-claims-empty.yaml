name: FCAF wallet relying-party DCQL claims empty
runtime:
  temporal:
    activity_options:
      schedule_to_close_timeout: 50m
      start_to_close_timeout: 50m
      retry_policy:
        maximum_attempts: 1
steps:
- id: create-empty-claims-request
  use: http-request
  with:
    method: POST
    url: ${fixture.verifier_url}/openid4vp/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      scheme: haip-vp://
      request_delivery: by_reference
      request_uri_method: post
      response_type: vp_token
      response_mode: direct_post.jwt
      presentation_request:
        nonce: fcaf-083-claims-empty
        dcql_query:
          credentials:
          - id: pididentity01
            format: dc+sd-jwt
            meta:
              vct_values:
              - urn:eudi:pid:1
            claims:
            - path:
              - given_name
      request_mutation:
        request_object:
          set:
            /dcql_query:
              credentials:
              - id: pididentity01
                format: dc+sd-jwt
                meta:
                  vct_values:
                  - urn:eudi:pid:1
                claims: []
        verification_applies: false
- id: reject-empty-claims
  use: mobile-automation
  with:
    version_id: installed_from_external_source
    action_code: |
      appId: eu.europa.ec.euidi
      ---
      - launchApp:
          stopApp: true
          clearState: false
      - extendedWaitUntil:
          visible: "Welcome back|Home|Documents|Welcome, .*"
          timeout: 30000
      - runFlow:
          when:
            visible: "Welcome back"
          commands:
          - tapOn:
              point: "11%,40%"
          - inputText: "123456"
          - hideKeyboard
          - tapOn:
              point: "50%,10%"
      - extendedWaitUntil:
          visible: "Home|Documents|Welcome, .*"
          timeout: 30000
      - openLink:
          link: "${DEEPLINK_EMPTY_CLAIMS_REQUEST}"
          autoVerify: false
          browser: false
      - waitForAnimationToEnd:
          timeout: 5000
      - runFlow:
          when:
            visible: "Welcome back"
          commands:
          - tapOn:
              point: "11%,40%"
          - inputText: "123456"
          - hideKeyboard
          - tapOn:
              point: "50%,10%"
      - extendedWaitUntil:
          visible: "Oups! Something went wrong|The requested document is not available in your EUDI Wallet.*|Data sharing request|Home|Documents|Welcome, .*"
          timeout: 30000
      - takeScreenshot: fcaf-083-claims-empty-rejected
      - runFlow:
          when:
            visible: "Requested data"
          commands:
          - tapOn: "Share"
          - runFlow:
              when:
                visible: "PIN"
              commands:
              - tapOn:
                  point: "11%,39%"
              - inputText: "123456"
              - hideKeyboard
              - tapOn:
                  point: "50%,10%"
          - extendedWaitUntil:
              visible: ".*successfully shared.*|Oups! Something went wrong"
              timeout: 60000
          - takeScreenshot: fcaf-083-claims-empty-rejected-presented
          - tapOn:
              text: "Close|TRY AGAIN"
              optional: true
      - runFlow:
          when:
            visible: "Data sharing request"
          commands:
          - tapOn: "Cancel"
          - waitForAnimationToEnd:
              timeout: 3000
    parameters:
      DEEPLINK_EMPTY_CLAIMS_REQUEST: ${{ create-empty-claims-request.outputs.body.deeplink }}
- id: fetch-empty-claims-request
  use: http-request
  with:
    method: GET
    url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-empty-claims-request.outputs.body.session_id }}
    expected_status: 200
- id: run-fcaf-validators
  use: fcaf-validation
  with:
    test_ids:
    - WS_RP_MS_ProtocolMessages__083
    suite: wallet_solution/relying_party
    pipeline_outputs:
      pipeline.dcql.claims-empty:
        output:
          dcql_exchange: ${{ fetch-empty-claims-request.outputs.body.raw.authorization_request_delivered }}
          visual_evidence: ${{ reject-empty-claims.outputs.flow_output.maestro_screenshot_urls }}
          fetch-empty-claims-request: ${{ fetch-empty-claims-request.outputs.body.raw.authorization_request_delivered }}
          reject-empty-claims: ${{ reject-empty-claims.outputs }}
          dcql_exchange_session: ${{ fetch-empty-claims-request.outputs.body }}
