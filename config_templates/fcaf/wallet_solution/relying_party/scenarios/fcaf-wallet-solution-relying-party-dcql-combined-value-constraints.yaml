name: FCAF combined DCQL value constraints
runtime:
  fixture:
    issuer_url: https://beta-capture-wallet.credimi.io
    log_checker: capture-wallet
  global_device_id: forkbomb-bv-andrea/usb/device
  temporal:
    activity_options:
      schedule_to_close_timeout: 50m
      start_to_close_timeout: 50m
      retry_policy:
        maximum_attempts: 1
steps:
# A, the only credential satisfying every restriction
- id: create-full-match-issuance
  use: http-request
  with:
    method: POST
    url: ${fixture.issuer_url}/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      issuer_configuration_id: eu-pid-device-bound
      credential_configuration_id: urn:eu.europa.ec.eudi:pid:1.sd-jwt.key-attestation-required
      fixture_id: pid_default
- id: obtain-full-match-credential
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/getcredential-generic-credential-without-authentication
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-full-match-issuance.outputs.body.deeplink }}
# B1, fails age_over_18
- id: create-age-trap-issuance
  use: http-request
  with:
    method: POST
    url: ${fixture.issuer_url}/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      issuer_configuration_id: eu-pid-device-bound
      credential_configuration_id: urn:eu.europa.ec.eudi:pid:1.sd-jwt.key-attestation-required
      fixture_id: pid_under_18
- id: obtain-age-trap-credential
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/getcredential-generic-credential-without-authentication
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-age-trap-issuance.outputs.body.deeplink }}
# B3, fails letter case
- id: create-case-trap-issuance
  use: http-request
  with:
    method: POST
    url: ${fixture.issuer_url}/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      issuer_configuration_id: eu-pid-device-bound
      credential_configuration_id: urn:eu.europa.ec.eudi:pid:1.sd-jwt.key-attestation-required
      fixture_id: pid_family_name_uppercase
- id: obtain-case-trap-credential
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/getcredential-generic-credential-without-authentication
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-case-trap-issuance.outputs.body.deeplink }}
# B4, fails whitespace
- id: create-whitespace-trap-issuance
  use: http-request
  with:
    method: POST
    url: ${fixture.issuer_url}/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      issuer_configuration_id: eu-pid-device-bound
      credential_configuration_id: urn:eu.europa.ec.eudi:pid:1.sd-jwt.key-attestation-required
      fixture_id: pid_family_name_trailing_space
- id: obtain-whitespace-trap-credential
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/getcredential-generic-credential-without-authentication
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-whitespace-trap-issuance.outputs.body.deeplink }}
# B5a, fails locality encoding
- id: create-diacritics-trap-issuance
  use: http-request
  with:
    method: POST
    url: ${fixture.issuer_url}/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      issuer_configuration_id: eu-pid-device-bound
      credential_configuration_id: urn:eu.europa.ec.eudi:pid:1.sd-jwt.key-attestation-required
      fixture_id: pid_locality_diacritics
- id: obtain-diacritics-trap-credential
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/getcredential-generic-credential-without-authentication
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-diacritics-trap-issuance.outputs.body.deeplink }}
# B5b, fails locality encoding
- id: create-no-diacritics-trap-issuance
  use: http-request
  with:
    method: POST
    url: ${fixture.issuer_url}/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      issuer_configuration_id: eu-pid-device-bound
      credential_configuration_id: urn:eu.europa.ec.eudi:pid:1.sd-jwt.key-attestation-required
      fixture_id: pid_locality_no_diacritics
- id: obtain-no-diacritics-trap-credential
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/getcredential-generic-credential-without-authentication
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-no-diacritics-trap-issuance.outputs.body.deeplink }}
# B6, fails the array element
- id: create-array-trap-issuance
  use: http-request
  with:
    method: POST
    url: ${fixture.issuer_url}/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      issuer_configuration_id: eu-pid-device-bound
      credential_configuration_id: urn:eu.europa.ec.eudi:pid:1.sd-jwt.key-attestation-required
      fixture_id: pid_multiple_nationalities
- id: obtain-array-trap-credential
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/getcredential-generic-credential-without-authentication
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-array-trap-issuance.outputs.body.deeplink }}
# B7, fails the expiry boundary
- id: create-expiry-trap-issuance
  use: http-request
  with:
    method: POST
    url: ${fixture.issuer_url}/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      issuer_configuration_id: eu-pid-device-bound
      credential_configuration_id: urn:eu.europa.ec.eudi:pid:1.sd-jwt.key-attestation-required
      fixture_id: pid_expiry_2032
- id: obtain-expiry-trap-credential
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/getcredential-generic-credential-without-authentication
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-expiry-trap-issuance.outputs.body.deeplink }}
# Precondition evidence: one unconstrained query with multiple: true returns
# every PID the Wallet holds, so the eight fixtures above are shown to be
# present before the constrained query is asked to exclude seven of them.
- id: create-fixture-inventory-request
  use: http-request
  with:
    method: POST
    url: ${fixture.verifier_url}/openid4vp/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      scheme: haip-vp://
      request_uri_method: post
      request_delivery: by_reference
      response_type: vp_token
      response_mode: direct_post
      presentation_request:
        nonce: combined-value-constraints-inventory
        dcql_query:
          credentials:
          - id: pid
            format: dc+sd-jwt
            multiple: true
            meta:
              vct_values:
              - urn:eudi:pid:1
            claims:
            - path:
              - document_number
- id: present-fixture-inventory-request
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-engagement-haip-vp
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-fixture-inventory-request.outputs.body.deeplink }}
- id: fetch-fixture-inventory-request
  use: http-request
  with:
    method: GET
    url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-fixture-inventory-request.outputs.body.session_id }}
    expected_status: 200
# One query restricting five independent axes at once. Every trap above fails
# exactly one of them, and multiple: true makes the Wallet return every
# credential it considered a match, so a released trap cannot stay hidden
# behind the matching credential.
- id: create-combined-constraint-request
  use: http-request
  with:
    method: POST
    url: ${fixture.verifier_url}/openid4vp/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      scheme: haip-vp://
      request_uri_method: post
      request_delivery: by_reference
      response_type: vp_token
      response_mode: direct_post
      presentation_request:
        nonce: combined-value-constraints
        dcql_query:
          credentials:
          - id: pid
            format: dc+sd-jwt
            multiple: true
            meta:
              vct_values:
              - urn:eudi:pid:1
            claims:
            - path:
              - family_name
              values:
              - Rossi
            - path:
              - age_over_18
              values:
              - true
            - path:
              - address
              - locality
              values:
              - Roma
            - path:
              - nationalities
              - 0
              values:
              - IT
            - path:
              - date_of_expiry
              values:
              - '2031-01-01'
- id: present-combined-constraint-request
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-engagement-haip-vp
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-combined-constraint-request.outputs.body.deeplink }}
- id: fetch-combined-constraint-request
  use: http-request
  with:
    method: GET
    url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-combined-constraint-request.outputs.body.session_id }}
    expected_status: 200
- id: run-fcaf-validators
  use: fcaf-validation
  with:
    test_ids:
    - WS_RP_IA_MainInteraction__033
    suite: wallet_solution/relying_party
    pipeline_outputs:
      pipeline.dcql.combined-value-constraints:
        output:
          fixture_inventory: ${{ fetch-fixture-inventory-request.outputs.body }}
          dcql_exchange: ${{ fetch-combined-constraint-request.outputs.body }}
          visual_evidence: ${{ present-combined-constraint-request.outputs.flow_output.maestro_screenshot_urls }}
