name: FCAF combined DCQL value constraints
runtime:
  fixture:
    issuer_url: https://capture-wallet.credimi.io
    log_checker: capture-wallet
  global_device_id: forkbomb-bv-andrea/usb/device
  temporal:
    activity_options:
      schedule_to_close_timeout: 50m
      start_to_close_timeout: 50m
      retry_policy:
        maximum_attempts: 1
steps:
# A, the only credential satisfying every restriction
- id: create-full-match-issuance
  use: http-request
  with:
    method: POST
    url: ${fixture.issuer_url}/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      issuer_configuration_id: eu-pid-device-bound
      credential_configuration_id: urn:eu.europa.ec.eudi:pid:1.sd-jwt.key-attestation-required
      fixture_id: pid_default
- id: obtain-full-match-credential
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/getcredential-generic-credential-without-authentication
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-full-match-issuance.outputs.body.deeplink }}
# B1, fails age_over_18
- id: create-age-trap-issuance
  use: http-request
  with:
    method: POST
    url: ${fixture.issuer_url}/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      issuer_configuration_id: eu-pid-device-bound
      credential_configuration_id: urn:eu.europa.ec.eudi:pid:1.sd-jwt.key-attestation-required
      fixture_id: pid_under_18
- id: obtain-age-trap-credential
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/getcredential-generic-credential-without-authentication
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-age-trap-issuance.outputs.body.deeplink }}
# B3, fails letter case
- id: create-case-trap-issuance
  use: http-request
  with:
    method: POST
    url: ${fixture.issuer_url}/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      issuer_configuration_id: eu-pid-device-bound
      credential_configuration_id: urn:eu.europa.ec.eudi:pid:1.sd-jwt.key-attestation-required
      fixture_id: pid_family_name_uppercase
- id: obtain-case-trap-credential
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/getcredential-generic-credential-without-authentication
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-case-trap-issuance.outputs.body.deeplink }}
# B4, fails whitespace
- id: create-whitespace-trap-issuance
  use: http-request
  with:
    method: POST
    url: ${fixture.issuer_url}/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      issuer_configuration_id: eu-pid-device-bound
      credential_configuration_id: urn:eu.europa.ec.eudi:pid:1.sd-jwt.key-attestation-required
      fixture_id: pid_family_name_trailing_space
- id: obtain-whitespace-trap-credential
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/getcredential-generic-credential-without-authentication
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-whitespace-trap-issuance.outputs.body.deeplink }}
# B5a, fails locality encoding
- id: create-diacritics-trap-issuance
  use: http-request
  with:
    method: POST
    url: ${fixture.issuer_url}/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      issuer_configuration_id: eu-pid-device-bound
      credential_configuration_id: urn:eu.europa.ec.eudi:pid:1.sd-jwt.key-attestation-required
      fixture_id: pid_locality_diacritics
- id: obtain-diacritics-trap-credential
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/getcredential-generic-credential-without-authentication
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-diacritics-trap-issuance.outputs.body.deeplink }}
# B5b, fails locality encoding
- id: create-no-diacritics-trap-issuance
  use: http-request
  with:
    method: POST
    url: ${fixture.issuer_url}/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      issuer_configuration_id: eu-pid-device-bound
      credential_configuration_id: urn:eu.europa.ec.eudi:pid:1.sd-jwt.key-attestation-required
      fixture_id: pid_locality_no_diacritics
- id: obtain-no-diacritics-trap-credential
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/getcredential-generic-credential-without-authentication
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-no-diacritics-trap-issuance.outputs.body.deeplink }}
# B6, fails the array element
- id: create-array-trap-issuance
  use: http-request
  with:
    method: POST
    url: ${fixture.issuer_url}/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      issuer_configuration_id: eu-pid-device-bound
      credential_configuration_id: urn:eu.europa.ec.eudi:pid:1.sd-jwt.key-attestation-required
      fixture_id: pid_multiple_nationalities
- id: obtain-array-trap-credential
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/getcredential-generic-credential-without-authentication
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-array-trap-issuance.outputs.body.deeplink }}
# B7, fails the expiry boundary
- id: create-expiry-trap-issuance
  use: http-request
  with:
    method: POST
    url: ${fixture.issuer_url}/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      issuer_configuration_id: eu-pid-device-bound
      credential_configuration_id: urn:eu.europa.ec.eudi:pid:1.sd-jwt.key-attestation-required
      fixture_id: pid_expiry_2032
- id: obtain-expiry-trap-credential
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/getcredential-generic-credential-without-authentication
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-expiry-trap-issuance.outputs.body.deeplink }}
# Precondition evidence: each issuer session above records whether the Wallet
# fetched its credential. Possession is proven from these records rather than
# by presenting the credentials, because the reference Wallet spends a
# credential instance on every presentation: an inventory query with
# multiple: true would empty the Wallet before the constrained query below.
- id: fetch-full-match-issuance
  use: http-request
  with:
    method: GET
    url: ${fixture.issuer_url}/sessions/${{ create-full-match-issuance.outputs.body.session_id }}
    expected_status: 200
- id: fetch-age-trap-issuance
  use: http-request
  with:
    method: GET
    url: ${fixture.issuer_url}/sessions/${{ create-age-trap-issuance.outputs.body.session_id }}
    expected_status: 200
- id: fetch-case-trap-issuance
  use: http-request
  with:
    method: GET
    url: ${fixture.issuer_url}/sessions/${{ create-case-trap-issuance.outputs.body.session_id }}
    expected_status: 200
- id: fetch-whitespace-trap-issuance
  use: http-request
  with:
    method: GET
    url: ${fixture.issuer_url}/sessions/${{ create-whitespace-trap-issuance.outputs.body.session_id }}
    expected_status: 200
- id: fetch-diacritics-trap-issuance
  use: http-request
  with:
    method: GET
    url: ${fixture.issuer_url}/sessions/${{ create-diacritics-trap-issuance.outputs.body.session_id }}
    expected_status: 200
- id: fetch-no-diacritics-trap-issuance
  use: http-request
  with:
    method: GET
    url: ${fixture.issuer_url}/sessions/${{ create-no-diacritics-trap-issuance.outputs.body.session_id }}
    expected_status: 200
- id: fetch-array-trap-issuance
  use: http-request
  with:
    method: GET
    url: ${fixture.issuer_url}/sessions/${{ create-array-trap-issuance.outputs.body.session_id }}
    expected_status: 200
- id: fetch-expiry-trap-issuance
  use: http-request
  with:
    method: GET
    url: ${fixture.issuer_url}/sessions/${{ create-expiry-trap-issuance.outputs.body.session_id }}
    expected_status: 200
# One query restricting five independent axes at once. Every trap above fails
# exactly one of them, and multiple: true makes the Wallet return every
# credential it considered a match, so a released trap cannot stay hidden
# behind the matching credential.
- id: create-combined-constraint-request
  use: http-request
  with:
    method: POST
    url: ${fixture.verifier_url}/openid4vp/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      scheme: haip-vp://
      request_uri_method: post
      request_delivery: by_reference
      response_type: vp_token
      response_mode: direct_post.jwt
      presentation_request:
        nonce: combined-value-constraints
        dcql_query:
          credentials:
          - id: pid
            format: dc+sd-jwt
            multiple: true
            meta:
              vct_values:
              - urn:eudi:pid:1
            claims:
            - path:
              - family_name
              values:
              - Rossi
            - path:
              - age_over_18
              values:
              - true
            - path:
              - address
              - locality
              values:
              - Roma
            - path:
              - nationalities
              - 0
              values:
              - IT
            - path:
              - date_of_expiry
              values:
              - '2031-01-01'
- id: present-combined-constraint-request
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-engagement-haip-vp
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-combined-constraint-request.outputs.body.deeplink }}
- id: fetch-combined-constraint-request
  use: http-request
  with:
    method: GET
    url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-combined-constraint-request.outputs.body.session_id }}
    expected_status: 200
# B2, fails the numeric data type. The source's trap is a credential holding a
# float where the query constrains an integer. No PID or degree claim is
# numeric, and OpenID4VP 6.4 restricts DCQL `values` to strings, integers and
# booleans, so the axis cannot be expressed inside the PID query above: the
# verifier refuses a float constraint with `Invalid integer: Received 70.5`.
# It is therefore exercised on the only credential type that carries a numeric
# claim, as its own pair of requests.
- id: create-numeric-type-trap-issuance
  use: http-request
  with:
    method: POST
    url: ${fixture.issuer_url}/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      issuer_configuration_id: eu-pid-device-bound
      credential_configuration_id: urn:credimi:numeric-claims:1.sd-jwt.key-attestation-required
- id: obtain-numeric-type-trap-credential
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/getcredential-generic-credential-without-authentication
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-numeric-type-trap-issuance.outputs.body.deeplink }}
# Possession evidence: the issuer session records that the Wallet fetched the
# numeric credential, whose kg claim is the float 70.5 the trap below relies
# on. Presenting it to prove possession would spend it.
- id: fetch-numeric-type-trap-issuance
  use: http-request
  with:
    method: GET
    url: ${fixture.issuer_url}/sessions/${{ create-numeric-type-trap-issuance.outputs.body.session_id }}
    expected_status: 200
# The trap itself: an integer constraint against the float the wallet holds.
- id: create-numeric-type-trap-request
  use: http-request
  with:
    method: POST
    url: ${fixture.verifier_url}/openid4vp/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      scheme: haip-vp://
      request_uri_method: post
      request_delivery: by_reference
      response_type: vp_token
      response_mode: direct_post.jwt
      presentation_request:
        nonce: combined-value-constraints-numeric-type
        dcql_query:
          credentials:
          - id: numeric
            format: dc+sd-jwt
            meta:
              vct_values:
              - urn:credimi:numeric-claims:1
            claims:
            - path:
              - kg
              values:
              - 70
- id: present-numeric-type-trap-request
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-expect-no-matching-document
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-numeric-type-trap-request.outputs.body.deeplink }}
- id: fetch-numeric-type-trap-request
  use: http-request
  with:
    method: GET
    url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-numeric-type-trap-request.outputs.body.session_id }}
    expected_status: 200
- id: run-fcaf-validators
  use: fcaf-validation
  with:
    test_ids:
    - WS_RP_IA_MainInteraction__033
    suite: wallet_solution/relying_party
    pipeline_outputs:
      pipeline.dcql.combined-value-constraints:
        output:
          fixture_issuances:
          - ${{ fetch-full-match-issuance.outputs.body }}
          - ${{ fetch-age-trap-issuance.outputs.body }}
          - ${{ fetch-case-trap-issuance.outputs.body }}
          - ${{ fetch-whitespace-trap-issuance.outputs.body }}
          - ${{ fetch-diacritics-trap-issuance.outputs.body }}
          - ${{ fetch-no-diacritics-trap-issuance.outputs.body }}
          - ${{ fetch-array-trap-issuance.outputs.body }}
          - ${{ fetch-expiry-trap-issuance.outputs.body }}
          dcql_exchange: ${{ fetch-combined-constraint-request.outputs.body }}
          visual_evidence: ${{ present-combined-constraint-request.outputs.flow_output.maestro_screenshot_urls }}
          numeric_issuance: ${{ fetch-numeric-type-trap-issuance.outputs.body }}
          numeric_type_trap: ${{ fetch-numeric-type-trap-request.outputs.body }}
          numeric_visual_evidence: ${{ present-numeric-type-trap-request.outputs.flow_output.maestro_screenshot_urls }}
