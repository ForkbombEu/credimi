- id: exercise-holder-binding-variants
  use: mobile-automation
  with:
    version_id: installed_from_external_source
    parameters:
      DEEPLINK_VALID_TRUE: ${{ create-valid-true.outputs.body.deeplink }}
      DEEPLINK_VALID_FALSE: ${{ create-valid-false.outputs.body.deeplink }}
      DEEPLINK_NUMBER_ZERO: ${{ create-number-zero.outputs.body.deeplink }}
      DEEPLINK_NUMBER_ONE: ${{ create-number-one.outputs.body.deeplink }}
      DEEPLINK_NUMBER_RANDOM: ${{ create-number-random.outputs.body.deeplink }}
      DEEPLINK_STRING_TRUE: ${{ create-string-true.outputs.body.deeplink }}
      DEEPLINK_STRING_FALSE: ${{ create-string-false.outputs.body.deeplink }}
      DEEPLINK_STRING_UPPERCASE_TRUE: ${{ create-string-uppercase-true.outputs.body.deeplink }}
      DEEPLINK_STRING_UPPERCASE_FALSE: ${{ create-string-uppercase-false.outputs.body.deeplink }}
      DEEPLINK_STRING_YES: ${{ create-string-yes.outputs.body.deeplink }}
      DEEPLINK_STRING_NO: ${{ create-string-no.outputs.body.deeplink }}
      DEEPLINK_STRING_Y: ${{ create-string-y.outputs.body.deeplink }}
      DEEPLINK_STRING_N: ${{ create-string-n.outputs.body.deeplink }}
      DEEPLINK_STRING_ZERO: ${{ create-string-zero.outputs.body.deeplink }}
      DEEPLINK_STRING_ONE: ${{ create-string-one.outputs.body.deeplink }}
      DEEPLINK_STRING_RANDOM: ${{ create-string-random.outputs.body.deeplink }}
    action_code: |
      appId: eu.europa.ec.euidi
      ---
      - launchApp:
          stopApp: true
          clearState: false
      - extendedWaitUntil:
          visible: "Welcome back|Home|Documents|Welcome, .*"
          timeout: 30000
      - runFlow:
          when:
            visible: "Welcome back"
          commands:
          - tapOn:
              point: "11%,40%"
          - inputText: "123456"
          - hideKeyboard
          - tapOn:
              point: "50%,10%"
      - extendedWaitUntil:
          visible: "Home|Documents|Welcome, .*"
          timeout: 30000
      - openLink: { link: "${DEEPLINK_VALID_TRUE}", autoVerify: false, browser: false }
      - waitForAnimationToEnd:
          timeout: 5000
      - runFlow:
          when:
            visible: "Welcome back"
          commands:
          - tapOn:
              point: "11%,40%"
          - inputText: "123456"
          - hideKeyboard
          - tapOn:
              point: "50%,10%"
      - extendedWaitUntil:
          visible: "Data sharing request"
          timeout: 100000
      - tapOn: "Share"
      - extendedWaitUntil:
          visible: "PIN"
          timeout: 30000
      - tapOn:
          point: "11%,39%"
      - inputText: "123456"
      - hideKeyboard
      - tapOn: { point: "50%,10%" }
      - extendedWaitUntil:
          visible: ".*successfully shared.*"
          timeout: 30000
      - takeScreenshot: fcaf-081-valid-true
      - tapOn: "Close"
      - openLink: { link: "${DEEPLINK_VALID_FALSE}", autoVerify: false, browser: false }
      - waitForAnimationToEnd:
          timeout: 5000
      - runFlow:
          when:
            visible: "Welcome back"
          commands:
          - tapOn:
              point: "11%,40%"
          - inputText: "123456"
          - hideKeyboard
          - tapOn:
              point: "50%,10%"
      - extendedWaitUntil:
          visible: "Data sharing request"
          timeout: 100000
      - tapOn: "Share"
      - extendedWaitUntil:
          visible: "PIN"
          timeout: 30000
      - tapOn:
          point: "11%,39%"
      - inputText: "123456"
      - hideKeyboard
      - tapOn: { point: "50%,10%" }
      - extendedWaitUntil:
          visible: ".*successfully shared.*"
          timeout: 30000
      - takeScreenshot: fcaf-081-valid-false
      - tapOn: "Close"
      - openLink:
          link: "${DEEPLINK_NUMBER_ZERO}"
          autoVerify: false
          browser: false
      - waitForAnimationToEnd:
          timeout: 5000
      - runFlow:
          when:
            visible: "Welcome back"
          commands:
          - tapOn:
              point: "11%,40%"
          - inputText: "123456"
          - hideKeyboard
          - tapOn:
              point: "50%,10%"
      - extendedWaitUntil:
          visible: "Oups! Something went wrong|The requested document is not available in your EUDI Wallet.*|Data sharing request|Home|Documents|Welcome, .*"
          timeout: 30000
      - takeScreenshot: fcaf-081-number-zero
      - runFlow:
          when:
            visible: "Requested data"
          commands:
          - tapOn: "Share"
          - runFlow:
              when:
                visible: "PIN"
              commands:
              - tapOn:
                  point: "11%,39%"
              - inputText: "123456"
              - hideKeyboard
              - tapOn:
                  point: "50%,10%"
