name: FCAF wallet relying-party DCQL holder binding type boundary
runtime:
  temporal:
    activity_options:
      schedule_to_close_timeout: 50m
      start_to_close_timeout: 50m
      retry_policy:
        maximum_attempts: 1
steps:
- id: create-valid-true
  use: http-request
  with:
    method: POST
    url: ${fixture.verifier_url}/openid4vp/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      scheme: haip-vp://
      request_delivery: by_reference
      response_type: vp_token
      response_mode: direct_post.jwt
      presentation_request:
        nonce: fcaf-081-valid-true
        dcql_query:
          credentials:
          - id: pididentity01
            format: dc+sd-jwt
            meta:
              vct_values:
              - urn:eudi:pid:1
            require_cryptographic_holder_binding: true
            claims:
            - path:
              - given_name
            - path:
              - family_name
- id: create-valid-false
  use: http-request
  with:
    method: POST
    url: ${fixture.verifier_url}/openid4vp/sessions
