  use: fcaf-validation
  with:
    test_ids:
    - WS_RP_IA_MainInteraction__005
    - WS_RP_IA_MainInteraction__007
    - WS_RP_IA_MainInteraction__008
    - WS_RP_MS_ProtocolMessages__081
    - WS_RP_SM_DeviceBinding__008
    - WS_RP_SM_DeviceBinding__009
