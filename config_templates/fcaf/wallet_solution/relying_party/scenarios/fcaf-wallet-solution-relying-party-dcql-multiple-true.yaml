name: FCAF wallet relying-party DCQL multiple true
runtime:
  fixture:
    issuer_url: https://capture-wallet.credimi.io
  temporal:
    activity_options:
      schedule_to_close_timeout: 50m
      start_to_close_timeout: 50m
      retry_policy:
        maximum_attempts: 1

steps:
  # The source's precondition is a Wallet holding more than one credential
  # matching the query. The Wallet spends a credential instance per
  # presentation and the scenario starts from a reset Wallet, so it issues both
  # matching identities itself and proves possession from the issuer sessions,
  # not by presenting them.
  - id: create-first-matching-issuance
    use: http-request
    with:
      method: POST
      url: ${fixture.issuer_url}/sessions
      expected_status: 201
      headers:
        Content-Type: application/json
      body:
        issuer_configuration_id: eu-pid-device-bound
        credential_configuration_id: urn:eu.europa.ec.eudi:pid:1.sd-jwt.key-attestation-required
        fixture_id: pid_default
  - id: obtain-first-matching-credential
    use: mobile-automation
    with:
      action_id: forkbomb-bv-andrea/eudiw-beta-wallet/getcredential-generic-credential-without-authentication
      version_id: installed_from_external_source
      parameters:
        deeplink: ${{ create-first-matching-issuance.outputs.body.deeplink }}
  - id: fetch-first-matching-issuance
    use: http-request
    with:
      method: GET
      url: ${fixture.issuer_url}/sessions/${{ create-first-matching-issuance.outputs.body.session_id }}
      expected_status: 200
  - id: create-second-matching-issuance
    use: http-request
    with:
      method: POST
      url: ${fixture.issuer_url}/sessions
      expected_status: 201
      headers:
        Content-Type: application/json
      body:
        issuer_configuration_id: eu-pid-device-bound
        credential_configuration_id: urn:eu.europa.ec.eudi:pid:1.sd-jwt.key-attestation-required
        fixture_id: pid_person_b
  - id: obtain-second-matching-credential
    use: mobile-automation
    with:
      action_id: forkbomb-bv-andrea/eudiw-beta-wallet/getcredential-generic-credential-without-authentication
      version_id: installed_from_external_source
      parameters:
        deeplink: ${{ create-second-matching-issuance.outputs.body.deeplink }}
  - id: fetch-second-matching-issuance
    use: http-request
    with:
      method: GET
      url: ${fixture.issuer_url}/sessions/${{ create-second-matching-issuance.outputs.body.session_id }}
      expected_status: 200
  - id: create-presentation
    use: http-request
    with:
      method: POST
      url: ${fixture.verifier_url}/openid4vp/sessions
      expected_status: 201
      headers:
        Content-Type: application/json
      body:
        scheme: haip-vp://
        request_delivery: by_reference
        response_type: vp_token
        response_mode: direct_post.jwt
        presentation_request:
          nonce: fcaf-dcql-multiple-true
          dcql_query:
            credentials:
              - id: pid_sdjwt
                format: dc+sd-jwt
                multiple: true
                meta:
                  vct_values:
                    - urn:eudi:pid:1
                claims:
                  - path:
                      - given_name
                  - path:
                      - family_name

  - id: present-with-reference-implementation
    use: mobile-automation
    with:
      version_id: installed_from_external_source
      parameters:
        deeplink: ${{ create-presentation.outputs.body.deeplink }}
      action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-engagement-haip-vp
  - id: get-presentation-result
    use: http-request
    with:
      method: GET
      url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-presentation.outputs.body.session_id }}
      expected_status: 200

  - id: run-fcaf-validators
    use: fcaf-validation
    with:
      test_ids:
        - WS_RP_MS_ProtocolMessages__071
      suite: wallet_solution/relying_party
      pipeline_outputs:
        pipeline.dcql.multiple-true:
          output:
            dcql_exchange: ${{ get-presentation-result.outputs.body }}
            visual_evidence: ${{ present-with-reference-implementation.outputs.flow_output.maestro_screenshot_urls }}
            matching_issuances:
              - ${{ fetch-first-matching-issuance.outputs.body }}
              - ${{ fetch-second-matching-issuance.outputs.body }}
            create-presentation: ${{ create-presentation.outputs }}
            present-with-reference-implementation: ${{ present-with-reference-implementation.outputs }}
            get-presentation-result: ${{ get-presentation-result.outputs }}
