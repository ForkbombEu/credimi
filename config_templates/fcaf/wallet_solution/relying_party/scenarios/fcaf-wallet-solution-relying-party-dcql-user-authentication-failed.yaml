name: FCAF DCQL user authentication failed
runtime: { global_runner_id: forkbomb-bv-andrea/usb }
steps:
  - id: create-presentation
    use: http-request
    with:
      method: POST
      url: ${fixture.verifier_url}/ui/presentations
      expected_status: 200
      headers: { Content-Type: application/json }
      body:
        type: vp_token
        nonce: fcaf-149-user-authentication-failed
        dcql_query:
          credentials:
            - id: pid-authentication-failed
              format: dc+sd-jwt
              meta: { vct_values: [urn:eudi:pid:1] }
              claims:
                - { path: [given_name] }

  - id: fail-user-authentication
    use: mobile-automation
    with:
      version_id: installed_from_external_source
      parameters:
        CLIENT_ID: ${{ create-presentation.outputs.body.client_id }}
        REQUEST_URI: ${{ create-presentation.outputs.body.request_uri }}
      action_code: |
        appId: eu.europa.ec.euidi
        ---
                - launchApp: { stopApp: true, clearState: false }
        - extendedWaitUntil:
            visible: "Welcome back|Home|Documents|Add document|Welcome, .*"
            timeout: 30000
        - runFlow:
            when:
              visible: "Welcome back"
            commands:
              - tapOn:
                  point: "11%,40%"
              - inputText: "123456"
              - hideKeyboard
              - tapOn: { point: "50%,10%" }
        - extendedWaitUntil:
            visible: "Home|Documents|Add document|Welcome, .*"
            timeout: 30000
        - evalScript: ${output.authorizationRequest = 'eudi-openid4vp://?client_id=' + encodeURIComponent(env.CLIENT_ID) + '&request_uri=' + encodeURIComponent(env.REQUEST_URI)}
        - openLink: { link: ${output.authorizationRequest}, autoVerify: false, browser: false }
        - runFlow:
            when:
              visible: "EUDI Wallet"
            commands:
              - tapOn: { text: "EUDI Wallet", optional: true }
        - runFlow:
            when:
              visible: "Just once"
            commands:
              - tapOn: { text: "Just once", optional: true }
        - runFlow:
            when:
              visible: "Always"
            commands:
              - tapOn: { text: "Always", optional: true }
        - extendedWaitUntil: { visible: "Welcome back|DATA SHARING REQUEST", timeout: 100000 }
        - runFlow:
            when: { visible: "Welcome back" }
            commands:
              - tapOn: { point: "11%,40%" }
              - tapOn: { text: "1", retryTapIfNoChange: false }
              - tapOn: { text: "2", retryTapIfNoChange: false }
              - tapOn: { text: "3", retryTapIfNoChange: false }
              - tapOn: { text: "4", retryTapIfNoChange: false }
              - tapOn: { text: "5", retryTapIfNoChange: false }
              - tapOn: { text: "6", retryTapIfNoChange: false, waitToSettleTimeoutMs: 0 }
        - extendedWaitUntil: { visible: "DATA SHARING REQUEST", timeout: 100000 }
        - assertVisible: { id: eu.europa.ec.euidi:id/request_screen_requested_document_0 }
        - tapOn: { id: eu.europa.ec.euidi:id/request_screen_requested_document_0, retryTapIfNoChange: false }
        - assertVisible: "Given Name(s)"
        - takeScreenshot: fcaf-149-consent-screen-before-authentication
        - tapOn: "Share"
        - extendedWaitUntil: { visible: "PIN|To approve the transaction you need to verify your identity.", timeout: 30000 }
        - tapOn: { point: "11%,39%" }
        - inputText: "111111"
        - extendedWaitUntil: { visible: "Invalid pin", timeout: 30000 }
        - assertNotVisible: ".*successfully shared.*"
        - takeScreenshot: fcaf-149-user-authentication-failed
        - tapOn: "Go Back"
        - extendedWaitUntil: { visible: "DATA SHARING REQUEST", timeout: 30000 }
        - tapOn: "Go Back"
        - extendedWaitUntil: { visible: "Home|Welcome, .*", timeout: 30000 }

  - id: fetch-result
    use: http-request
    with:
      method: GET
      url: ${fixture.verifier_url}/ui/presentations/${{ create-presentation.outputs.body.transaction_id }}
      expected_status: 200

  - id: run-fcaf-validators
    use: fcaf-validation
    with:
      test_ids:
        - WS_RP_MS_ProtocolMessages__149
      suite: wallet_solution/relying_party
      pipeline_outputs:
        pipeline.dcql.user-authentication-failed:
          output:
            dcql_exchange: ${{ fetch-result.outputs.body }}
            visual_evidence: ${{ fail-user-authentication.outputs.flow_output.maestro_screenshot_urls }}
            create-presentation: ${{ create-presentation.outputs }}
            fail-user-authentication: ${{ fail-user-authentication.outputs }}
            fetch-result: ${{ fetch-result.outputs }}
