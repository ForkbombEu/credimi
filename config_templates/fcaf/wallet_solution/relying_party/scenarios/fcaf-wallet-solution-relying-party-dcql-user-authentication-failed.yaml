name: FCAF DCQL user authentication failed
runtime:
steps:
  - id: create-presentation
    use: http-request
    with:
      method: POST
      url: ${fixture.verifier_url}/openid4vp/sessions
      expected_status: 201
      headers: { Content-Type: application/json }
      body:
        scheme: haip-vp://
        request_delivery: by_reference
        response_type: vp_token
        response_mode: direct_post.jwt
        presentation_request:
          nonce: fcaf-149-user-authentication-failed
          dcql_query:
            credentials:
              - id: pid-authentication-failed
                format: dc+sd-jwt
                meta: { vct_values: ["urn:eudi:pid:1"] }
                claims:
                  - { path: [given_name] }

  - id: fail-user-authentication
    use: mobile-automation
    with:
      version_id: installed_from_external_source
      parameters:
        deeplink: ${{ create-presentation.outputs.body.deeplink }}
      action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-user-authentication-failed
  - id: fetch-result
    use: http-request
    with:
      method: GET
      url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-presentation.outputs.body.session_id }}
      expected_status: 200

  - id: run-fcaf-validators
    use: fcaf-validation
    with:
      test_ids:
        - WS_RP_MS_ProtocolMessages__149
      suite: wallet_solution/relying_party
      pipeline_outputs:
        pipeline.dcql.user-authentication-failed:
          output:
            dcql_exchange: ${{ fetch-result.outputs.body }}
            visual_evidence: ${{ fail-user-authentication.outputs.flow_output.maestro_screenshot_urls }}
            create-presentation: ${{ create-presentation.outputs }}
            fail-user-authentication: ${{ fail-user-authentication.outputs }}
            fetch-result: ${{ fetch-result.outputs }}
