name: FCAF verifier reuses an encryption JWK
runtime:
  fixture:
    issuer_url: https://beta-capture-wallet.credimi.io
    log_checker: capture-wallet
  global_device_id: forkbomb-bv-andrea/usb/device
  temporal:
    activity_options:
      schedule_to_close_timeout: 50m
      start_to_close_timeout: 50m
      retry_policy:
        maximum_attempts: 1
steps:
- id: create-first-capture-session
  use: http-request
  with:
    method: POST
    url: ${fixture.verifier_url}/openid4vp/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      scheme: haip-vp://
      request_delivery: by_reference
      request_uri_method: post
      response_type: vp_token
      response_mode: direct_post.jwt
      allow_undecryptable_response: true
      client_metadata:
        jwks:
          keys:
          - kty: EC
            crv: P-256
            x: 2HBwD9dMk-T3nLobOnvKGrXW0OJmXhyDZ92Yh_quEdA
            y: SWCeVREJqSFRRXLrjTUIkMDtqn_88DbktyVKJc0ECEk
            use: enc
            kid: fcaf-reused-verifier-enc-key
            alg: ECDH-ES
      presentation_request:
        nonce: response-encryption-reused-jwk-first
        dcql_query:
          credentials:
          - id: pid
            format: dc+sd-jwt
            meta:
              vct_values:
              - urn:eudi:pid:1
            claims:
            - path:
              - given_name
- id: exercise-first-wallet
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-exercise-wallet-generic
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-first-capture-session.outputs.body.deeplink }}
- id: create-second-capture-session
  use: http-request
  with:
    method: POST
    url: ${fixture.verifier_url}/openid4vp/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      scheme: haip-vp://
      request_delivery: by_reference
      request_uri_method: post
      response_type: vp_token
      response_mode: direct_post.jwt
      allow_undecryptable_response: true
      client_metadata:
        jwks:
          keys:
          - kty: EC
            crv: P-256
            x: 2HBwD9dMk-T3nLobOnvKGrXW0OJmXhyDZ92Yh_quEdA
            y: SWCeVREJqSFRRXLrjTUIkMDtqn_88DbktyVKJc0ECEk
            use: enc
            kid: fcaf-reused-verifier-enc-key
            alg: ECDH-ES
      presentation_request:
        nonce: response-encryption-reused-jwk-second
        dcql_query:
          credentials:
          - id: pid
            format: dc+sd-jwt
            meta:
              vct_values:
              - urn:eudi:pid:1
            claims:
            - path:
              - given_name
- id: exercise-second-wallet
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-exercise-wallet-generic
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-second-capture-session.outputs.body.deeplink }}
- id: fetch-first-capture-session
  use: http-request
  with:
    method: GET
    url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-first-capture-session.outputs.body.session_id }}
    expected_status: 200
- id: fetch-second-capture-session
  use: http-request
  with:
    method: GET
    url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-second-capture-session.outputs.body.session_id }}
    expected_status: 200
- id: run-fcaf-validators
  use: fcaf-validation
  with:
    test_ids:
    - WS_RP_SM_SessionEncryption__010
    suite: wallet_solution/relying_party
    pipeline_outputs:
      pipeline.response-encryption.reused-jwk:
        output:
          first_request_object: ${{ fetch-first-capture-session.outputs.body.raw.authorization_request_jwt }}
          second_request_object: ${{ fetch-second-capture-session.outputs.body.raw.authorization_request_jwt }}
          second_capture_session: ${{ fetch-second-capture-session.outputs.body }}
          visual_evidence: ${{ exercise-second-wallet.outputs.flow_output.maestro_screenshot_urls }}
