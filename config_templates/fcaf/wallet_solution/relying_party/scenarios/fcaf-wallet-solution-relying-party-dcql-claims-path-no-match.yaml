name: 'FCAF ProtocolMessages 106: unmatched claim path'
runtime:

# Possession control: MainInteraction 021's "claim_sets includes a claim the
# Wallet does not have" names a credential the Wallet must hold first, so the
# scenario shares that PID in a matching presentation before the probe. 106
# keeps its dcql_exchange/visual_evidence outputs; the possession exchange is
# the test's proof that the no-match probe below did not run on an empty Wallet.
steps:
- id: possession-create-presentation
  use: http-request
  with:
    method: POST
    url: ${fixture.verifier_url}/openid4vp/sessions
    expected_status: 201
    headers: { Content-Type: application/json }
    body:
      scheme: haip-vp://
      request_uri_method: post
      request_delivery: by_reference
      response_type: vp_token
      response_mode: direct_post.jwt
      presentation_request:
        nonce: fcaf-dcql-claims-path-possession
        dcql_query:
          credentials:
          - id: pid
            format: dc+sd-jwt
            meta: { vct_values: ["urn:eudi:pid:1"] }
            claims:
            - path: [given_name]
- id: possession-present
  use: mobile-automation
  with:
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ possession-create-presentation.outputs.body.deeplink }}
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-engagement-haip-vp
- id: possession-fetch
  use: http-request
  with: { method: GET, url: '${fixture.verifier_url}/openid4vp/sessions/${{ possession-create-presentation.outputs.body.session_id }}', expected_status: 200 }
- id: create
  use: http-request
  with:
    method: POST
    url: ${fixture.verifier_url}/openid4vp/sessions
    expected_status: 201
    headers: { Content-Type: application/json }
    body:
      request_uri_method: post
      response_mode: direct_post.jwt
      presentation_request:
        dcql_query:
          credentials:
          - id: pid
            format: dc+sd-jwt
            meta: { vct_values: ["urn:eudi:pid:1"] }
            claims:
            - id: missing_claim
              path: [claim_that_does_not_exist]
            claim_sets: [[missing_claim]]
- id: wallet
  use: mobile-automation
  with:
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create.outputs.body.deeplink }}
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-expect-no-matching-document
- id: session
  use: http-request
  with: { method: GET, url: '${fixture.verifier_url}/openid4vp/sessions/${{ create.outputs.body.session_id }}', expected_status: 200 }
- id: run-fcaf-validators
  use: fcaf-validation
  with:
    test_ids: [WS_RP_MS_ProtocolMessages__106]
    suite: wallet_solution/relying_party
    pipeline_outputs:
      pipeline.dcql.claims-path-no-match:
        output:
          dcql_exchange: ${{ session.outputs.body }}
          visual_evidence: ${{ wallet.outputs.flow_output.maestro_screenshot_urls }}
          possession_exchange: ${{ possession-fetch.outputs.body }}
