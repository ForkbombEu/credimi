name: FCAF DCQL unmatched claim path
runtime:
    fixture:
        verifier_url: https://capture-wallet.credimi.io
    global_runner_id: forkbomb-bv-andrea/usb
steps:
    - id: create-presentation
      use: http-request
      with:
        body:
            dcql_query:
                credentials:
                    - claim_sets:
                        - - missing_claim
                      claims:
                        - id: missing_claim
                          path:
                            - claim_that_does_not_exist
                      format: dc+sd-jwt
                      id: pid
                      meta:
                        vct_values:
                            - urn:eu.europa.ec.eudi:pid:1
            nonce: fcaf-106
            response_type: vp_token
        expected_status: 201
        headers:
            Content-Type: application/json
        method: POST
        url: ${fixture.verifier_url}/openid4vp/sessions
    - id: reject-unmatched-claim-path
      use: mobile-automation
      with:
        action_code: |
            appId: eu.europa.ec.euidi
            ---
            - launchApp:
                stopApp: true
                clearState: false
            - openLink:
                link: ${env.DEEPLINK}
                autoVerify: false
                browser: false
            - waitForAnimationToEnd:
                timeout: 5000
            - takeScreenshot: fcaf-106
        parameters:
            DEEPLINK: ${{ create-presentation.outputs.body.deeplink }}
        version_id: installed_from_external_source
    - id: fetch-result
      use: http-request
      with:
        expected_status: 200
        method: GET
        url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-presentation.outputs.body.session_id }}
    - id: run-fcaf-validators
      use: fcaf-validation
      with:
        pipeline_outputs:
            pipeline.dcql.claims-path-no-match:
                output:
                    create-presentation: ${{ create-presentation.outputs }}
                    dcql_exchange: ${{ fetch-result.outputs.body }}
                    fetch-result: ${{ fetch-result.outputs }}
                    reject-unmatched-claim-path: ${{ reject-unmatched-claim-path.outputs }}
                    visual_evidence: ${{ reject-unmatched-claim-path.outputs.flow_output.maestro_screenshot_urls }}
        suite: wallet_solution/relying_party
        test_ids:
            - WS_RP_MS_ProtocolMessages__106
