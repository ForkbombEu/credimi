name: FCAF DCQL credential format missing
runtime:

steps:
  - id: create
    use: http-request
    with:
      method: POST
      url: ${fixture.verifier_url}/openid4vp/sessions
      expected_status: 201
      headers: { Content-Type: application/json }
      body: { presentation_request: { dcql_query: { credentials: [{ id: pid, meta: { vct_values: ['urn:eudi:pid:1'] } }] } } }
  - id: reject
    use: mobile-automation
    with:
      action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-expect-request-rejected
      version_id: installed_from_external_source
      parameters:
        deeplink: "${{ create.outputs.body.deeplink }}"
  - id: fetch
    use: http-request
    with: { method: GET, url: "${fixture.verifier_url}/openid4vp/sessions/${{ create.outputs.body.session_id }}", expected_status: 200 }
  - id: validate
    use: fcaf-validation
    with:
      test_ids: [WS_RP_MS_ProtocolMessages__068]
      suite: wallet_solution/relying_party
      pipeline_outputs:
        pipeline.dcql.credential-format-missing:
          output:
            dcql_exchange: ${{ fetch.outputs.body }}
            visual_evidence: ${{ reject.outputs.flow_output.maestro_screenshot_urls }}
