name: FCAF credential digest algorithm
runtime:
  fixture:
    issuer_url: https://capture-wallet.credimi.io
    log_checker: capture-wallet
  temporal:
    activity_options:
      schedule_to_close_timeout: 50m
      start_to_close_timeout: 50m
      retry_policy:
        maximum_attempts: 1
steps:
  # The source requires a credential whose digests use a hash function the
  # Credential Issuer Metadata does not advertise. Capture keeps advertising
  # SHA-256 only, so `digest_algorithm` alone creates that precondition.
  # `pid_person_b` makes the credential addressable: no other fixture carries
  # `family_name: Bianchi`, so the query below cannot be satisfied by a
  # SHA-256 credential the wallet happens to hold from an earlier scenario.
  - id: create-sha384-issuance
    use: http-request
    with:
      method: POST
      url: ${fixture.issuer_url}/sessions
      expected_status: 201
      headers:
        Content-Type: application/json
      body:
        issuer_configuration_id: eu-pid-device-bound
        credential_configuration_id: urn:eu.europa.ec.eudi:pid:1.sd-jwt.key-attestation-required
        flow: pre_authorized_code
        fixture_id: pid_person_b
        digest_algorithm: sha-384

  - id: obtain-sha384-credential
    use: mobile-automation
    with:
      action_id: forkbomb-bv-andrea/eudiw-beta-wallet/getcredential-generic-credential-without-authentication
      version_id: installed_from_external_source
      parameters:
        deeplink: ${{ create-sha384-issuance.outputs.body.deeplink }}

  - id: fetch-sha384-issuance
    use: http-request
    with:
      method: GET
      url: ${fixture.issuer_url}/sessions/${{ create-sha384-issuance.outputs.body.session_id }}
      expected_status: 200

  - id: create-sha384-presentation
    use: http-request
    with:
      method: POST
      url: ${fixture.verifier_url}/openid4vp/sessions
      expected_status: 201
      headers:
        Content-Type: application/json
      body:
        scheme: haip-vp://
        request_delivery: by_reference
        request_uri_method: post
        response_type: vp_token
        response_mode: direct_post.jwt
        presentation_request:
          nonce: fcaf-cryptographic-hash-010
          dcql_query:
            credentials:
              - id: pid_sha384
                format: dc+sd-jwt
                meta:
                  vct_values:
                    - urn:eudi:pid:1
                claims:
                  - path:
                      - family_name
                    values:
                      - Bianchi
                  - path:
                      - given_name

  # The wallet is allowed to reach consent and share; the verdict is decided by
  # the digest algorithm of whatever it returns, not by the screen it showed.
  - id: exercise-sha384-presentation
    use: mobile-automation
    with:
      action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-exercise-wallet-generic
      version_id: installed_from_external_source
      parameters:
        deeplink: ${{ create-sha384-presentation.outputs.body.deeplink }}

  - id: fetch-sha384-presentation
    use: http-request
    with:
      method: GET
      url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-sha384-presentation.outputs.body.session_id }}
      expected_status: 200

  # CryptographicHash_007: the Wallet holds the same claim-set fixture digested
  # with SHA-384 and with SHA-256, and the Verifier's generated client metadata
  # names no hash algorithm, so HAIP Section 8 leaves it at SHA-256. Pinning
  # `pid_expiry_2032`'s document_number makes both copies, and only those,
  # candidates for the query.
  - id: create-sha384-selection-issuance
    use: http-request
    with:
      method: POST
      url: ${fixture.issuer_url}/sessions
      expected_status: 201
      headers:
        Content-Type: application/json
      body:
        issuer_configuration_id: eu-pid-device-bound
        credential_configuration_id: urn:eu.europa.ec.eudi:pid:1.sd-jwt.key-attestation-required
        fixture_id: pid_expiry_2032
        digest_algorithm: sha-384

  - id: obtain-sha384-selection-credential
    use: mobile-automation
    with:
      action_id: forkbomb-bv-andrea/eudiw-beta-wallet/getcredential-generic-credential-without-authentication
      version_id: installed_from_external_source
      parameters:
        deeplink: ${{ create-sha384-selection-issuance.outputs.body.deeplink }}

  - id: fetch-sha384-selection-issuance
    use: http-request
    with:
      method: GET
      url: ${fixture.issuer_url}/sessions/${{ create-sha384-selection-issuance.outputs.body.session_id }}
      expected_status: 200

  - id: create-sha256-selection-issuance
    use: http-request
    with:
      method: POST
      url: ${fixture.issuer_url}/sessions
      expected_status: 201
      headers:
        Content-Type: application/json
      body:
        issuer_configuration_id: eu-pid-device-bound
        credential_configuration_id: urn:eu.europa.ec.eudi:pid:1.sd-jwt.key-attestation-required
        fixture_id: pid_expiry_2032
        digest_algorithm: sha-256

  - id: obtain-sha256-selection-credential
    use: mobile-automation
    with:
      action_id: forkbomb-bv-andrea/eudiw-beta-wallet/getcredential-generic-credential-without-authentication
      version_id: installed_from_external_source
      parameters:
        deeplink: ${{ create-sha256-selection-issuance.outputs.body.deeplink }}

  - id: fetch-sha256-selection-issuance
    use: http-request
    with:
      method: GET
      url: ${fixture.issuer_url}/sessions/${{ create-sha256-selection-issuance.outputs.body.session_id }}
      expected_status: 200

  - id: create-sha256-only-presentation
    use: http-request
    with:
      method: POST
      url: ${fixture.verifier_url}/openid4vp/sessions
      expected_status: 201
      headers:
        Content-Type: application/json
      body:
        scheme: haip-vp://
        request_delivery: by_reference
        request_uri_method: post
        response_type: vp_token
        response_mode: direct_post.jwt
        presentation_request:
          nonce: fcaf-cryptographic-hash-007
          dcql_query:
            credentials:
              - id: pid_expiry
                format: dc+sd-jwt
                meta:
                  vct_values:
                    - urn:eudi:pid:1
                claims:
                  - path:
                      - document_number
                    values:
                      - CREDIMI-DEMO-EXPIRY

  - id: exercise-sha256-only-presentation
    use: mobile-automation
    with:
      action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-exercise-wallet-generic
      version_id: installed_from_external_source
      parameters:
        deeplink: ${{ create-sha256-only-presentation.outputs.body.deeplink }}

  - id: fetch-sha256-only-presentation
    use: http-request
    with:
      method: GET
      url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-sha256-only-presentation.outputs.body.session_id }}
      expected_status: 200

  - id: run-fcaf-validators
    use: fcaf-validation
    with:
      test_ids:
        - WS_RP_SH_Cryptography_CryptographicHash_006
        - WS_RP_SH_Cryptography_CryptographicHash_007
        - WS_RP_SH_Cryptography_CryptographicHash_008
        - WS_RP_SH_Cryptography_CryptographicHash_010
      suite: wallet_solution/relying_party
      pipeline_outputs:
        pipeline.cryptography.digest-algorithm:
          output:
            issuance_capture: ${{ fetch-sha384-issuance.outputs.body }}
            presentation_session: ${{ fetch-sha384-presentation.outputs.body }}
            presentation_request_object: ${{ fetch-sha384-presentation.outputs.body.raw.authorization_request_jwt }}
            visual_evidence: ${{ exercise-sha384-presentation.outputs.flow_output.maestro_screenshot_urls }}
            sha384_selection_issuance: ${{ fetch-sha384-selection-issuance.outputs.body }}
            sha256_selection_issuance: ${{ fetch-sha256-selection-issuance.outputs.body }}
            sha256_only_session: ${{ fetch-sha256-only-presentation.outputs.body }}
            sha256_only_request_object: ${{ fetch-sha256-only-presentation.outputs.body.raw.authorization_request_jwt }}
            sha256_only_visual_evidence: ${{ exercise-sha256-only-presentation.outputs.flow_output.maestro_screenshot_urls }}
