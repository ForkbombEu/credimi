# Each case issues one SD-JWT VC PID whose status reference has one malformed
# shape and its own document_number, then probes for that number. Only the
# refused credential could answer the probe, so fcaf-expect-request-rejected
# passes when the Wallet answers with the no-match notice, an error or a return
# Home. A Wallet that kept the credential shows consent and shares it, so the
# Verifier records the presentation the test refutes, and the step fails.
name: FCAF malformed status reference rejection
runtime:
  fixture:
    issuer_url: https://capture-wallet.credimi.io
    log_checker: capture-wallet
  global_device_id: forkbomb-bv-andrea/usb/device
  temporal:
    activity_options:
      schedule_to_close_timeout: 50m
      start_to_close_timeout: 50m
      retry_policy:
        maximum_attempts: 1
steps:
- id: create-status-without-status-list-issuance
  use: http-request
  with:
    method: POST
    url: ${fixture.issuer_url}/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      issuer_configuration_id: eu-pid-device-bound
      credential_configuration_id: urn:eu.europa.ec.eudi:pid:1.sd-jwt.key-attestation-required
      status_list_enabled: true
      status_reference: status_without_status_list
      document_number: CREDIMI-SDJWT-STATUS-WITHOUT-STATUS-LIST
- id: offer-status-without-status-list-credential
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-expect-credential-rejected
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-status-without-status-list-issuance.outputs.body.deeplink }}
  continue_on_error: true
- id: fetch-status-without-status-list-issuance
  use: http-request
  with:
    method: GET
    url: ${fixture.issuer_url}/sessions/${{ create-status-without-status-list-issuance.outputs.body.session_id }}
    expected_status: 200
- id: create-status-without-status-list-probe
  use: http-request
  with:
    method: POST
    url: ${fixture.verifier_url}/openid4vp/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      request_uri_method: post
      response_mode: direct_post.jwt
      presentation_request:
        nonce: status-reference-status-without-status-list
        dcql_query:
          credentials:
          - id: pid
            format: dc+sd-jwt
            meta:
              vct_values:
              - urn:eudi:pid:1
            claims:
            - path:
              - document_number
              values:
              - CREDIMI-SDJWT-STATUS-WITHOUT-STATUS-LIST
- id: probe-status-without-status-list
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-expect-request-rejected
    version_id: installed_from_external_source
