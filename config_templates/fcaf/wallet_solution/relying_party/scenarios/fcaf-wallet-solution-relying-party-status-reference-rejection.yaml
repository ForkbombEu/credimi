name: FCAF malformed status reference rejection
runtime:
  fixture:
    issuer_url: https://beta-capture-wallet.credimi.io
    log_checker: capture-wallet
  global_device_id: forkbomb-bv-andrea/usb/device
  temporal:
    activity_options:
      schedule_to_close_timeout: 50m
      start_to_close_timeout: 50m
      retry_policy:
        maximum_attempts: 1
steps:
- id: create-status-without-status-list-issuance
  use: http-request
  with:
    method: POST
    url: ${fixture.issuer_url}/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      issuer_configuration_id: eu-pid-device-bound
      credential_configuration_id: urn:eu.europa.ec.eudi:pid:1.sd-jwt.key-attestation-required
      status_list_enabled: true
      status_reference: status_without_status_list
      fixture_id: pid_family_name_uppercase
- id: offer-status-without-status-list-credential
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/getcredential-generic-credential-without-authentication
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-status-without-status-list-issuance.outputs.body.deeplink }}
  continue_on_error: true
- id: fetch-status-without-status-list-issuance
  use: http-request
  with:
    method: GET
    url: ${fixture.issuer_url}/sessions/${{ create-status-without-status-list-issuance.outputs.body.session_id }}
    expected_status: 200
- id: create-status-without-status-list-probe
  use: http-request
  with:
    method: POST
    url: ${fixture.verifier_url}/openid4vp/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      request_uri_method: post
      response_mode: direct_post
      presentation_request:
        nonce: status-reference-status-without-status-list
        dcql_query:
          credentials:
          - id: pid
            format: dc+sd-jwt
            multiple: true
            meta:
              vct_values:
              - urn:eudi:pid:1
            claims:
            - path:
              - document_number
              values:
              - CREDIMI-DEMO-CASE
- id: probe-status-without-status-list
  use: mobile-automation
  with:
    version_id: installed_from_external_source
    parameters:
      DEEPLINK: ${{ create-status-without-status-list-probe.outputs.body.deeplink }}
    action_code: |
      appId: eu.europa.ec.euidi
      ---
      - launchApp:
          stopApp: true
          clearState: false
          permissions: { camera: allow, notifications: allow, all: unset }
      - extendedWaitUntil: { visible: "Welcome back|Home|Documents|Add document|Welcome, .*", timeout: 30000 }
      - runFlow:
          when: { visible: "Welcome back" }
          commands:
            - tapOn: { point: "11%,40%" }
            - inputText: "123456"
            - hideKeyboard
            - tapOn: { point: "50%,10%" }
      - extendedWaitUntil: { visible: "Home|Documents|Add document|Welcome, .*", timeout: 30000 }
      - openLink: { link: "${DEEPLINK}", autoVerify: false, browser: false }
      - runFlow:
          when: { visible: "Welcome back" }
          commands:
            - tapOn: { point: "11%,40%" }
            - inputText: "123456"
            - hideKeyboard
            - tapOn: { point: "50%,10%" }
      - extendedWaitUntil: { visible: "The requested document is not available in your EUDI Wallet.*", timeout: 30000 }
      - assertNotVisible: { id: eu.europa.ec.euidi:id/request_screen_requested_document_0 }
      - takeScreenshot: fcaf-metadata-084
- id: fetch-status-without-status-list-probe
  use: http-request
  with:
    method: GET
    url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-status-without-status-list-probe.outputs.body.session_id }}
    expected_status: 200
- id: create-negative-index-issuance
