    - id: run-fcaf-validators
      use: fcaf-validation
      with:
        pipeline_outputs:
            pipeline.dcql.claim-sets:
                output:
                    create-presentation: ${{ improved-main-019-create-presentation.outputs }}
                    dcql_exchange: ${{ improved-main-019-fetch-capture-session.outputs.body }}
                    fetch-capture-session: ${{ improved-main-019-fetch-capture-session.outputs }}
                    present-with-reference-implementation: ${{ improved-main-019-present-with-reference-implementation.outputs }}
