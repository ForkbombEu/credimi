            - runFlow:
                when:
                  visible: "Welcome back"
                commands:
                  - tapOn:
                      point: "11%,39%"
                  - inputText: "123456"
                  - tapOn:
                      point: "50%,10%"
            - extendedWaitUntil:
                visible: "DATA SHARING REQUEST"
