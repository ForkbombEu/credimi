                    dcql_exchange: ${{ improved-main-025-fetch-result.outputs.body }}
                    visual_evidence: ${{ improved-main-025-present-partial-fallback.outputs.flow_output.maestro_screenshot_urls }}
            pipeline.dcql.claim-sets-second-preferred:
                output:
                    dcql_exchange: ${{ improved-main-020-fetch-result.outputs.body }}
                    visual_evidence: ${{ improved-main-020-present-second-preferred-option.outputs.flow_output.maestro_screenshot_urls }}
            pipeline.dcql.claim-sets-without-claims:
                output:
                    dcql_exchange: ${{ improved-main-022-fetch-result.outputs.body }}
                    visual_evidence: ${{ improved-main-022-reject-claim-sets-without-claims.outputs.flow_output.maestro_screenshot_urls }}
            pipeline.dcql.credential-sets-combined-option-no-match:
                output:
                    dcql_exchange: ${{ improved-main-031-fetch-result.outputs.body }}
                    visual_evidence: ${{ improved-main-031-present-combined-option.outputs.flow_output.maestro_screenshot_urls }}
            pipeline.dcql.credential-sets-required-optional:
                output:
                    dcql_exchange: ${{ improved-main-029-fetch-result.outputs.body }}
                    visual_evidence: ${{ improved-main-029-present-required-option.outputs.flow_output.maestro_screenshot_urls }}
            pipeline.dcql.credential-sets-single-available-option:
                output:
                    dcql_exchange: ${{ improved-main-030-fetch-result.outputs.body }}
                    visual_evidence: ${{ improved-main-030-present-available-option.outputs.flow_output.maestro_screenshot_urls }}
            pipeline.dcql.main-interaction:
                output:
                    dcql_exchange: ${{ fetch-capture-session.outputs.body }}
                    visual_evidence: ${{ exercise-wallet.outputs.flow_output.maestro_screenshot_urls }}
