name: FCAF main-interaction
runtime:
    fixture:
        issuer_url: https://capture-wallet.credimi.io
        log_checker: capture-wallet
        verifier_url: https://capture-wallet.credimi.io
    global_runner_id: forkbomb-bv-andrea/usb
    temporal:
        activity_options:
            retry_policy:
                maximum_attempts: 1
            schedule_to_close_timeout: 50m
            start_to_close_timeout: 50m
steps:
    - id: create-capture-session
      use: http-request
      with:
        body:
            presentation_request:
                dcql_query:
                    credentials:
                        - claims:
                            - path:
                                - given_name
                          format: dc+sd-jwt
                          id: pid
                          meta:
                            vct_values:
                                - urn:eudi:pid:1
                nonce: main-interaction
            request_delivery: by_reference
            request_uri_method: post
            response_mode: direct_post
            response_type: vp_token
            scheme: haip-vp://
        expected_status: 201
        headers:
            Content-Type: application/json
        method: POST
        url: https://capture-wallet.credimi.io/openid4vp/sessions
    - id: exercise-wallet
      use: mobile-automation
      with:
        action_code: |-
            appId: eu.europa.ec.euidi
            ---
            - launchApp:
                stopApp: true
                clearState: false
                permissions:
                  camera: allow
                  notifications: allow
                  all: unset
            - extendedWaitUntil:
                visible: "Welcome back|Home|Documents|Add document|Welcome, .*"
                timeout: 30000
            - runFlow:
                when:
                  visible: "Welcome back"
                commands:
                  - tapOn:
                      point: "11%,40%"
                  - inputText: "123456"
                  - hideKeyboard
                  - tapOn:
                      point: "50%,10%"
            - extendedWaitUntil:
                visible: "Home|Documents|Add document|Welcome, .*"
                timeout: 30000
            - openLink:
                link: "${DEEPLINK}"
                autoVerify: false
                browser: false
            - runFlow:
                when:
                  visible: "EUDI Wallet"
                commands:
                  - tapOn:
                      text: "EUDI Wallet"
                      optional: true
            - runFlow:
                when:
                  visible: "Just once"
                commands:
                  - tapOn:
                      text: "Just once"
                      optional: true
            - runFlow:
                when:
                  visible: "Always"
                commands:
                  - tapOn:
                      text: "Always"
                      optional: true
            - extendedWaitUntil:
                visible: "Welcome back|Error|invalid request|Something went wrong|DATA SHARING REQUEST"
                timeout: 100000
            - runFlow:
                when:
                  visible: "DATA SHARING REQUEST"
                commands:
                  - tapOn: "Share"
                  - extendedWaitUntil:
                      visible: "PIN"
                      timeout: 30000
                  - tapOn:
                      point: "11%,39%"
                  - inputText: "123456"
                  - tapOn:
                      point: "50%,10%"
                  - extendedWaitUntil:
                      visible: ".*successfully shared.*|Welcome back"
                      timeout: 30000
            - runFlow:
                when:
                  visible: "Welcome back"
                commands:
                  - tapOn:
                      point: "11%,40%"
                  - inputText: "123456"
            - extendedWaitUntil:
                visible: "Error|invalid request|Something went wrong|Home|Documents"
                timeout: 30000
            - takeScreenshot: main-interaction
            - back
        parameters:
            DEEPLINK: ${{ create-capture-session.outputs.body.deeplink }}
        version_id: installed_from_external_source
    - id: fetch-capture-session
      use: http-request
      with:
        expected_status: 200
        method: GET
        url: https://capture-wallet.credimi.io/openid4vp/sessions/${{ create-capture-session.outputs.body.session_id }}
    - id: improved-main-019-create-presentation
      use: http-request
      with:
        body:
            dcql_query:
                credentials:
                    - claim_sets:
                        - - identity_name
                        - - identity_family_name
                        - - postal_code
                      claims:
                        - id: identity_name
                          path:
                            - given_name
                        - id: identity_family_name
                          path:
                            - family_name
                        - id: postal_code
                          path:
                            - resident_postal_code
                      format: dc+sd-jwt
                      id: pid
                      meta:
                        vct_values:
                            - urn:eu.europa.ec.eudi:pid:1
            nonce: fcaf-dcql-claim-sets
            response_type: vp_token
        expected_status: 201
        headers:
            Content-Type: application/json
        method: POST
        url: ${fixture.verifier_url}/openid4vp/sessions
    - id: improved-main-019-present-with-reference-implementation
      use: mobile-automation
      with:
        action_code: |
            appId: eu.europa.ec.euidi
            ---
            - launchApp:
                stopApp: false
                clearState: false
                permissions:
                  camera: allow
                  notifications: allow
                  all: unset
            - openLink:
                link: ${env.DEEPLINK}
                autoVerify: false
                browser: false
            - waitForAnimationToEnd:
                timeout: 5000
            - tapOn:
                text: "(?i)(continue|accept|authorize|share|present)"
                optional: true
            - waitForAnimationToEnd:
                timeout: 5000
            - tapOn:
                text: "(?i)(continue|accept|authorize|share|present)"
                optional: true
            - waitForAnimationToEnd:
                timeout: 5000
            - takeScreenshot: fcaf-dcql-claim-sets
        parameters:
            DEEPLINK: ${{ improved-main-019-create-presentation.outputs.body.deeplink }}
        version_id: installed_from_external_source
    - id: improved-main-019-fetch-capture-session
      use: http-request
      with:
        expected_status: 200
        method: GET
        url: ${fixture.verifier_url}/openid4vp/sessions/${{ improved-main-019-create-presentation.outputs.body.session_id }}
    - id: improved-main-020-create-presentation
      use: http-request
      with:
        body:
            dcql_query:
                credentials:
                    - claim_sets:
                        - - unavailable
                        - - second
                        - - third
                      claims:
                        - id: unavailable
                          path:
                            - claim_that_does_not_exist
                        - id: second
                          path:
                            - given_name
                        - id: third
                          path:
                            - family_name
                      format: dc+sd-jwt
                      id: pid
                      meta:
                        vct_values:
                            - urn:eu.europa.ec.eudi:pid:1
            nonce: fcaf-ia-020
            response_type: vp_token
