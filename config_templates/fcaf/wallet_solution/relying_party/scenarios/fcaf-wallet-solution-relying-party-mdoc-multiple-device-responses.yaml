# Three mdoc PIDs on distinct claim-set fixtures, requested by three mso_mdoc
# queries that each pin one fixture's document_number. The pin is what lets the
# validator tell the three DeviceResponses apart.
name: FCAF three mdoc PIDs in separate DeviceResponses
runtime:
  fixture:
    issuer_url: https://beta-capture-wallet.credimi.io
    log_checker: capture-wallet
  global_device_id: forkbomb-bv-andrea/usb/device
  temporal:
    activity_options:
      schedule_to_close_timeout: 50m
      start_to_close_timeout: 50m
      retry_policy:
        maximum_attempts: 1
steps:
- id: create-baseline-mdoc-issuance
  use: http-request
  with:
    method: POST
    url: ${fixture.issuer_url}/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      issuer_configuration_id: eu-pid-device-bound
      credential_configuration_id: urn:eu.europa.ec.eudi:pid:1.mdoc.key-attestation-required
      fixture_id: pid_default
- id: obtain-baseline-mdoc
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/getcredential-generic-credential-without-authentication
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-baseline-mdoc-issuance.outputs.body.deeplink }}
- id: create-second-identity-mdoc-issuance
  use: http-request
  with:
    method: POST
    url: ${fixture.issuer_url}/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      issuer_configuration_id: eu-pid-device-bound
      credential_configuration_id: urn:eu.europa.ec.eudi:pid:1.mdoc.key-attestation-required
      fixture_id: pid_person_b
- id: obtain-second-identity-mdoc
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/getcredential-generic-credential-without-authentication
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-second-identity-mdoc-issuance.outputs.body.deeplink }}
- id: create-under-18-mdoc-issuance
  use: http-request
  with:
    method: POST
    url: ${fixture.issuer_url}/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      issuer_configuration_id: eu-pid-device-bound
      credential_configuration_id: urn:eu.europa.ec.eudi:pid:1.mdoc.key-attestation-required
      fixture_id: pid_under_18
- id: obtain-under-18-mdoc
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/getcredential-generic-credential-without-authentication
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-under-18-mdoc-issuance.outputs.body.deeplink }}
- id: create-three-mdoc-request
  use: http-request
  with:
    method: POST
    url: ${fixture.verifier_url}/openid4vp/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      request_uri_method: post
      request_delivery: by_reference
      response_type: vp_token
      response_mode: direct_post.jwt
      presentation_request:
        nonce: fcaf-three-mdoc-device-responses
        dcql_query:
          credentials:
          - id: pid_baseline
            format: mso_mdoc
            meta:
              doctype_value: eu.europa.ec.eudi.pid.1
            claims:
            - path:
              - eu.europa.ec.eudi.pid.1
              - document_number
              values:
              - CREDIMI-DEMO-001
          - id: pid_second_identity
            format: mso_mdoc
            meta:
              doctype_value: eu.europa.ec.eudi.pid.1
            claims:
            - path:
              - eu.europa.ec.eudi.pid.1
              - document_number
              values:
              - CREDIMI-DEMO-002
          - id: pid_under_18
            format: mso_mdoc
            meta:
              doctype_value: eu.europa.ec.eudi.pid.1
            claims:
            - path:
              - eu.europa.ec.eudi.pid.1
              - document_number
              values:
              - CREDIMI-DEMO-U18
- id: present-three-mdocs
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-exercise-wallet-generic
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-three-mdoc-request.outputs.body.deeplink }}
- id: fetch-three-mdoc-request
  use: http-request
  with:
    method: GET
    url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-three-mdoc-request.outputs.body.session_id }}
    expected_status: 200
- id: run-fcaf-validators
  use: fcaf-validation
  with:
    test_ids:
    - WS_RP_MS_CredentialFormats__041
    suite: wallet_solution/relying_party
    pipeline_outputs:
      pipeline.fixtures.mdoc-multiple-device-responses:
        output:
          dcql_exchange: ${{ fetch-three-mdoc-request.outputs.body }}
          visual_evidence: ${{ present-three-mdocs.outputs.flow_output.maestro_screenshot_urls }}
