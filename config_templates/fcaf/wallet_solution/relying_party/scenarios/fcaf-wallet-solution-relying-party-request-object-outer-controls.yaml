name: FCAF Request Object outer parameter controls
runtime:
  fixture:
    issuer_url: https://beta-capture-wallet.credimi.io
  global_device_id: forkbomb-bv-andrea/usb/device
steps:
- id: create-conflicting-nonce
  use: http-request
  with:
    method: POST
    url: ${fixture.verifier_url}/openid4vp/sessions
    expected_status: 201
    headers: { Content-Type: application/json }
    body:
      request_delivery: by_reference
      request_uri_method: post
      response_type: vp_token
      response_mode: direct_post
      presentation_request:
        nonce: request-object-nonce
        dcql_query:
          credentials: [{ id: pid, format: dc+sd-jwt, meta: { vct_values: ["urn:eudi:pid:1"] }, claims: [{ path: [given_name] }] }]
      request_mutation:
        outer_request:
          set: { /nonce: outer-nonce }
        verification_applies: false
- id: exercise-conflicting-nonce
  use: mobile-automation
  with:
    version_id: installed_from_external_source
    parameters: { deeplink: "${{ create-conflicting-nonce.outputs.body.deeplink }}" }
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-exercise-wallet-generic
- id: fetch-conflicting-nonce
  use: http-request
  with: { method: GET, url: "${fixture.verifier_url}/openid4vp/sessions/${{ create-conflicting-nonce.outputs.body.session_id }}", expected_status: 200 }
- id: create-conflicting-client-id
  use: http-request
  with:
    method: POST
    url: ${fixture.verifier_url}/openid4vp/sessions
    expected_status: 201
    headers: { Content-Type: application/json }
    body:
      request_delivery: by_reference
      request_uri_method: post
      response_type: vp_token
      response_mode: direct_post
      presentation_request:
        nonce: conflicting-client-id
        dcql_query:
          credentials: [{ id: pid, format: dc+sd-jwt, meta: { vct_values: ["urn:eudi:pid:1"] }, claims: [{ path: [given_name] }] }]
      request_mutation:
        request_object:
          set: { /client_id: request-object-client }
        outer_request:
          set: { /client_id: outer-client }
        verification_applies: false
- id: reject-conflicting-client-id
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-expect-request-rejected
    version_id: installed_from_external_source
    parameters:
      deeplink: "${{ create-conflicting-client-id.outputs.body.deeplink }}"
- id: fetch-conflicting-client-id
  use: http-request
  with: { method: GET, url: "${fixture.verifier_url}/openid4vp/sessions/${{ create-conflicting-client-id.outputs.body.session_id }}", expected_status: 200 }
- id: run-fcaf-validators
  use: fcaf-validation
  with:
    test_ids: [WS_RP_MS_ProtocolMessages__049, WS_RP_MS_ProtocolMessages__051]
    suite: wallet_solution/relying_party
    pipeline_outputs:
      pipeline.protocol.request-object-outer-controls:
        output:
          conflicting_nonce_session: ${{ fetch-conflicting-nonce.outputs.body }}
          conflicting_nonce_request_object: ${{ fetch-conflicting-nonce.outputs.body.raw.authorization_request_jwt }}
          conflicting_nonce_outer_request: ${{ fetch-conflicting-nonce.outputs.body.raw.outer_request_delivered }}
          conflicting_nonce_visual_evidence: ${{ exercise-conflicting-nonce.outputs.flow_output.maestro_screenshot_urls }}
          conflicting_client_id_session: ${{ fetch-conflicting-client-id.outputs.body }}
          conflicting_client_id_request_object: ${{ fetch-conflicting-client-id.outputs.body.raw.authorization_request_jwt }}
          conflicting_client_id_outer_request: ${{ fetch-conflicting-client-id.outputs.body.raw.outer_request_delivered }}
          conflicting_client_id_visual_evidence: ${{ reject-conflicting-client-id.outputs.flow_output.maestro_screenshot_urls }}
