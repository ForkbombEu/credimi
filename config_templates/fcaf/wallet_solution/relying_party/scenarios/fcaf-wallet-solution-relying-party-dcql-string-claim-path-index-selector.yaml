name: 'FCAF TextualEncoding 010: string claim path index selector'
runtime:

steps:
- id: create
  use: http-request
  with:
    method: POST
    url: ${fixture.verifier_url}/openid4vp/sessions
    expected_status: 201
    headers: { Content-Type: application/json }
    body:
      request_uri_method: post
      response_mode: direct_post
      presentation_request:
        dcql_query:
          credentials:
          - id: pid
            format: dc+sd-jwt
            meta: { vct_values: ["urn:eudi:pid:1"] }
            claims:
            - id: index_selector_on_string
              path: [address, street_address, 0]
            claim_sets: [[index_selector_on_string]]
- id: wallet
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-exercise-wallet-generic
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create.outputs.body.deeplink }}
- id: session
  use: http-request
  with: { method: GET, url: '${fixture.verifier_url}/openid4vp/sessions/${{ create.outputs.body.session_id }}', expected_status: 200 }
- id: run-fcaf-validators
  use: fcaf-validation
  with:
    test_ids: [WS_RP_SH_Encoding_TextualEncoding_010]
    suite: wallet_solution/relying_party
    pipeline_outputs:
      pipeline.dcql.string-claim-path-index-selector:
        output:
          dcql_exchange: ${{ session.outputs.body }}
          visual_evidence: ${{ wallet.outputs.flow_output.maestro_screenshot_urls }}
