name: 'FCAF ProtocolMessages 025: transaction_data type non-string'
runtime:

steps:
- id: create
  use: http-request
  with:
    method: POST
    url: ${fixture.verifier_url}/openid4vp/sessions
    expected_status: 201
    headers: { Content-Type: application/json }
    body:
      response_mode: direct_post.jwt
      presentation_request:
        nonce: fcaf-025
        dcql_query:
          credentials: [{ id: pid, format: dc+sd-jwt, meta: { vct_values: ["urn:eudi:pid:1"] }, claims: [{ path: [given_name] }] }]
        transaction_data: [{ type: 1, data: dGVzdA==, credential_ids: [pid] }]
- id: wallet
  use: mobile-automation
  with:
    version_id: installed_from_external_source
    parameters: { DEEPLINK: '${{ create.outputs.body.deeplink }}' }
    action_code: |
      appId: eu.europa.ec.euidi
      ---
      - openLink: { link: "${DEEPLINK}", autoVerify: false, browser: false }
      - extendedWaitUntil: { visible: "Error|invalid request|Oups! Something went wrong|Home|Documents", timeout: 100000 }
      - takeScreenshot: protocol-messages-025
- id: session
  use: http-request
  with: { method: GET, url: '${fixture.verifier_url}/openid4vp/sessions/${{ create.outputs.body.session_id }}', expected_status: 200 }
- id: request
  use: http-request
  with: { method: GET, url: '${fixture.verifier_url}/openid4vp/sessions/${{ create.outputs.body.session_id }}/request', expected_status: 200 }
- id: run-fcaf-validators
  use: fcaf-validation
  with:
    test_ids: [WS_RP_MS_ProtocolMessages__025]
    suite: wallet_solution/relying_party
    pipeline_outputs:
      pipeline.dcql.transaction-data-type-non-string:
        output:
          request_object: ${{ request.outputs.body }}
          dcql_exchange: ${{ session.outputs.body }}
          visual_evidence: ${{ wallet.outputs.flow_output.maestro_screenshot_urls }}
