name: FCAF direct-post.jwt response transport
runtime:
  fixture:
    issuer_url: https://beta-capture-wallet.credimi.io
    log_checker: capture-wallet
  global_device_id: forkbomb-bv-andrea/usb/device
  temporal:
    activity_options:
      schedule_to_close_timeout: 50m
      start_to_close_timeout: 50m
      retry_policy:
        maximum_attempts: 1
steps:
- id: create-capture-session
  use: http-request
  with:
    method: POST
    url: ${fixture.verifier_url}/openid4vp/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      scheme: haip-vp://
      request_delivery: by_reference
      request_uri_method: post
      response_type: vp_token
      response_mode: direct_post.jwt
      presentation_request:
        nonce: direct-post-jwt-response-transport
        dcql_query:
          credentials:
          - id: pid
            format: dc+sd-jwt
            meta:
              vct_values:
              - urn:eudi:pid:1
            claims:
            - path:
              - given_name
- id: exercise-wallet
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-exercise-wallet-generic
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-capture-session.outputs.body.deeplink }}
- id: fetch-capture-session
  use: http-request
  with:
    method: GET
    url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-capture-session.outputs.body.session_id }}
    expected_status: 200
- id: run-fcaf-validators
  use: fcaf-validation
  with:
    test_ids:
    - WS_RP_MS_ProtocolMessages__129
    - WS_RP_MS_ProtocolMessages__131
    - WS_RP_MS_ProtocolMessages__133
    - WS_RP_MS_ProtocolMessages__134
    - WS_RP_IA_MainInteraction__049
    - WS_RP_IA_MainInteraction__052
    - WS_RP_IA_MainInteraction__054
    - WS_RP_SM_SessionEncryption__012
    - WS_RP_SM_SessionEncryption__007
    - WS_RP_SM_SessionEncryption__008
    - WS_RP_SM_SessionEncryption__009
    - WS_RP_SH_Encoding_TextualEncoding_022
    suite: wallet_solution/relying_party
    pipeline_outputs:
      pipeline.direct-post-jwt.response-transport:
        output:
          capture_session: ${{ fetch-capture-session.outputs.body }}
          default_encryption_evidence:
            request_object: ${{ fetch-capture-session.outputs.body.raw.authorization_request_jwt }}
            presentation_response_http: ${{ fetch-capture-session.outputs.body.raw.presentation_response_http }}
          visual_evidence: ${{ exercise-wallet.outputs.flow_output.maestro_screenshot_urls }}
