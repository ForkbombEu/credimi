    suite: wallet_solution/relying_party
    pipeline_outputs:
      pipeline.dcql.claim-sets-non-array:
        output:
          dcql_exchange: ${{ fetch-null.outputs.body.raw.authorization_request_delivered }}
          visual_evidence: ${{ exercise-non-array-claim-sets.outputs.flow_output.maestro_screenshot_urls }}
          exercise-non-array-claim-sets: ${{ exercise-non-array-claim-sets.outputs }}
          dcql_exchange_session: ${{ fetch-null.outputs.body }}
