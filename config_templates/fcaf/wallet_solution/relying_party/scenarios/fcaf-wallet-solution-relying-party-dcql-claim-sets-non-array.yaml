- id: exercise-non-array-claim-sets
  use: mobile-automation
  with:
    version_id: installed_from_external_source
    action_code: |
      appId: eu.europa.ec.euidi
      ---
      - launchApp:
          stopApp: true
          clearState: false
      - extendedWaitUntil:
          visible: "Welcome back|Home|Documents|Welcome, .*"
          timeout: 30000
      - runFlow:
          when:
            visible: "Welcome back"
          commands:
          - tapOn:
              point: "11%,40%"
          - inputText: "123456"
          - hideKeyboard
          - tapOn:
              point: "50%,10%"
      - extendedWaitUntil:
          visible: "Home|Documents|Welcome, .*"
          timeout: 30000
      - openLink: { link: "${DEEPLINK_NULL}", autoVerify: false, browser: false }
      - waitForAnimationToEnd:
          timeout: 5000
      - runFlow:
          when:
            visible: "Welcome back"
          commands:
          - tapOn:
              point: "11%,40%"
          - inputText: "123456"
          - hideKeyboard
          - tapOn:
              point: "50%,10%"
      - extendedWaitUntil: { visible: "Oups! Something went wrong|The requested document is not available in your EUDI Wallet.*|Data sharing request|Home|Documents|Welcome, .*", timeout: 30000 }
      - takeScreenshot: fcaf-086-null
      - runFlow:
          when:
            visible: "Requested data"
          commands:
          - tapOn: "Share"
          - runFlow:
              when:
                visible: "PIN"
              commands:
              - tapOn:
                  point: "11%,39%"
              - inputText: "123456"
              - hideKeyboard
              - tapOn:
                  point: "50%,10%"
          - extendedWaitUntil:
              visible: ".*successfully shared.*|Oups! Something went wrong"
              timeout: 60000
          - takeScreenshot: fcaf-086-null-presented
          - tapOn:
              text: "Close|TRY AGAIN"
              optional: true
      - runFlow:
          when:
            visible: "Data sharing request"
          commands:
          - tapOn: "Cancel"
          - waitForAnimationToEnd:
              timeout: 3000
