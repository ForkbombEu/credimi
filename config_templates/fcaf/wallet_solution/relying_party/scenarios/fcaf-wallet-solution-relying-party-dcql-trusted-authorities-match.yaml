name: FCAF wallet relying-party DCQL trusted authorities match
runtime:
  temporal:
    activity_options:
      schedule_to_close_timeout: 50m
      start_to_close_timeout: 50m
      retry_policy:
        maximum_attempts: 1

steps:
  - id: create-presentation
    use: http-request
    with:
      method: POST
      url: ${fixture.verifier_url}/openid4vp/sessions
      expected_status: 201
      headers:
        Content-Type: application/json
      body:
        scheme: haip-vp://
        request_delivery: by_reference
        response_type: vp_token
        response_mode: direct_post
        presentation_request:
          nonce: fcaf-dcql-trusted-authorities-match
          dcql_query:
            credentials:
              - id: pid_identity
                format: dc+sd-jwt
                meta:
                  vct_values:
                    - urn:eudi:pid:1
                claims:
                  - path:
                      - given_name
                  - path:
                      - family_name
                trusted_authorities:
                  - type: aki
                    values:
                      # AuthorityKeyId from the public EUDIW PID issuer certificate.
                      - QlBQvhC4EPCdRFyNv6sQCO4n3Ek

  - id: present-with-reference-implementation
    use: mobile-automation
    with:
      version_id: installed_from_external_source
      parameters:
        DEEPLINK: ${{ create-presentation.outputs.body.deeplink }}
      action_code: |
        appId: eu.europa.ec.euidi
        ---
                - launchApp:
            stopApp: true
            clearState: false
            permissions:
              camera: allow
              notifications: allow
              all: unset
        - extendedWaitUntil:
            visible: "Welcome back|Home|Documents|Add document|Welcome, .*"
            timeout: 30000
        - runFlow:
            when:
              visible: "Welcome back"
            commands:
              - tapOn:
                  point: "11%,40%"
              - inputText: "123456"
              - hideKeyboard
              - tapOn: { point: "50%,10%" }
        - extendedWaitUntil:
            visible: "Home|Documents|Add document|Welcome, .*"
            timeout: 30000
                - openLink: { link: ${env.DEEPLINK}, autoVerify: false, browser: false }
        - runFlow:
            when:
              visible: "EUDI Wallet"
            commands:
              - tapOn: { text: "EUDI Wallet", optional: true }
        - runFlow:
            when:
              visible: "Just once"
            commands:
              - tapOn: { text: "Just once", optional: true }
        - runFlow:
            when:
              visible: "Always"
            commands:
              - tapOn: { text: "Always", optional: true }
        - extendedWaitUntil: { visible: "Welcome back|Share", timeout: 100000 }
        - runFlow:
            when: { visible: "Welcome back" }
            commands:
              - tapOn: { point: "11%,40%" }
              - inputText: "123456"
              - tapOn: { point: "50%,10%" }
        - extendedWaitUntil: { visible: "Share", timeout: 30000 }
        - tapOn: "Share"
        - extendedWaitUntil:
            visible: "Welcome back|To approve the transaction you need to verify your identity."
            timeout: 100000
        - tapOn: { point: "11%,40%" }
        - inputText: "123456"
        - tapOn: { point: "50%,10%" }
        - assertNotVisible: { text: "Oups! Something went wrong" }
        - extendedWaitUntil: { visible: "Close", timeout: 30000 }
        - takeScreenshot: fcaf-dcql-trusted-authorities-match
        - tapOn: "Close"

  - id: fetch-capture-session
    use: http-request
    with:
      method: GET
      url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-presentation.outputs.body.session_id }}
      expected_status: 200

  - id: run-fcaf-validators
    use: fcaf-validation
    with:
      test_ids:
        - WS_RP_IA_MainInteraction__003
      suite: wallet_solution/relying_party
      pipeline_outputs:
        pipeline.dcql.trusted-authorities-match:
          output:
            dcql_exchange: ${{ fetch-capture-session.outputs.body }}
            visual_evidence: ${{ present-with-reference-implementation.outputs.flow_output.maestro_screenshot_urls }}
            create-presentation: ${{ create-presentation.outputs }}
            present-with-reference-implementation: ${{ present-with-reference-implementation.outputs }}
            fetch-capture-session: ${{ fetch-capture-session.outputs }}
