name: FCAF DCQL union across multiple queries
runtime:
steps:
  - id: create-presentation
    use: http-request
    with:
      method: POST
      url: ${fixture.verifier_url}/openid4vp/sessions
      expected_status: 201
      headers: { Content-Type: application/json }
      body:
        scheme: haip-vp://
        request_delivery: by_reference
        response_type: vp_token
        response_mode: direct_post.jwt
        presentation_request:
          nonce: fcaf-014-claims-union
          dcql_query:
            credentials:
              - { id: pid-name, format: dc+sd-jwt, meta: { vct_values: ["urn:eudi:pid:1"] }, claims: [{ path: [given_name] }] }
              - { id: pid-address, format: dc+sd-jwt, meta: { vct_values: ["urn:eudi:pid:1"] }, claims: [{ path: [address] }] }
  - id: present-union
    use: mobile-automation
    with:
      version_id: installed_from_external_source
      parameters: { deeplink: "${{ create-presentation.outputs.body.deeplink }}" }
      action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-present-claims-union
  - id: fetch-result
    use: http-request
    with: { method: GET, url: "${fixture.verifier_url}/openid4vp/sessions/${{ create-presentation.outputs.body.session_id }}", expected_status: 200 }

  - id: run-fcaf-validators
    use: fcaf-validation
    with:
      test_ids:
        - WS_RP_IA_MainInteraction__014
      suite: wallet_solution/relying_party
      pipeline_outputs:
        pipeline.dcql.claims-union:
          output:
            dcql_exchange: ${{ fetch-result.outputs.body }}
            visual_evidence: ${{ present-union.outputs.flow_output.maestro_screenshot_urls }}
            create-presentation: ${{ create-presentation.outputs }}
            present-union: ${{ present-union.outputs }}
            fetch-result: ${{ fetch-result.outputs }}
