name: FCAF wallet relying-party DCQL meta VCT mismatch
runtime:
  temporal:
    activity_options:
      schedule_to_close_timeout: 50m
      start_to_close_timeout: 50m
      retry_policy:
        maximum_attempts: 1

steps:
  - id: create-presentation
    use: http-request
    with:
      method: POST
      url: ${fixture.verifier_url}/openid4vp/sessions
      expected_status: 201
      headers:
        Content-Type: application/json
      body:
        scheme: haip-vp://
        request_delivery: by_reference
        response_type: vp_token
        response_mode: direct_post.jwt
        presentation_request:
          nonce: fcaf-dcql-meta-vct-mismatch
          dcql_query:
            credentials:
              - id: pididentity01
                format: dc+sd-jwt
                meta:
                  vct_values:
                    - urn:credimi:fcaf:not-the-wallet-pid
                claims:
                  - path:
                      - given_name
                  - path:
                      - family_name

  - id: present-with-reference-implementation
    use: mobile-automation
    with:
      version_id: installed_from_external_source
      parameters:
        DEEPLINK: ${{ create-presentation.outputs.body.deeplink }}
      action_code: |
        appId: eu.europa.ec.euidi
        ---
        - launchApp:
            stopApp: false
            clearState: false
            permissions:
              camera: allow
              notifications: allow
              all: unset
        - openLink: { link: "${DEEPLINK}", autoVerify: false, browser: false }
        - waitForAnimationToEnd:
            timeout: 5000
        - takeScreenshot: fcaf-dcql-meta-vct-mismatch
        - tapOn:
            text: "(?i)(cancel|reject|close)"
            optional: true
        - waitForAnimationToEnd:
            timeout: 5000
  - id: get-presentation-result
    use: http-request
    with:
      method: GET
      url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-presentation.outputs.body.session_id }}
      expected_status: 200

  - id: run-fcaf-validators
    use: fcaf-validation
    with:
      test_ids:
        - WS_RP_MS_ProtocolMessages__073
      suite: wallet_solution/relying_party
      pipeline_outputs:
        pipeline.dcql.meta-vct-mismatch:
          output:
            dcql_exchange: ${{ get-presentation-result.outputs.body }}
            visual_evidence: ${{ present-with-reference-implementation.outputs.flow_output.maestro_screenshot_urls }}
            create-presentation: ${{ create-presentation.outputs }}
            present-with-reference-implementation: ${{ present-with-reference-implementation.outputs }}
            get-presentation-result: ${{ get-presentation-result.outputs }}
