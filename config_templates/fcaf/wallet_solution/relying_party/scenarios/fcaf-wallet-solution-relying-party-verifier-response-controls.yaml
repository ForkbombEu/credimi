name: FCAF verifier response controls
runtime:
  fixture:
    issuer_url: https://capture-wallet.credimi.io
  global_device_id: forkbomb-bv-andrea/usb/device
  temporal:
    activity_options:
      schedule_to_close_timeout: 50m
      start_to_close_timeout: 50m
      retry_policy: { maximum_attempts: 1 }
steps:
- id: create-non-json-response
  use: http-request
  with:
    method: POST
    url: ${fixture.verifier_url}/openid4vp/sessions
    expected_status: 201
    headers: { Content-Type: application/json }
    body:
      request_delivery: by_reference
      response_type: vp_token
      response_mode: direct_post.jwt
      presentation_request:
        nonce: verifier-response-non-json
        dcql_query:
          credentials:
          - id: pid
            format: dc+sd-jwt
            meta: { vct_values: ["urn:eudi:pid:1"] }
            claims: [{ path: [given_name] }]
      response_scenario:
        status: 200
        content_type: text/plain
        body: fcaf plain text response
# 125: the verifier answers the Authorization Response with HTTP 200 and a
# non-JSON body. The Wallet has already submitted its response by then, so no
# protocol channel carries its error back and the terminal screen is the only
# evidence. The screenshot is taken only while the error screen is up, so a
# Wallet that stays on its success screen stores no `non-json-wallet-error`
# file and fails the named-screenshot assertion instead of passing on any
# screenshot.
- id: exercise-non-json-response
  use: mobile-automation
  with:
    version_id: installed_from_external_source
    parameters: { DEEPLINK: "${{ create-non-json-response.outputs.body.deeplink }}" }
    action_code: |
      appId: eu.europa.ec.euidi
      ---
      - launchApp:
          stopApp: true
          clearState: false
          permissions:
            camera: allow
            notifications: allow
      - extendedWaitUntil:
          visible: "Welcome back"
          timeout: 30000
      - waitForAnimationToEnd:
          timeout: 3000
      - runFlow:
          when:
            visible: "Welcome back"
          commands:
            - inputText: "12345"
            - tapOn: "6"
      - waitForAnimationToEnd:
          timeout: 3000
      - openLink:
          link: "${DEEPLINK}"
          autoVerify: false
          browser: false
      - waitForAnimationToEnd:
          timeout: 3000
      - runFlow:
          when:
            visible: "Requested data"
          commands:
            - tapOn: "Share"
            - waitForAnimationToEnd:
                timeout: 3000
            - inputText: "12345"
            - tapOn: "6"
      - extendedWaitUntil:
          visible: "Oups! Something went wrong|invalid request|Verifier rejected the response|Presentation blocked"
          timeout: 60000
          optional: true
      - runFlow:
          when:
            visible: "Oups! Something went wrong|invalid request|Verifier rejected the response|Presentation blocked"
          commands:
            - takeScreenshot: "non-json-wallet-error"
      - waitForAnimationToEnd:
          timeout: 3000
      - takeScreenshot: "exercise-wallet"
- id: fetch-non-json-response
  use: http-request
  with:
    method: GET
    url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-non-json-response.outputs.body.session_id }}
    expected_status: 200
- id: create-http-error-response
  use: http-request
  with:
    method: POST
    url: ${fixture.verifier_url}/openid4vp/sessions
    expected_status: 201
    headers: { Content-Type: application/json }
    body:
      request_delivery: by_reference
      response_type: vp_token
      response_mode: direct_post.jwt
      presentation_request:
        nonce: verifier-response-http-error
        dcql_query:
          credentials:
          - id: pid
            format: dc+sd-jwt
            meta: { vct_values: ["urn:eudi:pid:1"] }
            claims: [{ path: [given_name] }]
      response_scenario:
        status: 400
        content_type: application/json
        body: '{"error":"invalid_request","error_description":"fcaf verifier response control"}'
# 126: the verifier answers the Authorization Response with HTTP 400 and a JSON
# error body. As for 125, the terminal screen is the only evidence of the
# Wallet's handling and the screenshot is stored only while the error screen is
# up.
- id: exercise-http-error-response
  use: mobile-automation
  with:
    version_id: installed_from_external_source
    parameters: { DEEPLINK: "${{ create-http-error-response.outputs.body.deeplink }}" }
    action_code: |
      appId: eu.europa.ec.euidi
      ---
      - launchApp:
          stopApp: true
          clearState: false
          permissions:
            camera: allow
            notifications: allow
      - extendedWaitUntil:
          visible: "Welcome back"
          timeout: 30000
      - waitForAnimationToEnd:
          timeout: 3000
      - runFlow:
          when:
            visible: "Welcome back"
          commands:
            - inputText: "12345"
            - tapOn: "6"
      - waitForAnimationToEnd:
          timeout: 3000
      - openLink:
          link: "${DEEPLINK}"
          autoVerify: false
          browser: false
      - waitForAnimationToEnd:
          timeout: 3000
      - runFlow:
          when:
            visible: "Requested data"
          commands:
            - tapOn: "Share"
            - waitForAnimationToEnd:
                timeout: 3000
            - inputText: "12345"
            - tapOn: "6"
      - extendedWaitUntil:
          visible: "Oups! Something went wrong|invalid request|Verifier rejected the response|Presentation blocked"
          timeout: 60000
          optional: true
      - runFlow:
          when:
            visible: "Oups! Something went wrong|invalid request|Verifier rejected the response|Presentation blocked"
          commands:
            - takeScreenshot: "http-error-wallet-error"
      - waitForAnimationToEnd:
          timeout: 3000
      - takeScreenshot: "exercise-wallet"
- id: fetch-http-error-response
  use: http-request
  with:
    method: GET
    url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-http-error-response.outputs.body.session_id }}
    expected_status: 200
# 064: the verifier answers the Authorization Response with HTTP 400 and a JSON
# body carrying a redirect_uri. The configured redirect_uri is what makes Capture
# return it with a fresh response_code; it is not signed into the Request
# Object, so it reaches the Wallet only through the error reply.
- id: create-http-error-redirect-response
  use: http-request
  with:
    method: POST
    url: ${fixture.verifier_url}/openid4vp/sessions
    expected_status: 201
    headers: { Content-Type: application/json }
    body:
      request_delivery: by_reference
      response_type: vp_token
      response_mode: direct_post.jwt
      redirect_uri: ${fixture.verifier_url}/openid4vp/redirect
      presentation_request:
        nonce: verifier-response-http-error-redirect
        dcql_query:
          credentials:
          - id: pid
            format: dc+sd-jwt
            meta: { vct_values: ["urn:eudi:pid:1"] }
            claims: [{ path: [given_name] }]
      response_scenario:
        status: 400
# 064: the verifier answers the Authorization Response with HTTP 400 and a JSON
# body carrying a redirect_uri, and the source requires the Wallet to open it.
# The reference Wallet parks on `Oups! Something went wrong / Verifier rejected
# the response` whose only dismiss control is the X, so this flow dismisses that
# screen when it is there and waits for Capture's `Presentation complete` page
# in the browser. Every wait on Wallet-specific text is `optional` and the X tap
# is conditional, because the source says nothing about the Wallet's screen
# wording: a Wallet that never opens the redirect_uri is reported by
# `oid4vp.redirect_uri_visited` instead of failing this step and, with it, the
# validation step that 066, 125 and 126 share through this scenario.
- id: exercise-http-error-redirect-response
  use: mobile-automation
  with:
    version_id: installed_from_external_source
    parameters: { DEEPLINK: "${{ create-http-error-redirect-response.outputs.body.deeplink }}" }
    action_code: |
      appId: eu.europa.ec.euidi
      ---
      - launchApp:
          stopApp: true
          clearState: false
          permissions:
            camera: allow
            notifications: allow
      - extendedWaitUntil:
          visible: "Welcome back"
          timeout: 30000
      - waitForAnimationToEnd:
          timeout: 3000
      - runFlow:
          when:
            visible: "Welcome back"
          commands:
            - inputText: "12345"
            - tapOn: "6"
      - waitForAnimationToEnd:
          timeout: 3000
      - openLink:
          link: "${DEEPLINK}"
          autoVerify: false
          browser: false
      - waitForAnimationToEnd:
          timeout: 3000
      - runFlow:
          when:
            visible: "Requested data"
          commands:
            - tapOn: "Share"
            - waitForAnimationToEnd:
                timeout: 3000
            - inputText: "12345"
            - tapOn: "6"
      - extendedWaitUntil:
          visible: "Oups! Something went wrong|Verifier rejected the response"
          timeout: 30000
          optional: true
      - takeScreenshot: "http-error-redirect-wallet-error"
      # The X is the error screen's only dismiss control (and the sibling
      # verifier-response-controls flows word the same screen as `Verifier
      # rejected the response`). It is tapped only while the error screen is up,
      # so a Wallet that worded its screen differently is not hit by a blind
      # coordinate tap. If the tap leaves the screen in place, the Android Back
      # gesture (which the Wallet's DC API error screen also accepts) is tried
      # before the browser is awaited.
      - runFlow:
          when:
            visible: "Oups! Something went wrong|Verifier rejected the response"
          commands:
            - tapOn:
                point: "8%,9%"
            - waitForAnimationToEnd:
                timeout: 3000
      - runFlow:
          when:
            visible: "Oups! Something went wrong|Verifier rejected the response"
          commands:
            - pressKey: Back
      - extendedWaitUntil:
          visible: "Presentation complete"
          timeout: 30000
          optional: true
      - takeScreenshot: "http-error-redirect-visit"
- id: fetch-http-error-redirect-response
  use: http-request
  with:
    method: GET
    url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-http-error-redirect-response.outputs.body.session_id }}
    expected_status: 200
# 066: the default direct-post reply is HTTP 200 with an empty JSON object, so
# the verifier supplies no redirect_uri.
- id: create-no-redirect-response
  use: http-request
  with:
    method: POST
    url: ${fixture.verifier_url}/openid4vp/sessions
    expected_status: 201
    headers: { Content-Type: application/json }
    body:
      request_delivery: by_reference
      response_type: vp_token
      response_mode: direct_post.jwt
      presentation_request:
        nonce: verifier-response-without-redirect-uri
        dcql_query:
          credentials:
          - id: pid
            format: dc+sd-jwt
            meta: { vct_values: ["urn:eudi:pid:1"] }
            claims: [{ path: [given_name] }]
# 066: the Wallet must raise an error or terminate the transaction, and the
# terminal screen is the only evidence. The screenshot is stored only while the
# error screen is up, so a Wallet that stays on its success screen fails the
# named-screenshot assertion instead of passing on any screenshot.
- id: exercise-no-redirect-response
  use: mobile-automation
  with:
    version_id: installed_from_external_source
    parameters: { DEEPLINK: "${{ create-no-redirect-response.outputs.body.deeplink }}" }
    action_code: |
      appId: eu.europa.ec.euidi
      ---
      - launchApp:
          stopApp: true
          clearState: false
          permissions:
            camera: allow
            notifications: allow
      - extendedWaitUntil:
          visible: "Welcome back"
          timeout: 30000
      - waitForAnimationToEnd:
          timeout: 3000
      - runFlow:
          when:
            visible: "Welcome back"
          commands:
            - inputText: "12345"
            - tapOn: "6"
      - waitForAnimationToEnd:
          timeout: 3000
      - openLink:
          link: "${DEEPLINK}"
          autoVerify: false
          browser: false
      - waitForAnimationToEnd:
          timeout: 3000
      - runFlow:
          when:
            visible: "Requested data"
          commands:
            - tapOn: "Share"
            - waitForAnimationToEnd:
                timeout: 3000
            - inputText: "12345"
            - tapOn: "6"
      - extendedWaitUntil:
          visible: "Oups! Something went wrong|invalid request|Verifier rejected the response|Presentation blocked"
          timeout: 60000
          optional: true
      - runFlow:
          when:
            visible: "Oups! Something went wrong|invalid request|Verifier rejected the response|Presentation blocked"
          commands:
            - takeScreenshot: "no-redirect-wallet-error"
      - waitForAnimationToEnd:
          timeout: 3000
      - takeScreenshot: "exercise-wallet"
- id: fetch-no-redirect-response
  use: http-request
  with:
    method: GET
    url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-no-redirect-response.outputs.body.session_id }}
    expected_status: 200
- id: run-fcaf-validators
  use: fcaf-validation
  with:
    test_ids:
    - WS_RP_IA_MainInteraction__064
    - WS_RP_IA_MainInteraction__066
    - WS_RP_MS_ProtocolMessages__125
    - WS_RP_MS_ProtocolMessages__126
    suite: wallet_solution/relying_party
    pipeline_outputs:
      pipeline.protocol.verifier-response-controls:
        output:
          non_json_response_session: ${{ fetch-non-json-response.outputs.body }}
          non_json_response_callback:
            verifier_http: ${{ fetch-non-json-response.outputs.body.raw.presentation_response_verifier_http }}
          non_json_response_visual_evidence: ${{ exercise-non-json-response.outputs.flow_output.maestro_screenshot_urls }}
          http_error_response_session: ${{ fetch-http-error-response.outputs.body }}
          http_error_response_callback:
            verifier_http: ${{ fetch-http-error-response.outputs.body.raw.presentation_response_verifier_http }}
          http_error_response_visual_evidence: ${{ exercise-http-error-response.outputs.flow_output.maestro_screenshot_urls }}
          http_error_redirect_session: ${{ fetch-http-error-redirect-response.outputs.body }}
          http_error_redirect_request_object: ${{ fetch-http-error-redirect-response.outputs.body.raw.authorization_request_jwt }}
          http_error_redirect_callback:
            verifier_http: ${{ fetch-http-error-redirect-response.outputs.body.raw.presentation_response_verifier_http }}
            configured_redirect_uri: ${{ create-http-error-redirect-response.outputs.body.redirect_uri }}
          http_error_redirect_visual_evidence: ${{ exercise-http-error-redirect-response.outputs.flow_output.maestro_screenshot_urls }}
          no_redirect_session: ${{ fetch-no-redirect-response.outputs.body }}
          no_redirect_request_object: ${{ fetch-no-redirect-response.outputs.body.raw.authorization_request_jwt }}
          no_redirect_callback:
            verifier_http: ${{ fetch-no-redirect-response.outputs.body.raw.presentation_response_verifier_http }}
          no_redirect_visual_evidence: ${{ exercise-no-redirect-response.outputs.flow_output.maestro_screenshot_urls }}
