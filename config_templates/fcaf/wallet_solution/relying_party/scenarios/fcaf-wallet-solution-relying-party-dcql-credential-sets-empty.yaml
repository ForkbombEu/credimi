name: FCAF DCQL credential sets empty
runtime:

steps:
  - id: create
    use: http-request
    with:
      method: POST
      url: ${fixture.verifier_url}/openid4vp/sessions
      expected_status: 201
      headers: { Content-Type: application/json }
      body: { presentation_request: { dcql_query: { credentials: [{ id: pid, format: dc+sd-jwt, meta: { vct_values: ['urn:eudi:pid:1'] }, claims: [{ path: [given_name] }] }], credential_sets: [] } } }
  - id: reject
    use: mobile-automation
    with:
      version_id: installed_from_external_source
      parameters:
        DEEPLINK: ${{ create.outputs.body.deeplink }}
      # Inline copy of the shared `fcaf-expect-request-rejected` action that also
      # stores a named screenshot while the Wallet's decisive refusal screen is
      # up. The protocol outcome alone (no vp_token) cannot tell a Wallet that
      # refused the request from one that never retrieved it or stopped while
      # still loading it: in the 4t9hxzgxlf run the Wallet showed its
      # "Data sharing request" sheet with a spinner and never answered, and
      # `dcql.response_satisfies_constraints{mode: invalid_request_generic}`
      # passed anyway. WS_RP_MS_ProtocolMessages__058 requires the screenshot.
      action_code: |
        appId: eu.europa.ec.euidi
        ---
        - launchApp:
            stopApp: true
            clearState: false
            permissions:
              camera: allow
              notifications: allow
        - extendedWaitUntil:
            visible: "Welcome back|Home|Documents|Add document|Welcome, .*"
            timeout: 30000
        - waitForAnimationToEnd:
            timeout: 3000
        - runFlow:
            when:
              visible: "Welcome back"
            commands:
              - extendedWaitUntil:
                  visible: "1"
                  timeout: 30000
              - inputText: "12345"
              - tapOn: "6"
        - extendedWaitUntil:
            visible: "Home|Documents|Add document|Welcome, .*"
            timeout: 30000
        - openLink:
            link: "${DEEPLINK}"
            autoVerify: false
            browser: false
        - waitForAnimationToEnd:
            timeout: 3000
        - extendedWaitUntil:
            visible: "Welcome back|Requested data|The requested document is not available.*|invalid request|Oups! Something went wrong|Presentation blocked"
            timeout: 60000
            optional: true
        - runFlow:
            when:
              visible: "Welcome back"
            commands:
              - extendedWaitUntil:
                  visible: "1"
                  timeout: 30000
              - inputText: "12345"
              - tapOn: "6"
              - waitForAnimationToEnd:
                  timeout: 3000
        # A tolerant Wallet that lists the request has accepted it; share so the
        # Verifier records the Authorization Response the source test must
        # refute.
        - runFlow:
            when:
              visible: "Requested data"
            commands:
              - tapOn: "Share"
              - waitForAnimationToEnd:
                  timeout: 3000
              - inputText: "12345"
              - tapOn: "6"
              - extendedWaitUntil:
                  visible: ".*successfully shared.*|Oups! Something went wrong|invalid request"
                  timeout: 30000
                  optional: true
        # The decisive refusal screen, captured under its own name. The same
        # screen is what the terminal screenshot records, so this block only
        # adds the name the test asserts.
        - runFlow:
            when:
              visible: "Oups! Something went wrong|invalid request|Presentation blocked|The requested document is not available.*"
            commands:
              - takeScreenshot: wallet-refused
        - takeScreenshot: expect-request-rejected
  - id: fetch
    use: http-request
    with: { method: GET, url: "${fixture.verifier_url}/openid4vp/sessions/${{ create.outputs.body.session_id }}", expected_status: 200 }
  - id: validate
    use: fcaf-validation
    with:
      test_ids: [WS_RP_MS_ProtocolMessages__058]
      suite: wallet_solution/relying_party
      pipeline_outputs:
        pipeline.dcql.credential-sets-empty:
          output:
            dcql_exchange: ${{ fetch.outputs.body }}
            visual_evidence: ${{ reject.outputs.flow_output.maestro_screenshot_urls }}
