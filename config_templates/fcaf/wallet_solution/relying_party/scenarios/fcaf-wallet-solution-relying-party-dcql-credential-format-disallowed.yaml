name: FCAF DCQL credential format disallowed
runtime: { global_runner_id: forkbomb-bv-andrea/usb }
steps:
  - id: create
    use: http-request
    with:
      method: POST
      url: https://capture-wallet.credimi.io/openid4vp/sessions
      expected_status: 201
      headers: { Content-Type: application/json }
      body: { presentation_request: { dcql_query: { credentials: [{ id: pid, format: jwt_vc_json, meta: {} }] } } }
  - id: reject
    use: mobile-automation
    with:
      version_id: installed_from_external_source
      parameters: { DEEPLINK: "${{ create.outputs.body.deeplink }}" }
      action_code: |
        appId: eu.europa.ec.euidi
        ---
        - launchApp: { stopApp: true, clearState: false }
        - openLink: { link: "${DEEPLINK}", autoVerify: false, browser: false }
        - extendedWaitUntil: { visible: "Welcome back|Error|invalid request|Something went wrong|Home|Documents", timeout: 100000 }
        - takeScreenshot: fcaf-dcql-credential-format-disallowed
  - id: fetch
    use: http-request
    with: { method: GET, url: "https://capture-wallet.credimi.io/openid4vp/sessions/${{ create.outputs.body.session_id }}", expected_status: 200 }
  - id: validate
    use: fcaf-validation
    with:
      test_ids: [WS_RP_MS_ProtocolMessages__069]
      suite: wallet_solution/relying_party
      pipeline_outputs:
        pipeline.dcql.credential-format-disallowed:
          output:
            dcql_exchange: ${{ fetch.outputs.body }}
            visual_evidence: ${{ reject.outputs.flow_output.maestro_screenshot_urls }}
