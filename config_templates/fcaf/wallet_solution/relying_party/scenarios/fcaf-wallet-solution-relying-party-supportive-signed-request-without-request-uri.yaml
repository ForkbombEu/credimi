name: FCAF Supportive signed Request Object without request_uri
runtime:
  temporal:
    activity_options:
      schedule_to_close_timeout: 50m
      start_to_close_timeout: 50m
      retry_policy:
        maximum_attempts: 1

steps:
  - id: create-presentation
    use: http-request
    with:
      method: POST
      url: ${fixture.verifier_url}/openid4vp/sessions
      expected_status: 201
      headers:
        Content-Type: application/json
      body:
        scheme: haip-vp://
        request_delivery: by_value
        response_type: vp_token
        response_mode: direct_post.jwt
        presentation_request:
          nonce: fcaf-supportive-signed-request-without-request-uri
          dcql_query:
            credentials:
              - id: pid_mdoc
                format: mso_mdoc
                meta:
                  doctype_value: eu.europa.ec.eudi.pid.1
                claims:
                  - path:
                      - eu.europa.ec.eudi.pid.1
                      - given_name

  - id: submit-haip-by-value-request
    use: mobile-automation
    with:
      version_id: installed_from_external_source
      parameters:
        DEEPLINK: ${{ create-presentation.outputs.body.deeplink }}
      action_code: |
        appId: eu.europa.ec.euidi
        ---
        - stopApp
        - openLink: { link: "${DEEPLINK}", autoVerify: false, browser: false }
        - waitForAnimationToEnd:
            timeout: 5000
        - tapOn:
            text: "EUDI Wallet"
            optional: true
        - tapOn:
            text: "Just once"
            optional: true
        - extendedWaitUntil:
            visible: "Oups! Something went wrong|invalid request|Oups! Something went wrong|Home|Documents"
            timeout: 30000
        - takeScreenshot: fcaf-supportive-signed-request-without-request-uri-rejected
  - id: get-presentation-result
    use: http-request
    with:
      method: GET
      url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-presentation.outputs.body.session_id }}
      expected_status: 200

  - id: run-fcaf-validators
    use: fcaf-validation
    with:
      test_ids:
        - WS_RP_IA_Supportive__007
      suite: wallet_solution/relying_party
      pipeline_outputs:
        pipeline.wallet.supportive.signed-request-without-request-uri:
          output:
            request_object: ${{ create-presentation.outputs.body.request }}
            dcql_exchange: ${{ get-presentation-result.outputs.body }}
            visual_evidence: ${{ submit-haip-by-value-request.outputs.flow_output.maestro_screenshot_urls }}
