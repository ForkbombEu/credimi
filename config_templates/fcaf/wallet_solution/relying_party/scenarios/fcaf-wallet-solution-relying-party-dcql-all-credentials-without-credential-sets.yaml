name: FCAF DCQL all credentials without credential_sets
runtime:
steps:
  - id: create-presentation
    use: http-request
    with:
      method: POST
      url: ${fixture.verifier_url}/openid4vp/sessions
      expected_status: 201
      headers: { Content-Type: application/json }
      body:
        scheme: haip-vp://
        request_delivery: by_reference
        response_type: vp_token
        response_mode: direct_post.jwt
        presentation_request:
          nonce: fcaf-117
          dcql_query:
            credentials:
              - { id: pid-sdjwt, format: dc+sd-jwt, meta: { vct_values: ["urn:eudi:pid:1"] }, claims: [{ path: [given_name] }] }
              - { id: pid-mdoc, format: mso_mdoc, meta: { doctype_value: eu.europa.ec.eudi.pid.1 }, claims: [{ path: [eu.europa.ec.eudi.pid.1, given_name] }] }
  - id: present-all-credentials
    use: mobile-automation
    with:
      version_id: installed_from_external_source
      parameters: { deeplink: "${{ create-presentation.outputs.body.deeplink }}" }
      action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-present-all-credentials
  - id: fetch-result
    use: http-request
    with: { method: GET, url: "${fixture.verifier_url}/openid4vp/sessions/${{ create-presentation.outputs.body.session_id }}", expected_status: 200 }

  - id: run-fcaf-validators
    use: fcaf-validation
    with:
      test_ids:
        - WS_RP_MS_ProtocolMessages__117
      suite: wallet_solution/relying_party
      pipeline_outputs:
        pipeline.dcql.all-credentials-without-credential-sets:
          output:
            dcql_exchange: ${{ fetch-result.outputs.body }}
            visual_evidence: ${{ present-all-credentials.outputs.flow_output.maestro_screenshot_urls }}
            create-presentation: ${{ create-presentation.outputs }}
            present-all-credentials: ${{ present-all-credentials.outputs }}
            fetch-result: ${{ fetch-result.outputs }}
