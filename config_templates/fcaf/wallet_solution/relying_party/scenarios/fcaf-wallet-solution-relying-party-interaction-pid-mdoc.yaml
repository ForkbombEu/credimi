name: FCAF main-interaction PID mdoc
runtime:
  fixture:
    issuer_url: https://beta-capture-wallet.credimi.io
    log_checker: capture-wallet
  global_device_id: forkbomb-bv-andrea/usb/device
  temporal:
    activity_options:
      schedule_to_close_timeout: 50m
      start_to_close_timeout: 50m
      retry_policy:
        maximum_attempts: 1
steps:
- id: onboard-reference-wallet
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/onboarding-1
    version_id: forkbomb-bv-andrea/eudiw-beta-wallet/2026-06-38-demo
- id: create-pid-mdoc-offer
  use: credential-offer
  with:
    credential_id: /forkbomb-bv-andrea/misc-issuer-integration-demo/capture-issuer-pid-mdoc
- id: obtain-pid-mdoc
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/getcredential-generic-credential-without-authentication
    version_id: forkbomb-bv-andrea/eudiw-beta-wallet/2026-06-38-demo
    parameters:
      deeplink: ${{ create-pid-mdoc-offer.outputs }}
- id: create-missing-element-presentation
  use: http-request
  with:
    method: POST
    url: ${fixture.verifier_url}/openid4vp/sessions
    expected_status: 201
    headers: { Content-Type: application/json }
    body:
      scheme: haip-vp://
      request_uri_method: post
      request_delivery: by_reference
      response_type: vp_token
      response_mode: direct_post
      presentation_request:
        nonce: fcaf-ia-012d
        dcql_query:
          credentials:
          - id: pid_mdoc
            format: mso_mdoc
            meta: { doctype_value: eu.europa.ec.eudi.pid.1 }
            claims:
            - path: [eu.europa.ec.eudi.pid.1, unavailable_element]
- id: present-missing-element
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-exercise-wallet-generic
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-missing-element-presentation.outputs.body.deeplink }}
- id: fetch-missing-element-presentation
  use: http-request
  with:
    method: GET
    url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-missing-element-presentation.outputs.body.session_id }}
    expected_status: 200
- id: create-two-element-presentation
  use: http-request
  with:
    method: POST
    url: ${fixture.verifier_url}/openid4vp/sessions
    expected_status: 201
    headers: { Content-Type: application/json }
    body:
      scheme: haip-vp://
      request_uri_method: post
      request_delivery: by_reference
      response_type: vp_token
      response_mode: direct_post
      presentation_request:
        nonce: fcaf-ia-034b
        dcql_query:
          credentials:
          - id: pid_mdoc
            format: mso_mdoc
            meta: { doctype_value: eu.europa.ec.eudi.pid.1 }
            claims:
            - path: [eu.europa.ec.eudi.pid.1, given_name]
            - path: [eu.europa.ec.eudi.pid.1, family_name]
- id: present-two-element-presentation
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-engagement-haip-vp
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-two-element-presentation.outputs.body.deeplink }}
- id: fetch-two-element-presentation
  use: http-request
  with:
    method: GET
    url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-two-element-presentation.outputs.body.session_id }}
    expected_status: 200
- id: create-element-and-missing-presentation
  use: http-request
  with:
    method: POST
    url: ${fixture.verifier_url}/openid4vp/sessions
    expected_status: 201
    headers: { Content-Type: application/json }
    body:
      scheme: haip-vp://
      request_uri_method: post
      request_delivery: by_reference
      response_type: vp_token
      response_mode: direct_post
      presentation_request:
        nonce: fcaf-ia-034i
        dcql_query:
          credentials:
          - id: pid_mdoc
            format: mso_mdoc
            meta: { doctype_value: eu.europa.ec.eudi.pid.1 }
            claims:
            - path: [eu.europa.ec.eudi.pid.1, given_name]
            - path: [eu.europa.ec.eudi.pid.1, unavailable_element]
- id: present-element-and-missing
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-exercise-wallet-generic
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-element-and-missing-presentation.outputs.body.deeplink }}
- id: fetch-element-and-missing-presentation
  use: http-request
  with:
    method: GET
    url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-element-and-missing-presentation.outputs.body.session_id }}
    expected_status: 200
- id: run-fcaf-validators
  use: fcaf-validation
  with:
    test_ids:
    - WS_RP_IA_MainInteraction__012d_UF
    - WS_RP_IA_MainInteraction__034b
    - WS_RP_IA_MainInteraction__034i_UF
    suite: wallet_solution/relying_party
    pipeline_outputs:
      pipeline.interaction.pid-mdoc-missing-element:
        output:
          dcql_exchange: ${{ fetch-missing-element-presentation.outputs.body }}
          visual_evidence: ${{ present-missing-element.outputs.flow_output.maestro_screenshot_urls }}
      pipeline.interaction.pid-mdoc-two-elements:
        output:
          dcql_exchange: ${{ fetch-two-element-presentation.outputs.body }}
          pid_mdoc: ${{ fetch-two-element-presentation.outputs.body.observed.wallet_response.value.vp_token }}
          visual_evidence: ${{ present-two-element-presentation.outputs.flow_output.maestro_screenshot_urls }}
      pipeline.interaction.pid-mdoc-element-and-missing:
        output:
          dcql_exchange: ${{ fetch-element-and-missing-presentation.outputs.body }}
          visual_evidence: ${{ present-element-and-missing.outputs.flow_output.maestro_screenshot_urls }}
