name: FCAF wallet relying-party DCQL no matching credentials
runtime:
  temporal:
    activity_options:
      schedule_to_close_timeout: 50m
      start_to_close_timeout: 50m
      retry_policy:
        maximum_attempts: 1

steps:
  - id: create-presentation
    use: http-request
    with:
      method: POST
      url: ${fixture.verifier_url}/openid4vp/sessions
      expected_status: 201
      headers:
        Content-Type: application/json
      body:
        scheme: haip-vp://
        request_delivery: by_reference
        response_type: vp_token
        response_mode: direct_post.jwt
        presentation_request:
          nonce: fcaf-dcql-no-matching-credentials
          dcql_query:
            credentials:
              - id: unavailable_pid
                format: dc+sd-jwt
                meta:
                  vct_values:
                    - urn:credimi:fcaf:no-matching-test-credential
                claims:
                  - path:
                      - not_available_in_reference_wallet

  - id: present-with-reference-implementation
    use: mobile-automation
    with:
      version_id: installed_from_external_source
      parameters:
        DEEPLINK: ${{ create-presentation.outputs.body.deeplink }}
      action_code: |
        appId: eu.europa.ec.euidi
        ---
        - launchApp:
            stopApp: true
            clearState: false
            permissions:
              camera: allow
              notifications: allow
              all: unset
        - extendedWaitUntil:
            visible: "Welcome back|Home|Documents|Add document|Welcome, .*"
            timeout: 30000
        - runFlow:
            when:
              visible: "Welcome back"
            commands:
              - tapOn:
                  point: "11%,40%"
              - inputText: "123456"
              - hideKeyboard
              - tapOn: { point: "50%,10%" }
        - extendedWaitUntil:
            visible: "Home|Documents|Add document|Welcome, .*"
            timeout: 30000
        - openLink: { link: "${DEEPLINK}", autoVerify: false, browser: false }
        - runFlow:
            when:
              visible: "EUDI Wallet"
            commands:
              - tapOn: { text: "EUDI Wallet", optional: true }
        - runFlow:
            when:
              visible: "Just once"
            commands:
              - tapOn: { text: "Just once", optional: true }
        - runFlow:
            when:
              visible: "Always"
            commands:
              - tapOn: { text: "Always", optional: true }
        - runFlow:
            when:
              visible: "Welcome back"
            commands:
              - tapOn:
                  point: "11%,40%"
              - tapOn: { text: "1", retryTapIfNoChange: false }
              - tapOn: { text: "2", retryTapIfNoChange: false }
              - tapOn: { text: "3", retryTapIfNoChange: false }
              - tapOn: { text: "4", retryTapIfNoChange: false }
              - tapOn: { text: "5", retryTapIfNoChange: false }
              - tapOn: { text: "6", retryTapIfNoChange: false, waitToSettleTimeoutMs: 0 }
        - waitForAnimationToEnd:
            timeout: 5000
        - extendedWaitUntil:
            visible: "The requested document is not available in your EUDI Wallet.*"
            timeout: 30000
        - assertNotVisible:
            id: eu.europa.ec.euidi:id/request_screen_requested_document_0
        - takeScreenshot: fcaf-147-no-matching-credential-access-denied
        - tapOn: "Go Back"
  - id: fetch-capture-session
    use: http-request
    with:
      method: GET
      url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-presentation.outputs.body.session_id }}
      expected_status: 200

  - id: run-fcaf-validators
    use: fcaf-validation
    with:
      test_ids:
        - WS_RP_DM_CredentialMetadata_CredentialStructure_009
        - WS_RP_MS_ProtocolMessages__014
        - WS_RP_MS_ProtocolMessages__147
      suite: wallet_solution/relying_party
      pipeline_outputs:
        pipeline.dcql.no-matching-credentials:
          output:
            dcql_exchange: ${{ fetch-capture-session.outputs.body }}
            visual_evidence: ${{ present-with-reference-implementation.outputs.flow_output.maestro_screenshot_urls }}
            create-presentation: ${{ create-presentation.outputs }}
            present-with-reference-implementation: ${{ present-with-reference-implementation.outputs }}
            fetch-capture-session: ${{ fetch-capture-session.outputs }}
