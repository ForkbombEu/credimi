name: FCAF wallet relying-party DCQL no matching credentials
runtime:
  temporal:
    activity_options:
      schedule_to_close_timeout: 50m
      start_to_close_timeout: 50m
      retry_policy:
        maximum_attempts: 1

steps:
  - id: create-presentation
    use: http-request
    with:
      method: POST
      url: ${fixture.verifier_url}/openid4vp/sessions
      expected_status: 201
      headers:
        Content-Type: application/json
      body:
        scheme: haip-vp://
        request_delivery: by_reference
        response_type: vp_token
        response_mode: direct_post.jwt
        presentation_request:
          nonce: fcaf-dcql-no-matching-credentials
          dcql_query:
            credentials:
              - id: unavailable_pid
                format: dc+sd-jwt
                meta:
                  vct_values:
                    - urn:credimi:fcaf:no-matching-test-credential
                claims:
                  - path:
                      - not_available_in_reference_wallet

  - id: present-with-reference-implementation
    use: mobile-automation
    with:
      version_id: installed_from_external_source
      parameters:
        deeplink: ${{ create-presentation.outputs.body.deeplink }}
      action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-expect-no-matching-document
  - id: fetch-capture-session
    use: http-request
    with:
      method: GET
      url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-presentation.outputs.body.session_id }}
      expected_status: 200

  - id: run-fcaf-validators
    use: fcaf-validation
    with:
      test_ids:
        - WS_RP_DM_CredentialMetadata_CredentialStructure_009
        - WS_RP_MS_ProtocolMessages__014
        - WS_RP_MS_ProtocolMessages__147
      suite: wallet_solution/relying_party
      pipeline_outputs:
        pipeline.dcql.no-matching-credentials:
          output:
            dcql_exchange: ${{ fetch-capture-session.outputs.body }}
            visual_evidence: ${{ present-with-reference-implementation.outputs.flow_output.maestro_screenshot_urls }}
            create-presentation: ${{ create-presentation.outputs }}
            present-with-reference-implementation: ${{ present-with-reference-implementation.outputs }}
            fetch-capture-session: ${{ fetch-capture-session.outputs }}
