- id: run-fcaf-validators
  use: fcaf-validation
  with:
    test_ids:
    - WS_RP_MS_ProtocolMessages__093
    suite: wallet_solution/relying_party
    pipeline_outputs:
      pipeline.dcql.trusted-authorities-values-item-non-string:
        output:
          null_value: ${{ fetch-null.outputs.body.raw.authorization_request_delivered }}
          true_value: ${{ fetch-true.outputs.body.raw.authorization_request_delivered }}
          false_value: ${{ fetch-false.outputs.body.raw.authorization_request_delivered }}
          zero_value: ${{ fetch-zero.outputs.body.raw.authorization_request_delivered }}
          random_number: ${{ fetch-number.outputs.body.raw.authorization_request_delivered }}
          array_value: ${{ fetch-array.outputs.body.raw.authorization_request_delivered }}
          object_value: ${{ fetch-object.outputs.body.raw.authorization_request_delivered }}
          visual_evidence: ${{ exercise-trusted-authorities-values-item-non-string.outputs.screenshot_urls }}
