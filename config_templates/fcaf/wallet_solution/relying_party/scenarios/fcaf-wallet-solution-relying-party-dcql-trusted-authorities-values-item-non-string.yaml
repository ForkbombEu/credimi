- id: fetch-null
  use: http-request
  with:
    method: GET
    url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-null.outputs.body.session_id }}
    expected_status: 200
- id: fetch-true
  use: http-request
  with:
    method: GET
    url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-true.outputs.body.session_id }}
