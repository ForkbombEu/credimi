name: FCAF wallet relying-party DCQL trusted authorities values item non-string
runtime:
  temporal:
    activity_options:
      schedule_to_close_timeout: 50m
      start_to_close_timeout: 50m
      retry_policy:
        maximum_attempts: 1
steps:
- id: create-null
  use: http-request
  with:
    method: POST
    url: ${fixture.verifier_url}/openid4vp/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      scheme: haip-vp://
      request_delivery: by_reference
      request_uri_method: post
      response_type: vp_token
      response_mode: direct_post.jwt
      presentation_request:
        nonce: fcaf-093-null
        dcql_query:
          credentials:
          - id: pididentity01
            format: dc+sd-jwt
            meta:
              vct_values:
              - urn:eudi:pid:1
            claims:
            - path:
              - given_name
      request_mutation:
        request_object:
          set:
            /dcql_query:
              credentials:
              - id: pididentity01
                format: dc+sd-jwt
                meta:
                  vct_values:
                  - urn:eudi:pid:1
                claims:
                - path:
                  - given_name
                trusted_authorities:
                - type: aki
                  values:
                  - null
        verification_applies: false
- id: create-true
  use: http-request
  with:
