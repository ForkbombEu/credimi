name: FCAF DCQL credential_sets options valid references
runtime:
  global_device_id: forkbomb-bv-andrea/usb/device
  fixture:
    issuer_url: https://capture-wallet.credimi.io
    log_checker: capture-wallet
steps:
  - id: create-capture-session
    use: http-request
    with:
      method: POST
      url: "${fixture.verifier_url}/openid4vp/sessions"
      expected_status: 201
      headers: { Content-Type: application/json }
      body: { response_mode: direct_post.jwt, presentation_request: { nonce: fcaf-099, dcql_query: { credentials: [{ id: pid, format: dc+sd-jwt, meta: { vct_values: ["urn:eudi:pid:1"] } }], credential_sets: [{ options: [[pid]] }] } } }
  - id: present-valid-credential-sets-options
    use: mobile-automation
    with:
      version_id: installed_from_external_source
      parameters:
        deeplink: "${{ create-capture-session.outputs.body.deeplink }}"
      action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-exercise-wallet-generic
  - id: fetch-capture-session
    use: http-request
    with:
      method: GET
      url: "${fixture.verifier_url}/openid4vp/sessions/${{ create-capture-session.outputs.body.session_id }}"
      expected_status: 200
  - id: run-fcaf-validators
    use: fcaf-validation
    with:
      test_ids:
        - WS_RP_MS_ProtocolMessages__099
      suite: wallet_solution/relying_party
      pipeline_outputs:
        pipeline.dcql.credential-sets-options-valid-references:
          output:
            dcql_exchange: ${{ fetch-capture-session.outputs.body }}
            visual_evidence: ${{ present-valid-credential-sets-options.outputs.flow_output.maestro_screenshot_urls }}
            create-capture-session: ${{ create-capture-session.outputs }}
            present-valid-credential-sets-options: ${{ present-valid-credential-sets-options.outputs }}
            fetch-capture-session: ${{ fetch-capture-session.outputs }}
