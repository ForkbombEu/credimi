name: FCAF DCQL credential_sets options valid references
runtime:
  global_runner_id: forkbomb-bv-andrea/usb
  fixture:
    issuer_url: https://capture-wallet.credimi.io
    verifier_url: https://capture-wallet.credimi.io
    log_checker: capture-wallet
steps:
  - id: create-capture-session
    use: http-request
    with:
      method: POST
      url: "https://capture-wallet.credimi.io/openid4vp/sessions"
      expected_status: 201
      headers: { Content-Type: application/json }
      body: { response_mode: direct_post, presentation_request: { nonce: fcaf-099, dcql_query: { credentials: [{ id: pid, format: dc+sd-jwt, meta: { vct_values: [urn:eudi:pid:1] } }], credential_sets: [{ options: [[pid]] }] } } }
  - id: present-valid-credential-sets-options
    use: mobile-automation
    with:
      version_id: installed_from_external_source
      parameters:
        DEEPLINK: "${{ create-capture-session.outputs.body.deeplink }}"
      action_code: |
        appId: eu.europa.ec.euidi
        ---
                - launchApp: { stopApp: true, clearState: false, permissions: { camera: allow, notifications: allow, all: unset } }
        - extendedWaitUntil:
            visible: "Welcome back|Home|Documents|Add document|Welcome, .*"
            timeout: 30000
        - runFlow:
            when:
              visible: "Welcome back"
            commands:
              - tapOn:
                  point: "11%,40%"
              - inputText: "123456"
              - hideKeyboard
              - tapOn: { point: "50%,10%" }
        - extendedWaitUntil:
            visible: "Home|Documents|Add document|Welcome, .*"
            timeout: 30000
        - openLink: { link: "${DEEPLINK}", autoVerify: false, browser: false }
        - runFlow:
            when:
              visible: "EUDI Wallet"
            commands:
              - tapOn: { text: "EUDI Wallet", optional: true }
        - runFlow:
            when:
              visible: "Just once"
            commands:
              - tapOn: { text: "Just once", optional: true }
        - runFlow:
            when:
              visible: "Always"
            commands:
              - tapOn: { text: "Always", optional: true }
        - extendedWaitUntil: { visible: "Welcome back|Share", timeout: 100000 }
        - tapOn: { point: "11%,40%" }
        - inputText: "123456"
        - tapOn: { point: "50%,10%" }
        - waitForAnimationToEnd: { timeout: 1000 }
        - extendedWaitUntil: { visible: "Share", timeout: 30000 }
        - tapOn: "Share"
        - extendedWaitUntil: { visible: "Welcome back|To approve the transaction you need to verify your identity.", timeout: 100000 }
        - tapOn: { point: "11%,40%" }
        - inputText: "123456"
        - tapOn: { point: "50%,10%" }
        - waitForAnimationToEnd: { timeout: 1000 }
        - assertNotVisible: { text: "Oups! Something went wrong" }
        - extendedWaitUntil: { visible: "Close", timeout: 30000 }
        - takeScreenshot: fcaf-099
  - id: fetch-capture-session
    use: http-request
    with:
      method: GET
      url: "https://capture-wallet.credimi.io/openid4vp/sessions/${{ create-capture-session.outputs.body.session_id }}"
      expected_status: 200
  - id: run-fcaf-validators
    use: fcaf-validation
    with:
      test_ids:
        - WS_RP_MS_ProtocolMessages__099
      suite: wallet_solution/relying_party
      pipeline_outputs:
        pipeline.dcql.credential-sets-options-valid-references:
          output:
            dcql_exchange: ${{ fetch-capture-session.outputs.body }}
            visual_evidence: ${{ present-valid-credential-sets-options.outputs.flow_output.maestro_screenshot_urls }}
            create-capture-session: ${{ create-capture-session.outputs }}
            present-valid-credential-sets-options: ${{ present-valid-credential-sets-options.outputs }}
            fetch-capture-session: ${{ fetch-capture-session.outputs }}
