name: FCAF DCQL credentials non-array
runtime: { global_runner_id: forkbomb-bv-andrea/usb }
steps:
  - id: create-capture-session
    use: http-request
    with:
      method: POST
      url: https://capture-wallet.credimi.io/openid4vp/sessions
      expected_status: 201
      headers: { Content-Type: application/json }
      body: { presentation_request: { dcql_query: { credentials: {} } } }
  - id: reject-non-array-credentials
    use: mobile-automation
    with:
      version_id: installed_from_external_source
      parameters: { DEEPLINK: "${{ create-capture-session.outputs.body.deeplink }}" }
      action_code: |
        appId: eu.europa.ec.euidi
        ---
        - launchApp: { stopApp: true, clearState: false, permissions: { camera: allow, notifications: allow, all: unset } }
        - extendedWaitUntil: { visible: "Welcome back|Home|Documents|Add document|Welcome, .*", timeout: 30000 }
        - runFlow:
            when: { visible: "Welcome back" }
            commands:
              - tapOn: { point: "11%,40%" }
              - inputText: "123456"
              - hideKeyboard
              - tapOn: { point: "50%,10%" }
        - openLink: { link: "${DEEPLINK}", autoVerify: false, browser: false }
        - tapOn: { text: "EUDI Wallet", optional: true }
        - tapOn: { text: "Just once", optional: true }
        - extendedWaitUntil: { visible: "Welcome back|Error|invalid request|Something went wrong|Home|Documents", timeout: 100000 }
        - takeScreenshot: fcaf-dcql-credentials-non-array
  - id: fetch-capture-session
    use: http-request
    with:
      method: GET
      url: "https://capture-wallet.credimi.io/openid4vp/sessions/${{ create-capture-session.outputs.body.session_id }}"
      expected_status: 200
  - id: run-fcaf-validators
    use: fcaf-validation
    with:
      test_ids: [WS_RP_MS_ProtocolMessages__056]
      suite: wallet_solution/relying_party
      pipeline_outputs:
        pipeline.dcql.credentials-non-array:
          output:
            dcql_exchange: ${{ fetch-capture-session.outputs.body }}
            visual_evidence: ${{ reject-non-array-credentials.outputs.flow_output.maestro_screenshot_urls }}
