name: FCAF wallet relying-party same credential multiple queries
runtime:
  temporal:
    activity_options: { schedule_to_close_timeout: 50m, start_to_close_timeout: 50m, retry_policy: { maximum_attempts: 1 } }
steps:
  - id: evidence-request
    use: json-parse
    with:
      rawJSON: '{"dcql_query":{"credentials":[{"id":"pid-query-one","format":"dc+sd-jwt","meta":{"vct_values":["urn:eudi:pid:1"]},"claims":[{"path":["given_name"]}]},{"id":"pid-query-two","format":"dc+sd-jwt","meta":{"vct_values":["urn:eudi:pid:1"]},"claims":[{"path":["given_name"]}]}]}}'
      struct_type: map
  - id: create-presentation
    use: http-request
    with:
      method: POST
      url: ${fixture.verifier_url}/openid4vp/sessions
      expected_status: 201
      headers: { Content-Type: application/json }
      body:
        scheme: haip-vp://
        request_delivery: by_reference
        response_type: vp_token
        response_mode: direct_post.jwt
        presentation_request:
          nonce: fcaf-087-same-credential-multiple-queries
          dcql_query:
            credentials:
              - { id: pid-query-one, format: dc+sd-jwt, meta: { vct_values: ["urn:eudi:pid:1"] }, claims: [{ path: [given_name] }] }
              - { id: pid-query-two, format: dc+sd-jwt, meta: { vct_values: ["urn:eudi:pid:1"] }, claims: [{ path: [given_name] }] }
  - id: present-and-share
    use: mobile-automation
    with:
      version_id: installed_from_external_source
      parameters:
        DEEPLINK: ${{ create-presentation.outputs.body.deeplink }}
      action_code: |
        appId: eu.europa.ec.euidi
        ---
        - extendedWaitUntil: { visible: "Home|Documents|Welcome, .*", timeout: 30000 }
        - openLink: { link: "${DEEPLINK}", autoVerify: false, browser: false }
        - extendedWaitUntil: { visible: "Data sharing request", timeout: 100000 }
        - assertVisible: { id: eu.europa.ec.euidi:id/request_screen_requested_document_0 }
        - assertVisible: { id: eu.europa.ec.euidi:id/request_screen_requested_document_1 }
        - tapOn: "Share"
        - extendedWaitUntil: { visible: "PIN", timeout: 30000 }
        - tapOn: { point: "11%,39%" }
        - inputText: "123456"
        - hideKeyboard
        - tapOn: { point: "50%,10%" }
        - extendedWaitUntil: { visible: ".*successfully shared.*", timeout: 30000 }
        - takeScreenshot: fcaf-087-same-credential-multiple-queries
        - tapOn: "Close"
  - id: get-presentation-result
    use: http-request
    with:
      method: GET
      url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-presentation.outputs.body.session_id }}
      expected_status: 200

  - id: run-fcaf-validators
    use: fcaf-validation
    with:
      test_ids:
        - WS_RP_MS_ProtocolMessages__013
        - WS_RP_MS_ProtocolMessages__087
      suite: wallet_solution/relying_party
      pipeline_outputs:
        pipeline.dcql.same-credential-multiple-queries:
          output:
            dcql_exchange: ${{ get-presentation-result.outputs.body }}
            visual_evidence: ${{ present-and-share.outputs.flow_output.maestro_screenshot_urls }}
            evidence-request: ${{ evidence-request.outputs }}
            create-presentation: ${{ create-presentation.outputs }}
            present-and-share: ${{ present-and-share.outputs }}
            get-presentation-result: ${{ get-presentation-result.outputs }}
