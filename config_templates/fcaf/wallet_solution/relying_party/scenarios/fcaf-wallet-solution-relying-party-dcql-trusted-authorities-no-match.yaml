name: FCAF wallet relying-party DCQL trusted authorities no match
runtime:
  temporal:
    activity_options:
      schedule_to_close_timeout: 50m
      start_to_close_timeout: 50m
      retry_policy: { maximum_attempts: 1 }
steps:
  - id: create-capture-session
    use: http-request
    with:
      method: POST
      url: ${fixture.verifier_url}/openid4vp/sessions
      expected_status: 201
      headers: { Content-Type: application/json }
      body:
        response_mode: direct_post.jwt
        presentation_request:
          nonce: fcaf-dcql-trusted-authorities-no-match
          dcql_query:
            credentials:
              - id: pid_identity
                format: dc+sd-jwt
                meta: { vct_values: ["urn:eudi:pid:1"] }
                claims: [{ path: [given_name] }]
                trusted_authorities:
                  # Valid base64url AuthorityKeyIdentifier that differs from the reference PID issuer.
                  - { type: aki, values: [AAAAAAAAAAAAAAAAAAAAAAAAAAA] }
  - id: present-with-reference-implementation
    use: mobile-automation
    with:
      version_id: installed_from_external_source
      parameters:
        deeplink: ${{ create-capture-session.outputs.body.deeplink }}
      action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-expect-no-matching-document
  - id: get-capture-session
    use: http-request
    with:
      method: GET
      url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-capture-session.outputs.body.session_id }}
      expected_status: 200

  - id: run-fcaf-validators
    use: fcaf-validation
    with:
      test_ids:
        - WS_RP_IA_MainInteraction__004
      suite: wallet_solution/relying_party
      pipeline_outputs:
        pipeline.dcql.trusted-authorities-no-match:
          output:
            dcql_exchange: ${{ get-capture-session.outputs.body }}
            visual_evidence: ${{ present-with-reference-implementation.outputs.flow_output.maestro_screenshot_urls }}
            create-capture-session: ${{ create-capture-session.outputs }}
            present-with-reference-implementation: ${{ present-with-reference-implementation.outputs }}
            get-capture-session: ${{ get-capture-session.outputs }}
