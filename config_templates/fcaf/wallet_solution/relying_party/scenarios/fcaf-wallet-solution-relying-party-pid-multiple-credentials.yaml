name: FCAF two distinct PIDs satisfying one credential query
runtime:
  fixture:
    issuer_url: https://beta-capture-wallet.credimi.io
    log_checker: capture-wallet
  global_device_id: forkbomb-bv-andrea/usb/device
  temporal:
    activity_options:
      schedule_to_close_timeout: 50m
      start_to_close_timeout: 50m
      retry_policy:
        maximum_attempts: 1
steps:
- id: create-baseline-issuance
  use: http-request
  with:
    method: POST
    url: ${fixture.issuer_url}/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      issuer_configuration_id: eu-pid-device-bound
      credential_configuration_id: urn:eu.europa.ec.eudi:pid:1.sd-jwt.key-attestation-required
      fixture_id: pid_default
- id: obtain-baseline-credential
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/getcredential-generic-credential-without-authentication
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-baseline-issuance.outputs.body.deeplink }}
- id: create-second-identity-issuance
  use: http-request
  with:
    method: POST
    url: ${fixture.issuer_url}/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      issuer_configuration_id: eu-pid-device-bound
      credential_configuration_id: urn:eu.europa.ec.eudi:pid:1.sd-jwt.key-attestation-required
      fixture_id: pid_person_b
- id: obtain-second-identity-credential
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/getcredential-generic-credential-without-authentication
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-second-identity-issuance.outputs.body.deeplink }}
- id: create-baseline-probe
  use: http-request
  with:
    method: POST
    url: ${fixture.verifier_url}/openid4vp/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      scheme: haip-vp://
      request_uri_method: post
      request_delivery: by_reference
      response_type: vp_token
      response_mode: direct_post
      presentation_request:
        nonce: pid-fixture-probe-baseline
        dcql_query:
          credentials:
          - id: pid
            format: dc+sd-jwt
            meta:
              vct_values:
              - urn:eudi:pid:1
            claims:
            - path:
              - family_name
              values:
              - Rossi
            - path:
              - document_number
- id: present-baseline-probe
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-engagement-haip-vp
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-baseline-probe.outputs.body.deeplink }}
- id: fetch-baseline-probe
  use: http-request
  with:
    method: GET
    url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-baseline-probe.outputs.body.session_id }}
    expected_status: 200
- id: create-second-identity-probe
  use: http-request
  with:
    method: POST
    url: ${fixture.verifier_url}/openid4vp/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      scheme: haip-vp://
      request_uri_method: post
      request_delivery: by_reference
      response_type: vp_token
      response_mode: direct_post
      presentation_request:
        nonce: pid-fixture-probe-second-identity
        dcql_query:
          credentials:
          - id: pid
            format: dc+sd-jwt
            meta:
              vct_values:
              - urn:eudi:pid:1
            claims:
            - path:
              - family_name
              values:
              - Bianchi
            - path:
              - document_number
- id: present-second-identity-probe
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-engagement-haip-vp
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-second-identity-probe.outputs.body.deeplink }}
- id: fetch-second-identity-probe
  use: http-request
  with:
    method: GET
    url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-second-identity-probe.outputs.body.session_id }}
    expected_status: 200
- id: create-multiple-omitted
  use: http-request
  with:
    method: POST
    url: ${fixture.verifier_url}/openid4vp/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      scheme: haip-vp://
      request_uri_method: post
      request_delivery: by_reference
      response_type: vp_token
      response_mode: direct_post
      presentation_request:
        nonce: pid-multiple-omitted
        dcql_query:
          credentials:
          - id: pid
            format: dc+sd-jwt
            meta:
              vct_values:
              - urn:eudi:pid:1
            claims:
            - path:
              - family_name
            - path:
              - document_number
- id: present-multiple-omitted
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-engagement-haip-vp
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-multiple-omitted.outputs.body.deeplink }}
- id: fetch-multiple-omitted
  use: http-request
  with:
    method: GET
    url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-multiple-omitted.outputs.body.session_id }}
    expected_status: 200
- id: create-multiple-false
  use: http-request
  with:
    method: POST
    url: ${fixture.verifier_url}/openid4vp/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      scheme: haip-vp://
      request_uri_method: post
      request_delivery: by_reference
      response_type: vp_token
      response_mode: direct_post
      presentation_request:
        nonce: pid-multiple-false
        dcql_query:
          credentials:
          - id: pid
            format: dc+sd-jwt
            multiple: false
            meta:
              vct_values:
              - urn:eudi:pid:1
            claims:
            - path:
              - family_name
            - path:
              - document_number
- id: present-multiple-false
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-engagement-haip-vp
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-multiple-false.outputs.body.deeplink }}
- id: fetch-multiple-false
  use: http-request
  with:
    method: GET
    url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-multiple-false.outputs.body.session_id }}
    expected_status: 200
- id: run-fcaf-validators
  use: fcaf-validation
  with:
    test_ids:
    - WS_RP_IA_MainInteraction__040
    - WS_RP_IA_MainInteraction__041
    suite: wallet_solution/relying_party
    pipeline_outputs:
      pipeline.fixtures.pid-multiple-credentials:
        output:
          fixture_exchanges:
          - ${{ fetch-baseline-probe.outputs.body }}
          - ${{ fetch-second-identity-probe.outputs.body }}
          multiple_omitted_exchange: ${{ fetch-multiple-omitted.outputs.body }}
          multiple_omitted_visual_evidence: ${{ present-multiple-omitted.outputs.flow_output.maestro_screenshot_urls }}
          multiple_false_exchange: ${{ fetch-multiple-false.outputs.body }}
          multiple_false_visual_evidence: ${{ present-multiple-false.outputs.flow_output.maestro_screenshot_urls }}
