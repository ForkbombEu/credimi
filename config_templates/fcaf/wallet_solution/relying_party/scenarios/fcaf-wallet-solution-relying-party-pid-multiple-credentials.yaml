name: FCAF two distinct PIDs satisfying one credential query
runtime:
  fixture:
    issuer_url: https://capture-wallet.credimi.io
    log_checker: capture-wallet
  global_device_id: forkbomb-bv-andrea/usb/device
  temporal:
    activity_options:
      schedule_to_close_timeout: 50m
      start_to_close_timeout: 50m
      retry_policy:
        maximum_attempts: 1
# The sources need a Wallet holding at least two distinct PIDs that satisfy the
# same query when each query arrives. The reference Wallet spends a credential
# instance per presentation, so possession is proven from the issuer sessions,
# not by presenting, and the two identities are issued again before the second
# query: the first query spends one of them.
steps:
- id: create-baseline-issuance
  use: http-request
  with:
    method: POST
    url: ${fixture.issuer_url}/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      issuer_configuration_id: eu-pid-device-bound
      credential_configuration_id: urn:eu.europa.ec.eudi:pid:1.sd-jwt.key-attestation-required
      fixture_id: pid_default
- id: obtain-baseline-credential
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/getcredential-generic-credential-without-authentication
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-baseline-issuance.outputs.body.deeplink }}
- id: fetch-baseline-issuance
  use: http-request
  with:
    method: GET
    url: ${fixture.issuer_url}/sessions/${{ create-baseline-issuance.outputs.body.session_id }}
    expected_status: 200
- id: create-second-identity-issuance
  use: http-request
  with:
    method: POST
    url: ${fixture.issuer_url}/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      issuer_configuration_id: eu-pid-device-bound
      credential_configuration_id: urn:eu.europa.ec.eudi:pid:1.sd-jwt.key-attestation-required
      fixture_id: pid_person_b
- id: obtain-second-identity-credential
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/getcredential-generic-credential-without-authentication
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-second-identity-issuance.outputs.body.deeplink }}
- id: fetch-second-identity-issuance
  use: http-request
  with:
    method: GET
    url: ${fixture.issuer_url}/sessions/${{ create-second-identity-issuance.outputs.body.session_id }}
    expected_status: 200
- id: create-multiple-omitted
  use: http-request
  with:
    method: POST
    url: ${fixture.verifier_url}/openid4vp/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      scheme: haip-vp://
      request_uri_method: post
      request_delivery: by_reference
      response_type: vp_token
      response_mode: direct_post.jwt
      presentation_request:
        nonce: pid-multiple-omitted
        dcql_query:
          credentials:
          - id: pid
            format: dc+sd-jwt
            meta:
              vct_values:
              - urn:eudi:pid:1
            claims:
            - path:
              - family_name
            - path:
              - document_number
- id: present-multiple-omitted
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-engagement-haip-vp
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-multiple-omitted.outputs.body.deeplink }}
- id: fetch-multiple-omitted
  use: http-request
  with:
    method: GET
    url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-multiple-omitted.outputs.body.session_id }}
    expected_status: 200
- id: create-replacement-baseline-issuance
  use: http-request
  with:
    method: POST
    url: ${fixture.issuer_url}/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      issuer_configuration_id: eu-pid-device-bound
      credential_configuration_id: urn:eu.europa.ec.eudi:pid:1.sd-jwt.key-attestation-required
      fixture_id: pid_default
- id: obtain-replacement-baseline-credential
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/getcredential-generic-credential-without-authentication
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-replacement-baseline-issuance.outputs.body.deeplink }}
- id: fetch-replacement-baseline-issuance
  use: http-request
  with:
    method: GET
    url: ${fixture.issuer_url}/sessions/${{ create-replacement-baseline-issuance.outputs.body.session_id }}
    expected_status: 200
- id: create-replacement-second-identity-issuance
  use: http-request
  with:
    method: POST
    url: ${fixture.issuer_url}/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      issuer_configuration_id: eu-pid-device-bound
      credential_configuration_id: urn:eu.europa.ec.eudi:pid:1.sd-jwt.key-attestation-required
      fixture_id: pid_person_b
- id: obtain-replacement-second-identity-credential
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/getcredential-generic-credential-without-authentication
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-replacement-second-identity-issuance.outputs.body.deeplink }}
- id: fetch-replacement-second-identity-issuance
  use: http-request
  with:
    method: GET
    url: ${fixture.issuer_url}/sessions/${{ create-replacement-second-identity-issuance.outputs.body.session_id }}
    expected_status: 200
- id: create-multiple-false
  use: http-request
  with:
    method: POST
    url: ${fixture.verifier_url}/openid4vp/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      scheme: haip-vp://
      request_uri_method: post
      request_delivery: by_reference
      response_type: vp_token
      response_mode: direct_post.jwt
      presentation_request:
        nonce: pid-multiple-false
        dcql_query:
          credentials:
          - id: pid
            format: dc+sd-jwt
            multiple: false
            meta:
              vct_values:
              - urn:eudi:pid:1
            claims:
            - path:
              - family_name
            - path:
              - document_number
- id: present-multiple-false
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-engagement-haip-vp
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-multiple-false.outputs.body.deeplink }}
- id: fetch-multiple-false
  use: http-request
  with:
    method: GET
    url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-multiple-false.outputs.body.session_id }}
    expected_status: 200
- id: run-fcaf-validators
  use: fcaf-validation
  with:
    test_ids:
    - WS_RP_IA_MainInteraction__040
    - WS_RP_IA_MainInteraction__041
    # 070 needs the same two matching PIDs as 040: its source's precondition is
    # a Wallet holding more than one credential matching the request.
    - WS_RP_MS_ProtocolMessages__070
    suite: wallet_solution/relying_party
    pipeline_outputs:
      pipeline.fixtures.pid-multiple-credentials:
        output:
          omitted_query_issuances:
          - ${{ fetch-baseline-issuance.outputs.body }}
          - ${{ fetch-second-identity-issuance.outputs.body }}
          false_query_issuances:
          - ${{ fetch-replacement-baseline-issuance.outputs.body }}
          - ${{ fetch-replacement-second-identity-issuance.outputs.body }}
          multiple_omitted_exchange: ${{ fetch-multiple-omitted.outputs.body }}
          multiple_omitted_visual_evidence: ${{ present-multiple-omitted.outputs.flow_output.maestro_screenshot_urls }}
          multiple_false_exchange: ${{ fetch-multiple-false.outputs.body }}
          multiple_false_visual_evidence: ${{ present-multiple-false.outputs.flow_output.maestro_screenshot_urls }}
