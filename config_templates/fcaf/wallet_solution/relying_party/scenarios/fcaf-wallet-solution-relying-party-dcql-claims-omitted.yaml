name: FCAF wallet relying-party DCQL claims omitted
runtime:
    fixture:
        verifier_url: https://capture-wallet.credimi.io
    global_runner_id: forkbomb-bv-andrea/usb
    temporal:
        activity_options:
            retry_policy:
                maximum_attempts: 1
            schedule_to_close_timeout: 50m
            start_to_close_timeout: 50m
steps:
    - id: evidence-request
      use: json-parse
      with:
        rawJSON: '{"dcql_query":{"credentials":[{"id":"pididentity01","format":"dc+sd-jwt","meta":{"vct_values":["urn:eudi:pid:1"]}}]}}'
        struct_type: map
    - id: create-presentation
      use: http-request
      with:
        body:
            dcql_query:
                credentials:
                    - format: dc+sd-jwt
                      id: pididentity01
                      meta:
                        vct_values:
                            - urn:eudi:pid:1
            nonce: fcaf-082-claims-omitted
            response_type: vp_token
        expected_status: 201
        headers:
            Content-Type: application/json
        method: POST
        url: ${fixture.verifier_url}/openid4vp/sessions
    - id: present-without-claims
      use: mobile-automation
      with:
        action_code: |
            appId: eu.europa.ec.euidi
            ---
            - extendedWaitUntil:
                visible: "Home|Documents|Welcome, .*"
                timeout: 30000
            - openLink:
                link: ${env.DEEPLINK}
                autoVerify: false
                browser: false
            - extendedWaitUntil:
                visible: "DATA SHARING REQUEST"
                timeout: 100000
            - tapOn: "Share"
            - extendedWaitUntil:
                visible: "PIN"
                timeout: 30000
            - tapOn:
                point: "11%,39%"
            - inputText: "123456"
            - tapOn: { point: "50%,10%" }
            - extendedWaitUntil:
                visible: ".*successfully shared.*"
                timeout: 30000
            - takeScreenshot: fcaf-082-claims-omitted
            - tapOn: "Close"
        parameters:
            DEEPLINK: ${{ create-presentation.outputs.body.deeplink }}
        version_id: installed_from_external_source
    - id: get-presentation-result
      use: http-request
      with:
        expected_status: 200
        method: GET
        url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-presentation.outputs.body.session_id }}
    - id: run-fcaf-validators
      use: fcaf-validation
      with:
        pipeline_outputs:
            pipeline.dcql.claims-omitted:
                output:
                    create-presentation: ${{ create-presentation.outputs }}
                    dcql_exchange: ${{ get-presentation-result.outputs.body }}
                    evidence-request: ${{ evidence-request.outputs }}
                    get-presentation-result: ${{ get-presentation-result.outputs }}
                    present-without-claims: ${{ present-without-claims.outputs }}
                    visual_evidence: ${{ present-without-claims.outputs.flow_output.maestro_screenshot_urls }}
        suite: wallet_solution/relying_party
        test_ids:
            - WS_RP_MS_ProtocolMessages__082
