name: FCAF credential status list
runtime:
  fixture:
    issuer_url: https://beta-capture-wallet.credimi.io
    log_checker: capture-wallet
  global_device_id: forkbomb-bv-andrea/usb/device
  temporal:
    activity_options:
      schedule_to_close_timeout: 50m
      start_to_close_timeout: 50m
      retry_policy:
        maximum_attempts: 1
steps:
- id: create-status-sdjwt-issuance-session
  use: http-request
  with:
    method: POST
    url: ${fixture.issuer_url}/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      issuer_configuration_id: eu-pid-device-bound
      credential_configuration_id: urn:eu.europa.ec.eudi:pid:1.sd-jwt.key-attestation-required
      status_list_enabled: true
- id: obtain-status-sdjwt-credential
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/getcredential-generic-credential-without-authentication
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-status-sdjwt-issuance-session.outputs.body.deeplink }}
- id: create-status-sdjwt-presentation
  use: http-request
  with:
    method: POST
    url: ${fixture.verifier_url}/openid4vp/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      scheme: haip-vp://
      request_uri_method: post
      request_delivery: by_reference
      response_type: vp_token
      response_mode: direct_post
      presentation_request:
        nonce: fcaf-credential-status-sdjwt
        dcql_query:
          credentials:
          - id: pid
            format: dc+sd-jwt
            meta:
              vct_values:
              - urn:eudi:pid:1
            claims:
            - id: given_name
              path:
              - given_name
            - id: family_name
              path:
              - family_name
            claim_sets:
            - - given_name
              - family_name
- id: present-status-sdjwt
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-engagement-haip-vp
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-status-sdjwt-presentation.outputs.body.deeplink }}
- id: fetch-status-sdjwt-presentation
  use: http-request
  with:
    method: GET
    url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-status-sdjwt-presentation.outputs.body.session_id }}
    expected_status: 200
- id: create-status-mdoc-issuance-session
  use: http-request
  with:
    method: POST
    url: ${fixture.issuer_url}/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      issuer_configuration_id: eu-pid-device-bound
      credential_configuration_id: urn:eu.europa.ec.eudi:pid:1.mdoc.key-attestation-required
      status_list_enabled: true
- id: obtain-status-mdoc-credential
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/getcredential-generic-credential-without-authentication
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-status-mdoc-issuance-session.outputs.body.deeplink }}
- id: create-status-mdoc-presentation
  use: http-request
  with:
    method: POST
    url: ${fixture.verifier_url}/openid4vp/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      scheme: haip-vp://
      request_uri_method: post
      request_delivery: by_reference
      response_type: vp_token
      response_mode: direct_post
      presentation_request:
        nonce: fcaf-credential-status-mdoc
        dcql_query:
          credentials:
          - id: pid_mdoc
            format: mso_mdoc
            meta:
              doctype_value: eu.europa.ec.eudi.pid.1
            claims:
            - path:
              - eu.europa.ec.eudi.pid.1
              - given_name
            - path:
              - eu.europa.ec.eudi.pid.1
              - family_name
- id: present-status-mdoc
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-engagement-haip-vp
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-status-mdoc-presentation.outputs.body.deeplink }}
- id: fetch-status-mdoc-presentation
  use: http-request
  with:
    method: GET
    url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-status-mdoc-presentation.outputs.body.session_id }}
    expected_status: 200
- id: run-fcaf-validators
  use: fcaf-validation
  with:
    test_ids:
    - WS_RP_MS_CredentialFormats__029a
    - WS_RP_MS_CredentialFormats__029b
    - WS_RP_MS_CredentialFormats__029c
    - WS_RP_MS_CredentialFormats__029d
    - WS_RP_MS_CredentialFormats__029e
    - WS_RP_MS_CredentialFormats__029f
    - WS_RP_MS_CredentialFormats__029g
    - WS_RP_MS_CredentialFormats__033a
    - WS_RP_MS_CredentialFormats__033b
    - WS_RP_MS_CredentialFormats__033c
    - WS_RP_MS_CredentialFormats__033d
    - WS_RP_MS_CredentialFormats__033e
    - WS_RP_MS_CredentialFormats__033f
    - WS_RP_MS_CredentialFormats__033g
    - WS_RP_MS_CredentialFormats__033h
    - WS_RP_MS_CredentialFormats__033
    - WS_RP_MS_CredentialFormats__044
    - WS_RP_MS_CredentialFormats__030
    - WS_RP_MS_CredentialFormats__031
    - WS_RP_MS_Metadata__081
    - WS_RP_MS_Metadata__083
    - WS_RP_MS_Metadata__085
    - WS_RP_MS_Metadata__088
    suite: wallet_solution/relying_party
    pipeline_outputs:
      pipeline.credential-status.sdjwt:
        output:
          pid_sdjwt: ${{ fetch-status-sdjwt-presentation.outputs.body.observed.wallet_response.value.vp_token }}
          visual_evidence: ${{ present-status-sdjwt.outputs.flow_output.maestro_screenshot_urls }}
      pipeline.credential-status.mdoc:
        output:
          pid_mdoc: ${{ fetch-status-mdoc-presentation.outputs.body.observed.wallet_response.value.vp_token }}
          visual_evidence: ${{ present-status-mdoc.outputs.flow_output.maestro_screenshot_urls }}
