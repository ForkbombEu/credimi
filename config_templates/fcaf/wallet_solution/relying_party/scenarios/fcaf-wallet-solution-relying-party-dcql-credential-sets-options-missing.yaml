name: FCAF wallet relying-party DCQL credential_sets options missing
runtime:
  temporal:
    activity_options:
      schedule_to_close_timeout: 50m
      start_to_close_timeout: 50m
      retry_policy: { maximum_attempts: 1 }
steps:
  - id: create-capture-session
    use: http-request
    with:
      method: POST
      url: ${fixture.verifier_url}/openid4vp/sessions
      expected_status: 201
      headers: { Content-Type: application/json }
      body:
        response_mode: direct_post.jwt
        presentation_request:
          nonce: fcaf-dcql-credential-sets-options-missing
          dcql_query:
            credentials:
              - id: pid_sdjwt
                format: dc+sd-jwt
                meta:
                  vct_values: ["urn:eudi:pid:1"]
                claims:
                  - path: [given_name]
            credential_sets:
              - required: true
  - id: reject-missing-credential-sets-options
    use: mobile-automation
    with:
      action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-expect-request-rejected
      version_id: installed_from_external_source
      parameters:
        deeplink: ${{ create-capture-session.outputs.body.deeplink }}
  - id: fetch-capture-session
    use: http-request
    with:
      method: GET
      url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-capture-session.outputs.body.session_id }}
      expected_status: 200

  - id: run-fcaf-validators
    use: fcaf-validation
    with:
      test_ids:
        - WS_RP_MS_ProtocolMessages__096
      suite: wallet_solution/relying_party
      pipeline_outputs:
        pipeline.dcql.credential-sets-options-missing:
          output:
            dcql_exchange: ${{ fetch-capture-session.outputs.body }}
            visual_evidence: ${{ reject-missing-credential-sets-options.outputs.flow_output.maestro_screenshot_urls }}
            create-capture-session: ${{ create-capture-session.outputs }}
            reject-missing-credential-sets-options: ${{ reject-missing-credential-sets-options.outputs }}
            fetch-capture-session: ${{ fetch-capture-session.outputs }}
