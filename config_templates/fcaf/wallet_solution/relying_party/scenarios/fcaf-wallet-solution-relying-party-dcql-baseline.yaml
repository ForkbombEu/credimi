name: FCAF baseline PID presentation
runtime:
  fixture:
    issuer_url: https://capture-wallet.credimi.io
    log_checker: capture-wallet
  global_device_id: forkbomb-bv-andrea/usb/device
  temporal:
    activity_options:
      schedule_to_close_timeout: 50m
      start_to_close_timeout: 50m
      retry_policy:
        maximum_attempts: 1
# The one baseline exchange every test that needs a plain HAIP SD-JWT PID
# presentation reads: a by-reference Request Object retrieved with POST,
# answered with direct_post.jwt, asking for given_name. Fifteen scenarios used
# to repeat this identical request, each with its own wallet reset, PID and
# presentation; the evidence a test reads from it is the same whichever copy
# produced it.
steps:
- id: create-capture-session
  use: http-request
  with:
    method: POST
    url: ${fixture.verifier_url}/openid4vp/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      scheme: haip-vp://
      request_uri_method: post
      request_delivery: by_reference
      response_type: vp_token
      response_mode: direct_post.jwt
      presentation_request:
        nonce: dcql-baseline
        dcql_query:
          credentials:
          - id: pid
            format: dc+sd-jwt
            meta:
              vct_values:
              - urn:eudi:pid:1
            claims:
            - path:
              - given_name
# A second session of the same request, retrieved by the pipeline itself so the
# Request URI response can be inspected without consuming the Wallet's.
- id: create-request-uri-media-type-probe
  use: http-request
  with:
    method: POST
    url: ${fixture.verifier_url}/openid4vp/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      scheme: haip-vp://
      request_uri_method: post
      request_delivery: by_reference
      response_type: vp_token
      response_mode: direct_post.jwt
      presentation_request:
        nonce: dcql-baseline-request-uri-media-type
        dcql_query:
          credentials:
          - id: pid
            format: dc+sd-jwt
            meta:
              vct_values:
              - urn:eudi:pid:1
            claims:
            - path:
              - given_name
- id: probe-request-uri-response
  use: http-request
  with:
    method: POST
    url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-request-uri-media-type-probe.outputs.body.session_id }}/request
    expected_status: 200
- id: exercise-wallet
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-exercise-wallet-generic
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-capture-session.outputs.body.deeplink }}
- id: fetch-capture-session
  use: http-request
  with:
    method: GET
    url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-capture-session.outputs.body.session_id }}
    expected_status: 200
- id: fetch-signed-request-object
  use: http-request
  with:
    method: GET
    url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-capture-session.outputs.body.session_id }}/request
    expected_status: 200
