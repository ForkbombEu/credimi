    - WS_RP_SM_RpIntegrity__008
    - WS_RP_SM_RpIntegrity__009
    - WS_RP_SM_RpIntegrity__010
    - WS_RP_SM_RpIntegrity__011
    - WS_RP_SM_RpIntegrity__012
    - WS_RP_SM_RpIntegrity__025
    - WS_RP_SM_RpIntegrity__032
    - WS_RP_SM_RpIntegrity__033
    - WS_RP_SM_RpIntegrity__034
    - WS_RP_UC_Presentation__003
    - WS_RP_UC_Presentation__004
    suite: wallet_solution/relying_party
    pipeline_outputs:
      pipeline.dcql.baseline:
        output:
          session: ${{ fetch-capture-session.outputs.body }}
          visual_evidence: ${{ exercise-wallet.outputs.flow_output.maestro_screenshot_urls }}
          vp_token: ${{ fetch-capture-session.outputs.body.raw.presentation_response_decrypted.vp_token }}
          wallet_response: ${{ fetch-capture-session.outputs.body.raw.presentation_response_decrypted }}
          request_object: ${{ fetch-capture-session.outputs.body.raw.authorization_request_jwt }}
          request_uri_payload: ${{ fetch-capture-session.outputs.body.observed.request_uri_payload.value }}
          session_checks: ${{ fetch-capture-session.outputs.body.checks }}
          signed_request_object: ${{ fetch-signed-request-object.outputs.body }}
          client_id_evidence:
            deeplink: ${{ create-capture-session.outputs.body.deeplink }}
            request_object: ${{ fetch-signed-request-object.outputs.body }}
          wallet_nonce_evidence:
            request_object: ${{ fetch-signed-request-object.outputs.body }}
            request_uri_payload: ${{ fetch-capture-session.outputs.body.observed.request_uri_payload.value }}
          request_uri_response: ${{ probe-request-uri-response.outputs }}
          probe_request_object: ${{ probe-request-uri-response.outputs.body }}
