name: FCAF wallet relying-party DCQL trusted authorities values empty string
runtime:
  temporal:
    activity_options:
      schedule_to_close_timeout: 50m
      start_to_close_timeout: 50m
      retry_policy:
        maximum_attempts: 1
steps:
- id: create-single
  use: http-request
  with:
    method: POST
    url: ${fixture.verifier_url}/openid4vp/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      scheme: haip-vp://
      request_delivery: by_reference
      request_uri_method: post
      response_type: vp_token
      response_mode: direct_post.jwt
      presentation_request:
        nonce: fcaf-094-single
        dcql_query:
          credentials:
          - id: pididentity01
            format: dc+sd-jwt
            meta:
              vct_values:
              - urn:eudi:pid:1
            claims:
            - path:
              - given_name
      request_mutation:
        request_object:
          set:
            /dcql_query:
              credentials:
              - id: pididentity01
                format: dc+sd-jwt
                meta:
                  vct_values:
                  - urn:eudi:pid:1
                claims:
                - path:
                  - given_name
                trusted_authorities:
                - type: aki
                  values:
                  - ''
        verification_applies: false
- id: create-mixed
  use: http-request
  with:
    method: POST
    url: ${fixture.verifier_url}/openid4vp/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      scheme: haip-vp://
      request_delivery: by_reference
      request_uri_method: post
      response_type: vp_token
      response_mode: direct_post.jwt
      presentation_request:
        nonce: fcaf-094-mixed
        dcql_query:
          credentials:
          - id: pididentity01
            format: dc+sd-jwt
            meta:
              vct_values:
              - urn:eudi:pid:1
            claims:
            - path:
              - given_name
      request_mutation:
        request_object:
          set:
            /dcql_query:
              credentials:
              - id: pididentity01
                format: dc+sd-jwt
                meta:
                  vct_values:
                  - urn:eudi:pid:1
                claims:
                - path:
                  - given_name
                trusted_authorities:
                - type: aki
                  values:
                  - authority-key-id
                  - ''
        verification_applies: false
- id: exercise-trusted-authorities-values-empty-string
  use: mobile-automation
  with:
    version_id: installed_from_external_source
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-exercise-trusted-authorities-values-empty-string
    parameters:
      deeplink_SINGLE: ${{ create-single.outputs.body.deeplink }}
      deeplink_MIXED: ${{ create-mixed.outputs.body.deeplink }}
- id: fetch-single
  use: http-request
  with:
    method: GET
    url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-single.outputs.body.session_id }}
    expected_status: 200
- id: fetch-mixed
  use: http-request
  with:
    method: GET
    url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-mixed.outputs.body.session_id }}
    expected_status: 200
- id: run-fcaf-validators
  use: fcaf-validation
  with:
    test_ids:
    - WS_RP_MS_ProtocolMessages__094
    suite: wallet_solution/relying_party
    pipeline_outputs:
      pipeline.dcql.trusted-authorities-values-empty-string:
        output:
          single_value: ${{ fetch-single.outputs.body.raw.authorization_request_delivered }}
          mixed_value: ${{ fetch-mixed.outputs.body.raw.authorization_request_delivered }}
          visual_evidence: ${{ exercise-trusted-authorities-values-empty-string.outputs.flow_output.maestro_screenshot_urls }}
          single_value_session: ${{ fetch-single.outputs.body }}
          mixed_value_session: ${{ fetch-mixed.outputs.body }}
outputs:
  single_value:
    path: $.output.fetch-single.outputs.body.raw.authorization_request_delivered
    decoder: raw
  mixed_value:
    path: $.output.fetch-mixed.outputs.body.raw.authorization_request_delivered
    decoder: raw
  visual_evidence:
    path: $.output.exercise-trusted-authorities-values-empty-string.outputs.flow_output.maestro_screenshot_urls
    decoder: raw
  single_value_session:
    path: $.output.fetch-single.outputs.body
    decoder: raw
  mixed_value_session:
    path: $.output.fetch-mixed.outputs.body
    decoder: raw
failure_policy: fail_dependent_preconditions_and_tests
