name: FCAF wallet relying-party DCQL trusted authorities values empty string
runtime:
  temporal:
    activity_options:
      schedule_to_close_timeout: 50m
      start_to_close_timeout: 50m
      retry_policy:
        maximum_attempts: 1
steps:
- id: create-single
  use: http-request
  with:
    method: POST
    url: ${fixture.verifier_url}/openid4vp/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      scheme: haip-vp://
      request_delivery: by_reference
      request_uri_method: post
      response_type: vp_token
      response_mode: direct_post.jwt
      presentation_request:
        nonce: fcaf-094-single
        dcql_query:
          credentials:
          - id: pididentity01
            format: dc+sd-jwt
            meta:
              vct_values:
              - urn:eudi:pid:1
            claims:
            - path:
              - given_name
      request_mutation:
        request_object:
          set:
            /dcql_query:
              credentials:
              - id: pididentity01
                format: dc+sd-jwt
                meta:
                  vct_values:
                  - urn:eudi:pid:1
                claims:
                - path:
                  - given_name
                trusted_authorities:
                - type: aki
                  values:
                  - ''
        verification_applies: false
- id: create-mixed
  use: http-request
  with:
    method: POST
    url: ${fixture.verifier_url}/openid4vp/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      scheme: haip-vp://
      request_delivery: by_reference
      request_uri_method: post
      response_type: vp_token
      response_mode: direct_post.jwt
      presentation_request:
        nonce: fcaf-094-mixed
        dcql_query:
          credentials:
          - id: pididentity01
            format: dc+sd-jwt
            meta:
              vct_values:
              - urn:eudi:pid:1
            claims:
            - path:
              - given_name
      request_mutation:
        request_object:
          set:
            /dcql_query:
              credentials:
              - id: pididentity01
                format: dc+sd-jwt
                meta:
                  vct_values:
                  - urn:eudi:pid:1
                claims:
                - path:
                  - given_name
                trusted_authorities:
                - type: aki
                  values:
                  - authority-key-id
                  - ''
        verification_applies: false
- id: exercise-trusted-authorities-values-empty-string
  use: mobile-automation
  with:
    version_id: installed_from_external_source
    action_code: |
      appId: eu.europa.ec.euidi
      ---
      - stopApp
      - launchApp: { clearState: false }
      - extendedWaitUntil: { visible: "Welcome back|Home|Documents|Add document|Welcome, .*", timeout: 30000 }
      - runFlow:
          when: { visible: "Welcome back" }
          commands:
            - tapOn: { point: "11%,40%" }
            - inputText: "123456"
            - hideKeyboard
            - tapOn: { point: "50%,10%" }
      - openLink: { link: "${DEEPLINK_SINGLE}", autoVerify: false, browser: false }
      - waitForAnimationToEnd:
          timeout: 5000
      - runFlow:
          when:
            visible: "Welcome back"
          commands:
          - tapOn:
              point: "11%,40%"
          - inputText: "123456"
          - hideKeyboard
          - tapOn:
              point: "50%,10%"
      - tapOn: { text: "EUDI Wallet", optional: true }
      - tapOn: { text: "Just once", optional: true }
      - tapOn: { text: "Always", optional: true }
      - runFlow:
          when: { visible: "Welcome back" }
          commands:
            - tapOn: { point: "11%,40%" }
            - inputText: "123456"
            - hideKeyboard
            - tapOn: { point: "50%,10%" }
      - extendedWaitUntil: { visible: "Oups! Something went wrong|The requested document is not available in your EUDI Wallet.*|Data sharing request|Home|Documents|Welcome, .*", timeout: 30000 }
      - takeScreenshot: fcaf-094-single
      - runFlow:
          when: { visible: "Data sharing request" }
          commands:
            - tapOn: "Cancel"
            - waitForAnimationToEnd: { timeout: 3000 }
      - openLink: { link: "${DEEPLINK_MIXED}", autoVerify: false, browser: false }
      - waitForAnimationToEnd:
          timeout: 5000
      - runFlow:
          when:
            visible: "Welcome back"
          commands:
          - tapOn:
              point: "11%,40%"
          - inputText: "123456"
          - hideKeyboard
          - tapOn:
              point: "50%,10%"
      - tapOn: { text: "EUDI Wallet", optional: true }
      - tapOn: { text: "Just once", optional: true }
      - tapOn: { text: "Always", optional: true }
      - runFlow:
          when: { visible: "Welcome back" }
          commands:
            - tapOn: { point: "11%,40%" }
            - inputText: "123456"
            - hideKeyboard
            - tapOn: { point: "50%,10%" }
      - extendedWaitUntil: { visible: "Oups! Something went wrong|The requested document is not available in your EUDI Wallet.*|Data sharing request|Home|Documents|Welcome, .*", timeout: 30000 }
      - takeScreenshot: fcaf-094-mixed
      - runFlow:
          when: { visible: "Data sharing request" }
          commands:
            - tapOn: "Cancel"
            - waitForAnimationToEnd: { timeout: 3000 }
    parameters:
      DEEPLINK_SINGLE: ${{ create-single.outputs.body.deeplink }}
      DEEPLINK_MIXED: ${{ create-mixed.outputs.body.deeplink }}
- id: fetch-single
  use: http-request
  with:
    method: GET
    url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-single.outputs.body.session_id }}
    expected_status: 200
- id: fetch-mixed
  use: http-request
  with:
    method: GET
    url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-mixed.outputs.body.session_id }}
    expected_status: 200
- id: run-fcaf-validators
  use: fcaf-validation
  with:
    test_ids:
    - WS_RP_MS_ProtocolMessages__094
    suite: wallet_solution/relying_party
    pipeline_outputs:
      pipeline.dcql.trusted-authorities-values-empty-string:
        output:
          single_value: ${{ fetch-single.outputs.body.raw.authorization_request_delivered }}
          mixed_value: ${{ fetch-mixed.outputs.body.raw.authorization_request_delivered }}
          visual_evidence: ${{ exercise-trusted-authorities-values-empty-string.outputs.screenshot_urls }}
outputs:
  single_value:
    path: $.output.fetch-single.outputs.body.raw.authorization_request_delivered
    decoder: raw
  mixed_value:
    path: $.output.fetch-mixed.outputs.body.raw.authorization_request_delivered
    decoder: raw
  visual_evidence:
    path: $.output.exercise-trusted-authorities-values-empty-string.outputs.screenshot_urls
    decoder: raw
failure_policy: fail_dependent_preconditions_and_tests
