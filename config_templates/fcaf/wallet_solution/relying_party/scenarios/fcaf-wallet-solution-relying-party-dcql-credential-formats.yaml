            - WS_RP_MS_CredentialFormats__041
            - WS_RP_MS_CredentialFormats__044
            - WS_RP_MS_CredentialFormats__045
            - WS_RP_MS_CredentialFormats__046
            - WS_RP_MS_CredentialFormats__048
