name: FCAF credential-formats
runtime:
    fixture:
        issuer_url: https://capture-wallet.credimi.io
        log_checker: capture-wallet
        verifier_url: https://capture-wallet.credimi.io
    global_runner_id: forkbomb-bv-andrea/usb
    temporal:
        activity_options:
            retry_policy:
                maximum_attempts: 1
            schedule_to_close_timeout: 50m
            start_to_close_timeout: 50m
steps:
    - id: create-capture-session
      use: http-request
      with:
        body:
            presentation_request:
                dcql_query:
                    credentials:
                        - claims:
                            - path:
                                - given_name
                          format: dc+sd-jwt
                          id: pid
                          meta:
                            vct_values:
                                - urn:eudi:pid:1
                nonce: credential-formats
            request_delivery: by_reference
            request_uri_method: post
            response_mode: direct_post
            response_type: vp_token
            scheme: haip-vp://
        expected_status: 201
        headers:
            Content-Type: application/json
        method: POST
        url: https://capture-wallet.credimi.io/openid4vp/sessions
    - id: exercise-wallet
      use: mobile-automation
      with:
        action_code: |-
            appId: eu.europa.ec.euidi
            ---
            - launchApp:
                stopApp: true
                clearState: false
                permissions:
                  camera: allow
                  notifications: allow
                  all: unset
            - extendedWaitUntil:
                visible: "Welcome back|Home|Documents|Add document|Welcome, .*"
                timeout: 30000
            - runFlow:
                when:
                  visible: "Welcome back"
                commands:
                  - tapOn:
                      point: "11%,40%"
                  - inputText: "123456"
                  - hideKeyboard
                  - tapOn:
                      point: "50%,10%"
            - extendedWaitUntil:
                visible: "Home|Documents|Add document|Welcome, .*"
                timeout: 30000
            - openLink:
                link: "${DEEPLINK}"
                autoVerify: false
                browser: false
            - runFlow:
                when:
                  visible: "EUDI Wallet"
                commands:
                  - tapOn:
                      text: "EUDI Wallet"
                      optional: true
            - runFlow:
                when:
                  visible: "Just once"
                commands:
                  - tapOn:
                      text: "Just once"
                      optional: true
            - runFlow:
                when:
                  visible: "Always"
                commands:
                  - tapOn:
                      text: "Always"
                      optional: true
            - extendedWaitUntil:
                visible: "Welcome back|Error|invalid request|Something went wrong|DATA SHARING REQUEST"
                timeout: 100000
            - runFlow:
                when:
                  visible: "DATA SHARING REQUEST"
                commands:
                  - tapOn: "Share"
                  - extendedWaitUntil:
                      visible: "PIN"
                      timeout: 30000
                  - tapOn:
                      point: "11%,39%"
                  - inputText: "123456"
                  - tapOn:
                      point: "50%,10%"
                  - extendedWaitUntil:
                      visible: ".*successfully shared.*|Welcome back"
                      timeout: 30000
            - runFlow:
                when:
                  visible: "Welcome back"
                commands:
                  - tapOn:
                      point: "11%,40%"
                  - inputText: "123456"
            - extendedWaitUntil:
                visible: "Error|invalid request|Something went wrong|Home|Documents"
                timeout: 30000
            - takeScreenshot: credential-formats
            - back
        parameters:
            DEEPLINK: ${{ create-capture-session.outputs.body.deeplink }}
        version_id: installed_from_external_source
    - id: fetch-capture-session
      use: http-request
      with:
        expected_status: 200
        method: GET
        url: https://capture-wallet.credimi.io/openid4vp/sessions/${{ create-capture-session.outputs.body.session_id }}
    - id: credential-formats-035-create-pid-mdoc-offer
      use: credential-offer
      with:
        credential_id: /forkbomb-bv-andrea/misc-issuer-integration-demo/capture-issuer-pid-mdoc
    - id: credential-formats-035-obtain-pid-mdoc
      use: mobile-automation
      with:
        action_id: forkbomb-bv-andrea/eudiw-beta-wallet/getcredential-generic-credential-without-authentication
        parameters:
            deeplink: ${{ credential-formats-035-create-pid-mdoc-offer.outputs }}
        version_id: forkbomb-bv-andrea/eudiw-beta-wallet/2026-06-38-demo
    - id: credential-formats-035-create-capture-session
      use: http-request
      with:
        body:
            presentation_request:
                dcql_query:
                    credentials:
                        - claims:
                            - path:
                                - eu.europa.ec.eudi.pid.1
                                - given_name
                          format: mso_mdoc
                          id: pid_mdoc
                          meta:
                            doctype_value: eu.europa.ec.eudi.pid.1
                nonce: fcaf-credential-format-mso-mdoc
            request_delivery: by_reference
            request_uri_method: post
            response_mode: direct_post
            response_type: vp_token
            scheme: haip-vp://
        expected_status: 201
        headers:
            Content-Type: application/json
        method: POST
        url: https://capture-wallet.credimi.io/openid4vp/sessions
    - id: credential-formats-035-present-pid-mdoc
      use: mobile-automation
      with:
        action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-engagement-haip-vp
        parameters:
            deeplink: ${{ credential-formats-035-create-capture-session.outputs.body.deeplink }}
        version_id: forkbomb-bv-andrea/eudiw-beta-wallet/2026-06-38-demo
    - id: credential-formats-035-fetch-capture-session
      use: http-request
      with:
        expected_status: 200
        method: GET
        url: https://capture-wallet.credimi.io/openid4vp/sessions/${{ credential-formats-035-create-capture-session.outputs.body.session_id }}
    - id: credential-formats-036-create-pid-sdjwt-offer
      use: credential-offer
      with:
        credential_id: /forkbomb-bv-andrea/misc-issuer-integration-demo/capture-issuer-pid-dc-sd-jwt
    - id: credential-formats-036-obtain-pid-sdjwt
      use: mobile-automation
      with:
        action_id: forkbomb-bv-andrea/eudiw-beta-wallet/getcredential-generic-credential-without-authentication
        parameters:
            deeplink: ${{ credential-formats-036-create-pid-sdjwt-offer.outputs }}
        version_id: forkbomb-bv-andrea/eudiw-beta-wallet/2026-06-38-demo
    - id: credential-formats-036-create-capture-session
      use: http-request
      with:
        body:
            presentation_request:
                dcql_query:
                    credentials:
                        - claims:
                            - path:
                                - given_name
                          format: dc+sd-jwt
                          id: pid_sdjwt
                          meta:
                            vct_values:
                                - urn:eudi:pid:1
                nonce: fcaf-credential-format-dc-sd-jwt
            request_delivery: by_reference
            request_uri_method: post
            response_mode: direct_post
            response_type: vp_token
            scheme: haip-vp://
        expected_status: 201
        headers:
            Content-Type: application/json
        method: POST
        url: https://capture-wallet.credimi.io/openid4vp/sessions
    - id: credential-formats-036-present-pid-sdjwt
      use: mobile-automation
      with:
        action_id: forkbomb-bv-andrea/eudiw-beta-wallet/fcaf-engagement-haip-vp
        parameters:
            deeplink: ${{ credential-formats-036-create-capture-session.outputs.body.deeplink }}
        version_id: forkbomb-bv-andrea/eudiw-beta-wallet/2026-06-38-demo
    - id: credential-formats-036-fetch-capture-session
      use: http-request
      with:
        expected_status: 200
        method: GET
        url: https://capture-wallet.credimi.io/openid4vp/sessions/${{ credential-formats-036-create-capture-session.outputs.body.session_id }}
    - id: credential-formats-039-create-capture-session
      use: http-request
      with:
        body:
            presentation_request:
                dcql_query:
                    credentials:
                        - claims:
                            - path:
                                - eu.europa.ec.eudi.pid.1
                                - given_name
                          format: mso_mdoc
                          id: pid_mdoc
                          meta:
                            doctype_value: eu.europa.ec.eudi.pid.1
                nonce: fcaf-credential-formats-039
            request_delivery: by_reference
            request_uri_method: post
            response_mode: direct_post
            response_type: vp_token id_token
            scheme: haip-vp://
        expected_status: 201
        headers:
            Content-Type: application/json
        method: POST
        url: ${fixture.verifier_url}/openid4vp/sessions
    - id: credential-formats-039-exercise-wallet
      use: mobile-automation
      with:
        action_code: |
            appId: eu.europa.ec.euidi
            ---
            - stopApp
            - launchApp: { clearState: false }
            - extendedWaitUntil: { visible: "Welcome back|Home|Documents|Add document|Welcome, .*", timeout: 30000 }
            - runFlow:
                when: { visible: "Welcome back" }
                commands:
                  - tapOn: { point: "11%,40%" }
                  - inputText: "123456"
                  - tapOn: { point: "50%,10%" }
            - openLink: { link: "${DEEPLINK}", autoVerify: false, browser: false }
            - runFlow:
                when: { visible: "EUDI Wallet" }
                commands:
                  - tapOn: { text: "EUDI Wallet", optional: true }
            - runFlow:
                when: { visible: "Just once" }
                commands:
                  - tapOn: { text: "Just once", optional: true }
            - runFlow:
                when: { visible: "Welcome back" }
                commands:
                  - tapOn: { point: "11%,40%" }
                  - inputText: "123456"
                  - tapOn: { point: "50%,10%" }
            - extendedWaitUntil: { visible: "unsupported_response_type|Oups! Something went wrong|Error|Home|Documents|Welcome, .*", timeout: 100000 }
            - takeScreenshot: fcaf-credential-formats-039-response-type-rejected
        parameters:
            DEEPLINK: ${{ credential-formats-039-create-capture-session.outputs.body.deeplink }}
        version_id: installed_from_external_source
    - id: credential-formats-039-fetch-capture-session
      use: http-request
      with:
        expected_status: 200
        method: GET
        url: ${fixture.verifier_url}/openid4vp/sessions/${{ credential-formats-039-create-capture-session.outputs.body.session_id }}
    - id: credential-formats-040-create-capture-session
      use: http-request
      with:
        body:
            presentation_request:
                dcql_query:
                    credentials:
                        - claims:
                            - path:
                                - eu.europa.ec.eudi.pid.1
                                - given_name
                          format: mso_mdoc
                          id: pid_mdoc
                          meta:
                            doctype_value: eu.europa.ec.eudi.pid.1
                nonce: fcaf-credential-formats-040
            request_delivery: by_reference
            request_uri_method: post
            response_mode: direct_post
            response_type: code
            scheme: haip-vp://
        expected_status: 201
        headers:
            Content-Type: application/json
        method: POST
        url: ${fixture.verifier_url}/openid4vp/sessions
    - id: credential-formats-040-exercise-wallet
      use: mobile-automation
      with:
        action_code: |
            appId: eu.europa.ec.euidi
            ---
            - stopApp
            - launchApp: { clearState: false }
            - extendedWaitUntil: { visible: "Welcome back|Home|Documents|Add document|Welcome, .*", timeout: 30000 }
            - runFlow:
                when: { visible: "Welcome back" }
                commands:
                  - tapOn: { point: "11%,40%" }
                  - inputText: "123456"
                  - tapOn: { point: "50%,10%" }
            - openLink: { link: "${DEEPLINK}", autoVerify: false, browser: false }
            - runFlow:
                when: { visible: "EUDI Wallet" }
                commands:
                  - tapOn: { text: "EUDI Wallet", optional: true }
            - runFlow:
                when: { visible: "Just once" }
                commands:
                  - tapOn: { text: "Just once", optional: true }
            - runFlow:
                when: { visible: "Welcome back" }
                commands:
                  - tapOn: { point: "11%,40%" }
                  - inputText: "123456"
                  - tapOn: { point: "50%,10%" }
            - extendedWaitUntil: { visible: "unsupported_response_type|Oups! Something went wrong|Error|Home|Documents|Welcome, .*", timeout: 100000 }
            - takeScreenshot: fcaf-credential-formats-040-response-type-rejected
        parameters:
            DEEPLINK: ${{ credential-formats-040-create-capture-session.outputs.body.deeplink }}
        version_id: installed_from_external_source
    - id: credential-formats-040-fetch-capture-session
      use: http-request
      with:
        expected_status: 200
        method: GET
        url: ${fixture.verifier_url}/openid4vp/sessions/${{ credential-formats-040-create-capture-session.outputs.body.session_id }}
    - id: run-fcaf-validators
      use: fcaf-validation
      with:
        pipeline_outputs:
            pipeline.credential-formats.mdoc-presentation:
                output:
                    create-capture-session: ${{ credential-formats-035-create-capture-session.outputs }}
                    create-pid-mdoc-offer: ${{ credential-formats-035-create-pid-mdoc-offer.outputs }}
                    dcql_exchange: ${{ credential-formats-035-fetch-capture-session.outputs.body }}
                    fetch-capture-session: ${{ credential-formats-035-fetch-capture-session.outputs }}
                    obtain-pid-mdoc: ${{ credential-formats-035-obtain-pid-mdoc.outputs }}
                    pid_mdoc: ${{ credential-formats-035-fetch-capture-session.outputs.body.observed.wallet_response.value.vp_token }}
                    present-pid-mdoc: ${{ credential-formats-035-present-pid-mdoc.outputs }}
                    visual_evidence: ${{ credential-formats-035-present-pid-mdoc.outputs.flow_output.maestro_screenshot_urls }}
            pipeline.credential-formats.sdjwt-presentation:
                output:
                    create-capture-session: ${{ credential-formats-036-create-capture-session.outputs }}
                    create-pid-sdjwt-offer: ${{ credential-formats-036-create-pid-sdjwt-offer.outputs }}
                    dcql_exchange: ${{ credential-formats-036-fetch-capture-session.outputs.body }}
                    fetch-capture-session: ${{ credential-formats-036-fetch-capture-session.outputs }}
                    obtain-pid-sdjwt: ${{ credential-formats-036-obtain-pid-sdjwt.outputs }}
                    pid_sdjwt: ${{ credential-formats-036-fetch-capture-session.outputs.body.observed.wallet_response.value.vp_token }}
                    present-pid-sdjwt: ${{ credential-formats-036-present-pid-sdjwt.outputs }}
                    visual_evidence: ${{ credential-formats-036-present-pid-sdjwt.outputs.flow_output.maestro_screenshot_urls }}
            pipeline.credential-formats.unsupported-response-type-code:
                output:
                    create-capture-session: ${{ credential-formats-040-create-capture-session.outputs }}
                    exercise-wallet: ${{ credential-formats-040-exercise-wallet.outputs }}
                    fetch-capture-session: ${{ credential-formats-040-fetch-capture-session.outputs }}
                    oid4vp_exchange: ${{ credential-formats-040-fetch-capture-session.outputs.body }}
                    visual_evidence: ${{ credential-formats-040-exercise-wallet.outputs.flow_output.maestro_screenshot_urls }}
            pipeline.credential-formats.unsupported-response-type-vp-token-id-token:
                output:
                    create-capture-session: ${{ credential-formats-039-create-capture-session.outputs }}
                    exercise-wallet: ${{ credential-formats-039-exercise-wallet.outputs }}
                    fetch-capture-session: ${{ credential-formats-039-fetch-capture-session.outputs }}
                    oid4vp_exchange: ${{ credential-formats-039-fetch-capture-session.outputs.body }}
                    visual_evidence: ${{ credential-formats-039-exercise-wallet.outputs.flow_output.maestro_screenshot_urls }}
            pipeline.dcql.credential-formats:
                output:
                    dcql_exchange: ${{ fetch-capture-session.outputs.body }}
                    visual_evidence: ${{ exercise-wallet.outputs.flow_output.maestro_screenshot_urls }}
        suite: wallet_solution/relying_party
        test_ids:
            - WS_RP_MS_CredentialFormats__029
            - WS_RP_MS_CredentialFormats__030
            - WS_RP_MS_CredentialFormats__031
            - WS_RP_MS_CredentialFormats__032
            - WS_RP_MS_CredentialFormats__033
            - WS_RP_MS_CredentialFormats__034
            - WS_RP_MS_CredentialFormats__035
            - WS_RP_MS_CredentialFormats__036
