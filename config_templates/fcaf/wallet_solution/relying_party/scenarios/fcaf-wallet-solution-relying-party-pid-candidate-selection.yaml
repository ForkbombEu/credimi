# One credential query that two held PIDs satisfy. Wallet 2026.09.42 lists the
# candidates as radio options "Option N of M" on the consent screen and exposes
# only the selected option's text to accessibility, so the flow reads "Option 1
# of M" first, taps the second option card by position, and then requires
# "Option 2 of M" before sharing.
name: FCAF user selection between matching PIDs
runtime:
  fixture:
    issuer_url: https://capture-wallet.credimi.io
    log_checker: capture-wallet
  global_device_id: forkbomb-bv-andrea/usb/device
  temporal:
    activity_options:
      schedule_to_close_timeout: 50m
      start_to_close_timeout: 50m
      retry_policy:
        maximum_attempts: 1
steps:
- id: create-baseline-issuance
  use: http-request
  with:
    method: POST
    url: ${fixture.issuer_url}/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      issuer_configuration_id: eu-pid-device-bound
      credential_configuration_id: urn:eu.europa.ec.eudi:pid:1.sd-jwt.key-attestation-required
      fixture_id: pid_default
- id: obtain-baseline-credential
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/getcredential-generic-credential-without-authentication
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-baseline-issuance.outputs.body.deeplink }}
- id: fetch-baseline-issuance
  use: http-request
  with:
    method: GET
    url: ${fixture.issuer_url}/sessions/${{ create-baseline-issuance.outputs.body.session_id }}
    expected_status: 200
- id: create-second-identity-issuance
  use: http-request
  with:
    method: POST
    url: ${fixture.issuer_url}/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      issuer_configuration_id: eu-pid-device-bound
      credential_configuration_id: urn:eu.europa.ec.eudi:pid:1.sd-jwt.key-attestation-required
      fixture_id: pid_person_b
- id: obtain-second-identity-credential
  use: mobile-automation
  with:
    action_id: forkbomb-bv-andrea/eudiw-beta-wallet/getcredential-generic-credential-without-authentication
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-second-identity-issuance.outputs.body.deeplink }}
- id: fetch-second-identity-issuance
  use: http-request
  with:
    method: GET
    url: ${fixture.issuer_url}/sessions/${{ create-second-identity-issuance.outputs.body.session_id }}
    expected_status: 200
- id: create-candidate-request
  use: http-request
  with:
    method: POST
    url: ${fixture.verifier_url}/openid4vp/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      request_uri_method: post
      request_delivery: by_reference
      response_type: vp_token
      response_mode: direct_post.jwt
      presentation_request:
        nonce: fcaf-pid-candidate-selection
        dcql_query:
          credentials:
          - id: pid
            format: dc+sd-jwt
            meta:
              vct_values:
              - urn:eudi:pid:1
            claims:
            - path:
              - family_name
            - path:
              - document_number
              values:
              - CREDIMI-DEMO-001
              - CREDIMI-DEMO-002
- id: select-and-share-candidate
  use: mobile-automation
  with:
    version_id: installed_from_external_source
    parameters:
      deeplink: ${{ create-candidate-request.outputs.body.deeplink }}
    action_code: |
      appId: eu.europa.ec.euidi
      ---
      - launchApp:
          stopApp: true
          clearState: false
      - extendedWaitUntil:
          visible: "Welcome back|Home|Documents|Add document|Welcome, .*"
          timeout: 30000
      - runFlow:
          when:
            visible: "1"
          commands:
            - inputText: "12345"
            - tapOn: "6"
      - extendedWaitUntil:
          visible: "Home|Documents|Add document|Welcome, .*"
          timeout: 30000
      - openLink:
          link: "${deeplink}"
          autoVerify: false
          browser: false
      - tapOn:
          text: "Just once"
          optional: true
      - extendedWaitUntil:
          visible: "Welcome back|Data sharing request"
          timeout: 100000
      - runFlow:
          when:
            visible: "Welcome back"
          commands:
            - extendedWaitUntil:
                visible: "1"
                timeout: 30000
            - inputText: "12345"
            - tapOn: "6"
      - extendedWaitUntil:
          visible: "Data sharing request"
          timeout: 30000
      # M >= 2 proves several candidates are offered; reading "Option 2 of M"
      # after the tap proves the user could select the second one.
      - assertVisible: "Option 1 of [2-9][0-9]*"
      - takeScreenshot: pid-candidates-offered
      - tapOn:
          point: "15%,53%"
      - assertVisible: "Option 2 of [2-9][0-9]*"
      - takeScreenshot: pid-candidate-selected
      - tapOn: "Share"
      - extendedWaitUntil:
          visible: "1"
          timeout: 30000
      - inputText: "12345"
      - tapOn: "6"
      - extendedWaitUntil:
          visible: ".*successfully shared.*"
          timeout: 30000
      - takeScreenshot: pid-candidate-shared
- id: fetch-candidate-request
  use: http-request
  with:
    method: GET
    url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-candidate-request.outputs.body.session_id }}
    expected_status: 200
- id: run-fcaf-validators
  use: fcaf-validation
  with:
    test_ids:
    - WS_RP_MS_ProtocolMessages__013
    suite: wallet_solution/relying_party
    pipeline_outputs:
      pipeline.fixtures.pid-candidate-selection:
        output:
          baseline_issuance: ${{ fetch-baseline-issuance.outputs.body }}
          second_identity_issuance: ${{ fetch-second-identity-issuance.outputs.body }}
          dcql_exchange: ${{ fetch-candidate-request.outputs.body }}
          visual_evidence: ${{ select-and-share-candidate.outputs.flow_output.maestro_screenshot_urls }}
