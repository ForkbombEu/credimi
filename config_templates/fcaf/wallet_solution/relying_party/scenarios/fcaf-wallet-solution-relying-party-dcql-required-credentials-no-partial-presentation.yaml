name: FCAF DCQL required credentials without partial presentation
runtime:
  global_runner_id: forkbomb-bv-andrea/usb
  fixture:
    issuer_url: https://capture-wallet.credimi.io
    verifier_url: https://capture-wallet.credimi.io
    log_checker: capture-wallet
steps:
  - id: create-capture-session
    use: http-request
    with:
      method: POST
      url: https://capture-wallet.credimi.io/openid4vp/sessions
      expected_status: 201
      headers:
        Content-Type: application/json
      body:
        response_mode: direct_post
        presentation_request:
          nonce: fcaf-ia-034
          dcql_query:
            credentials:
              - id: available_pid
                format: dc+sd-jwt
                meta:
                  vct_values:
                    - urn:eudi:pid:1
              - id: unavailable_credential
                format: dc+sd-jwt
                meta:
                  vct_values:
                    - urn:credimi:fcaf:unavailable-required-credential:1
            credential_sets:
              - required: true
                options:
                  - - available_pid
                    - unavailable_credential
  - id: reject-partial-presentation
    use: mobile-automation
    with:
      version_id: installed_from_external_source
      parameters:
        DEEPLINK: ${{ create-capture-session.outputs.body.deeplink }}
      action_code: |
        appId: eu.europa.ec.euidi
        ---
        - launchApp:
            stopApp: true
            clearState: false
            permissions:
              camera: allow
              notifications: allow
              all: unset
        - extendedWaitUntil:
            visible: "Welcome back|Home|Documents|Add document|Welcome, .*"
            timeout: 30000
        - runFlow:
            when:
              visible: "Welcome back"
            commands:
              - tapOn:
                  point: "11%,40%"
              - inputText: "123456"
              - hideKeyboard
              - tapOn:
                  point: "50%,10%"
        - extendedWaitUntil:
            visible: "Home|Documents|Add document|Welcome, .*"
            timeout: 30000
        - openLink:
            link: "${DEEPLINK}"
            autoVerify: false
            browser: false
        - extendedWaitUntil:
            visible: "Oups! Something went wrong|Error|invalid request|Something went wrong|Home|Documents"
            timeout: 100000
        - takeScreenshot: fcaf-ia-034-required-credentials
  - id: fetch-capture-session
    use: http-request
    with:
      method: GET
      url: https://capture-wallet.credimi.io/openid4vp/sessions/${{ create-capture-session.outputs.body.session_id }}
      expected_status: 200
  - id: run-fcaf-validators
    use: fcaf-validation
    with:
      test_ids:
        - WS_RP_IA_MainInteraction__034
      suite: wallet_solution/relying_party
      pipeline_outputs:
        pipeline.dcql.required-credentials-no-partial-presentation:
          output:
            dcql_exchange: ${{ fetch-capture-session.outputs.body }}
            visual_evidence: ${{ reject-partial-presentation.outputs.flow_output.maestro_screenshot_urls }}
            create-capture-session: ${{ create-capture-session.outputs }}
            reject-partial-presentation: ${{ reject-partial-presentation.outputs }}
            fetch-capture-session: ${{ fetch-capture-session.outputs }}
