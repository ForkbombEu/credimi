name: FCAF wallet relying-party presentation redirect URI
runtime:
  temporal:
    activity_options:
      schedule_to_close_timeout: 50m
      start_to_close_timeout: 50m
      retry_policy:
        maximum_attempts: 1

steps:
  - id: create-presentation
    use: http-request
    with:
      method: POST
      url: ${fixture.verifier_url}/openid4vp/sessions
      expected_status: 201
      headers:
        Content-Type: application/json
      body:
        scheme: haip-vp://
        request_uri_method: post
        request_delivery: by_reference
        response_type: vp_token
        response_mode: direct_post
        redirect_uri: ${fixture.verifier_url}/openid4vp/redirect
        presentation_request:
          nonce: fcaf-supportive-redirect-uri
          dcql_query:
            credentials:
              - id: pid_mdoc
                format: mso_mdoc
                meta:
                  doctype_value: eu.europa.ec.eudi.pid.1
                claims:
                  - path:
                      - eu.europa.ec.eudi.pid.1
                      - given_name
                  - path:
                      - eu.europa.ec.eudi.pid.1
                      - family_name

  - id: submit-and-follow-redirect
    use: mobile-automation
    with:
      version_id: installed_from_external_source
      parameters:
        DEEPLINK: ${{ create-presentation.outputs.body.deeplink }}
      action_code: |
        appId: eu.europa.ec.euidi
        ---
        - stopApp
        - openLink: { link: ${env.DEEPLINK}, autoVerify: false, browser: false }
        - waitForAnimationToEnd:
            timeout: 5000
        - tapOn:
            text: "EUDI Wallet"
            optional: true
        - tapOn:
            text: "Just once"
            optional: true
        - extendedWaitUntil:
            visible: "Welcome back|Share|Cancel|Close"
            timeout: 100000
        - runFlow:
            when:
              visible: "Welcome back"
            commands:
              - tapOn:
                  point: "11%,40%"
              - inputText: "123456"
        - extendedWaitUntil:
            visible: "Share"
            timeout: 30000
        - tapOn:
            text: "Share"
            enabled: true
        - extendedWaitUntil:
            visible: "verify your identity|PIN"
            timeout: 30000
        - inputText: "123456"
        - extendedWaitUntil:
            visible: "Close"
            timeout: 30000
        - tapOn: "Close"
        - extendedWaitUntil:
            visible: "Presentation complete"
            timeout: 30000
        - assertVisible: "Presentation complete"
        - takeScreenshot: fcaf-supportive-redirect-uri-opened

  - id: get-presentation-result
    use: http-request
    with:
      method: GET
      url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-presentation.outputs.body.session_id }}
      expected_status: 200

  - id: run-fcaf-validators
    use: fcaf-validation
    with:
      test_ids:
        - WS_RP_IA_Supportive__001
      suite: wallet_solution/relying_party
      pipeline_outputs:
        pipeline.wallet.supportive.redirect-uri:
          output:
            dcql_exchange: ${{ get-presentation-result.outputs.body }}
            wallet_response: ${{ get-presentation-result.outputs.body }}
            capture_session: ${{ get-presentation-result.outputs.body }}
            visual_evidence: ${{ submit-and-follow-redirect.outputs.flow_output.maestro_screenshot_urls }}
            create-presentation: ${{ create-presentation.outputs }}
            submit-and-follow-redirect: ${{ submit-and-follow-redirect.outputs }}
            get-presentation-result: ${{ get-presentation-result.outputs }}
