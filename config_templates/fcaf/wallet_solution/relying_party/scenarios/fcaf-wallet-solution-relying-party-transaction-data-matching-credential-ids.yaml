name: 'FCAF ProtocolMessages 028: transaction_data credential IDs match DCQL'
runtime:
  fixture:
    verifier_url: https://capture-wallet.credimi.io
  global_runner_id: forkbomb-bv-andrea/usb
  temporal:
    activity_options:
      schedule_to_close_timeout: 50m
      start_to_close_timeout: 50m
      retry_policy:
        maximum_attempts: 1
steps:
- id: create-capture-session
  use: http-request
  with:
    method: POST
    url: ${fixture.verifier_url}/openid4vp/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      scheme: haip-vp://
      request_uri_method: post
      request_delivery: by_reference
      response_type: vp_token
      response_mode: direct_post
      presentation_request:
        nonce: fcaf-protocol-messages-028
        transaction_data:
        - type: payment
          data: dGVzdA==
          credential_ids:
          - pid
        dcql_query:
          credentials:
          - id: pid
            format: dc+sd-jwt
            meta:
              vct_values:
              - urn:eudi:pid:1
            claims:
            - path:
              - given_name
- id: exercise-wallet
  use: mobile-automation
  with:
    version_id: installed_from_external_source
    parameters:
      DEEPLINK: ${{ create-capture-session.outputs.body.deeplink }}
    action_code: |
      appId: eu.europa.ec.euidi
      ---
      - launchApp:
          stopApp: true
          clearState: false
          permissions: { camera: allow, notifications: allow, all: unset }
      - extendedWaitUntil: { visible: "Welcome back|Home|Documents|Add document|Welcome, .*", timeout: 30000 }
      - runFlow:
          when: { visible: "Welcome back" }
          commands:
            - tapOn: { point: "11%,40%" }
            - inputText: "123456"
            - hideKeyboard
            - tapOn: { point: "50%,10%" }
      - extendedWaitUntil: { visible: "Home|Documents|Add document|Welcome, .*", timeout: 30000 }
      - openLink: { link: "${DEEPLINK}", autoVerify: false, browser: false }
      - runFlow:
          when: { visible: "EUDI Wallet" }
          commands:
            - tapOn: { text: "EUDI Wallet", optional: true }
      - runFlow:
          when: { visible: "Just once" }
          commands:
            - tapOn: { text: "Just once", optional: true }
      - extendedWaitUntil: { visible: "Welcome back|Error|invalid request|Something went wrong|DATA SHARING REQUEST", timeout: 100000 }
      - runFlow:
          when: { visible: "DATA SHARING REQUEST" }
          commands:
            - tapOn: "Share"
            - extendedWaitUntil: { visible: "PIN", timeout: 30000 }
            - tapOn: { point: "11%,39%" }
            - inputText: "123456"
            - tapOn: { point: "50%,10%" }
            - extendedWaitUntil: { visible: ".*successfully shared.*|Welcome back", timeout: 30000 }
      - extendedWaitUntil: { visible: "Error|invalid request|Something went wrong|Home|Documents", timeout: 30000 }
      - takeScreenshot: protocol-messages-028
      - back
- id: fetch-capture-session
  use: http-request
  with:
    method: GET
    url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-capture-session.outputs.body.session_id }}
    expected_status: 200
- id: fetch-signed-request-object
  use: http-request
  with:
    method: GET
    url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-capture-session.outputs.body.session_id }}/request
    expected_status: 200
- id: run-fcaf-validators
  use: fcaf-validation
  with:
    test_ids:
    - WS_RP_MS_ProtocolMessages__028
    suite: wallet_solution/relying_party
    pipeline_outputs:
      pipeline.dcql.transaction-data-matching-credential-ids:
        output:
          request_object: ${{ fetch-signed-request-object.outputs.body }}
          dcql_exchange: ${{ fetch-capture-session.outputs.body }}
          visual_evidence: ${{ exercise-wallet.outputs.flow_output.maestro_screenshot_urls }}
