name: FCAF DCQL claims without values
runtime: { global_device_id: forkbomb-bv-andrea/usb/device }
steps:
  - id: create-presentation
    use: http-request
    with:
      method: POST
      url: ${fixture.verifier_url}/ui/presentations
      expected_status: 200
      headers: { Content-Type: application/json }
      body: { type: vp_token, nonce: fcaf-116, dcql_query: { credentials: [{ id: pid, format: dc+sd-jwt, meta: { vct_values: [urn:eu.europa.ec.eudi:pid:1] }, claims: [{ id: given_name, path: [given_name] }] }] } }
  - id: present-claim-without-values
    use: mobile-automation
    with:
      version_id: installed_from_external_source
      parameters: { CLIENT_ID: "${{ create-presentation.outputs.body.client_id }}", REQUEST_URI: "${{ create-presentation.outputs.body.request_uri }}" }
      action_code: |
        appId: eu.europa.ec.euidi
        ---
                - launchApp: { stopApp: true, clearState: false }
        - extendedWaitUntil: { visible: "Welcome back|Home|Documents|Welcome, .*", timeout: 30000 }
        - runFlow:
            when: { visible: "Welcome back" }
            commands:
              - tapOn: { point: "11%,40%" }
              - inputText: "123456"
              - tapOn: { point: "50%,10%" }
        - extendedWaitUntil: { visible: "Home|Documents|Welcome, .*", timeout: 30000 }
        - evalScript: ${output.authorizationRequest = 'eudi-openid4vp://?client_id=' + encodeURIComponent(env.CLIENT_ID) + '&request_uri=' + encodeURIComponent(env.REQUEST_URI)}
        - openLink: { link: ${output.authorizationRequest}, autoVerify: false, browser: false }
        - runFlow:
            when: { visible: "EUDI Wallet" }
            commands:
              - tapOn: { text: "EUDI Wallet", optional: true }
        - runFlow:
            when: { visible: "Just once" }
            commands:
              - tapOn: { text: "Just once", optional: true }
        - extendedWaitUntil: { visible: "Welcome back|DATA SHARING REQUEST", timeout: 100000 }
        - runFlow:
            when: { visible: "Welcome back" }
            commands:
              - tapOn: { point: "11%,39%" }
              - inputText: "123456"
              - tapOn: { point: "50%,10%" }
        - extendedWaitUntil: { visible: "DATA SHARING REQUEST", timeout: 100000 }
        - tapOn: "Share"
        - extendedWaitUntil: { visible: "PIN", timeout: 30000 }
        - tapOn: { point: "11%,39%" }
        - inputText: "123456"
        - tapOn: { point: "50%,10%" }
        - extendedWaitUntil: { visible: ".*successfully shared.*", timeout: 30000 }
        - takeScreenshot: fcaf-116-claims-without-values
        - tapOn: "Close"
  - id: fetch-result
    use: http-request
    with: { method: GET, url: "${fixture.verifier_url}/ui/presentations/${{ create-presentation.outputs.body.transaction_id }}", expected_status: 200 }

  - id: run-fcaf-validators
    use: fcaf-validation
    with:
      test_ids:
        - WS_RP_MS_ProtocolMessages__116
      suite: wallet_solution/relying_party
      pipeline_outputs:
        pipeline.dcql.claims-without-values:
          output:
            dcql_exchange: ${{ fetch-result.outputs.body }}
            visual_evidence: ${{ present-claim-without-values.outputs.flow_output.maestro_screenshot_urls }}
            create-presentation: ${{ create-presentation.outputs }}
            present-claim-without-values: ${{ present-claim-without-values.outputs }}
            fetch-result: ${{ fetch-result.outputs }}
