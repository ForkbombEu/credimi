name: FCAF DCQL credential_sets required omitted
runtime: { global_device_id: forkbomb-bv-andrea/usb/device }
steps:
  - id: create-presentation
    use: http-request
    with:
      method: POST
      url: ${fixture.verifier_url}/ui/presentations
      expected_status: 200
      headers: { Content-Type: application/json }
      body: { type: vp_token, nonce: fcaf-103, dcql_query: { credentials: [{ id: pid, format: dc+sd-jwt, meta: { vct_values: [urn:eu.europa.ec.eudi:pid:1] }, claims: [{ path: [given_name] }] }], credential_sets: [{ options: [[pid]] }] } }
  - id: present-default-required-set
    use: mobile-automation
    with:
      version_id: installed_from_external_source
      parameters: { CLIENT_ID: "${{ create-presentation.outputs.body.client_id }}", REQUEST_URI: "${{ create-presentation.outputs.body.request_uri }}" }
      action_code: |
        appId: eu.europa.ec.euidi
        ---
        - launchApp: { stopApp: false, clearState: false }
        - evalScript: ${output.authorizationRequest = 'eudi-openid4vp://?client_id=' + encodeURIComponent(env.CLIENT_ID) + '&request_uri=' + encodeURIComponent(env.REQUEST_URI)}
        - openLink: { link: ${output.authorizationRequest}, autoVerify: false, browser: false }
        - waitForAnimationToEnd: { timeout: 5000 }
        - tapOn: { text: "(?i)(continue|accept|authorize|share|present)", optional: true }
        - takeScreenshot: fcaf-103
  - id: fetch-result
    use: http-request
    with: { method: GET, url: "${fixture.verifier_url}/ui/presentations/${{ create-presentation.outputs.body.transaction_id }}", expected_status: 200 }

  - id: run-fcaf-validators
    use: fcaf-validation
    with:
      test_ids:
        - WS_RP_MS_ProtocolMessages__103
      suite: wallet_solution/relying_party
      pipeline_outputs:
        pipeline.dcql.credential-sets-required-omitted:
          output:
            dcql_exchange: ${{ fetch-result.outputs.body }}
            visual_evidence: ${{ present-default-required-set.outputs.flow_output.maestro_screenshot_urls }}
            create-presentation: ${{ create-presentation.outputs }}
            present-default-required-set: ${{ present-default-required-set.outputs }}
            fetch-result: ${{ fetch-result.outputs }}
