name: FCAF DCQL user-denied consent
runtime:
steps:
  - id: create-presentation
    use: http-request
    with:
      method: POST
      url: ${fixture.verifier_url}/openid4vp/sessions
      expected_status: 201
      headers: { Content-Type: application/json }
      body:
        scheme: haip-vp://
        request_delivery: by_reference
        response_type: vp_token
        response_mode: direct_post
        presentation_request:
          nonce: fcaf-148-user-denied-consent
          dcql_query:
            credentials:
              - id: pid-consent-denied
                format: dc+sd-jwt
                meta: { vct_values: ["urn:eudi:pid:1"] }
                claims:
                  - { path: [given_name] }

  - id: deny-consent
    use: mobile-automation
    with:
      version_id: installed_from_external_source
      parameters:
        DEEPLINK: ${{ create-presentation.outputs.body.deeplink }}
      action_code: |
        appId: eu.europa.ec.euidi
        ---
                - launchApp: { stopApp: true, clearState: false }
        - extendedWaitUntil:
            visible: "Welcome back|Home|Documents|Add document|Welcome, .*"
            timeout: 30000
        - runFlow:
            when:
              visible: "Welcome back"
            commands:
              - tapOn:
                  point: "11%,40%"
              - inputText: "123456"
              - hideKeyboard
              - tapOn: { point: "50%,10%" }
        - extendedWaitUntil:
            visible: "Home|Documents|Add document|Welcome, .*"
            timeout: 30000
        - openLink: { link: ${env.DEEPLINK}, autoVerify: false, browser: false }
        - runFlow:
            when:
              visible: "EUDI Wallet"
            commands:
              - tapOn: { text: "EUDI Wallet", optional: true }
        - runFlow:
            when:
              visible: "Just once"
            commands:
              - tapOn: { text: "Just once", optional: true }
        - runFlow:
            when:
              visible: "Always"
            commands:
              - tapOn: { text: "Always", optional: true }
        - extendedWaitUntil: { visible: "Welcome back|DATA SHARING REQUEST", timeout: 100000 }
        - runFlow:
            when: { visible: "Welcome back" }
            commands:
              - tapOn: { point: "11%,40%" }
              - tapOn: { text: "1", retryTapIfNoChange: false }
              - tapOn: { text: "2", retryTapIfNoChange: false }
              - tapOn: { text: "3", retryTapIfNoChange: false }
              - tapOn: { text: "4", retryTapIfNoChange: false }
              - tapOn: { text: "5", retryTapIfNoChange: false }
              - tapOn: { text: "6", retryTapIfNoChange: false, waitToSettleTimeoutMs: 0 }
        - extendedWaitUntil: { visible: "DATA SHARING REQUEST", timeout: 100000 }
        - assertVisible: { id: eu.europa.ec.euidi:id/request_screen_requested_document_0 }
        - tapOn: { id: eu.europa.ec.euidi:id/request_screen_requested_document_0, retryTapIfNoChange: false }
        - assertVisible: "Given Name(s)"
        - takeScreenshot: fcaf-148-consent-screen-before-denial
        - tapOn: "Go Back"
        - runFlow:
            when: { visible: "Cancel the process|Are you sure" }
            commands:
              - tapOn: { text: "Cancel|Yes|Confirm", index: 1 }
        - extendedWaitUntil: { visible: "Home|Welcome, .*|Oups! Something went wrong", timeout: 30000 }
        - takeScreenshot: fcaf-148-after-consent-denial

  - id: fetch-result
    use: http-request
    with:
      method: GET
      url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-presentation.outputs.body.session_id }}
      expected_status: 200

  - id: run-fcaf-validators
    use: fcaf-validation
    with:
      test_ids:
        - WS_RP_MS_ProtocolMessages__148
      suite: wallet_solution/relying_party
      pipeline_outputs:
        pipeline.dcql.user-denied-consent:
          output:
            dcql_exchange: ${{ fetch-result.outputs.body }}
            wallet_response: ${{ fetch-result.outputs.body }}
            visual_evidence: ${{ deny-consent.outputs.flow_output.maestro_screenshot_urls }}
            create-presentation: ${{ create-presentation.outputs }}
            deny-consent: ${{ deny-consent.outputs }}
            fetch-result: ${{ fetch-result.outputs }}
