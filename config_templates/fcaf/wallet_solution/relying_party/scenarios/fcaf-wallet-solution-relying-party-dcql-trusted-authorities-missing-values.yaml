name: FCAF wallet relying-party DCQL trusted authorities missing values
runtime:
  temporal:
    activity_options:
      schedule_to_close_timeout: 50m
      start_to_close_timeout: 50m
      retry_policy:
        maximum_attempts: 1
steps:
- id: create-missing-trusted-authorities-values
  use: http-request
  with:
    method: POST
    url: ${fixture.verifier_url}/openid4vp/sessions
    expected_status: 201
    headers:
      Content-Type: application/json
    body:
      scheme: haip-vp://
      request_delivery: by_reference
      request_uri_method: post
      response_type: vp_token
      response_mode: direct_post.jwt
      presentation_request:
        nonce: fcaf-090-trusted-authorities-missing-values
        dcql_query:
          credentials:
          - id: pididentity01
            format: dc+sd-jwt
            meta:
              vct_values:
              - urn:eudi:pid:1
            claims:
            - path:
              - given_name
      request_mutation:
        request_object:
          set:
            /dcql_query:
              credentials:
              - id: pididentity01
                format: dc+sd-jwt
                meta:
                  vct_values:
                  - urn:eudi:pid:1
                claims:
                - path:
                  - given_name
                trusted_authorities:
                - type: aki
        verification_applies: false
- id: reject-missing-trusted-authorities-values
  use: mobile-automation
  with:
    version_id: installed_from_external_source
    action_code: |
      appId: eu.europa.ec.euidi
      ---
      - stopApp
      - launchApp: { clearState: false }
      - extendedWaitUntil: { visible: "Welcome back|Home|Documents|Add document|Welcome, .*", timeout: 30000 }
      - runFlow:
          when: { visible: "Welcome back" }
          commands:
            - tapOn: { point: "11%,40%" }
            - inputText: "123456"
            - hideKeyboard
            - tapOn: { point: "50%,10%" }
      - openLink: { link: "${DEEPLINK_MISSING_TRUSTED_AUTHORITIES_VALUES}", autoVerify: false, browser: false }
      - waitForAnimationToEnd:
          timeout: 5000
      - runFlow:
          when: { visible: "Welcome back" }
          commands:
            - tapOn: { point: "11%,40%" }
            - inputText: "123456"
            - hideKeyboard
            - tapOn: { point: "50%,10%" }
      - extendedWaitUntil: { visible: "Oups! Something went wrong|The requested document is not available in your EUDI Wallet.*|Data sharing request|Home|Documents|Welcome, .*", timeout: 30000 }
      - takeScreenshot: fcaf-090-trusted-authorities-missing-values-rejected
      - runFlow:
          when:
            visible: "Requested data"
          commands:
          - tapOn: "Share"
          - runFlow:
              when:
                visible: "PIN"
              commands:
              - tapOn:
                  point: "11%,39%"
              - inputText: "123456"
              - hideKeyboard
              - tapOn:
                  point: "50%,10%"
          - extendedWaitUntil:
              visible: ".*successfully shared.*|Oups! Something went wrong"
              timeout: 60000
          - takeScreenshot: fcaf-090-trusted-authorities-missing-values-rejected-presented
          - tapOn:
              text: "Close|TRY AGAIN"
              optional: true
      - runFlow:
          when:
            visible: "Data sharing request"
          commands:
          - tapOn: "Cancel"
          - waitForAnimationToEnd:
              timeout: 3000
    parameters:
      DEEPLINK_MISSING_TRUSTED_AUTHORITIES_VALUES: ${{ create-missing-trusted-authorities-values.outputs.body.deeplink }}
- id: fetch-missing-trusted-authorities-values
  use: http-request
  with:
    method: GET
    url: ${fixture.verifier_url}/openid4vp/sessions/${{ create-missing-trusted-authorities-values.outputs.body.session_id }}
    expected_status: 200
- id: run-fcaf-validators
  use: fcaf-validation
  with:
    test_ids:
    - WS_RP_MS_ProtocolMessages__090
    suite: wallet_solution/relying_party
    pipeline_outputs:
      pipeline.dcql.trusted-authorities-missing-values:
        output:
          trusted_authority: ${{ evidence-missing-trusted-authorities-values.outputs.trusted_authority }}
          dcql_exchange: ${{ fetch-missing-trusted-authorities-values.outputs.body.raw.authorization_request_delivered }}
          visual_evidence: ${{ reject-missing-trusted-authorities-values.outputs.screenshot_urls }}
          dcql_exchange_session: ${{ fetch-missing-trusted-authorities-values.outputs.body }}
outputs:
  trusted_authority:
    path: $.output.fetch-missing-trusted-authorities-values.outputs.body.raw.authorization_request_delivered.trusted_authority
    decoder: raw
  dcql_exchange:
    path: $.output.fetch-missing-trusted-authorities-values.outputs.body.raw.authorization_request_delivered
    decoder: raw
  visual_evidence:
    path: $.output.reject-missing-trusted-authorities-values.outputs.screenshot_urls
    decoder: raw
  dcql_exchange_session:
    path: $.output.fetch-missing-trusted-authorities-values.outputs.body
    decoder: raw
failure_policy: fail_dependent_preconditions_and_tests
