id: WS_RP_IA_ProtocolFlow__002d
title: Continue with JAR over HTTP GET when the Wallet does not support POST retrieval.
source:
  path: Interaction/ProtocolFlow/WS_RP_IA_ProtocolFlow__002d.md
suite:
  sut: wallet_solution
  role: relying_party
  section: interaction.protocol_flow
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
  request_uri_method_post: unsupported
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: '5.1'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
- title: OpenID4VP High Assurance Interoperability Profile
  section: '5.1'
  url: https://openid.net/specs/openid4vc-high-assurance-interoperability-profile-1_0.html
- title: OAuth 2.0 JWT-Secured Authorization Request
  section: '5'
  url: https://www.rfc-editor.org/rfc/rfc9101
- ref: pipeline.dcql.baseline
evidence:
  session:
    from: pipeline.dcql.baseline.outputs.session
assertions:
# Deviation from the source: its invocation URL example is an `eu-eaap://` link,
# which is only how the source illustrates the redirects flow. This test mirrors
# WS_RP_MS_ProtocolMessages__011, whose scenario creates its session with the
# suite's default `haip-vp://` scheme, so the retrieval observed here is over
# that default scheme.
#
# The source applies to a Wallet that does not support the `request_uri_method`
# `post`. The retrieval assertion records the method the Wallet actually used,
# which is the fact that refutes that precondition for this SUT; the
# `fcaf.not_applicable` assertion carries the reason. Source ER3.1 (GET) is the
# fallback branch; ER3.2 (Host header) and ER3.3 (the requested path without
# query or fragment) describe the request shape whichever method the Wallet
# uses, so the retrieval assertion checks both on the observed request
# (raw.request_uri_http.target, recorded by Capture since 22/10/2026).
- id: request_uri_is_retrieved_by_post_at_the_request_uri_path
  validator: oid4vp.request_uri_retrieval
  input: evidence.session
  params:
    method: POST
    require_path_target: true
- id: wallet_continues_with_jar_over_get_after_post_retrieval
  validator: fcaf.not_applicable
  input: evidence.session
  params:
    reason: >-
      the source applies to a Wallet profile that does not support POST Request
      URI retrieval ("Profile applicability: Wallet does not support the Request
      URI Method post"); the reference Wallet retrieves the Request Object with
      HTTP POST, so the GET fallback the source describes does not arise
verdict:
  pass_when: all_assertions_pass
