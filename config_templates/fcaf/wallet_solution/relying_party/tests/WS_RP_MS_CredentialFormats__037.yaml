id: WS_RP_MS_CredentialFormats__037
title: Present both ISO mdoc and IETF SD-JWT VC Credentials after user consent.
source:
  path: MessageStructure/CredentialFormats/WS_RP_MS_CredentialFormats__037.md
suite:
  sut: wallet_solution
  role: relying_party
  section: message_structure.credential_formats
applicability:
  profile: EUDI_generic
normative_references:
  - title: OpenID4VC High Assurance Interoperability Profile 1.0
    section: "5, 5.3.1, 5.3.2, 6"
    url: https://openid.net/specs/openid4vc-high-assurance-interoperability-profile-1_0.html
  - title: OpenID for Verifiable Presentations 1.0
    section: "Appendix B.2, Appendix B.3"
    url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
evidence:
  mdoc_exchange:
    from: pipeline.credential-formats.mdoc-presentation.outputs.dcql_exchange
  pid_mdoc:
    from: pipeline.credential-formats.mdoc-presentation.outputs.pid_mdoc
  mdoc_visual_evidence:
    from: pipeline.credential-formats.mdoc-presentation.outputs.visual_evidence
  sdjwt_exchange:
    from: pipeline.credential-formats.sdjwt-presentation.outputs.dcql_exchange
  pid_sdjwt:
    from: pipeline.credential-formats.sdjwt-presentation.outputs.pid_sdjwt
  sdjwt_visual_evidence:
    from: pipeline.credential-formats.sdjwt-presentation.outputs.visual_evidence
assertions:
  - id: mdoc_request_and_response_use_mso_mdoc
    validator: dcql.response_satisfies_constraints
    input: evidence.mdoc_exchange
    params:
      mode: credential_format_presentation
      expected_format: mso_mdoc
  - id: returned_mdoc_artifact_is_pid
    validator: pid.mdoc_doc_type
    input: evidence.pid_mdoc
  - id: mdoc_consent_and_success_screenshots_are_stored
    validator: evidence.minimum_items
    input: evidence.mdoc_visual_evidence
    params:
      min_items: 2
  - id: sdjwt_request_and_response_use_dc_sd_jwt
    validator: dcql.response_satisfies_constraints
    input: evidence.sdjwt_exchange
    params:
      mode: credential_format_presentation
      expected_format: dc+sd-jwt
  - id: returned_sdjwt_artifact_is_pid
    validator: pid.sdjwt_vct_pid
    input: evidence.pid_sdjwt
  - id: sdjwt_consent_and_success_screenshots_are_stored
    validator: evidence.minimum_items
    input: evidence.sdjwt_visual_evidence
    params:
      min_items: 2
verdict:
  pass_when: all_assertions_pass
