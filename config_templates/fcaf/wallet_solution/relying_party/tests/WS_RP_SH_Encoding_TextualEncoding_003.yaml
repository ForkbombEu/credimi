id: WS_RP_SH_Encoding_TextualEncoding_003
title: Select the array element addressed by a non-negative integer component.
source:
  path: Shared/Encoding/WS_RP_SH_Encoding_TextualEncoding_003.md
suite:
  sut: wallet_solution
  role: relying_party
  section: shared.encoding
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: '7.2.1'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
evidence:
  dcql_exchange:
    from: pipeline.dcql.degree-array-index.outputs.dcql_exchange
  visual_evidence:
    from: pipeline.dcql.degree-array-index.outputs.visual_evidence
assertions:
- id: integer_component_selects_only_the_addressed_element
  validator: oid4vp.dcql_array_selector_filter
  input: evidence.dcql_exchange
  params:
    vct: urn:credimi:degree:1
    path:
    - academic_programmes
    - 1
    required_values:
    - Master of Science
    - Doctor of Philosophy
    forbidden_values:
    - Bachelor of Science
- id: wallet_completes_the_degree_presentation
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
