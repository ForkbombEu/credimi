id: WS_RP_MS_CredentialFormats__033e
title: The `status_list` element in the `status` element in the MSO contains an `idx` and a `uri` element.
source:
  path: MessageStructure/CredentialFormats/WS_RP_MS_CredentialFormats__033e.md
suite:
  sut: wallet_solution
  role: relying_party
  section: message_structure.credential_formats
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
  credential_format: iso_mdoc
normative_references:
- title: Commission Implementing Regulation (EU) 2024/2982 as amended
  section: Annex II
  url: https://data.europa.eu/eli/reg_impl/2024/2982/oj
- title: ETSI TS 119 472-1
  section: '6.2.10'
  url: https://www.etsi.org/deliver/etsi_ts/119400_119499/11947201/01.02.01_60/ts_11947201v010201p.pdf
- title: Token Status List
  section: '6.3'
  url: https://datatracker.ietf.org/doc/html/draft-ietf-oauth-status-list-15
- ref: pipeline.credential-status.mdoc
evidence:
  pid_mdoc:
    from: pipeline.credential-status.mdoc.outputs.pid_mdoc
  visual_evidence:
    from: pipeline.credential-status.mdoc.outputs.visual_evidence
assertions:
- id: mso_status_list_idx_present
  validator: mdoc.mso_status_member_present
  input: evidence.pid_mdoc
  params:
    path:
    - status_list
    - idx
- id: mso_status_list_uri_present
  validator: mdoc.mso_status_member_present
  input: evidence.pid_mdoc
  params:
    path:
    - status_list
    - uri
- id: presentation_visual_evidence_is_stored
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
