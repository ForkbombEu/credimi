id: WS_RP_SM_SessionEncryption__007
title: Encrypt the response content with A128GCM.
source:
  path: SecurityMechanisms/SessionEncryption/WS_RP_SM_SessionEncryption__007.md
suite:
  sut: wallet_solution
  role: relying_party
  section: security_mechanisms.session_encryption
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: '8.3'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
- title: JSON Web Encryption (JWE)
  section: '4.1.2'
  url: https://www.rfc-editor.org/rfc/rfc7516
- ref: pipeline.response-encryption.a128gcm
evidence:
  capture_session:
    from: pipeline.response-encryption.a128gcm.outputs.capture_session
  encryption_evidence:
    from: pipeline.response-encryption.a128gcm.outputs.encryption_evidence
  visual_evidence:
    from: pipeline.response-encryption.a128gcm.outputs.visual_evidence
assertions:
- id: wallet_posted_an_encrypted_response
  validator: oid4vp.presentation_response_http
  input: evidence.capture_session
  params: {method: POST, require_response_parameter: true}
- id: only_a128gcm_is_offered_and_used
  validator: oid4vp.response_encryption
  input: evidence.encryption_evidence
  params:
    metadata_enc_values_supported: [A128GCM]
    metadata_enc_values_exclusive: true
    expected_enc: A128GCM
- id: wallet_processing_has_visual_evidence
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
