id: WS_RP_SH_Cryptography_CryptographicHash_006
title: Declare supported hash algorithms beyond SHA-256 in the Wallet metadata.
source:
  path: Shared/Cryptography/WS_RP_SH_Cryptography_CryptographicHash_006.md
suite:
  sut: wallet_solution
  role: relying_party
  section: shared.cryptography
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
- title: OpenID4VC High Assurance Interoperability Profile 1.0
  section: '8'
  url: https://openid.net/specs/openid4vc-high-assurance-interoperability-profile-1_0.html
evidence:
  presentation_session:
    from: pipeline.cryptography.digest-algorithm.outputs.presentation_session
assertions:
# The session holds the wallet_metadata POSTed to the Request URI and the
# presentation of a SHA-384-digested PID. Presenting it is what shows the
# Wallet supports another hash algorithm; without it the source's profile
# applicability does not hold and the validator reports not_applicable. No
# metadata member is defined for hash algorithms, so any IANA hash name in
# wallet_metadata counts as declaring it.
- id: wallet_metadata_names_the_supported_hash_algorithm
  validator: oid4vp.wallet_metadata_hash_algorithms
  input: evidence.presentation_session
verdict:
  pass_when: all_assertions_pass
