id: WS_RP_MS_Metadata__090
title: Reject a Referenced Token whose status_list omits uri.
source:
  path: MessageStructure/Metadata/WS_RP_MS_Metadata__090.md
suite:
  sut: wallet_solution
  role: relying_party
  section: message_structure.metadata
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
  credential_format: ietf_sd_jwt_vc
normative_references:
- title: Token Status List
  section: '6.2'
  url: https://www.ietf.org/archive/id/draft-ietf-oauth-status-list-13.html
evidence:
  issuance_session:
    from: pipeline.fixtures.status-reference.outputs.missing_uri_issuance
  probe_exchange:
    from: pipeline.fixtures.status-reference.outputs.missing_uri_probe
  visual_evidence:
    from: pipeline.fixtures.status-reference.outputs.missing_uri_visual_evidence
assertions:
- id: issuer_offered_the_malformed_status_reference
  validator: json.field_equals
  input: evidence.issuance_session
  params: { field: status_reference, value: missing_uri }
- id: issuer_issued_the_probed_document_number
  validator: json.field_equals
  input: evidence.issuance_session
  params: { field: document_number, value: CREDIMI-SDJWT-MISSING-URI }
- id: wallet_matched_nothing_for_the_refused_document_number
  validator: dcql.response_satisfies_constraints
  input: evidence.probe_exchange
  params:
    mode: claims_values_no_match
    expected_claim_path: [document_number]
    expected_value: CREDIMI-SDJWT-MISSING-URI
- id: wallet_showed_the_no_match_notice
  validator: evidence.screenshot_named
  input: evidence.visual_evidence
  params: { name: no-match-notice }
verdict:
  pass_when: all_assertions_pass
