id: WS_RP_MS_Metadata__081
title: Accept a Referenced Token whose status claim holds a valid status_list.
source:
  path: MessageStructure/Metadata/WS_RP_MS_Metadata__081.md
suite:
  sut: wallet_solution
  role: relying_party
  section: message_structure.metadata
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
  credential_format: ietf_sd_jwt_vc
normative_references:
- title: Token Status List
  section: '6.2'
  url: https://www.ietf.org/archive/id/draft-ietf-oauth-status-list-13.html
evidence:
  pid_sdjwt:
    from: pipeline.credential-status.sdjwt.outputs.pid_sdjwt
  visual_evidence:
    from: pipeline.credential-status.sdjwt.outputs.visual_evidence
assertions:
- id: referenced_token_carries_a_status_claim
  validator: sdjwt.claim_present
  input: evidence.pid_sdjwt
  params:
    claim: status
- id: status_claim_holds_a_status_list_object
  validator: sdjwt.claim_object
  input: evidence.pid_sdjwt
  params:
    claim: status.status_list
- id: accepted_token_is_presented_by_the_wallet
  validator: pid.sdjwt_vct_pid
  input: evidence.pid_sdjwt
- id: presentation_visual_evidence_is_stored
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
