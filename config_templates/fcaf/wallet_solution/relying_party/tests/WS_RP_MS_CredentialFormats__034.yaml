id: WS_RP_MS_CredentialFormats__034
title: Match an mdoc CBOR text value through its JSON-compatible representation.
source:
  path: MessageStructure/CredentialFormats/WS_RP_MS_CredentialFormats__034.md
suite:
  sut: wallet_solution
  role: relying_party
  section: message_structure.credential_formats
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: '6.3'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
- title: Concise Binary Object Representation (CBOR)
  section: '6.1'
  url: https://www.rfc-editor.org/rfc/rfc8949.html
- ref: pipeline.credential-formats.mdoc-presentation
evidence:
  dcql_exchange:
    from: pipeline.credential-formats.mdoc-presentation.outputs.dcql_exchange
  pid_mdoc:
    from: pipeline.credential-formats.mdoc-presentation.outputs.pid_mdoc
  visual_evidence:
    from: pipeline.credential-formats.mdoc-presentation.outputs.visual_evidence
assertions:
- id: mdoc_query_with_value_constraint_is_matched
  validator: dcql.response_satisfies_constraints
  input: evidence.dcql_exchange
  params:
    mode: credential_format_presentation
    expected_format: mso_mdoc
- id: matched_element_is_a_cbor_text_value
  validator: mdoc.element_utf8_string
  input: evidence.pid_mdoc
  params:
    namespace: eu.europa.ec.eudi.pid.1
    element: given_name
- id: matching_interaction_evidence_is_stored
  validator: evidence.minimum_items
  input: evidence.visual_evidence
  params:
    min_items: 2
verdict:
  pass_when: all_assertions_pass
