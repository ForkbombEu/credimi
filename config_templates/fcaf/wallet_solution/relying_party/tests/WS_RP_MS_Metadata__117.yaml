id: WS_RP_MS_Metadata__117
title: Reject a verifier_attestation request whose Client Identifier differs from the attestation sub.
source:
  path: MessageStructure/Metadata/WS_RP_MS_Metadata__117.md
suite:
  sut: wallet_solution
  role: relying_party
  section: message_structure.metadata
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: '5.9.3'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
evidence:
  session:
    from: pipeline.rp-integrity.verifier-attestation.outputs.subject_mismatch_session
  request_object:
    from: pipeline.rp-integrity.verifier-attestation.outputs.subject_mismatch_request_object
  request_evidence:
    from: pipeline.rp-integrity.verifier-attestation.outputs.subject_mismatch_request_evidence
  visual_evidence:
    from: pipeline.rp-integrity.verifier-attestation.outputs.subject_mismatch_visual_evidence
assertions:
- id: delivered_attestation_sub_differs_from_the_client_identifier
  validator: oid4vp.verifier_attestation_request
  input: evidence.request_evidence
  params:
    jwt_header: present
    subject: other
    issuer: https://capture-wallet.credimi.io/openid4vp/verifier-attestation-issuer
    request_signature: valid
    attestation_signature: valid
    redirect_uris: absent
- id: wallet_returns_invalid_request_without_a_presentation
  validator: oid4vp.error_response_required
  input: evidence.session
  params:
    code: invalid_request
- id: visual_evidence_is_stored
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
