id: WS_RP_MS_ProtocolMessages__009
title: Process a Request Object whose iss differs from client_id
source:
  path: MessageStructure/ProtocolMessages/WS_RP_MS_ProtocolMessages__009.md
suite:
  sut: wallet_solution
  role: relying_party
  section: message_structure.protocol_messages
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: '5'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
evidence:
  session: { from: pipeline.protocol.request-object-payload-controls.outputs.different_iss_session }
  request_object: { from: pipeline.protocol.request-object-payload-controls.outputs.different_iss_request_object }
  visual_evidence: { from: pipeline.protocol.request-object-payload-controls.outputs.different_iss_visual_evidence }
assertions:
- id: request_object_contains_different_issuer_and_client
  validator: jwt.payload_fields_differ
  input: evidence.request_object
  params: { first: client_id, second: iss }
- id: wallet_retrieves_request_object
  validator: oid4vp.request_uri_retrieval
  input: evidence.session
  params: { method: POST }
- id: wallet_processes_request
  validator: dcql.response_satisfies_constraints
  input: evidence.session
  params: { mode: credentials_match }
- id: visual_evidence_is_stored
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
