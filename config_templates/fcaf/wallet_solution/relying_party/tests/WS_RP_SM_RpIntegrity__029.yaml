id: WS_RP_SM_RpIntegrity__029
title: Answer a signed presentation request.
source:
  path: SecurityMechanisms/RpIntegrity/WS_RP_SM_RpIntegrity__029.md
suite:
  sut: wallet_solution
  role: relying_party
  section: security_mechanisms.rp_integrity
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: '5.9.2'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
- ref: pipeline.wallet.metadata.default-x509-hash
evidence:
  signed_request_object:
    from: pipeline.wallet.metadata.default-x509-hash.outputs.signed_request_object
  capture_session:
    from: pipeline.wallet.metadata.default-x509-hash.outputs.capture_session
  visual_evidence:
    from: pipeline.wallet.metadata.default-x509-hash.outputs.visual_evidence
assertions:
- id: request_object_signature_verifies
  validator: jose.jws_signed_request
  input: evidence.signed_request_object
- id: wallet_answers_signed_request
  validator: oid4vp.session_event_count
  input: evidence.capture_session
  params: {type: vp_presentation_response_received, count: 1}
- id: wallet_processing_has_visual_evidence
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
