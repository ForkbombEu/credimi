id: WS_RP_IA_MainInteraction__033
title: Withhold every credential failing any one of several combined value constraints.
source:
  path: Interaction/MainInteraction/WS_RP_IA_MainInteraction__033.md
suite:
  sut: wallet_solution
  role: relying_party
  section: interaction.main_interaction
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
  credential_format: ietf_sd_jwt_vc
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: '6.4'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
evidence:
  fixture_inventory:
    from: pipeline.dcql.combined-value-constraints.outputs.fixture_inventory
  dcql_exchange:
    from: pipeline.dcql.combined-value-constraints.outputs.dcql_exchange
  visual_evidence:
    from: pipeline.dcql.combined-value-constraints.outputs.visual_evidence
assertions:
- id: wallet_holds_the_near_miss_credentials_it_must_exclude
  validator: oid4vp.distinct_presentations
  input: evidence.fixture_inventory
  params:
    vct: urn:eudi:pid:1
    claim: document_number
    minimum: 8
- id: every_released_credential_satisfies_all_value_constraints
  validator: oid4vp.dcql_value_constraints_satisfied
  input: evidence.dcql_exchange
  params:
    vct: urn:eudi:pid:1
    minimum_constraints: 5
    require_multiple: true
- id: selection_visual_evidence_is_stored
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
