id: WS_RP_IA_MainInteraction__033
title: Withhold every credential failing any one of several combined value constraints.
source:
  path: Interaction/MainInteraction/WS_RP_IA_MainInteraction__033.md
suite:
  sut: wallet_solution
  role: relying_party
  section: interaction.main_interaction
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
  credential_format: ietf_sd_jwt_vc
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: '6.4'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
evidence:
  fixture_issuances:
    from: pipeline.dcql.combined-value-constraints.outputs.fixture_issuances
  dcql_exchange:
    from: pipeline.dcql.combined-value-constraints.outputs.dcql_exchange
  visual_evidence:
    from: pipeline.dcql.combined-value-constraints.outputs.visual_evidence
  numeric_issuance:
    from: pipeline.dcql.combined-value-constraints.outputs.numeric_issuance
  numeric_issuance_screenshots:
    from: pipeline.dcql.combined-value-constraints.outputs.numeric_issuance_screenshots
  numeric_type_trap:
    from: pipeline.dcql.combined-value-constraints.outputs.numeric_type_trap
  numeric_visual_evidence:
    from: pipeline.dcql.combined-value-constraints.outputs.numeric_visual_evidence
assertions:
# Possession is proven without presenting: the reference Wallet spends a
# credential instance on every presentation, so an inventory query would leave
# the constrained query an empty Wallet. Each fixture needs its issuer session
# at credential_issued (the Wallet fetched it) and the issuance flow's
# credential-added screenshot (the Wallet confirmed it stored it).
- id: wallet_holds_the_near_miss_credentials_it_must_exclude
  validator: oid4vci.fixtures_stored
  input: evidence.fixture_issuances
  params:
    stored_screenshot: credential-added
    fixtures:
    - pid_default
    - pid_under_18
    - pid_family_name_uppercase
    - pid_family_name_trailing_space
    - pid_locality_diacritics
    - pid_locality_no_diacritics
    - pid_multiple_nationalities
    - pid_expiry_2032
- id: every_released_credential_satisfies_all_value_constraints
  validator: oid4vp.dcql_value_constraints_satisfied
  input: evidence.dcql_exchange
  params:
    vct: urn:eudi:pid:1
    minimum_constraints: 5
    require_multiple: true
- id: selection_visual_evidence_is_stored
  validator: evidence.non_empty
  input: evidence.visual_evidence
- id: wallet_holds_the_numeric_data_type_trap_credential
  validator: json.field_equals
  input: evidence.numeric_issuance
  params:
    field: status
    value: credential_issued
- id: numeric_trap_issuance_is_the_numeric_claims_credential
  validator: json.field_equals
  input: evidence.numeric_issuance
  params:
    field: credential_configuration_id
    value: urn:credimi:numeric-claims:1.sd-jwt.key-attestation-required
- id: wallet_stored_the_numeric_data_type_trap_credential
  validator: evidence.screenshot_named
  input: evidence.numeric_issuance_screenshots
  params:
    name: credential-added
- id: integer_constraint_withholds_the_float_credential
  validator: oid4vp.no_presentation_returned
  input: evidence.numeric_type_trap
- id: numeric_data_type_visual_evidence_is_stored
  validator: evidence.non_empty
  input: evidence.numeric_visual_evidence
verdict:
  pass_when: all_assertions_pass
