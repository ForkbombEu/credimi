id: WS_RP_MS_ProtocolMessages__043
title: Refuse a Request URI that is not HTTPS
source:
  path: MessageStructure/ProtocolMessages/WS_RP_MS_ProtocolMessages__043.md
suite:
  sut: wallet_solution
  role: relying_party
  section: message_structure.protocol_messages
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: '8.5'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
- title: OpenID for Verifiable Presentations 1.0
  section: '5.10'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
evidence:
  outer_request: { from: pipeline.protocol.client-id-binding-controls.outputs.http_request_uri_outer_request }
  target_session: { from: pipeline.protocol.client-id-binding-controls.outputs.http_request_uri_target_session }
  visual_evidence: { from: pipeline.protocol.client-id-binding-controls.outputs.http_request_uri_visual_evidence }
  control_session: { from: pipeline.protocol.client-id-binding-controls.outputs.http_request_uri_control_session }
assertions:
- id: request_uri_uses_plain_http
  validator: json.field_string_prefix
  input: evidence.outer_request
  params: { field: request_uri, prefix: "http://" }
- id: request_uri_method_is_post
  validator: json.field_equals
  input: evidence.outer_request
  params: { field: request_uri_method, value: post }
- id: wallet_does_not_retrieve_the_http_request_uri
  validator: oid4vp.request_uri_not_retrieved
  input: evidence.target_session
# wallet_does_not_retrieve_the_http_request_uri also passes for a Wallet that
# never handled the link; the HTTPS control on the same invocation path proves
# it did.
- id: wallet_retrieves_an_https_request_uri_on_the_same_path
  validator: oid4vp.request_uri_retrieval
  input: evidence.control_session
  params: { method: POST }
- id: visual_evidence_is_stored
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
