id: WS_RP_SM_RpIntegrity__009
title: Reject a Request Object not signed with the attestation cnf key.
source:
  path: SecurityMechanisms/RpIntegrity/WS_RP_SM_RpIntegrity__009.md
suite:
  sut: wallet_solution
  role: relying_party
  section: security_mechanisms.rp_integrity
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: '5.9.3'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
evidence:
  session:
    from: pipeline.rp-integrity.verifier-attestation.outputs.unrelated_signing_key_session
  request_object:
    from: pipeline.rp-integrity.verifier-attestation.outputs.unrelated_signing_key_request_object
  request_evidence:
    from: pipeline.rp-integrity.verifier-attestation.outputs.unrelated_signing_key_request_evidence
  visual_evidence:
    from: pipeline.rp-integrity.verifier-attestation.outputs.unrelated_signing_key_visual_evidence
assertions:
- id: delivered_request_signature_fails_against_the_cnf_key
  validator: oid4vp.verifier_attestation_request
  input: evidence.request_evidence
  params:
    jwt_header: present
    subject: client_id
    issuer: https://capture-wallet.credimi.io/openid4vp/verifier-attestation-issuer
    request_signature: invalid
    attestation_signature: valid
    redirect_uris: absent
- id: wallet_returns_invalid_request_without_a_presentation
  validator: oid4vp.error_response_required
  input: evidence.session
  params:
    code: invalid_request
- id: visual_evidence_is_stored
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
