id: WS_RP_IA_ProtocolFlow__002e_UF
title: Reject an invalid request_uri_method without retrieving the Request Object.
source: { path: Interaction/ProtocolFlow/WS_RP_IA_ProtocolFlow__002e_UF.md }
suite: { sut: wallet_solution, role: relying_party, section: interaction.protocol_flow }
applicability: { profile: EUDI_generic, presentation_flow: redirects, request_uri_method_post: supported }
normative_references:
  - { title: OpenID for Verifiable Presentations 1.0, section: "8.5", url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html }
evidence:
  presentation_request: { from: pipeline.oid4vp.invalid-request-uri-method.outputs.presentation_request }
  session: { from: pipeline.oid4vp.invalid-request-uri-method.outputs.capture_session }
  visual_evidence: { from: pipeline.oid4vp.invalid-request-uri-method.outputs.visual_evidence }
assertions:
  - { id: invalid_request_uri_method_is_delivered, validator: json.field_equals, input: evidence.presentation_request, params: { field: request_uri_method, value: DELETE } }
