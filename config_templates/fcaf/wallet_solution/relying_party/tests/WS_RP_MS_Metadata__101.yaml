id: WS_RP_MS_Metadata__101
title: Accept a COSE Referenced Token whose status claim at CBOR label 65535 is valid.
source:
  path: MessageStructure/Metadata/WS_RP_MS_Metadata__101.md
suite:
  sut: wallet_solution
  role: relying_party
  section: message_structure.metadata
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
  credential_format: iso_mdoc
normative_references:
- title: Token Status List
  section: '6.3'
  url: https://www.ietf.org/archive/id/draft-ietf-oauth-status-list-13.html
evidence:
  pid_mdoc:
    from: pipeline.credential-status.mdoc.outputs.pid_mdoc
  visual_evidence:
    from: pipeline.credential-status.mdoc.outputs.visual_evidence
assertions:
# Token Status List 6.3: for an ISO mdoc the Status CBOR structure sits in the
# Mobile Security Object under the recommended text label "status" (the mdoc
# encoding of the CWT label-65535 claim). A valid structure is a Status map
# holding a status_list map; the accepted token is presented by the Wallet.
- id: status_claim_holds_a_status_cbor_map
  validator: mdoc.mso_status_cbor_type
  input: evidence.pid_mdoc
  params:
    path: []
    major_type: 5
- id: status_map_holds_a_status_list
  validator: mdoc.mso_status_member_present
  input: evidence.pid_mdoc
  params:
    path:
    - status_list
- id: status_list_is_a_status_cbor_map
  validator: mdoc.mso_status_cbor_type
  input: evidence.pid_mdoc
  params:
    path:
    - status_list
    major_type: 5
- id: accepted_token_is_presented_by_the_wallet
  validator: pid.mdoc_doc_type
  input: evidence.pid_mdoc
- id: presentation_visual_evidence_is_stored
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
