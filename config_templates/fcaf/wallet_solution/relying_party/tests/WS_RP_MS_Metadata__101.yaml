id: WS_RP_MS_Metadata__101
title: Accept a COSE Referenced Token whose status claim at CBOR label 65535 is valid.
source:
  path: MessageStructure/Metadata/WS_RP_MS_Metadata__101.md
suite:
  sut: wallet_solution
  role: relying_party
  section: message_structure.metadata
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
  credential_format: iso_mdoc
normative_references:
- title: Token Status List
  section: '6.3'
  url: https://www.ietf.org/archive/id/draft-ietf-oauth-status-list-13.html
evidence:
  pid_mdoc:
    from: pipeline.credential-status.mdoc.outputs.pid_mdoc
  visual_evidence:
    from: pipeline.credential-status.mdoc.outputs.visual_evidence
assertions:
# Beta issues no CWT Referenced Token. The mdoc Mobile Security Object carries
# its status under the text key "status", not as a CWT claim at CBOR label
# 65535, so cose.cwt_status_claim reports this evidence as blocked rather than
# reading one encoding as the other.
- id: status_claim_at_label_65535_holds_a_valid_status
  validator: cose.cwt_status_claim
  input: evidence.pid_mdoc
- id: accepted_token_is_presented_by_the_wallet
  validator: pid.mdoc_doc_type
  input: evidence.pid_mdoc
- id: presentation_visual_evidence_is_stored
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
