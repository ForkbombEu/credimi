id: WS_RP_MS_Metadata__101
title: Accept a COSE Referenced Token whose status claim at CBOR label 65535 is valid.
source:
  path: MessageStructure/Metadata/WS_RP_MS_Metadata__101.md
suite:
  sut: wallet_solution
  role: relying_party
  section: message_structure.metadata
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
  credential_format: iso_mdoc
normative_references:
- title: Token Status List
  section: '6.3'
  url: https://www.ietf.org/archive/id/draft-ietf-oauth-status-list-13.html
evidence:
  referenced_token:
    from: pipeline.credential-status.mdoc.outputs.pid_mdoc
assertions:
# The source names the status claim at CBOR label 65535, i.e. the CWT claims
# set of a COSE-based Referenced Token (Token Status List 6.3). The reference
# issuer emits ISO mdoc and SD-JWT VC only, and an ISO mdoc keeps its Status
# CBOR structure under the MSO text label "status" (Token Status List, ISO
# mdoc section), so the label-65535 condition cannot be exercised here.
- id: status_claim_at_label_65535_holds_a_valid_status_structure
  validator: fcaf.skipped
  input: evidence.referenced_token
  params:
    reason: >-
      the source's precondition is a COSE-based Referenced Token whose status
      claim at CBOR label 65535 holds a valid Status CBOR structure, and the
      suite has no such fixture: the reference issuer emits ISO mdoc and
      SD-JWT VC only, and an ISO mdoc keys its status by the MSO text label
      "status" rather than by the CWT claims-set label 65535
verdict:
  pass_when: all_assertions_pass
