id: WS_RP_DM_Credentialmetadata_Expirydate_PID_IETF-sd-jwt-vc_001
title: This test case verifies that the claim `date_of_expiry` is present in the Credential in IETF SD-JWT VC format. Note that `date_of_expiry` is the Attribute Identifier in IETF SD-JWT VC for the Data Identifier expiry_date.
source:
    path: DataModel/CredentialMetadata/WS_RP_DM_Credentialmetadata_Expirydate_PID_IETF-sd-jwt-vc_001.md
suite:
    sut: wallet_solution
    role: relying_party
    section: data_model.credential_metadata
applicability:
    credential_format: ietf_sd_jwt_vc
    document_type: pid
normative_references:
    - title: European Digital Identity Wallet, ARF 2.0, Annex 3.01 pid rulebook
      url: https://conformance.eudi.dev/latest/fcaf/suts/wallet_solution/relying_party/ws_rp/#ws_rp_dm_credentialmetadata_expirydate_pid_ietf-sd-jwt-vc_001
    - title: '"ANNEXES to the COMMISSION IMPLEMENTING REGULATION amending Implementing Regulation (EU) 2024/2977, (EU) 2024/2979, (EU) 2024/2980 and (EU) 2024/2982 as regards applicable standards and specifications and correcting Implementing Regulation (EU) 2024/2980" section 4.2 (Table 5).'
      url: https://conformance.eudi.dev/latest/fcaf/suts/wallet_solution/relying_party/ws_rp/#ws_rp_dm_credentialmetadata_expirydate_pid_ietf-sd-jwt-vc_001
evidence:
    pid_sdjwt:
        from: pipeline.pid.presentation.sdjwt.all-claims.outputs.pid_sdjwt
assertions:
    - id: pid_sdjwt_vct_pid
      validator: pid.sdjwt_vct_pid
      input: evidence.pid_sdjwt
    - id: pid_sdjwt_required_mandatory_claims_present
      validator: pid.sdjwt_required_mandatory_claims_present
      input: evidence.pid_sdjwt
      params:
        required_elements:
          - family_name
          - given_name
          - birthdate
          - place_of_birth
          - nationalities
          - date_of_expiry
          - issuing_authority
          - issuing_country
    - id: date_of_expiry_present
      validator: sdjwt.claim_present
      input: evidence.pid_sdjwt
      params:
        claim: date_of_expiry
verdict:
    pass_when: all_assertions_pass
