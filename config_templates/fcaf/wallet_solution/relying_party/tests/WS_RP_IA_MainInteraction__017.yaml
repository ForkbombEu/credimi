id: WS_RP_IA_MainInteraction__017
title: Do not disclose PID personal data when the query omits claims.
source:
  path: Interaction/MainInteraction/WS_RP_IA_MainInteraction__017.md
suite:
  sut: wallet_solution
  role: relying_party
  section: interaction.main_interaction
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
  credential_format: iso_mdoc
normative_references:
  - title: OpenID for Verifiable Presentations 1.0
    section: "6.4.1"
    url: "https://openid.net/specs/openid-4-verifiable-presentations-1_0.html"
evidence:
  dcql_exchange:
    from: pipeline.dcql.claims-omitted-mdoc.outputs.dcql_exchange
  visual_evidence:
    from: pipeline.dcql.claims-omitted-mdoc.outputs.visual_evidence
assertions:
# Fixture substitution: the source names an ISO mDL, and Capture has no mDL
# fixture, so the query and assertions use the PID ISO mdoc instead. The property
# under test (a query that omits claims must not lead to claim disclosure) is
# unchanged by the doctype.
  - id: no_pid_personal_data_is_disclosed
    validator: dcql.response_satisfies_constraints
    input: evidence.dcql_exchange
    params:
      mode: mdoc_without_claim_disclosures
  - id: successful_interaction_is_recorded
    validator: evidence.non_empty
    input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
