id: WS_RP_IA_MainInteraction__025
title: Skip a partially satisfiable DCQL claim set and use the next option.
source:
  path: Interaction/MainInteraction/WS_RP_IA_MainInteraction__025.md
suite:
  sut: wallet_solution
  role: relying_party
  section: interaction.main_interaction
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
  - title: OpenID for Verifiable Presentations 1.0
    section: "6.4"
    url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
evidence:
  dcql_exchange:
    from: pipeline.dcql.claim-sets-partial-fallback.outputs.dcql_exchange
  visual_evidence:
    from: pipeline.dcql.claim-sets-partial-fallback.outputs.visual_evidence
assertions:
  - id: second_complete_claim_set_is_selected
    validator: dcql.response_satisfies_constraints
    input: evidence.dcql_exchange
    params:
      mode: claim_sets_preferred_option
      expected_value: 1
  - id: wallet_interaction_is_recorded
    validator: evidence.non_empty
    input: evidence.visual_evidence
verdict:
