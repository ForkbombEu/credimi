id: WS_RP_IA_Engagement__001b
title: Invoke the Wallet through the eu-eaap custom URL scheme.
source:
  path: Interaction/Engagement/WS_RP_IA_Engagement__001b.md
suite:
  sut: wallet_solution
  role: relying_party
  section: interaction.engagement
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
- title: ETSI TS 119 472-2
  section: '6.4.1'
  url: https://www.etsi.org/deliver/etsi_ts/119400_119499/11947202/01.01.01_60/ts_11947202v010101p.pdf
- title: OpenID4VP High Assurance Interoperability Profile
  section: '5.1'
  url: https://openid.net/specs/openid4vc-high-assurance-interoperability-profile-1_0.html
- title: OpenID for Verifiable Presentations 1.0
  section: '9'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
evidence:
  wallet_engagement:
    from: pipeline.wallet.engagement.eu-eaap.outputs.wallet_engagement
  visual_evidence:
    from: pipeline.wallet.engagement.eu-eaap.outputs.visual_evidence
assertions:
# The source's request shape: the Verifier hands the User-agent a presentation
# link under the `eu-eaap://` custom URL scheme. Capture builds the deeplink, so
# this holds whenever the session exists (probed 14/10/2026: POST
# /openid4vp/sessions with `scheme: eu-eaap://` answers 201 and serves
# `deeplink: eu-eaap://?client_id=...`).
- id: eu_eaap_deeplink_is_created
  validator: json.field_string_prefix
  input: evidence.wallet_engagement
  params:
    field: deeplink
    prefix: "eu-eaap://"
- id: wallet_retrieved_the_request_from_the_deeplink
  validator: oid4vp.request_uri_retrieval
  input: evidence.wallet_engagement
  params:
    method: POST
# Source expected results 1 and 2 ("User-agent presents option to End-user to
# engage presentation", "Wallet is invoked successfully") are the same
# engagement screen on the reference device, stored under one name by
# fcaf-engagement-eu-eaap. The reference Wallet registers no `eu-eaap://`
# handler, so this fails on it (EUDI_required) rather than reporting blocked.
- id: wallet_shows_the_engagement_screen
  validator: evidence.screenshot_named
  input: evidence.visual_evidence
  params:
    name: fcaf-engagement-eu-eaap-invoked
verdict:
  pass_when: all_assertions_pass
