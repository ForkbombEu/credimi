id: WS_RP_IA_Engagement__001a
title: Invoke the Wallet using the haip-vp custom URL scheme.
source: { path: Interaction/Engagement/WS_RP_IA_Engagement__001a.md }
suite: { sut: wallet_solution, role: relying_party, section: interaction.engagement }
applicability: { profile: EUDI_generic, presentation_flow: redirects }
normative_references:
  - { title: High Assurance Interoperability Profile, section: "5.1", url: "https://openid.net/specs/openid-4-high-assurance-interoperability-profile-1_0.html" }
evidence:
  wallet_engagement: { from: pipeline.wallet.engagement.haip-vp.outputs.wallet_engagement }
  visual_evidence: { from: pipeline.wallet.engagement.haip-vp.outputs.visual_evidence }
assertions:
  - { id: haip_vp_deeplink_is_created, validator: json.field_string_prefix, input: evidence.wallet_engagement, params: { field: deeplink, prefix: "haip-vp://" } }
  - { id: wallet_retrieved_the_request_from_the_deeplink, validator: oid4vp.request_uri_retrieval, input: evidence.wallet_engagement, params: { method: POST } }
  - { id: wallet_shows_the_engagement_option, validator: evidence.screenshot_named, input: evidence.visual_evidence, params: { name: fcaf-engagement-haip-vp-invoked } }
verdict: { pass_when: all_assertions_pass }
