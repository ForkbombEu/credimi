# The source assumes a Wallet that published wallet_metadata.jwks; the session
# sets request_behavior.request_object_encryption: none so the Request Object it
# receives is provably plain, not an encrypted one read through
# raw.authorization_request_jwt.
id: WS_RP_MS_Metadata__135
title: Reject an unencrypted Request Object after requiring encryption
source:
  path: MessageStructure/Metadata/WS_RP_MS_Metadata__135.md
suite:
  sut: wallet_solution
  role: relying_party
  section: message_structure.metadata
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: '5.10'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
evidence:
  session: { from: pipeline.protocol.metadata-request-object-delivery.outputs.unencrypted_request_object_session }
  visual_evidence: { from: pipeline.protocol.metadata-request-object-delivery.outputs.unencrypted_request_object_visual_evidence }
assertions:
- id: wallet_retrieves_request_object_with_post
  validator: oid4vp.request_uri_retrieval
  input: evidence.session
  params: { method: POST }
- id: encryption_requiring_wallet_rejects_unencrypted_request_object
  validator: oid4vp.unencrypted_request_object_rejected
  input: evidence.session
- id: visual_evidence_is_stored
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
