id: WS_RP_MS_Metadata__094
title: Handle a COSE Referenced Token whose Status map has no status_list per local policy.
source:
  path: MessageStructure/Metadata/WS_RP_MS_Metadata__094.md
suite:
  sut: wallet_solution
  role: relying_party
  section: message_structure.metadata
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
  credential_format: iso_mdoc
normative_references:
- title: Token Status List
  section: '6.3'
  url: https://www.ietf.org/archive/id/draft-ietf-oauth-status-list-13.html
evidence:
  issuance_session:
    from: pipeline.fixtures.status-reference.mdoc.outputs.status_without_status_list_issuance
  probe_exchange:
    from: pipeline.fixtures.status-reference.mdoc.outputs.status_without_status_list_probe
assertions:
- id: issuer_offered_the_malformed_status_reference
  validator: json.field_equals
  input: evidence.issuance_session
  params: { field: status_reference, value: status_without_status_list }
- id: issuer_used_the_identifying_claim_fixture
  validator: json.field_equals
  input: evidence.issuance_session
  params: { field: fixture_id, value: pid_family_name_uppercase }
- id: issuer_offered_an_mdoc_pid
  validator: json.field_equals
  input: evidence.issuance_session
  params: { field: credential_configuration_id, value: "urn:eu.europa.ec.eudi:pid:1.mdoc.key-attestation-required" }
# Local policy allows the Wallet to keep or refuse the token, so no disposition
# is asserted and WS_RP_MS_Metadata__092 is the case that requires rejection.
# What is asserted is that the Wallet handled the token instead of stalling on
# it: the probe exchange for the fixture's document_number records the Wallet's
# retrieval, so the Wallet was still able to process the request that reflects
# the token's disposition. `evidence.non_empty` on the session record was
# satisfied by the session Capture creates before the Wallet does anything, so
# it passed for a Wallet that never engaged.
- id: wallet_retrieved_the_probe_after_the_malformed_token
  validator: oid4vp.session_event_count
  input: evidence.probe_exchange
  params: { type: vp_request_retrieved, count: 1 }
verdict:
  pass_when: all_assertions_pass
