id: WS_RP_MS_ProtocolMessages__151
title: Return vp_formats_not_supported when the requested format is unsupported.
source:
  path: MessageStructure/ProtocolMessages/WS_RP_MS_ProtocolMessages__151.md
suite:
  sut: wallet_solution
  role: relying_party
  section: message_structure.protocol_messages
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: '6.1'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
- ref: pipeline.dcql.protocol-messages
evidence:
  dcql_exchange:
    from: pipeline.dcql.protocol-messages-151.outputs.dcql_exchange
assertions:
# The request shape the source states: the delivered query offers only the
# mso_mdoc format, which is the format the source's premise assumes the Wallet
# does not support.
- id: request_offers_only_the_mso_mdoc_format
  validator: oid4vp.dcql_requested_claim_paths
  input: evidence.dcql_exchange
  params:
    format: mso_mdoc
    paths:
    - - eu.europa.ec.eudi.pid.1
      - given_name
- id: ws_rp_ms_protocolmessages__151_dcql_protocol_valid
  validator: oid4vp.error_response_required
  input: evidence.dcql_exchange
  params:
    code: vp_formats_not_supported
    not_applicable_when_wallet_supports_format: mso_mdoc
verdict:
  pass_when: all_assertions_pass
