  validator: oid4vp.transaction_data_credential_ids_non_array
  input: evidence.request_object
# The delivered entry uses type payment, which the reference Wallet does not
# support, so its rejection could not be attributed to credential_ids.
- id: ws_rp_ms_protocolmessages__026_requires_a_supported_type
  validator: fcaf.not_applicable
  input: evidence.request_object
  params:
    reason: >-
      the source applies only in combination with a transaction data type the
      Wallet supports; the reference Wallet declares no supported
      transaction-data type, so the credential_ids defect cannot be isolated
      from an unsupported type
verdict:
