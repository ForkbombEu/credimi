id: WS_RP_MS_ProtocolMessages__090
title: Reject a DCQL query with missing trusted_authorities values.
source:
  path: MessageStructure/ProtocolMessages/WS_RP_MS_ProtocolMessages__090.md
suite:
  sut: wallet_solution
  role: relying_party
  section: message_structure.protocol_messages
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: 6.1.1, 8.5
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
- ref: pipeline.dcql.standard-all
evidence:
  dcql_exchange:
    from: pipeline.dcql.trusted-authorities-missing-values.outputs.dcql_exchange
  visual_evidence:
    from: pipeline.dcql.trusted-authorities-missing-values.outputs.visual_evidence
  dcql_exchange_session:
    from: pipeline.dcql.trusted-authorities-missing-values.outputs.dcql_exchange_session
assertions:
- id: delivered_trusted_authority_has_no_values
  validator: dcql.response_satisfies_constraints
  input: evidence.dcql_exchange
  params:
    mode: trusted_authority_property_absent
    property: values
- id: ws_rp_ms_protocolmessages__090_visual_evidence
  validator: evidence.non_empty
  input: evidence.visual_evidence
- id: dcql_exchange_no_presentation_returned
  validator: oid4vp.no_presentation_returned
  input: evidence.dcql_exchange_session
verdict:
  pass_when: all_assertions_pass
