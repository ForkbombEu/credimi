# The source signs with the Verifier's WRPAC key; Capture signs with its normal
# X.509 verifier certificate, so the invalid signature value is the only
# property this definition can hold the Wallet to.
id: WS_RP_SM_RpIntegrity__013b_UF
title: Abort a Request Object whose signature value is invalid
source:
  path: SecurityMechanisms/RpIntegrity/WS_RP_SM_RpIntegrity__013b_UF.md
suite:
  sut: wallet_solution
  role: relying_party
  section: security_mechanisms.rp_integrity
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
- title: OpenID4VC High Assurance Interoperability Profile
  section: '5.1'
  url: https://openid.net/specs/openid4vc-high-assurance-interoperability-profile-1_0.html
- title: OpenID for Verifiable Presentations 1.0
  section: '5'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
evidence:
  session: { from: pipeline.rp-integrity.invalid-signature.outputs.session }
  request_object: { from: pipeline.rp-integrity.invalid-signature.outputs.request_object }
  visual_evidence: { from: pipeline.rp-integrity.invalid-signature.outputs.visual_evidence }
assertions:
- id: request_object_signature_is_invalid
  validator: jose.jws_invalid_signature
  input: evidence.request_object
- id: wallet_retrieves_request_object_with_post
  validator: oid4vp.request_uri_retrieval
  input: evidence.session
  params: { method: POST }
- id: wallet_aborts_without_a_presentation
  validator: dcql.response_satisfies_constraints
  input: evidence.session
  params: { mode: request_rejected }
- id: visual_evidence_is_stored
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
