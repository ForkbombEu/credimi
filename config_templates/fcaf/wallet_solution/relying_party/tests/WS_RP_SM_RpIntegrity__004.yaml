id: WS_RP_SM_RpIntegrity__004
title: Validate a DC API Request Object signature and proceed.
source:
  path: SecurityMechanisms/RpIntegrity/WS_RP_SM_RpIntegrity__004.md
suite:
  sut: wallet_solution
  role: relying_party
  section: security_mechanisms.rp_integrity
applicability:
  profile: EUDI_generic
  presentation_flow: digital_credentials_api
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: 'A.2'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
- title: OpenID for Verifiable Presentations 1.0
  section: '5.9.3'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
evidence:
  session:
    from: pipeline.dc-api.signed-encrypted.outputs.session
  request_object:
    from: pipeline.dc-api.signed-encrypted.outputs.request_object
  visual_evidence:
    from: pipeline.dc-api.signed-encrypted.outputs.visual_evidence
assertions:
- id: delivered_request_object_signature_verifies
  validator: jose.jws_signed_request
  input: evidence.request_object
- id: client_id_is_the_hash_of_the_delivered_leaf_certificate
  validator: oid4vp.x509_hash_client_id
  input: evidence.request_object
- id: wallet_completed_the_presentation
  validator: dcql.response_satisfies_constraints
  input: evidence.session
  params:
    mode: credentials_match
- id: visual_evidence_is_stored
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
