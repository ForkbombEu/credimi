id: WS_RP_MS_ProtocolMessages__158
title: Return invalid_transaction_data for transaction_data credential_ids that do not match the DCQL query.
source:
  path: MessageStructure/ProtocolMessages/WS_RP_MS_ProtocolMessages__158.md
suite:
  sut: wallet_solution
  role: relying_party
  section: message_structure.protocol_messages
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: '8.5'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
# The source states no precondition, so the entry's concrete `payment` type and
# the mismatch of its credential_ids with the DCQL query are the request under
# test. The request-shape assertion proves the mismatch was delivered; the
# capture then records the Wallet's answer, which must be
# invalid_transaction_data.
evidence:
  request_object:
    from: pipeline.dcql.protocol-messages-158.outputs.request_object
  dcql_exchange:
    from: pipeline.dcql.protocol-messages-158.outputs.dcql_exchange
  visual_evidence:
    from: pipeline.dcql.protocol-messages-158.outputs.visual_evidence
assertions:
- id: ws_rp_ms_protocolmessages__158_transaction_data_credential_ids_mismatch
  validator: oid4vp.transaction_data_credential_ids_mismatch_dcql
  input: evidence.request_object
- id: ws_rp_ms_protocolmessages__158_returns_invalid_transaction_data
  validator: dcql.response_satisfies_constraints
  input: evidence.dcql_exchange
  params:
    mode: transaction_data_error_required
- id: ws_rp_ms_protocolmessages__158_visual_evidence_stored
  validator: evidence.screenshot_named
  input: evidence.visual_evidence
  params: { name: request-refused }
verdict:
  pass_when: all_assertions_pass
