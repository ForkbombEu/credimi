id: WS_RP_MS_ProtocolMessages__041
title: Derive the response URI from a redirect_uri Client Identifier under direct_post.jwt
source:
  path: MessageStructure/ProtocolMessages/WS_RP_MS_ProtocolMessages__041.md
suite:
  sut: wallet_solution
  role: relying_party
  section: message_structure.protocol_messages
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: '5.9.3'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
evidence:
  session: { from: pipeline.protocol.client-id-binding-controls.outputs.derived_response_uri_session }
  outer_request: { from: pipeline.protocol.client-id-binding-controls.outputs.derived_response_uri_outer_request }
  visual_evidence: { from: pipeline.protocol.client-id-binding-controls.outputs.derived_response_uri_visual_evidence }
assertions:
- id: client_id_uses_the_redirect_uri_prefix
  validator: json.field_string_prefix
  input: evidence.outer_request
  params: { field: client_id, prefix: "redirect_uri:https://" }
- id: request_uses_direct_post_jwt
  validator: json.field_equals
  input: evidence.outer_request
  params: { field: response_mode, value: direct_post.jwt }
- id: request_omits_response_uri
  validator: json.field_presence
  input: evidence.outer_request
  params: { field: response_uri, present: false }
- id: wallet_submitted_the_authorization_response
  validator: oid4vp.presentation_response_http
  input: evidence.session
  params:
    method: POST
    media_type: application/x-www-form-urlencoded
    require_response_parameter: true
- id: wallet_returned_the_requested_credential
  validator: dcql.response_satisfies_constraints
  input: evidence.session
  params: { mode: credentials_match }
- id: visual_evidence_is_stored
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
