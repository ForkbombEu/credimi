id: WS_RP_MS_ProtocolMessages__154
title: Return invalid_transaction_data for an unknown field in a known transaction data type.
source:
  path: MessageStructure/ProtocolMessages/WS_RP_MS_ProtocolMessages__154.md
suite:
  sut: wallet_solution
  role: relying_party
  section: message_structure.protocol_messages
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: '5.1, 8.5'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
- ref: pipeline.dcql.protocol-messages-154
# The scenario's "one object has a supported type but includes an unknown field"
# needs a transaction data type the Wallet knows, so that a field outside its
# definition is detectable. OpenID4VP 5.1 leaves type values and their
# definitions to other specifications, this suite defines no type schema, and
# the Wallet under test declares none, so no unknown field can be placed inside
# a known type. The request-shape assertions still prove the delivered entry is
# well-formed on the OpenID4VP-defined members and carries the extra field.
evidence:
  request_object:
    from: pipeline.dcql.protocol-messages-154.outputs.request_object
  visual_evidence:
    from: pipeline.dcql.protocol-messages-154.outputs.visual_evidence
assertions:
- id: ws_rp_ms_protocolmessages__154_delivered_entry_carries_transaction_data
  validator: jwt.payload_field_presence
  input: evidence.request_object
  params:
    field: transaction_data
    present: true
- id: ws_rp_ms_protocolmessages__154_delivered_entry_references_a_requested_credential
  validator: oid4vp.transaction_data_credential_ids_match_dcql
  input: evidence.request_object
- id: ws_rp_ms_protocolmessages__154_unknown_field_requires_a_known_type
  validator: fcaf.not_applicable
  input: evidence.request_object
  params:
    reason: >-
      the source requires "an object of a known type but containing an unknown
      field", which presupposes a type definition the Wallet knows; OpenID4VP
      Section 5.1 leaves transaction data type values out of scope, this suite
      defines no type schema, and the Wallet under test supports none (no
      wallet-metadata parameter declares transaction data types, and its
      18/11/2026 captures answer every structurally valid entry with
      invalid_transaction_data for the unsupported type), so an unknown field
      cannot be placed inside a known type
- id: ws_rp_ms_protocolmessages__154_visual_evidence_stored
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
