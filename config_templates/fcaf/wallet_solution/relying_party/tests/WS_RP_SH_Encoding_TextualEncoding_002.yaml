id: WS_RP_SH_Encoding_TextualEncoding_002
title: Select every element of the array addressed by a null path component.
source:
  path: Shared/Encoding/WS_RP_SH_Encoding_TextualEncoding_002.md
suite:
  sut: wallet_solution
  role: relying_party
  section: shared.encoding
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: '7.2.1'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
evidence:
  dcql_exchange:
    from: pipeline.dcql.degree-array-selector.outputs.dcql_exchange
  visual_evidence:
    from: pipeline.dcql.degree-array-selector.outputs.visual_evidence
assertions:
- id: null_component_selects_every_degree_entry
  validator: oid4vp.dcql_array_selector_filter
  input: evidence.dcql_exchange
  params:
    vct: urn:credimi:degree:1
    path:
    - degrees
    - null
    - type
    required_values:
    - Bachelor of Science
    - Master of Science
    forbidden_claims:
    - name
    - nationalities
    - address
- id: wallet_completes_the_degree_presentation
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
