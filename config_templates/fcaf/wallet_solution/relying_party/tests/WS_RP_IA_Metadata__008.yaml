id: WS_RP_IA_Metadata__008
title: Verify direct_post.jwt submission to an HTTPS response_uri.
source:
  path: Interaction/Metadata/WS_RP_IA_Metadata__008.md
suite:
  sut: wallet_solution
  role: relying_party
  section: interaction.metadata
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
  - title: OpenID for Verifiable Presentations 1.0
    section: "5.2, 8.2, 8.3"
    url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
evidence:
  authorization_request:
    from: pipeline.wallet.metadata.direct-post-jwt.outputs.authorization_request
  capture_session:
    from: pipeline.wallet.metadata.direct-post-jwt.outputs.capture_session
  wallet_response:
    from: pipeline.wallet.metadata.direct-post-jwt.outputs.wallet_response
assertions:
  - id: response_mode_is_direct_post_jwt
    validator: json.field_equals
    input: evidence.authorization_request
    params:
      field: response_mode
      value: direct_post.jwt
  - id: response_uri_is_https
    validator: json.field_string_prefix
    input: evidence.authorization_request
    params:
      field: response_uri
      prefix: https://
  - id: authorization_response_posted_to_response_uri
    validator: oid4vp.presentation_response_http
    input: evidence.capture_session
    params:
      method: POST
      media_type: application/x-www-form-urlencoded
      require_response_parameter: true
  - id: vp_token_posted
    validator: json.field_required
    input: evidence.wallet_response
    params:
      field: vp_token
verdict:
  pass_when: all_assertions_pass
