id: WS_RP_SM_RpIntegrity__020
title: Verify trusted x509_hash request metadata placement.
source:
  path: SecurityMechanisms/RpIntegrity/WS_RP_SM_RpIntegrity__020.md
suite:
  sut: wallet_solution
  role: relying_party
  section: security_mechanisms.rp_integrity
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: '5.9.3'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
- ref: pipeline.wallet.metadata.signed-x509-hash
evidence:
  signed_request_object:
    from: pipeline.wallet.metadata.signed-x509-hash.outputs.signed_request_object
  capture_session:
    from: pipeline.wallet.metadata.signed-x509-hash.outputs.capture_session
  visual_evidence:
    from: pipeline.wallet.metadata.signed-x509-hash.outputs.visual_evidence
assertions:
- id: signature_verifies_with_x509_leaf_key
  validator: jose.jws_signed_request
  input: evidence.signed_request_object
- id: client_id_matches_x509_leaf_hash
  validator: oid4vp.x509_hash_client_id
  input: evidence.signed_request_object
- id: verifier_metadata_is_exclusive_to_client_metadata
  validator: oid4vp.verifier_metadata_exclusive
  input: evidence.signed_request_object
- id: wallet_processes_trusted_x509_hash_request
  validator: oid4vp.session_event_count
  input: evidence.capture_session
  params: {type: vp_presentation_response_received, count: 1}
- id: wallet_processing_has_visual_evidence
  validator: evidence.non_empty
  input: evidence.visual_evidence
- id: complete_trust_chain_precondition_is_unbuildable
  validator: fcaf.skipped
  input: evidence.signed_request_object
  params:
    reason: >-
      the source requires a Request Object whose x5c chain leads to a trusted
      root and whose signature and chain the Wallet validates; Capture delivers
      its deployed verifier certificate as a single-element x5c (leaf only,
      probed 14/10/2026) and no Capture control builds a valid complete chain,
      so chain validation cannot be exercised; the reference Wallet also
      accepts a request whose chain ends in an untrusted root
      (REFERENCE-WALLET-ISSUES.md RI-WALLET-019), so its acceptance does not
      evidence chain validation. The client_metadata placement half of the
      source is asserted above and holds
verdict:
  pass_when: all_assertions_pass
