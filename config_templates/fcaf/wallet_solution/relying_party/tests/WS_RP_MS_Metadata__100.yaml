id: WS_RP_MS_Metadata__100
title: Reject a COSE Referenced Token whose status_list has no uri.
source:
  path: MessageStructure/Metadata/WS_RP_MS_Metadata__100.md
suite:
  sut: wallet_solution
  role: relying_party
  section: message_structure.metadata
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
  credential_format: iso_mdoc
normative_references:
- title: Token Status List
  section: '6.3'
  url: https://www.ietf.org/archive/id/draft-ietf-oauth-status-list-13.html
evidence:
  issuance_session:
    from: pipeline.fixtures.status-reference.mdoc.outputs.missing_uri_issuance
  probe_exchange:
    from: pipeline.fixtures.status-reference.mdoc.outputs.missing_uri_probe
  visual_evidence:
    from: pipeline.fixtures.status-reference.mdoc.outputs.missing_uri_visual_evidence
assertions:
- id: issuer_offered_the_malformed_status_reference
  validator: json.field_equals
  input: evidence.issuance_session
  params: { field: status_reference, value: missing_uri }
- id: issuer_issued_the_probed_document_number
  validator: json.field_equals
  input: evidence.issuance_session
  params: { field: document_number, value: CREDIMI-MDOC-MISSING-URI }
- id: issuer_offered_an_mdoc_pid
  validator: json.field_equals
  input: evidence.issuance_session
  params: { field: credential_configuration_id, value: "urn:eu.europa.ec.eudi:pid:1.mdoc.key-attestation-required" }
- id: wallet_matched_nothing_for_the_refused_document_number
  validator: dcql.response_satisfies_constraints
  input: evidence.probe_exchange
  params:
    mode: claims_values_no_match
    expected_claim_path: [eu.europa.ec.eudi.pid.1, document_number]
    expected_value: CREDIMI-MDOC-MISSING-URI
- id: wallet_showed_the_no_match_notice
  validator: evidence.screenshot_named
  input: evidence.visual_evidence
  params: { name: no-match-notice }
verdict:
  pass_when: all_assertions_pass
