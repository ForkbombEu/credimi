id: WS_RP_MS_Metadata__141
title: Present an SD-JWT VC with an issuer X.509 certificate chain.
source:
  path: MessageStructure/Metadata/WS_RP_MS_Metadata__141.md
suite:
  sut: wallet_solution
  role: relying_party
  section: message_structure.metadata
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: '6.3'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
- ref: pipeline.credential-formats.sdjwt-presentation
evidence:
  dcql_exchange:
    from: pipeline.credential-formats.sdjwt-presentation.outputs.dcql_exchange
  pid_sdjwt:
    from: pipeline.credential-formats.sdjwt-presentation.outputs.pid_sdjwt
  visual_evidence:
    from: pipeline.credential-formats.sdjwt-presentation.outputs.visual_evidence
assertions:
- id: request_and_response_use_sd_jwt_vc
  validator: dcql.response_satisfies_constraints
  input: evidence.dcql_exchange
  params:
    mode: credential_format_presentation
    expected_format: dc+sd-jwt
- id: issuer_header_contains_a_valid_x509_chain
  validator: sdjwt.issuer_x509_header
  input: evidence.pid_sdjwt
- id: presentation_evidence_is_stored
  validator: evidence.minimum_items
  input: evidence.visual_evidence
  params:
    min_items: 2
verdict:
  pass_when: all_assertions_pass
