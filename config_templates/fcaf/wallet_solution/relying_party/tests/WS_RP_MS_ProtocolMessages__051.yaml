id: WS_RP_MS_ProtocolMessages__051
title: Reject conflicting outer and Request Object client identifiers
source:
  path: MessageStructure/ProtocolMessages/WS_RP_MS_ProtocolMessages__051.md
suite:
  sut: wallet_solution
  role: relying_party
  section: message_structure.protocol_messages
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: '5.10.1'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
evidence:
  session: { from: pipeline.protocol.request-object-outer-controls.outputs.conflicting_client_id_session }
  request_object: { from: pipeline.protocol.request-object-outer-controls.outputs.conflicting_client_id_request_object }
  outer_request: { from: pipeline.protocol.request-object-outer-controls.outputs.conflicting_client_id_outer_request }
  visual_evidence: { from: pipeline.protocol.request-object-outer-controls.outputs.conflicting_client_id_visual_evidence }
assertions:
- id: request_object_client_id_is_controlled
  validator: jwt.payload_field_equals
  input: evidence.request_object
  params: { field: client_id, value: request-object-client }
- id: outer_client_id_conflicts
  validator: json.field_equals
  input: evidence.outer_request
  params: { field: client_id, value: outer-client }
- id: wallet_retrieves_request_object
  validator: oid4vp.request_uri_retrieval
  input: evidence.session
  params: { method: POST }
- id: wallet_rejects_request
  validator: dcql.response_satisfies_constraints
  input: evidence.session
  params: { mode: request_rejected }
- id: visual_evidence_is_stored
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
