id: WS_RP_IA_Supportive__001
title: Verify the wallet follows the redirect URI returned after direct_post.
source:
  path: Interaction/Supportive/WS_RP_IA_Supportive__001.md
suite:
  sut: wallet_solution
  role: relying_party
  section: interaction.supportive
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
  - title: OpenID for Verifiable Presentations 1.0
    section: "8.3"
    url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
evidence:
  wallet_response:
    from: pipeline.wallet.supportive.redirect-uri.outputs.wallet_response
  capture_session:
    from: pipeline.wallet.supportive.redirect-uri.outputs.capture_session
  visual_evidence:
    from: pipeline.wallet.supportive.redirect-uri.outputs.visual_evidence
assertions:
# The source's step 3 is the Wallet's POST to the response_uri; wallet_response
# is the decrypted body that only exists after a successful verification, so a
# missed presentation must fail on the raw HTTP record instead of a nil body.
# Plain direct_post carries the Authorization Response parameters directly in
# the form, not a single `response` JWE, so only the POST itself is required.
  - id: authorization_response_posted_to_the_response_uri
    validator: oid4vp.presentation_response_http
    input: evidence.capture_session
    params:
      method: POST
  - id: wallet_follows_the_returned_redirect_uri
    validator: oid4vp.redirect_uri_visited
    input: evidence.capture_session
    params:
      after_presentation_response: true
  - id: wallet_engagement_has_visual_evidence
    validator: evidence.non_empty
    input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
