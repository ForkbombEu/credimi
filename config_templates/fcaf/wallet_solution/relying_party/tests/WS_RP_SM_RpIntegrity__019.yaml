id: WS_RP_SM_RpIntegrity__019
title: Reject an x509_hash Request Object whose chain ends in an untrusted root.
source:
  path: SecurityMechanisms/RpIntegrity/WS_RP_SM_RpIntegrity__019.md
suite:
  sut: wallet_solution
  role: relying_party
  section: security_mechanisms.rp_integrity
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: '5.9.3'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
evidence:
  session:
    from: pipeline.rp-integrity.certificate-chain.outputs.untrusted_root_session
  request_object:
    from: pipeline.rp-integrity.certificate-chain.outputs.untrusted_root_request_object
  request_behavior:
    from: pipeline.rp-integrity.certificate-chain.outputs.untrusted_root_request_behavior
  visual_evidence:
    from: pipeline.rp-integrity.certificate-chain.outputs.untrusted_root_visual_evidence
assertions:
- id: verifier_delivered_the_untrusted_root_chain
  validator: json.field_equals
  input: evidence.request_behavior
  params: { field: certificate_chain, value: untrusted_root }
- id: delivered_x5c_has_the_untrusted_root_defect
  validator: oid4vp.request_certificate_chain
  input: evidence.request_object
  params: { shape: untrusted_root }
- id: signature_verifies_against_the_delivered_leaf
  validator: jose.jws_signed_request
  input: evidence.request_object
- id: client_id_is_the_hash_of_the_delivered_leaf_certificate
  validator: oid4vp.x509_hash_client_id
  input: evidence.request_object
- id: wallet_returns_invalid_request_without_a_presentation
  validator: oid4vp.error_response_required
  input: evidence.session
  params: { code: invalid_request }
- id: visual_evidence_is_stored
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
