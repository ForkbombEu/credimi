id: WS_RP_MS_ProtocolMessages__143
title: Return invalid_request for an unsupported Client Identifier Prefix
source:
  path: MessageStructure/ProtocolMessages/WS_RP_MS_ProtocolMessages__143.md
suite:
  sut: wallet_solution
  role: relying_party
  section: message_structure.protocol_messages
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: '5.9.3'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
- title: OpenID for Verifiable Presentations 1.0
  section: '8.5'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
evidence:
  session: { from: pipeline.protocol.client-id-prefix-controls.outputs.unsupported_prefix_session }
  delivered_request: { from: pipeline.protocol.client-id-prefix-controls.outputs.unsupported_prefix_delivered_request }
  outer_request: { from: pipeline.protocol.client-id-prefix-controls.outputs.unsupported_prefix_outer_request }
  visual_evidence: { from: pipeline.protocol.client-id-prefix-controls.outputs.unsupported_prefix_visual_evidence }
assertions:
- id: request_object_uses_unsupported_prefix
  validator: json.field_string_prefix
  input: evidence.delivered_request
  params: { field: client_id, prefix: "fcaf_unsupported_prefix:" }
- id: outer_request_uses_unsupported_prefix
  validator: json.field_string_prefix
  input: evidence.outer_request
  params: { field: client_id, prefix: "fcaf_unsupported_prefix:" }
- id: wallet_retrieves_request_object
  validator: oid4vp.request_uri_retrieval
  input: evidence.session
  params: { method: POST }
- id: wallet_returns_invalid_request
  validator: dcql.response_satisfies_constraints
  input: evidence.session
  params: { mode: invalid_request_required }
- id: visual_evidence_is_stored
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
