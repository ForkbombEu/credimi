id: WS_RP_IA_MainInteraction__013
title: Exclude a claim unchecked in the wallet UI.
source:
  path: Interaction/MainInteraction/WS_RP_IA_MainInteraction__013.md
suite:
  sut: wallet_solution
  role: relying_party
  section: interaction.main_interaction
applicability:
  profile: EUDI_generic
  credential_format: ietf_sd_jwt_vc
normative_references:
- title: OpenID for Verifiable Presentations
  section: '6.4'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
- ref: pipeline.dcql.standard-all
evidence:
  dcql_exchange:
    from: pipeline.dcql.unchecked-claim.outputs.dcql_exchange
  wallet_response:
    from: pipeline.dcql.unchecked-claim.outputs.wallet_response
  visual_evidence:
    from: pipeline.dcql.unchecked-claim.outputs.visual_evidence
assertions:
- id: request_asks_for_given_name_and_address
  validator: oid4vp.dcql_requested_claim_paths
  input: evidence.dcql_exchange
  params:
    format: dc+sd-jwt
    paths:
    - - given_name
    - - address
- id: ws_rp_ia_maininteraction__013_given_name_is_disclosed
  validator: sdjwt.claim_presence
  input: evidence.wallet_response
  params:
    claim: given_name
    present: true
- id: ws_rp_ia_maininteraction__013_unchecked_address_is_absent
  validator: sdjwt.claim_presence
  input: evidence.wallet_response
  params:
    claim: address
    present: false
- id: ws_rp_ia_maininteraction__013_visual_evidence
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
