id: WS_RP_MS_ProtocolMessages__049
title: Prefer Request Object parameters over conflicting outer parameters
source:
  path: MessageStructure/ProtocolMessages/WS_RP_MS_ProtocolMessages__049.md
suite:
  sut: wallet_solution
  role: relying_party
  section: message_structure.protocol_messages
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: '5.10.1'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
evidence:
  session: { from: pipeline.protocol.request-object-outer-controls.outputs.conflicting_nonce_session }
  request_object: { from: pipeline.protocol.request-object-outer-controls.outputs.conflicting_nonce_request_object }
  outer_request: { from: pipeline.protocol.request-object-outer-controls.outputs.conflicting_nonce_outer_request }
  visual_evidence: { from: pipeline.protocol.request-object-outer-controls.outputs.conflicting_nonce_visual_evidence }
assertions:
- id: request_object_nonce_is_selected_value
  validator: jwt.payload_field_equals
  input: evidence.request_object
  params: { field: nonce, value: request-object-nonce }
- id: outer_request_nonce_conflicts
  validator: json.field_equals
  input: evidence.outer_request
  params: { field: nonce, value: outer-nonce }
- id: wallet_retrieves_request_object
  validator: oid4vp.request_uri_retrieval
  input: evidence.session
  params: { method: POST }
- id: wallet_processes_request
  validator: dcql.response_satisfies_constraints
  input: evidence.session
  params: { mode: credentials_match }
- id: visual_evidence_is_stored
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
