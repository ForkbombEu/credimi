id: WS_RP_MS_ProtocolMessages__135
title: Include a transaction_data reference in the credential presentation.
source:
  path: MessageStructure/ProtocolMessages/WS_RP_MS_ProtocolMessages__135.md
suite:
  sut: wallet_solution
  role: relying_party
  section: message_structure.protocol_messages
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: '8.4'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
- ref: pipeline.dcql.protocol-messages-135
# The source requires the Wallet to display the transaction_data and to answer
# with a presentation whose JWT payload carries transaction_data_hashes
# referencing it. OpenID4VP 8.4 makes that representation transaction data type
# specific, so it needs a type the Wallet accepts; the Wallet under test
# declares none (its request_uri wallet_metadata carries none and its captures
# answer transaction_data with invalid_transaction_data), so the presentation
# the source expects cannot be produced. This is the Wallet-capability ground,
# not a claim that the Wallet is conformant on 135.
evidence:
  dcql_exchange:
    from: pipeline.dcql.protocol-messages-135.outputs.dcql_exchange
assertions:
- id: ws_rp_ms_protocolmessages__135_transaction_binding_requires_a_supported_type
  validator: fcaf.not_applicable
  input: evidence.dcql_exchange
  params:
    reason: >-
      the source requires the Wallet to display the transaction_data and to
      submit a presentation whose JWT payload contains transaction_data_hashes
      referencing it, and OpenID4VP Section 8.4 makes that representation
      transaction data type specific; the Wallet under test declares no
      transaction data type (its request_uri wallet_metadata carries none and
      its captures answer transaction_data with invalid_transaction_data), so
      the presentation cannot be produced
verdict:
  pass_when: all_assertions_pass
