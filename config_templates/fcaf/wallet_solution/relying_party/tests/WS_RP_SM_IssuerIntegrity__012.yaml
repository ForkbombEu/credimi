- ref: pipeline.dcql.baseline
evidence:
  dcql_exchange:
    from: pipeline.dcql.baseline.outputs.session
assertions:
- id: revoked_mdoc_wait_is_unavailable
  validator: fcaf.skipped
  input: evidence.dcql_exchange
  params:
    reason: >-
      needs the Wallet to hold an mdoc whose status is revoked when the request
      arrives. Capture now revokes a stored credential (POST
      /sessions/{id}/status, probed 22/10/2026: 200 and the status bit set),
      but the status list is served with Cache-Control max-age=43200, so a
      Wallet that fetched it at issuance may rely on the valid copy for 12
      hours; the pipeline has no wait step to pass that max-age, and each
      scenario resets the Wallet, so the wait cannot overlap other scenarios
verdict:
  pass_when: all_assertions_pass
