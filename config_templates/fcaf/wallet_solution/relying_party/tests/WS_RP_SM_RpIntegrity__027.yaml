id: WS_RP_SM_RpIntegrity__027
title: Reject a Request Object with an invalid JWS signature
source:
  path: SecurityMechanisms/RpIntegrity/WS_RP_SM_RpIntegrity__027.md
suite:
  sut: wallet_solution
  role: relying_party
  section: security_mechanisms.rp_integrity
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
- title: High Assurance Interoperability Profile
  section: '5.1'
  url: https://openid.net/specs/openid-4-high-assurance-interoperability-profile-1_0.html
evidence:
  session: { from: pipeline.rp-integrity.invalid-signature.outputs.session }
  request_object: { from: pipeline.rp-integrity.invalid-signature.outputs.request_object }
  visual_evidence: { from: pipeline.rp-integrity.invalid-signature.outputs.visual_evidence }
assertions:
- id: request_object_signature_is_invalid
  validator: jose.jws_invalid_signature
  input: evidence.request_object
- id: wallet_retrieves_request_object
  validator: oid4vp.request_uri_retrieval
  input: evidence.session
  params: { method: POST }
- id: wallet_rejects_invalid_signature
  validator: dcql.response_satisfies_constraints
  input: evidence.session
  params: { mode: request_rejected }
- id: visual_evidence_is_stored
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
