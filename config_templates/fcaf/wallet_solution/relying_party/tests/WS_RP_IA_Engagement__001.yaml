id: WS_RP_IA_Engagement__001
title: Verify that the wallet can be invoked through the haip-vp custom URL scheme.
source:
  path: Interaction/Engagement/WS_RP_IA_Engagement__001.md
suite:
  sut: wallet_solution
  role: relying_party
  section: interaction.engagement
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
  - title: OpenID4VP High Assurance Interoperability Profile
    section: "5.1"
    url: https://openid.net/specs/openid4vc-high-assurance-interoperability-profile-1_0.html
evidence:
  wallet_engagement:
    from: pipeline.wallet.engagement.haip-vp.outputs.wallet_engagement
  visual_evidence:
    from: pipeline.wallet.engagement.haip-vp.outputs.visual_evidence
assertions:
  - id: presentation_request_created
    validator: json.field_required
    input: evidence.wallet_engagement
    params:
      field: deeplink
  - id: haip_vp_scheme
    validator: json.field_string_prefix
    input: evidence.wallet_engagement
    params:
      field: deeplink
      prefix: haip-vp://
  - id: wallet_retrieved_the_request_from_the_deeplink
    validator: oid4vp.request_uri_retrieval
    input: evidence.wallet_engagement
    params:
      method: POST
  - id: wallet_engagement_is_visible
    validator: evidence.screenshot_named
    input: evidence.visual_evidence
    params:
      name: fcaf-engagement-haip-vp-invoked
verdict:
  pass_when: all_assertions_pass
