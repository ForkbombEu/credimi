id: WS_RP_SM_RpIntegrity__011
title: Refuse a Verifier attestation JWT whose issuer is not trusted.
source:
  path: SecurityMechanisms/RpIntegrity/WS_RP_SM_RpIntegrity__011.md
suite:
  sut: wallet_solution
  role: relying_party
  section: security_mechanisms.rp_integrity
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: '5.9.3'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
evidence:
  session:
    from: pipeline.rp-integrity.verifier-attestation.outputs.untrusted_issuer_session
  request_object:
    from: pipeline.rp-integrity.verifier-attestation.outputs.untrusted_issuer_request_object
  request_evidence:
    from: pipeline.rp-integrity.verifier-attestation.outputs.untrusted_issuer_request_evidence
  visual_evidence:
    from: pipeline.rp-integrity.verifier-attestation.outputs.untrusted_issuer_visual_evidence
assertions:
- id: delivered_attestation_names_an_untrusted_issuer
  validator: oid4vp.verifier_attestation_request
  input: evidence.request_evidence
  params:
    jwt_header: present
    subject: client_id
    issuer: https://untrusted-attestation-issuer.credimi.invalid
    request_signature: valid
    attestation_signature: valid
    redirect_uris: absent
- id: wallet_returns_invalid_client_without_a_presentation
  validator: oid4vp.error_response_required
  input: evidence.session
  params:
    code: invalid_client
- id: visual_evidence_is_stored
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
