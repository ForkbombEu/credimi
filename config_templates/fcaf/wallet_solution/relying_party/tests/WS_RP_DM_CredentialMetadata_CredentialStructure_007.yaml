id: WS_RP_DM_CredentialMetadata_CredentialStructure_007
title: The wallet applies valid DCQL credential_sets constraints
source:
  path: DataModel/CredentialMetadata/WS_RP_DM_CredentialMetadata_CredentialStructure_007.md
suite:
  sut: wallet_solution
  role: relying_party
  section: data_model.credential_metadata
applicability:
  protocol: oid4vp
normative_references:
- title: OID4VP section 6
  url: https://conformance.eudi.dev/latest/fcaf/suts/wallet_solution/relying_party/ws_rp/#ws_rp_dm_credentialmetadata_credentialstructure_007
- ref: pipeline.dcql.standard-all
evidence:
  dcql_exchange:
    from: pipeline.dcql.standard-all.outputs.credential_sets_dcql_exchange
  visual_evidence:
    from: pipeline.dcql.standard-all.outputs.credential_sets_visual_evidence
assertions:
# credential_sets_single_available_option requires a presentation for the
# available query AND no presentation for the excluded query, which the scenario
# makes satisfiable, so a Wallet that ignores credential_sets fails it.
- id: ws_rp_dm_credentialmetadata_credentialstructure_007_credential_sets_applied
  validator: dcql.response_satisfies_constraints
  input: evidence.dcql_exchange
  params:
    mode: credential_sets_single_available_option
- id: ws_rp_dm_credentialmetadata_credentialstructure_007_visual_evidence
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
