id: WS_RP_IA_MainInteraction__015
title: Disclose only a requested PID claim and technical SD-JWT fields.
source:
  path: Interaction/MainInteraction/WS_RP_IA_MainInteraction__015.md
suite:
  sut: wallet_solution
  role: relying_party
  section: interaction.main_interaction
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
  - title: OpenID for Verifiable Presentations 1.0
    section: "6.4.1"
    url: "https://openid.net/specs/openid-4-verifiable-presentations-1_0.html"
preconditions:
  - ref: pipeline.dcql.claims-without-values
evidence:
  dcql_exchange:
    from: pipeline.dcql.claims-without-values.outputs.dcql_exchange
  visual_evidence:
    from: pipeline.dcql.claims-without-values.outputs.visual_evidence
assertions:
  - id: only_requested_personal_claim_is_disclosed
    validator: dcql.response_satisfies_constraints
    input: evidence.dcql_exchange
    params:
      mode: claims_subset
      forbidden_paths:
        - - family_name
        - - birthdate
        - - email
        - - phone_number
        - - address
  - id: successful_interaction_is_recorded
    validator: evidence.non_empty
    input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
