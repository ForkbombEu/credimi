id: WS_RP_IA_MainInteraction__053
title: Reject a direct_post.jwt request whose response_uri is missing.
source:
  path: Interaction/MainInteraction/WS_RP_IA_MainInteraction__053.md
suite:
  sut: wallet_solution
  role: relying_party
  section: interaction.main_interaction
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: '8.2'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
evidence:
  session:
    from: pipeline.protocol.response-uri-controls.outputs.missing_response_uri_session
  request_object:
    from: pipeline.protocol.response-uri-controls.outputs.missing_response_uri_request_object
  visual_evidence:
    from: pipeline.protocol.response-uri-controls.outputs.missing_response_uri_visual_evidence
assertions:
- id: delivered_request_uses_direct_post_jwt
  validator: jwt.payload_field_equals
  input: evidence.request_object
  params: { field: response_mode, value: direct_post.jwt }
- id: delivered_request_omits_response_uri
  validator: jwt.payload_field_presence
  input: evidence.request_object
  params: { field: response_uri, present: false }
- id: wallet_retrieved_the_delivered_request_object
  validator: oid4vp.request_uri_retrieval
  input: evidence.session
  params: { method: GET }
- id: wallet_rejects_the_request
  validator: dcql.response_satisfies_constraints
  input: evidence.session
  params: { mode: request_rejected }
- id: visual_evidence_is_stored
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
