id: WS_RP_DM_CredentialMetadata_CredentialStructure_009
title: The wallet returns no credential when the DCQL query has no match
source:
  path: DataModel/CredentialMetadata/WS_RP_DM_CredentialMetadata_CredentialStructure_009.md
suite:
  sut: wallet_solution
  role: relying_party
  section: data_model.credential_metadata
applicability:
  protocol: oid4vp
normative_references:
- title: OID4VP section 6
  url: https://conformance.eudi.dev/latest/fcaf/suts/wallet_solution/relying_party/ws_rp/#ws_rp_dm_credentialmetadata_credentialstructure_009
- ref: pipeline.dcql.no-matching-credentials
evidence:
  dcql_exchange:
    from: pipeline.dcql.no-matching-credentials.outputs.dcql_exchange
assertions:
- id: ws_rp_dm_credentialmetadata_credentialstructure_009_dcql_valid
  validator: dcql.response_satisfies_constraints
  input: evidence.dcql_exchange
  params:
    mode: no_match
# Source Expected result 3: "The wallet will either return an "invalid request"
# error, or an empty VP token." Silence is neither, so the Wallet must also have
# delivered one Authorization Response; no_match above proves it carried no
# credential.
- id: wallet_sent_one_authorization_response
  validator: oid4vp.session_event_count
  input: evidence.dcql_exchange
  params: { type: vp_presentation_response_received, count: 1 }
verdict:
  pass_when: all_assertions_pass
