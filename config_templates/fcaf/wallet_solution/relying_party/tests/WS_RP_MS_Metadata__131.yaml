id: WS_RP_MS_Metadata__131
title: Verify a Request Object signature with its X.509 leaf key.
source:
  path: MessageStructure/Metadata/WS_RP_MS_Metadata__131.md
suite:
  sut: wallet_solution
  role: relying_party
  section: message_structure.metadata
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
  - title: OpenID for Verifiable Presentations 1.0
    section: "5.9.3"
    url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
evidence:
