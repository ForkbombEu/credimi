id: WS_RP_MS_ProtocolMessages__071
title: Verify DCQL multiple=true returns multiple credentials.
source:
  path: MessageStructure/ProtocolMessages/WS_RP_MS_ProtocolMessages__071.md
suite:
  sut: wallet_solution
  role: relying_party
  section: message_structure.protocol_messages
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: '6.1'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
- ref: pipeline.dcql.standard-all
evidence:
  matching_issuances:
    from: pipeline.dcql.multiple-true.outputs.matching_issuances
  dcql_exchange:
    from: pipeline.dcql.multiple-true.outputs.dcql_exchange
  visual_evidence:
    from: pipeline.dcql.multiple-true.outputs.visual_evidence
assertions:
# Source precondition: the Wallet contains more than one credential matching
# the request. Proven from the issuer sessions, because presenting a
# credential to prove possession would spend it.
- id: wallet_holds_two_matching_pids
  validator: oid4vci.fixtures_issued
  input: evidence.matching_issuances
  params:
    fixtures: [pid_default, pid_person_b]
- id: ws_rp_ms_protocolmessages__071_dcql_valid
  validator: dcql.response_satisfies_constraints
  input: evidence.dcql_exchange
  params:
    mode: multiple_true
- id: ws_rp_ms_protocolmessages__071_visual_evidence
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
