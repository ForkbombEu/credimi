id: WS_RP_MS_ProtocolMessages__046
title: Reject a Request Object with a mismatched wallet_nonce
source:
  path: MessageStructure/ProtocolMessages/WS_RP_MS_ProtocolMessages__046.md
suite:
  sut: wallet_solution
  role: relying_party
  section: message_structure.protocol_messages
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: '5.10.1'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
evidence:
  session: { from: pipeline.protocol.wallet-nonce-controls.outputs.protocol_message_mismatch_session }
  nonce_evidence: { from: pipeline.protocol.wallet-nonce-controls.outputs.protocol_message_mismatch_nonce_evidence }
  visual_evidence: { from: pipeline.protocol.wallet-nonce-controls.outputs.protocol_message_mismatch_visual_evidence }
assertions:
- id: request_object_nonce_differs_from_posted_nonce
  validator: oid4vp.wallet_nonce_mismatches_request_object
  input: evidence.nonce_evidence
  params: { expected: different }
- id: wallet_retrieves_request_object_with_post
  validator: oid4vp.request_uri_retrieval
  input: evidence.session
  params: { method: POST }
- id: wallet_rejects_request_object
  validator: dcql.response_satisfies_constraints
  input: evidence.session
  params: { mode: request_rejected }
- id: visual_evidence_is_stored
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
