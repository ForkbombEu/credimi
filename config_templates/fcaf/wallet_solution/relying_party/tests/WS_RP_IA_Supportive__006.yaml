id: WS_RP_IA_Supportive__006
title: Return wallet_unavailable when the device is out of resources.
source:
  path: Interaction/Supportive/WS_RP_IA_Supportive__006.md
suite:
  sut: wallet_solution
  role: relying_party
  section: interaction.supportive
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: '6.1'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
- ref: pipeline.dcql.baseline
evidence:
  wallet_response:
    from: pipeline.dcql.baseline.outputs.session
assertions:
- id: resource_exhausted_wallet_is_unavailable
  validator: fcaf.skipped
  input: evidence.wallet_response
  params:
    reason: >-
      requires a deliberately resource-exhausted wallet device (out of RAM and
      disk space) so the wallet cannot process the request and answers error
      wallet_unavailable; the harness has no way to put the device into that
      state
verdict:
  pass_when: all_assertions_pass
