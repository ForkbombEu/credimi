id: WS_RP_MS_CredentialFormats__044
title: Present an SD-JWT VC whose status claim contains status_list.
source:
  path: MessageStructure/CredentialFormats/WS_RP_MS_CredentialFormats__044.md
suite:
  sut: wallet_solution
  role: relying_party
  section: message_structure.credential_formats
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
  credential_format: ietf_sd_jwt_vc
normative_references:
- title: OpenID4VC High Assurance Interoperability Profile
  section: '6.1'
  url: https://openid.net/specs/openid4vc-high-assurance-interoperability-profile-1_0.html
- title: Token Status List
  section: '6.2'
  url: https://www.ietf.org/archive/id/draft-ietf-oauth-status-list-13.html
evidence:
  pid_sdjwt:
    from: pipeline.credential-status.sdjwt.outputs.pid_sdjwt
  visual_evidence:
    from: pipeline.credential-status.sdjwt.outputs.visual_evidence
assertions:
- id: presented_credential_carries_a_status_claim
  validator: sdjwt.claim_present
  input: evidence.pid_sdjwt
  params:
    claim: status
- id: status_claim_contains_status_list
  validator: sdjwt.claim_object
  input: evidence.pid_sdjwt
  params:
    claim: status.status_list
- id: status_list_reference_carries_a_uri
  validator: sdjwt.claim_uri
  input: evidence.pid_sdjwt
  params:
    claim: status.status_list.uri
- id: consent_visual_evidence_is_stored
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
