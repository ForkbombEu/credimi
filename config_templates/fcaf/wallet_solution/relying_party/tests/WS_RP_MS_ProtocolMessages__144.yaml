id: WS_RP_MS_ProtocolMessages__144
title: Return invalid_request for an unsigned request with an https Client Identifier
source:
  path: MessageStructure/ProtocolMessages/WS_RP_MS_ProtocolMessages__144.md
suite:
  sut: wallet_solution
  role: relying_party
  section: message_structure.protocol_messages
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: '5.9.3'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
- title: OpenID for Verifiable Presentations 1.0
  section: '8.5'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
evidence:
  session: { from: pipeline.protocol.client-id-prefix-controls.outputs.unsigned_https_session }
  outer_request: { from: pipeline.protocol.client-id-prefix-controls.outputs.unsigned_https_outer_request }
  visual_evidence: { from: pipeline.protocol.client-id-prefix-controls.outputs.unsigned_https_visual_evidence }
assertions:
- id: request_uses_https_client_identifier
  validator: json.field_string_prefix
  input: evidence.outer_request
  params: { field: client_id, prefix: "https:" }
- id: request_object_is_not_sent_by_value
  validator: json.field_presence
  input: evidence.outer_request
  params: { field: request, present: false }
- id: request_object_is_not_sent_by_reference
  validator: json.field_presence
  input: evidence.outer_request
  params: { field: request_uri, present: false }
- id: wallet_returns_invalid_request
  validator: dcql.response_satisfies_constraints
  input: evidence.session
  params: { mode: invalid_request_required }
- id: visual_evidence_is_stored
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
