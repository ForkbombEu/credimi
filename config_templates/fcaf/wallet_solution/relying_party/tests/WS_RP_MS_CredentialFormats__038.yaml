id: WS_RP_MS_CredentialFormats__038
title: Process a vp_token Authorization Request and return a vp_token response.
source:
  path: MessageStructure/CredentialFormats/WS_RP_MS_CredentialFormats__038.md
suite:
  sut: wallet_solution
  role: relying_party
  section: message_structure.credential_formats
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
  - title: OpenID4VC High Assurance Interoperability Profile 1.0
    section: "5"
    url: https://openid.net/specs/openid4vc-high-assurance-interoperability-profile-1_0.html
evidence:
  request_object:
    from: pipeline.wallet.protocol.request-object-by-value.outputs.request_object
  wallet_response:
    from: pipeline.wallet.protocol.request-object-by-value.outputs.wallet_response
  visual_evidence:
    from: pipeline.wallet.protocol.request-object-by-value.outputs.visual_evidence
assertions:
  - id: authorization_request_uses_vp_token_response_type
    validator: jwt.payload_field_equals
    input: evidence.request_object
    params:
      field: response_type
      value: vp_token
  - id: wallet_response_contains_vp_token
    validator: json.field_required
    input: evidence.wallet_response
    params:
      field: vp_token
  - id: consent_and_success_screenshots_are_stored
    validator: evidence.minimum_items
    input: evidence.visual_evidence
    params:
      min_items: 2
verdict:
  pass_when: all_assertions_pass
