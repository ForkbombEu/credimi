id: WS_RP_MS_Metadata__136
title: List Request Object signing algorithms for a signing-capable prefix
source:
  path: MessageStructure/Metadata/WS_RP_MS_Metadata__136.md
suite:
  sut: wallet_solution
  role: relying_party
  section: message_structure.metadata
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: '5.10'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
evidence:
  session: { from: pipeline.protocol.metadata-request-controls.outputs.default_post_retrieval_session }
  request_uri_payload: { from: pipeline.protocol.metadata-request-controls.outputs.default_post_retrieval_request_uri_payload }
  visual_evidence: { from: pipeline.protocol.metadata-request-controls.outputs.default_post_retrieval_visual_evidence }
assertions:
- id: wallet_retrieves_request_object_with_post
  validator: oid4vp.request_uri_retrieval
  input: evidence.session
  params: { method: POST }
- id: wallet_metadata_lists_signing_algorithms
  validator: oid4vp.wallet_metadata
  input: evidence.request_uri_payload
  params: { present: [request_object_signing_alg_values_supported] }
- id: visual_evidence_is_stored
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
