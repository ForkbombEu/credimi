id: WS_RP_MS_ProtocolMessages__003_UF
title: Reject a signed Request Object with an invalid typ header
source:
  path: MessageStructure/ProtocolMessages/WS_RP_MS_ProtocolMessages__003_UF.md
suite:
  sut: wallet_solution
  role: relying_party
  section: message_structure.protocol_messages
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: '5'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
evidence:
  session: { from: pipeline.protocol.request-object-header-controls.outputs.invalid_typ_session }
  request_object: { from: pipeline.protocol.request-object-header-controls.outputs.invalid_typ_request_object }
  visual_evidence: { from: pipeline.protocol.request-object-header-controls.outputs.invalid_typ_visual_evidence }
assertions:
- id: signed_request_has_valid_signature
  validator: jose.jws_signed_request
  input: evidence.request_object
- id: request_object_typ_is_invalid
  validator: jwt.header_field_equals
  input: evidence.request_object
  params: { field: typ, value: application/jwt }
- id: wallet_retrieves_request_object
  validator: oid4vp.request_uri_retrieval
  input: evidence.session
  params: { method: POST }
- id: wallet_rejects_request
  validator: dcql.response_satisfies_constraints
  input: evidence.session
  params: { mode: request_rejected }
- id: visual_evidence_is_stored
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
