id: WS_RP_SM_RpIntegrity__024
title: FCAF WS_RP_SM_RpIntegrity__024
source:
  path: SecurityMechanisms/RpIntegrity/WS_RP_SM_RpIntegrity__024.md
suite:
  sut: wallet_solution
  role: relying_party
  section: security_mechanisms.rp_integrity
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: '6.1'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
- ref: pipeline.dcql.rp-integrity
evidence:
  session:
    from: pipeline.dcql.rp-integrity.outputs.did_session
  request_evidence:
    from: pipeline.dcql.rp-integrity.outputs.did_request_evidence
  visual_evidence:
    from: pipeline.dcql.rp-integrity.outputs.did_visual_evidence
assertions:
- id: request_is_signed_without_x509_hash_prefix
  validator: oid4vp.did_signed_request
  input: evidence.request_evidence
- id: wallet_retrieves_request_object_with_post
  validator: oid4vp.request_uri_retrieval
  input: evidence.session
  params:
    method: POST
- id: wallet_rejects_or_discontinues
  validator: dcql.response_satisfies_constraints
  input: evidence.session
  params:
    mode: request_rejected
- id: rejection_visual_evidence_is_stored
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
