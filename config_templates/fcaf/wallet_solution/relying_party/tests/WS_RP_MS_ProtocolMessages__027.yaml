id: WS_RP_MS_ProtocolMessages__027
title: Return invalid_transaction_data for a transaction_data credential_id absent from the DCQL query.
source:
  path: MessageStructure/ProtocolMessages/WS_RP_MS_ProtocolMessages__027.md
suite:
  sut: wallet_solution
  role: relying_party
  section: message_structure.protocol_messages
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: '5.1, 8.3, 8.5'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
- ref: pipeline.dcql.protocol-messages-158
# The source's precondition ("Applicable only if tested in combination with a
# specific transaction data type") constrains the request, not the Wallet: the
# delivered entry uses the concrete `payment` type, so it applies. 027 and 158
# test the same request and therefore read the same session; the mismatch
# assertion proves the defect was delivered, and the capture records the
# Wallet's invalid_transaction_data answer to it.
evidence:
  request_object:
    from: pipeline.dcql.protocol-messages-158.outputs.request_object
  dcql_exchange:
    from: pipeline.dcql.protocol-messages-158.outputs.dcql_exchange
  visual_evidence:
    from: pipeline.dcql.protocol-messages-158.outputs.visual_evidence
assertions:
- id: ws_rp_ms_protocolmessages__027_transaction_data_credential_ids_mismatch
  validator: oid4vp.transaction_data_credential_ids_mismatch_dcql
  input: evidence.request_object
- id: ws_rp_ms_protocolmessages__027_returns_invalid_transaction_data
  validator: dcql.response_satisfies_constraints
  input: evidence.dcql_exchange
  params:
    mode: transaction_data_error_required
- id: ws_rp_ms_protocolmessages__027_visual_evidence_stored
  validator: evidence.screenshot_named
  input: evidence.visual_evidence
  params: { name: request-refused }
verdict:
  pass_when: all_assertions_pass
