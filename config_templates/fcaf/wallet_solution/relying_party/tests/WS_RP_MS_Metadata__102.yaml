id: WS_RP_MS_Metadata__102
title: Reject a COSE Referenced Token without the status claim at CBOR label 65535.
source:
  path: MessageStructure/Metadata/WS_RP_MS_Metadata__102.md
suite:
  sut: wallet_solution
  role: relying_party
  section: message_structure.metadata
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
  credential_format: iso_mdoc
normative_references:
- title: Token Status List
  section: '6.3'
  url: https://www.ietf.org/archive/id/draft-ietf-oauth-status-list-13.html
evidence:
  pid_mdoc:
    from: pipeline.credential-status.mdoc.outputs.pid_mdoc
  visual_evidence:
    from: pipeline.credential-status.mdoc.outputs.visual_evidence
assertions:
# Beta issues no CWT Referenced Token. The mdoc Mobile Security Object carries
# its status under the text key "status", not as a CWT claim at CBOR label
# 65535, so cose.cwt_status_claim reports this evidence as blocked rather than
# reading one encoding as the other.
# The rejection itself needs a CWT fixture lacking label 65535 and a probe like
# the one WS_RP_MS_Metadata__092 uses; until then this definition cannot pass.
- id: referenced_token_is_a_cwt
  validator: cose.cwt_status_claim
  input: evidence.pid_mdoc
verdict:
  pass_when: all_assertions_pass
