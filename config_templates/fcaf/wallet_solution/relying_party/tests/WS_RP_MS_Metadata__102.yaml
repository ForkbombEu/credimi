id: WS_RP_MS_Metadata__102
title: Reject a COSE Referenced Token without the status claim at CBOR label 65535.
source:
  path: MessageStructure/Metadata/WS_RP_MS_Metadata__102.md
suite:
  sut: wallet_solution
  role: relying_party
  section: message_structure.metadata
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
  credential_format: iso_mdoc
normative_references:
- title: Token Status List
  section: '6.3'
  url: https://www.ietf.org/archive/id/draft-ietf-oauth-status-list-13.html
evidence:
  referenced_token:
    from: pipeline.credential-status.mdoc.outputs.pid_mdoc
assertions:
# The source's precondition is a COSE-based Referenced Token whose status claim
# at CBOR label 65535 is missing, i.e. a CWT claims set defect (Token Status
# List 6.3). The reference issuer emits ISO mdoc and SD-JWT VC only, and an ISO
# mdoc keys its status by the MSO text label "status" rather than by the CWT
# claims-set label 65535, so the label-65535 condition cannot be built here.
# The mdoc MSO status cases are covered by the WS_RP_MS_Metadata__092-100
# family instead.
- id: token_without_the_status_claim_at_label_65535_is_rejected
  validator: fcaf.skipped
  input: evidence.referenced_token
  params:
    reason: >-
      the source's precondition is a COSE-based Referenced Token whose status
      claim at CBOR label 65535 is missing, and the suite has no such fixture:
      the reference issuer emits ISO mdoc and SD-JWT VC only, and an ISO mdoc
      keys its status by the MSO text label "status" rather than by the CWT
      claims-set label 65535
verdict:
  pass_when: all_assertions_pass
