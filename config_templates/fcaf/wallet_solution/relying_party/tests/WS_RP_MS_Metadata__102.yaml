id: WS_RP_MS_Metadata__102
title: Reject a COSE Referenced Token without the status claim at CBOR label 65535.
source:
  path: MessageStructure/Metadata/WS_RP_MS_Metadata__102.md
suite:
  sut: wallet_solution
  role: relying_party
  section: message_structure.metadata
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
  credential_format: iso_mdoc
normative_references:
- title: Token Status List
  section: '6.3'
  url: https://www.ietf.org/archive/id/draft-ietf-oauth-status-list-13.html
evidence:
  issuance_session:
    from: pipeline.credential-status.mdoc.outputs.statusless_issuance
  probe_exchange:
    from: pipeline.credential-status.mdoc.outputs.statusless_probe
  visual_evidence:
    from: pipeline.credential-status.mdoc.outputs.statusless_visual_evidence
assertions:
# Token Status List 6.3: the mdoc Mobile Security Object carries the Status CBOR
# structure under the recommended text label "status" (the mdoc encoding of the
# CWT label-65535 claim). This case issues the mdoc with no status at all
# (`status_list_enabled: false`) and requires the Wallet to reject it. Rejection
# cannot be seen directly, so it is probed like WS_RP_MS_Metadata__092: the offer
# must not reach the "Document issued" screen, and a DCQL query pins the
# fixture's document_number and asks for every match, so a conformant Wallet
# returns nothing for it.
- id: issuer_offered_a_statusless_mdoc_pid
  validator: json.field_equals
  input: evidence.issuance_session
  params: { field: credential_configuration_id, value: "urn:eu.europa.ec.eudi:pid:1.mdoc.key-attestation-required" }
- id: issuer_issued_the_mdoc_without_a_status
  validator: json.field_equals
  input: evidence.issuance_session
  params: { field: status_list_enabled, value: false }
- id: issuer_used_the_identifying_claim_fixture
  validator: json.field_equals
  input: evidence.issuance_session
  params: { field: fixture_id, value: pid_family_name_uppercase }
- id: wallet_retained_no_mdoc_without_the_status_claim
  validator: oid4vp.malformed_status_credential_absent
  input: evidence.probe_exchange
  params:
    doctype: eu.europa.ec.eudi.pid.1
    namespace: eu.europa.ec.eudi.pid.1
    claim: document_number
    value: CREDIMI-DEMO-CASE
    shape: status_absent
- id: rejection_visual_evidence_is_stored
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
