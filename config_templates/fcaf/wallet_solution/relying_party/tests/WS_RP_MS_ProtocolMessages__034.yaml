id: WS_RP_MS_ProtocolMessages__034
title: Reject a holder-binding-disabled Request Object without state
source:
  path: MessageStructure/ProtocolMessages/WS_RP_MS_ProtocolMessages__034.md
suite:
  sut: wallet_solution
  role: relying_party
  section: message_structure.protocol_messages
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: '5'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
evidence:
  session: { from: pipeline.protocol.request-object-payload-controls.outputs.no_state_without_holder_binding_session }
  request_object: { from: pipeline.protocol.request-object-payload-controls.outputs.no_state_without_holder_binding_request_object }
  delivered_request: { from: pipeline.protocol.request-object-payload-controls.outputs.no_state_without_holder_binding_delivered_request }
  visual_evidence: { from: pipeline.protocol.request-object-payload-controls.outputs.no_state_without_holder_binding_visual_evidence }
assertions:
# OpenID4VP Section 6.1: require_cryptographic_holder_binding is a member of
# each dcql_query credential entry, so the Section 5.3 precondition is read
# there and not on the Request Object top level.
- id: request_disables_cryptographic_holder_binding
  validator: dcql.response_satisfies_constraints
  input: evidence.delivered_request
  params:
    mode: property_equals
    property: require_cryptographic_holder_binding
    expected_value: false
    require_response: false
- id: request_omits_state
  validator: jwt.payload_field_presence
  input: evidence.request_object
  params: { field: state, present: false }
- id: wallet_retrieves_request_object
  validator: oid4vp.request_uri_retrieval
  input: evidence.session
  params: { method: POST }
- id: wallet_rejects_request
  validator: dcql.response_satisfies_constraints
  input: evidence.session
  params: { mode: invalid_request_required }
- id: visual_evidence_is_stored
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
