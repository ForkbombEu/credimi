id: WS_RP_MS_ProtocolMessages__042
title: Retrieve the request URI by HTTPS form POST.
source:
  path: MessageStructure/ProtocolMessages/WS_RP_MS_ProtocolMessages__042.md
suite:
  sut: wallet_solution
  role: relying_party
  section: message_structure.protocol_messages
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: '5.10'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
- ref: pipeline.request-uri.post
evidence:
  capture_session:
    from: pipeline.request-uri.post.outputs.capture_session
  visual_evidence:
    from: pipeline.request-uri.post.outputs.visual_evidence
assertions:
- id: wallet_posts_the_request_uri_as_an_https_form_request
  validator: oid4vp.request_uri_retrieval
  input: evidence.capture_session
  params:
    method: POST
    media_type: application/x-www-form-urlencoded
    accept: application/oauth-authz-req+jwt
- id: wallet_request_uri_processing_has_visual_evidence
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
