id: WS_RP_MS_ProtocolMessages__146
title: Reject client_metadata overriding a client_id from a trusted registry.
source:
  path: MessageStructure/ProtocolMessages/WS_RP_MS_ProtocolMessages__146.md
suite:
  sut: wallet_solution
  role: relying_party
  section: message_structure.protocol_messages
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: '6.1'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
- ref: pipeline.dcql.protocol-messages
evidence:
  dcql_exchange:
    from: pipeline.dcql.protocol-messages-146.outputs.dcql_exchange
  request_object:
    from: pipeline.dcql.protocol-messages-146.outputs.request_object
assertions:
# The request shape the source presupposes: the Verifier delivers
# client_metadata as a top-level Request Object member beside the client_id it
# already knows.
- id: client_metadata_is_delivered_top_level
  validator: jwt.payload_field_presence
  input: evidence.request_object
  params:
    field: client_metadata
    present: true
- id: verifier_trusted_registry_entry_is_unavailable
  validator: fcaf.not_applicable
  input: evidence.dcql_exchange
  params:
    reason: >-
      the source's precondition is a Wallet configured to resolve the client_id
      through a trusted registry in which Verifier A is pre-registered, so the
      client_metadata the request delivers overrides a pre-registered entry;
      the reference Wallet holds no trusted registry entry for the Capture
      verifier, so the override the source asserts cannot arise and its
      invalid_client expectation has no subject
verdict:
  pass_when: all_assertions_pass
