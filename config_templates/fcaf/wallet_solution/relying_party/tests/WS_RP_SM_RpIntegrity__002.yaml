id: WS_RP_SM_RpIntegrity__002
title: Reject a DC API Request Object carrying an invalid signature.
source:
  path: SecurityMechanisms/RpIntegrity/WS_RP_SM_RpIntegrity__002.md
suite:
  sut: wallet_solution
  role: relying_party
  section: security_mechanisms.rp_integrity
applicability:
  profile: EUDI_generic
  presentation_flow: digital_credentials_api
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: 'A.2'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
- title: JSON Web Signature (JWS)
  section: '5.2'
  url: https://www.rfc-editor.org/rfc/rfc7515
evidence:
  session:
    from: pipeline.dc-api.invalid-signature.outputs.session
  request_object:
    from: pipeline.dc-api.invalid-signature.outputs.request_object
  visual_evidence:
    from: pipeline.dc-api.invalid-signature.outputs.visual_evidence
assertions:
- id: delivered_dc_api_request_is_a_signed_request_object
  validator: oid4vp.dc_api_invocation
  input: evidence.session
  params:
    protocol: openid4vp-v1-signed
- id: delivered_signature_does_not_verify
  validator: jose.jws_invalid_signature
  input: evidence.request_object
- id: wallet_did_not_start_the_presentation_flow
  validator: oid4vp.dc_api_invocation
  input: evidence.session
  params:
    allowed_outcomes:
      - rejected
      - no_vp_token
      - failed
    vp_token_present: false
- id: visual_evidence_is_stored
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
