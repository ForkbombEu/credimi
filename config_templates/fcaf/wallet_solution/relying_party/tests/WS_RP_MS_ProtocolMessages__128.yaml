id: WS_RP_MS_ProtocolMessages__128
title: Ignore unrecognized parameters in both the request and the Response Endpoint reply.
source:
  path: MessageStructure/ProtocolMessages/WS_RP_MS_ProtocolMessages__128.md
suite:
  sut: wallet_solution
  role: relying_party
  section: message_structure.protocol_messages
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: '8.2'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
evidence:
  session:
    from: pipeline.protocol.unknown-parameter-controls.outputs.unknown_request_and_response_parameter_session
  request_object:
    from: pipeline.protocol.unknown-parameter-controls.outputs.unknown_request_and_response_parameter_request_object
  callback:
    from: pipeline.protocol.unknown-parameter-controls.outputs.unknown_request_and_response_parameter_callback
  visual_evidence:
    from: pipeline.protocol.unknown-parameter-controls.outputs.unknown_request_and_response_parameter_visual_evidence
assertions:
- id: delivered_request_carries_the_unrecognized_parameter
  validator: jwt.payload_field_equals
  input: evidence.request_object
  params: { field: fcaf_unrecognized_parameter, value: ignored-by-the-wallet }
- id: wallet_submitted_the_authorization_response
  validator: oid4vp.presentation_response_http
  input: evidence.session
  params:
    method: POST
    media_type: application/x-www-form-urlencoded
    form_utf8: true
- id: wallet_returned_the_requested_credential
  validator: dcql.response_satisfies_constraints
  input: evidence.session
  params: { mode: credentials_match }
- id: verifier_reply_carries_redirect_uri_and_an_unrecognized_member
  validator: oid4vp.response_endpoint_callback
  input: evidence.callback
  params:
    status: 200
    media_type: application/json
    body_format: json
    required_body_members: [fcaf_unrecognized_response_parameter]
    match_configured_redirect_uri: true
    require_response_code: true
- id: wallet_opened_the_returned_redirect_uri
  validator: oid4vp.redirect_uri_visited
  input: evidence.session
  params: { after_presentation_response: true }
- id: visual_evidence_is_stored
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
