id: WS_RP_MS_Metadata__119
title: Reject a verifier_attestation request whose jwt JOSE header is absent.
source:
  path: MessageStructure/Metadata/WS_RP_MS_Metadata__119.md
suite:
  sut: wallet_solution
  role: relying_party
  section: message_structure.metadata
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: '5.9.3'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
- title: OpenID for Verifiable Presentations 1.0
  section: '12'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
evidence:
  session:
    from: pipeline.rp-integrity.verifier-attestation.outputs.jwt_header_absent_session
  request_object:
    from: pipeline.rp-integrity.verifier-attestation.outputs.jwt_header_absent_request_object
  request_evidence:
    from: pipeline.rp-integrity.verifier-attestation.outputs.jwt_header_absent_request_evidence
  visual_evidence:
    from: pipeline.rp-integrity.verifier-attestation.outputs.jwt_header_absent_visual_evidence
assertions:
- id: delivered_request_has_no_jwt_header
  validator: oid4vp.verifier_attestation_request
  input: evidence.request_evidence
  params:
    jwt_header: absent
- id: wallet_returns_invalid_request_without_a_presentation
  validator: oid4vp.error_response_required
  input: evidence.session
  params:
    code: invalid_request
- id: visual_evidence_is_stored
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
