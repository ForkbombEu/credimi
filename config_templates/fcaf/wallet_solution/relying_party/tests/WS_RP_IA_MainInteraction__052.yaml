id: WS_RP_IA_MainInteraction__052
title: Encode every direct-post JWT response body parameter as UTF-8.
source:
  path: Interaction/MainInteraction/WS_RP_IA_MainInteraction__052.md
suite:
  sut: wallet_solution
  role: relying_party
  section: interaction.main_interaction
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: '6.1'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
- ref: pipeline.direct-post-jwt.response-transport
evidence:
  capture_session:
    from: pipeline.direct-post-jwt.response-transport.outputs.capture_session
  visual_evidence:
    from: pipeline.direct-post-jwt.response-transport.outputs.visual_evidence
assertions:
- id: wallet_posts_the_direct_post_jwt_response
  validator: oid4vp.presentation_response_http
  input: evidence.capture_session
  params:
    method: POST
    require_response_parameter: true
# The direct_post.jwt body carries a single `response` form parameter whose
# value is the Wallet-generated compact JWE (base64url). The verifier supplies
# no non-ASCII name or value that could reach the form, so a non-UTF-8 body
# cannot be induced and the encoding check cannot discriminate.
- id: direct_post_jwt_body_utf8_cannot_be_discriminated
  validator: fcaf.skipped
  input: evidence.capture_session
  params:
    reason: >-
      the harness supplies no verifier-controlled non-ASCII value to the
      direct_post.jwt body, whose only form parameter is the Wallet-generated
      ASCII `response` holding a compact JWE (Capture rejects any caller-supplied
      `state`), so a non-UTF-8 name or value cannot be delivered and the
      source's encoding property is unobservable
- id: wallet_response_visual_evidence_is_stored
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
