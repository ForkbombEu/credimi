id: WS_RP_IA_MainInteraction__040
title: Return one presentation when multiple is omitted.
source:
  path: Interaction/MainInteraction/WS_RP_IA_MainInteraction__040.md
suite:
  sut: wallet_solution
  role: relying_party
  section: interaction.main_interaction
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: '8.1'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
- title: OpenID for Verifiable Presentations 1.0
  section: '6.1'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
evidence:
  # Possession is proven from the issuer sessions: presenting a credential to
  # prove it is held would spend it, leaving the query a single PID.
  query_issuances:
    from: pipeline.fixtures.pid-multiple-credentials.outputs.omitted_query_issuances
  dcql_exchange:
    from: pipeline.fixtures.pid-multiple-credentials.outputs.multiple_omitted_exchange
  visual_evidence:
    from: pipeline.fixtures.pid-multiple-credentials.outputs.multiple_omitted_visual_evidence
assertions:
- id: wallet_holds_two_distinct_pids_for_the_same_query
  validator: oid4vci.fixtures_issued
  input: evidence.query_issuances
  params:
    fixtures: [pid_default, pid_person_b]
- id: credential_query_omits_multiple_and_returns_one_presentation
  validator: dcql.response_satisfies_constraints
  input: evidence.dcql_exchange
  params: { mode: multiple_default_false }
- id: visual_evidence_is_stored
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
