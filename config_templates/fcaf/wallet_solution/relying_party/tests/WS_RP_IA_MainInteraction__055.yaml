id: WS_RP_IA_MainInteraction__055
title: Reject a request carrying both response_uri and redirect_uri.
source:
  path: Interaction/MainInteraction/WS_RP_IA_MainInteraction__055.md
suite:
  sut: wallet_solution
  role: relying_party
  section: interaction.main_interaction
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: '8.2'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
evidence:
  session:
    from: pipeline.protocol.response-uri-controls.outputs.redirect_uri_present_session
  request_object:
    from: pipeline.protocol.response-uri-controls.outputs.redirect_uri_present_request_object
  visual_evidence:
    from: pipeline.protocol.response-uri-controls.outputs.redirect_uri_present_visual_evidence
assertions:
- id: delivered_request_uses_direct_post_jwt
  validator: jwt.payload_field_equals
  input: evidence.request_object
  params: { field: response_mode, value: direct_post.jwt }
- id: delivered_request_carries_response_uri
  validator: jwt.payload_field_presence
  input: evidence.request_object
  params: { field: response_uri, present: true }
- id: delivered_request_also_carries_redirect_uri
  validator: jwt.payload_field_presence
  input: evidence.request_object
  params: { field: redirect_uri, present: true }
- id: wallet_retrieved_the_delivered_request_object
  validator: oid4vp.request_uri_retrieval
  input: evidence.session
  params: { method: GET }
- id: wallet_returns_an_error_without_a_presentation
  validator: dcql.response_satisfies_constraints
  input: evidence.session
  params: { mode: wallet_error_required }
- id: visual_evidence_is_stored
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
