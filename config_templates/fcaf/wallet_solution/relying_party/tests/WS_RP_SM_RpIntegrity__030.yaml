id: WS_RP_SM_RpIntegrity__030
title: FCAF WS_RP_SM_RpIntegrity__030
source:
  path: SecurityMechanisms/RpIntegrity/WS_RP_SM_RpIntegrity__030.md
suite:
  sut: wallet_solution
  role: relying_party
  section: security_mechanisms.rp_integrity
applicability:
  profile: EUDI_generic
  presentation_flow: digital_credentials_api
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: '6.1'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
- ref: pipeline.dc-api.multisigned
evidence:
  session:
    from: pipeline.dc-api.multisigned.outputs.session
  signatures:
    from: pipeline.dc-api.multisigned.outputs.signatures
  wallet_response:
    from: pipeline.dc-api.multisigned.outputs.wallet_response
  visual_evidence:
    from: pipeline.dc-api.multisigned.outputs.visual_evidence
assertions:
- id: verifier_offered_a_multisigned_dc_api_request
  validator: oid4vp.dc_api_invocation
  input: evidence.session
  params:
    protocol: openid4vp-v1-multisigned
    invoked: true
- id: request_carries_two_signatures
  validator: evidence.minimum_items
  input: evidence.signatures
  params:
    min_items: 2
- id: wallet_answers_multisigned_request
  validator: json.field_required
  input: evidence.wallet_response
  params:
    field: vp_token
- id: presentation_visual_evidence_is_stored
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
