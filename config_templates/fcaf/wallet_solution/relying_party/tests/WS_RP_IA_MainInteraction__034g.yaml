id: WS_RP_IA_MainInteraction__034g
title: Disclose the final SD-JWT VC array element only.
source:
  path: Interaction/MainInteraction/WS_RP_IA_MainInteraction__034g.md
suite:
  sut: wallet_solution
  role: relying_party
  section: interaction.main_interaction
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
  credential_format: ietf_sd_jwt_vc
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: '7.1'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
- ref: pipeline.interaction.degree-last-element
evidence:
  dcql_exchange:
    from: pipeline.interaction.degree-last-element.outputs.dcql_exchange
  visual_evidence:
    from: pipeline.interaction.degree-last-element.outputs.visual_evidence
assertions:
- id: wallet_discloses_only_the_final_degree
  validator: oid4vp.dcql_array_selector_filter
  input: evidence.dcql_exchange
  params:
    vct: urn:credimi:degree:1
    path:
    - degrees
    - 2
    required_values:
    - University of Betelgeuse
    forbidden_values:
    - Bachelor of Science
    - Master of Science
    forbidden_claims:
    - name
    - address
    - academic_programmes
    - nationalities
- id: final_degree_presentation_has_visual_evidence
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
