id: WS_RP_IA_ProtocolFlow__002c
title: Retrieve a signed Request Object by request_uri using the default method.
source: { path: Interaction/ProtocolFlow/WS_RP_IA_ProtocolFlow__002c.md }
suite: { sut: wallet_solution, role: relying_party, section: interaction.protocol_flow }
applicability: { profile: EUDI_generic, presentation_flow: redirects }
normative_references:
  - { title: High Assurance Interoperability Profile, section: "5.1", url: https://openid.net/specs/openid-4-high-assurance-interoperability-profile-1_0.html }
  - { title: OpenID for Verifiable Presentations 1.0, section: "5.1", url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html }
evidence:
  session: { from: pipeline.wallet.protocol.request-uri-method-default.outputs.capture_session }
  signed_request_object: { from: pipeline.wallet.protocol.request-uri-method-default.outputs.signed_request_object }
  session_checks: { from: pipeline.wallet.protocol.request-uri-method-default.outputs.session_checks }
  visual_evidence: { from: pipeline.wallet.protocol.request-uri-method-default.outputs.visual_evidence }
assertions:
  - { id: signed_request_object_is_valid, validator: jose.jws_signed_request, input: evidence.signed_request_object }
  - { id: request_uri_method_is_omitted, validator: jwt.payload_field_presence, input: evidence.signed_request_object, params: { field: request_uri_method, present: false } }
  - { id: request_uri_is_retrieved_by_get_with_matching_host, validator: oid4vp.request_uri_retrieval, input: evidence.session, params: { method: GET } }
  - { id: presentation_is_accepted, validator: json.field_equals, input: evidence.session_checks, params: { field: presentation_valid, value: true } }
  - { id: user_consent_was_exercised, validator: evidence.non_empty, input: evidence.visual_evidence }
verdict: { pass_when: all_assertions_pass }
