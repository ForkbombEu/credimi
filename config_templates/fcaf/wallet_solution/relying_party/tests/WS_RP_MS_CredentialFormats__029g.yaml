id: WS_RP_MS_CredentialFormats__029g
title: Value of the `uri` member of `status_list` in the presented SD-JWT VC is an RFC 3986 URI.
source:
  path: MessageStructure/CredentialFormats/WS_RP_MS_CredentialFormats__029g.md
suite:
  sut: wallet_solution
  role: relying_party
  section: message_structure.credential_formats
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
  credential_format: ietf_sd_jwt_vc
normative_references:
- title: ETSI TS 119 472-1
  section: '5.2.10'
  url: https://www.etsi.org/deliver/etsi_ts/119400_119499/11947201/01.02.01_60/ts_11947201v010201p.pdf
- title: Token Status List
  section: '6.2'
  url: https://datatracker.ietf.org/doc/html/draft-ietf-oauth-status-list-15
- ref: pipeline.credential-status.sdjwt
evidence:
  pid_sdjwt:
    from: pipeline.credential-status.sdjwt.outputs.pid_sdjwt
  visual_evidence:
    from: pipeline.credential-status.sdjwt.outputs.visual_evidence
assertions:
- id: status_list_uri_is_rfc3986_uri
  validator: sdjwt.claim_uri
  input: evidence.pid_sdjwt
  params:
    claim: status.status_list.uri
- id: presentation_visual_evidence_is_stored
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
