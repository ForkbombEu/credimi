id: WS_RP_MS_ProtocolMessages__155
title: Return invalid_transaction_data for a field of the wrong type in a known transaction data type.
source:
  path: MessageStructure/ProtocolMessages/WS_RP_MS_ProtocolMessages__155.md
suite:
  sut: wallet_solution
  role: relying_party
  section: message_structure.protocol_messages
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: '5.1, 8.5'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
- ref: pipeline.dcql.protocol-messages-155
# The source's precondition is "The Wallet has a schema for a known transaction
# data type", so a field of the wrong type is detectable only against that
# schema. OpenID4VP 5.1 leaves type values and their definitions to other
# specifications, this suite defines no type schema, and the Wallet under test
# declares none. The request-shape assertions still prove the delivered entry
# is well-formed on the OpenID4VP-defined members and carries the mis-typed
# field.
evidence:
  request_object:
    from: pipeline.dcql.protocol-messages-155.outputs.request_object
  visual_evidence:
    from: pipeline.dcql.protocol-messages-155.outputs.visual_evidence
assertions:
- id: ws_rp_ms_protocolmessages__155_delivered_entry_carries_transaction_data
  validator: jwt.payload_field_presence
  input: evidence.request_object
  params:
    field: transaction_data
    present: true
- id: ws_rp_ms_protocolmessages__155_delivered_entry_references_a_requested_credential
  validator: oid4vp.transaction_data_credential_ids_match_dcql
  input: evidence.request_object
- id: ws_rp_ms_protocolmessages__155_wrong_field_type_requires_a_known_type
  validator: fcaf.not_applicable
  input: evidence.request_object
  params:
    reason: >-
      the source's precondition is "The Wallet has a schema for a known
      transaction data type", and OpenID4VP Section 5.1 leaves transaction
      data type values out of scope; this suite defines no type schema and the
      Wallet under test supports none (no wallet-metadata parameter declares
      transaction data types, and its 18/11/2026 captures answer every
      structurally valid entry with invalid_transaction_data for the
      unsupported type), so a field of the wrong type for a known type cannot
      be delivered
- id: ws_rp_ms_protocolmessages__155_visual_evidence_stored
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
