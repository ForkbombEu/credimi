id: WS_RP_IA_MainInteraction__014
title: Return the union of claims requested by multiple DCQL queries.
source: { path: Interaction/MainInteraction/WS_RP_IA_MainInteraction__014.md }
suite: { sut: wallet_solution, role: relying_party, section: interaction.main_interaction }
applicability: { profile: EUDI_generic, credential_format: ietf_sd_jwt_vc }
normative_references:
  - { title: OpenID for Verifiable Presentations, section: "6.4", url: "https://openid.net/specs/openid-4-verifiable-presentations-1_0.html" }
preconditions: [{ ref: pipeline.dcql.claims-union }]
evidence:
  dcql_exchange: { from: pipeline.dcql.claims-union.outputs.dcql_exchange }
  visual_evidence: { from: pipeline.dcql.claims-union.outputs.visual_evidence }
assertions:
  - id: union_contains_name_and_address_but_not_age
    validator: dcql.response_satisfies_constraints
    input: evidence.dcql_exchange
    params: { mode: claims_union, forbidden_paths: [[age_over_18]] }
  - { id: union_consent_ui_evidence, validator: evidence.non_empty, input: evidence.visual_evidence }
verdict: { pass_when: all_assertions_pass }
