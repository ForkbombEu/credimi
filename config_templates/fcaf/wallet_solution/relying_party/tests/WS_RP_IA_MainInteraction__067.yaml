id: WS_RP_IA_MainInteraction__067
title: Follow the redirect URI supplied by the verifier response.
source:
  path: Interaction/MainInteraction/WS_RP_IA_MainInteraction__067.md
suite:
  sut: wallet_solution
  role: relying_party
  section: interaction.main_interaction
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: '8.2'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
- ref: pipeline.callback.redirect
evidence:
  callback_evidence:
    from: pipeline.callback.redirect.outputs.callback_evidence
  capture_session:
    from: pipeline.callback.redirect.outputs.capture_session
  visual_evidence:
    from: pipeline.callback.redirect.outputs.visual_evidence
assertions:
- id: callback_supplies_the_configured_redirect_uri
  validator: oid4vp.response_endpoint_callback
  input: evidence.callback_evidence
  params:
    status: 200
    media_type: application/json
    match_configured_redirect_uri: true
- id: wallet_navigates_to_the_supplied_redirect_uri
  validator: oid4vp.redirect_uri_visited
  input: evidence.capture_session
  params:
    after_presentation_response: true
- id: wallet_navigates_to_redirect_uri_visual_evidence_is_stored
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
