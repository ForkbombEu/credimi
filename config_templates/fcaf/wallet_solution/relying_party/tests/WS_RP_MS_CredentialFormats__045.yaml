id: WS_RP_MS_CredentialFormats__045
title: Present an IETF SD-JWT VC using compact serialization with key binding.
source:
  path: MessageStructure/CredentialFormats/WS_RP_MS_CredentialFormats__045.md
suite:
  sut: wallet_solution
  role: relying_party
  section: message_structure.credential_formats
applicability:
  profile: EUDI_generic
  credential_format: ietf_sd_jwt_vc
normative_references:
  - title: OpenID4VC High Assurance Interoperability Profile 1.0
    section: "6.1"
    url: https://openid.net/specs/openid4vc-high-assurance-interoperability-profile-1_0.html
  - title: Selective Disclosure for JSON Web Tokens
    section: "4.3"
    url: https://www.rfc-editor.org/rfc/rfc9901.html
evidence:
  dcql_exchange:
    from: pipeline.credential-formats.sdjwt-presentation.outputs.dcql_exchange
  pid_sdjwt:
    from: pipeline.credential-formats.sdjwt-presentation.outputs.pid_sdjwt
  visual_evidence:
    from: pipeline.credential-formats.sdjwt-presentation.outputs.visual_evidence
assertions:
  - id: request_and_response_use_dc_sd_jwt
    validator: dcql.response_satisfies_constraints
    input: evidence.dcql_exchange
    params:
      mode: credential_format_presentation
      expected_format: dc+sd-jwt
  - id: presentation_uses_compact_serialization_with_key_binding
    validator: sdjwt.compact_serialization
    input: evidence.pid_sdjwt
    params:
      key_binding: true
  - id: key_binding_jwt_is_structurally_valid
    validator: sdjwt.kb_jwt_present
    input: evidence.pid_sdjwt
  - id: returned_artifact_is_pid_sd_jwt_vc
    validator: pid.sdjwt_vct_pid
    input: evidence.pid_sdjwt
  - id: consent_and_success_screenshots_are_stored
    validator: evidence.minimum_items
    input: evidence.visual_evidence
    params:
      min_items: 2
verdict:
  pass_when: all_assertions_pass
