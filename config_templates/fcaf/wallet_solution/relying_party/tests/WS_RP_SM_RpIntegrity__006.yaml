id: WS_RP_SM_RpIntegrity__006
title: Verify a decentralized identifier-signed Request Object.
source:
  path: SecurityMechanisms/RpIntegrity/WS_RP_SM_RpIntegrity__006.md
suite:
  sut: wallet_solution
  role: relying_party
  section: security_mechanisms.rp_integrity
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: '5.9.3'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
- ref: pipeline.wallet.metadata.did
evidence:
  request_evidence:
    from: pipeline.wallet.metadata.did.outputs.request_evidence
  capture_session:
    from: pipeline.wallet.metadata.did.outputs.capture_session
  visual_evidence:
    from: pipeline.wallet.metadata.did.outputs.visual_evidence
assertions:
- id: did_key_verifies_decentralized_identifier_request
  validator: oid4vp.did_signed_request
  input: evidence.request_evidence
- id: wallet_processes_signed_request
  validator: oid4vp.session_event_count
  input: evidence.capture_session
  params: {type: vp_presentation_response_received, count: 1}
- id: wallet_processing_has_visual_evidence
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
