id: WS_RP_MS_CredentialFormats__032
title: Hold and store a CWT Referenced Token carrying a status claim.
source:
  path: MessageStructure/CredentialFormats/WS_RP_MS_CredentialFormats__032.md
suite:
  sut: wallet_solution
  role: relying_party
  section: message_structure.credential_formats
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
  credential_format: iso_mdoc
normative_references:
- title: Token Status List
  section: '6.3'
  url: https://www.ietf.org/archive/id/draft-ietf-oauth-status-list-13.html
evidence:
  referenced_token:
    from: pipeline.credential-status.mdoc.outputs.pid_mdoc
assertions:
# The source is a CWT Referenced Token: its status claim lives at CBOR label
# 65535 of the CWT claims set (Token Status List 6.3). The reference issuer
# emits ISO mdoc and SD-JWT VC only, and an ISO mdoc carries its Status CBOR
# structure under the MSO text label "status" instead, so the CWT Referenced
# Token this source names cannot be issued here. The mdoc Referenced Token is
# WS_RP_MS_CredentialFormats__033's subject, not this one's.
- id: stored_token_is_a_cwt_with_a_status_claim
  validator: fcaf.skipped
  input: evidence.referenced_token
  params:
    reason: >-
      the source's precondition is a CWT Referenced Token carrying a status
      claim, and the suite has no such fixture: the reference issuer emits ISO
      mdoc and SD-JWT VC only, and an ISO mdoc keeps its status under the MSO
      text label "status" rather than at CBOR label 65535
verdict:
  pass_when: all_assertions_pass
