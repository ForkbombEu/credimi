id: WS_RP_MS_CredentialFormats__032
title: Hold and store a CWT Referenced Token carrying a status claim.
source:
  path: MessageStructure/CredentialFormats/WS_RP_MS_CredentialFormats__032.md
suite:
  sut: wallet_solution
  role: relying_party
  section: message_structure.credential_formats
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
  credential_format: iso_mdoc
normative_references:
- title: Token Status List
  section: '6.3'
  url: https://www.ietf.org/archive/id/draft-ietf-oauth-status-list-13.html
evidence:
  pid_mdoc:
    from: pipeline.credential-status.mdoc.outputs.pid_mdoc
  visual_evidence:
    from: pipeline.credential-status.mdoc.outputs.visual_evidence
assertions:
# Token Status List 6.3: an ISO mdoc uses the Status List mechanism by carrying
# the Status CBOR structure in the Mobile Security Object under the recommended
# text label "status"; the same structure a CWT would carry at CBOR label 65535.
# The stored mdoc Referenced Token proves storage by being presented.
- id: stored_token_carries_a_status_element
  validator: mdoc.mso_status_member_present
  input: evidence.pid_mdoc
  params:
    path: []
- id: stored_token_status_is_a_status_cbor_map
  validator: mdoc.mso_status_cbor_type
  input: evidence.pid_mdoc
  params:
    path: []
    major_type: 5
- id: accepted_token_is_presented_by_the_wallet
  validator: pid.mdoc_doc_type
  input: evidence.pid_mdoc
- id: presentation_visual_evidence_is_stored
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
