id: WS_RP_IA_Metadata__011
title: FCAF WS_RP_IA_Metadata__011
source:
  path: Interaction/Metadata/WS_RP_IA_Metadata__011.md
suite:
  sut: wallet_solution
  role: relying_party
  section: interaction.metadata
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: '6.1'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
- ref: pipeline.dcql.interaction-metadata
evidence:
  session:
    from: pipeline.dcql.interaction-metadata.outputs.aud_mismatch_session
  request_object:
    from: pipeline.dcql.interaction-metadata.outputs.aud_mismatch_request_object
  visual_evidence:
    from: pipeline.dcql.interaction-metadata.outputs.aud_mismatch_visual_evidence
assertions:
- id: request_object_is_signed
  validator: jose.jws_signed_request
  input: evidence.request_object
- id: wallet_retrieves_request_object_with_post
  validator: oid4vp.request_uri_retrieval
  input: evidence.session
  params:
    method: POST
- id: dynamic_discovery_wallet_rejects_aud_other_than_issuer
  validator: oid4vp.request_audience
  input: evidence.session
  params:
    discovery: dynamic
    outcome: rejected
- id: rejection_visual_evidence_is_stored
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
