id: WS_RP_MS_ProtocolMessages__125
title: Detect an HTTP 200 Response Endpoint reply whose body is not JSON.
source:
  path: MessageStructure/ProtocolMessages/WS_RP_MS_ProtocolMessages__125.md
suite:
  sut: wallet_solution
  role: relying_party
  section: message_structure.protocol_messages
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: '8.2'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
evidence:
  session:
    from: pipeline.protocol.verifier-response-controls.outputs.non_json_response_session
  callback:
    from: pipeline.protocol.verifier-response-controls.outputs.non_json_response_callback
  visual_evidence:
    from: pipeline.protocol.verifier-response-controls.outputs.non_json_response_visual_evidence
assertions:
- id: wallet_submitted_the_authorization_response
  validator: oid4vp.presentation_response_http
  input: evidence.session
  params:
    method: POST
    media_type: application/x-www-form-urlencoded
    require_response_parameter: true
- id: verifier_delivered_http_200_with_a_non_json_body
  validator: oid4vp.response_endpoint_callback
  input: evidence.callback
  params:
    status: 200
    media_type: text/plain
    body_format: not_json
- id: visual_evidence_of_the_wallet_error_is_stored
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
