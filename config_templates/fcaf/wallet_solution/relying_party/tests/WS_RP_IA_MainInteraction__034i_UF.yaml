id: WS_RP_IA_MainInteraction__034i_UF
title: Reject a mixed available and unavailable mdoc element request.
source:
  path: Interaction/MainInteraction/WS_RP_IA_MainInteraction__034i_UF.md
suite:
  sut: wallet_solution
  role: relying_party
  section: interaction.main_interaction
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
  credential_format: iso_mdoc
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: '7.2'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
- ref: pipeline.interaction.pid-mdoc-element-and-missing
evidence:
  dcql_exchange:
    from: pipeline.interaction.pid-mdoc-element-and-missing.outputs.dcql_exchange
  visual_evidence:
    from: pipeline.interaction.pid-mdoc-element-and-missing.outputs.visual_evidence
assertions:
- id: available_and_unavailable_mdoc_elements_are_requested_together
  validator: oid4vp.dcql_requested_claim_paths
  input: evidence.dcql_exchange
  params:
    format: mso_mdoc
    paths:
    - - eu.europa.ec.eudi.pid.1
      - given_name
    - - eu.europa.ec.eudi.pid.1
      - unavailable_element
- id: unavailable_mdoc_element_is_requested_with_available_element
  validator: dcql.response_satisfies_constraints
  input: evidence.dcql_exchange
  params:
    mode: mdoc_claim_path_no_match
    expected_claim_path:
    - eu.europa.ec.eudi.pid.1
    - unavailable_element
- id: wallet_rejects_or_discontinues_the_mixed_mdoc_element_request
  validator: dcql.response_satisfies_constraints
  input: evidence.dcql_exchange
  params:
    mode: request_rejected
- id: mixed_mdoc_element_request_has_visual_evidence
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
