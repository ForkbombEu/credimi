id: WS_RP_MS_Metadata__109
title: Ignore Verifier metadata outside client_metadata
source:
  path: MessageStructure/Metadata/WS_RP_MS_Metadata__109.md
suite:
  sut: wallet_solution
  role: relying_party
  section: message_structure.metadata
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: '5.9.3'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
- title: OpenID for Verifiable Presentations 1.0
  section: '5.1'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
evidence:
  session: { from: pipeline.protocol.metadata-request-controls.outputs.metadata_outside_client_metadata_session }
  request_object: { from: pipeline.protocol.metadata-request-controls.outputs.metadata_outside_client_metadata_request_object }
  visual_evidence: { from: pipeline.protocol.metadata-request-controls.outputs.metadata_outside_client_metadata_visual_evidence }
assertions:
- id: request_object_is_signed
  validator: jose.jws_signed_request
  input: evidence.request_object
- id: request_object_carries_metadata_outside_client_metadata
  validator: jwt.payload_field_equals
  input: evidence.request_object
  params: { field: client_name, value: FCAF metadata outside client_metadata }
- id: request_object_keeps_client_metadata
  validator: jwt.payload_field_presence
  input: evidence.request_object
  params: { field: client_metadata, present: true }
- id: wallet_retrieves_request_object_with_post
  validator: oid4vp.request_uri_retrieval
  input: evidence.session
  params: { method: POST }
- id: wallet_submitted_the_authorization_response
  validator: oid4vp.presentation_response_http
  input: evidence.session
  params:
    method: POST
    media_type: application/x-www-form-urlencoded
    require_response_parameter: true
- id: wallet_returned_the_requested_credential
  validator: dcql.response_satisfies_constraints
  input: evidence.session
  params: { mode: credentials_match }
- id: visual_evidence_is_stored
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
