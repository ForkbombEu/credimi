id: WS_RP_SH_Cryptography_CryptographicHash_010
title: Do not present a credential digested with an unsupported hash function.
source:
  path: Shared/Cryptography/WS_RP_SH_Cryptography_CryptographicHash_010.md
suite:
  sut: wallet_solution
  role: relying_party
  section: shared.cryptography
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
- title: OpenID4VC High Assurance Interoperability Profile
  section: '8'
  url: https://openid.net/specs/openid4vc-high-assurance-interoperability-profile-1_0.html
- title: SD-JWT-based Verifiable Credentials
  section: '4.1.1'
  url: https://www.ietf.org/archive/id/draft-ietf-oauth-sd-jwt-vc-12.html
evidence:
  issuance_capture:
    from: pipeline.cryptography.digest-algorithm.outputs.issuance_capture
  presentation_session:
    from: pipeline.cryptography.digest-algorithm.outputs.presentation_session
  visual_evidence:
    from: pipeline.cryptography.digest-algorithm.outputs.visual_evidence
assertions:
- id: issued_credential_uses_a_non_sha_256_digest_algorithm
  validator: json.field_equals
  input: evidence.issuance_capture
  params:
    field: digest_algorithm
    value: sha-384
- id: credential_reached_the_wallet
  validator: json.field_equals
  input: evidence.issuance_capture
  params:
    field: status
    value: credential_issued
- id: wallet_did_not_present_the_unsupported_digest_credential
  validator: sdjwt.presentation_digest_algorithm_unsupported
  input: evidence.presentation_session
  params:
    digest_algorithm: sha-384
- id: interaction_has_visual_evidence
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
