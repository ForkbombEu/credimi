id: WS_RP_IA_MainInteraction__031
title: FCAF WS_RP_IA_MainInteraction__031
source:
  path: Interaction/MainInteraction/WS_RP_IA_MainInteraction__031.md
suite:
  sut: wallet_solution
  role: relying_party
  section: interaction.main_interaction
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
  - title: OpenID for Verifiable Presentations 1.0
    section: '6.4'
    url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
evidence:
  dcql_exchange:
    from: pipeline.dcql.credential-sets-combined-option-no-match.outputs.dcql_exchange
  visual_evidence:
    from: pipeline.dcql.credential-sets-combined-option-no-match.outputs.visual_evidence
  possession_exchange:
    from: pipeline.dcql.credential-sets-combined-option-no-match.outputs.possession_exchange
assertions:
  # Precondition: the credential_sets option combines "1 the wallet has" with
  # one it does not. The scenario shares the held PID in a matching
  # presentation first, so an empty Wallet cannot pass the combined probe.
  - id: wallet_holds_the_available_credential_of_the_set
    validator: dcql.response_satisfies_constraints
    input: evidence.possession_exchange
    params:
      mode: claims_subset
      forbidden_paths:
        - [birthdate]
  - id: ws_rp_ia_maininteraction__031_unsatisfied_combined_set
    validator: dcql.response_satisfies_constraints
    input: evidence.dcql_exchange
    params:
      mode: credential_sets_combined_option_no_match
  - id: ws_rp_ia_maininteraction__031_visual_evidence
    validator: evidence.non_empty
    input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
