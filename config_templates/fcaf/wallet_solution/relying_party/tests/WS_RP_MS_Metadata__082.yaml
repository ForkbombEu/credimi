id: WS_RP_MS_Metadata__082
title: Store a Referenced Token issued without a status claim.
source:
  path: MessageStructure/Metadata/WS_RP_MS_Metadata__082.md
suite:
  sut: wallet_solution
  role: relying_party
  section: message_structure.metadata
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
  credential_format: ietf_sd_jwt_vc
normative_references:
- title: Token Status List
  section: '6.2'
  url: https://www.ietf.org/archive/id/draft-ietf-oauth-status-list-13.html
evidence:
  pid_sdjwt:
    from: pipeline.pid.presentation.sdjwt.all-claims.outputs.pid_sdjwt
  visual_evidence:
    from: pipeline.pid.presentation.sdjwt.all-claims.outputs.visual_evidence
assertions:
- id: referenced_token_carries_no_status_claim
  validator: sdjwt.claim_presence
  input: evidence.pid_sdjwt
  params:
    claim: status
    present: false
- id: wallet_stored_and_presented_the_statusless_token
  validator: pid.sdjwt_vct_pid
  input: evidence.pid_sdjwt
- id: presentation_visual_evidence_is_stored
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
