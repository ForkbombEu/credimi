id: WS_RP_MS_ProtocolMessages__132
title: Carry the Authorization Response parameters at the top level of the encrypted JWT.
source:
  path: MessageStructure/ProtocolMessages/WS_RP_MS_ProtocolMessages__132.md
suite:
  sut: wallet_solution
  role: relying_party
  section: message_structure.protocol_messages
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: '8.3'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
evidence:
  dcql_exchange:
    from: pipeline.dcql.session-encryption.outputs.dcql_exchange
  encrypted_response:
    from: pipeline.dcql.session-encryption.outputs.encrypted_response
  decrypted_response:
    from: pipeline.dcql.session-encryption.outputs.decrypted_response
  visual_evidence:
    from: pipeline.dcql.session-encryption.outputs.visual_evidence
assertions:
- id: wallet_submitted_an_encrypted_authorization_response
  validator: oid4vp.presentation_response_http
  input: evidence.dcql_exchange
  params:
    method: POST
    media_type: application/x-www-form-urlencoded
    require_response_parameter: true
- id: encrypted_response_is_an_unsigned_jwt
  validator: jose.jwe_protected_header
  input: evidence.encrypted_response
  params: { field: cty, present: false }
- id: decrypted_payload_carries_the_response_parameters_at_the_top_level
  validator: oid4vp.response_parameters_top_level
  input: evidence.decrypted_response
  params: { required: [vp_token] }
- id: visual_evidence_is_stored
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
