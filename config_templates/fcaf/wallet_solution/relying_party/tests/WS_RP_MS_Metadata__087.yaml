id: WS_RP_MS_Metadata__087
title: Reject a Referenced Token whose status_list omits idx.
source:
  path: MessageStructure/Metadata/WS_RP_MS_Metadata__087.md
suite:
  sut: wallet_solution
  role: relying_party
  section: message_structure.metadata
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
  credential_format: ietf_sd_jwt_vc
normative_references:
- title: Token Status List
  section: '6.2'
  url: https://www.ietf.org/archive/id/draft-ietf-oauth-status-list-13.html
evidence:
  issuance_session:
    from: pipeline.fixtures.status-reference.outputs.missing_index_issuance
  probe_exchange:
    from: pipeline.fixtures.status-reference.outputs.missing_index_probe
  visual_evidence:
    from: pipeline.fixtures.status-reference.outputs.missing_index_visual_evidence
assertions:
- id: issuer_offered_the_malformed_status_reference
  validator: json.field_equals
  input: evidence.issuance_session
  params: { field: status_reference, value: missing_index }
- id: issuer_used_the_identifying_claim_fixture
  validator: json.field_equals
  input: evidence.issuance_session
  params: { field: fixture_id, value: pid_locality_diacritics }
- id: wallet_retained_no_credential_carrying_the_malformed_status
  validator: oid4vp.malformed_status_credential_absent
  input: evidence.probe_exchange
  params:
    vct: urn:eudi:pid:1
    claim: document_number
    value: CREDIMI-DEMO-UMLAUT
    shape: missing_index
- id: rejection_visual_evidence_is_stored
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
