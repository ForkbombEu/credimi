id: WS_RP_MS_Metadata__089
title: Reject a Referenced Token whose status_list uri is malformed.
source:
  path: MessageStructure/Metadata/WS_RP_MS_Metadata__089.md
suite:
  sut: wallet_solution
  role: relying_party
  section: message_structure.metadata
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
  credential_format: ietf_sd_jwt_vc
normative_references:
- title: Token Status List
  section: '6.2'
  url: https://www.ietf.org/archive/id/draft-ietf-oauth-status-list-13.html
# One issuance and one probe per malformed uri: the source's five steps plus the
# unparseable uri the objective also covers. Each probe pins its fixture's
# document_number and fails only on a credential carrying that exact shape.
evidence:
  malformed_uri_issuance_session:
    from: pipeline.fixtures.status-reference.outputs.malformed_uri_issuance
  malformed_uri_probe_exchange:
    from: pipeline.fixtures.status-reference.outputs.malformed_uri_probe
  malformed_uri_visual_evidence:
    from: pipeline.fixtures.status-reference.outputs.malformed_uri_visual_evidence
  uri_missing_scheme_issuance_session:
    from: pipeline.fixtures.status-reference.outputs.uri_missing_scheme_issuance
  uri_missing_scheme_probe_exchange:
    from: pipeline.fixtures.status-reference.outputs.uri_missing_scheme_probe
  uri_missing_scheme_visual_evidence:
    from: pipeline.fixtures.status-reference.outputs.uri_missing_scheme_visual_evidence
  uri_space_in_host_issuance_session:
    from: pipeline.fixtures.status-reference.outputs.uri_space_in_host_issuance
  uri_space_in_host_probe_exchange:
    from: pipeline.fixtures.status-reference.outputs.uri_space_in_host_probe
  uri_space_in_host_visual_evidence:
    from: pipeline.fixtures.status-reference.outputs.uri_space_in_host_visual_evidence
  uri_invalid_percent_encoding_issuance_session:
    from: pipeline.fixtures.status-reference.outputs.uri_invalid_percent_encoding_issuance
  uri_invalid_percent_encoding_probe_exchange:
    from: pipeline.fixtures.status-reference.outputs.uri_invalid_percent_encoding_probe
  uri_invalid_percent_encoding_visual_evidence:
    from: pipeline.fixtures.status-reference.outputs.uri_invalid_percent_encoding_visual_evidence
  uri_illegal_characters_issuance_session:
    from: pipeline.fixtures.status-reference.outputs.uri_illegal_characters_issuance
  uri_illegal_characters_probe_exchange:
    from: pipeline.fixtures.status-reference.outputs.uri_illegal_characters_probe
  uri_illegal_characters_visual_evidence:
    from: pipeline.fixtures.status-reference.outputs.uri_illegal_characters_visual_evidence
  uri_empty_issuance_session:
    from: pipeline.fixtures.status-reference.outputs.uri_empty_issuance
  uri_empty_probe_exchange:
    from: pipeline.fixtures.status-reference.outputs.uri_empty_probe
  uri_empty_visual_evidence:
    from: pipeline.fixtures.status-reference.outputs.uri_empty_visual_evidence
assertions:
# unparseable uri
- id: malformed_uri_issuer_offered_the_status_shape
  validator: json.field_equals
  input: evidence.malformed_uri_issuance_session
  params: { field: status_reference, value: malformed_uri }
- id: malformed_uri_issuer_used_the_identifying_claim_fixture
  validator: json.field_equals
  input: evidence.malformed_uri_issuance_session
  params: { field: fixture_id, value: pid_locality_no_diacritics }
- id: malformed_uri_wallet_retained_no_credential_carrying_the_shape
  validator: oid4vp.malformed_status_credential_absent
  input: evidence.malformed_uri_probe_exchange
  params:
    vct: urn:eudi:pid:1
    claim: document_number
    value: CREDIMI-DEMO-NOUMLAUT
    shape: malformed_uri
- id: malformed_uri_rejection_visual_evidence_is_stored
  validator: evidence.non_empty
  input: evidence.malformed_uri_visual_evidence
# step 1, no scheme
- id: uri_missing_scheme_issuer_offered_the_status_shape
  validator: json.field_equals
  input: evidence.uri_missing_scheme_issuance_session
  params: { field: status_reference, value: uri_missing_scheme }
- id: uri_missing_scheme_issuer_used_the_identifying_claim_fixture
  validator: json.field_equals
  input: evidence.uri_missing_scheme_issuance_session
  params: { field: fixture_id, value: pid_person_b }
- id: uri_missing_scheme_wallet_retained_no_credential_carrying_the_shape
  validator: oid4vp.malformed_status_credential_absent
  input: evidence.uri_missing_scheme_probe_exchange
  params:
    vct: urn:eudi:pid:1
    claim: document_number
    value: CREDIMI-DEMO-002
    shape: uri_missing_scheme
- id: uri_missing_scheme_rejection_visual_evidence_is_stored
  validator: evidence.non_empty
  input: evidence.uri_missing_scheme_visual_evidence
# step 2, unencoded space in the host
- id: uri_space_in_host_issuer_offered_the_status_shape
  validator: json.field_equals
  input: evidence.uri_space_in_host_issuance_session
  params: { field: status_reference, value: uri_space_in_host }
- id: uri_space_in_host_issuer_used_the_identifying_claim_fixture
  validator: json.field_equals
  input: evidence.uri_space_in_host_issuance_session
  params: { field: fixture_id, value: pid_under_18 }
- id: uri_space_in_host_wallet_retained_no_credential_carrying_the_shape
  validator: oid4vp.malformed_status_credential_absent
  input: evidence.uri_space_in_host_probe_exchange
  params:
    vct: urn:eudi:pid:1
    claim: document_number
    value: CREDIMI-DEMO-U18
    shape: uri_space_in_host
- id: uri_space_in_host_rejection_visual_evidence_is_stored
  validator: evidence.non_empty
  input: evidence.uri_space_in_host_visual_evidence
# step 3, invalid percent-encoding
- id: uri_invalid_percent_encoding_issuer_offered_the_status_shape
  validator: json.field_equals
  input: evidence.uri_invalid_percent_encoding_issuance_session
  params: { field: status_reference, value: uri_invalid_percent_encoding }
- id: uri_invalid_percent_encoding_issuer_used_the_identifying_claim_fixture
  validator: json.field_equals
  input: evidence.uri_invalid_percent_encoding_issuance_session
  params: { field: fixture_id, value: pid_expiry_2032 }
- id: uri_invalid_percent_encoding_wallet_retained_no_credential_carrying_the_shape
  validator: oid4vp.malformed_status_credential_absent
  input: evidence.uri_invalid_percent_encoding_probe_exchange
  params:
    vct: urn:eudi:pid:1
    claim: document_number
    value: CREDIMI-DEMO-EXPIRY
    shape: uri_invalid_percent_encoding
- id: uri_invalid_percent_encoding_rejection_visual_evidence_is_stored
  validator: evidence.non_empty
  input: evidence.uri_invalid_percent_encoding_visual_evidence
# step 4, illegal characters <, > and |
- id: uri_illegal_characters_issuer_offered_the_status_shape
  validator: json.field_equals
  input: evidence.uri_illegal_characters_issuance_session
  params: { field: status_reference, value: uri_illegal_characters }
- id: uri_illegal_characters_issuer_used_the_identifying_claim_fixture
  validator: json.field_equals
  input: evidence.uri_illegal_characters_issuance_session
  params: { field: fixture_id, value: pid_locality_diacritics }
- id: uri_illegal_characters_wallet_retained_no_credential_carrying_the_shape
  validator: oid4vp.malformed_status_credential_absent
  input: evidence.uri_illegal_characters_probe_exchange
  params:
    vct: urn:eudi:pid:1
    claim: document_number
    value: CREDIMI-DEMO-UMLAUT
    shape: uri_illegal_characters
- id: uri_illegal_characters_rejection_visual_evidence_is_stored
  validator: evidence.non_empty
  input: evidence.uri_illegal_characters_visual_evidence
# step 5, empty string
- id: uri_empty_issuer_offered_the_status_shape
  validator: json.field_equals
  input: evidence.uri_empty_issuance_session
  params: { field: status_reference, value: uri_empty }
- id: uri_empty_issuer_used_the_identifying_claim_fixture
  validator: json.field_equals
  input: evidence.uri_empty_issuance_session
  params: { field: fixture_id, value: pid_family_name_uppercase }
- id: uri_empty_wallet_retained_no_credential_carrying_the_shape
  validator: oid4vp.malformed_status_credential_absent
  input: evidence.uri_empty_probe_exchange
  params:
    vct: urn:eudi:pid:1
    claim: document_number
    value: CREDIMI-DEMO-CASE
    shape: uri_empty
- id: uri_empty_rejection_visual_evidence_is_stored
  validator: evidence.non_empty
  input: evidence.uri_empty_visual_evidence
verdict:
  pass_when: all_assertions_pass
