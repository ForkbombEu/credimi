id: WS_RP_IA_MainInteraction__056
title: Reject a response_uri that fails the strict Client Identifier matching rule.
source:
  path: Interaction/MainInteraction/WS_RP_IA_MainInteraction__056.md
suite:
  sut: wallet_solution
  role: relying_party
  section: interaction.main_interaction
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: '5.9.3'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
- title: OpenID for Verifiable Presentations 1.0
  section: '8.2'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
evidence:
  session:
    from: pipeline.protocol.response-uri-controls.outputs.invalid_response_uri_session
assertions:
- id: x509_san_dns_client_identifier_is_unavailable
  validator: fcaf.skipped
  input: evidence.session
  params:
    reason: >-
      needs a client_id_scheme: x509_san_dns session, because the strict
      response_uri matching rule of OID4VP 5.9 exists only for that Client
      Identifier Prefix; the deployed verifier certificate carries no dNSName
      SAN, so Capture answers 500 there are no SAN-DNS names and never creates
      the session
verdict:
  pass_when: all_assertions_pass
