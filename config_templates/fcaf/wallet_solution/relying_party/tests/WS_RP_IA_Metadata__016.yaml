id: WS_RP_IA_Metadata__016
title: Reject an empty decentralized identifier client metadata object.
source:
  path: Interaction/Metadata/WS_RP_IA_Metadata__016.md
suite:
  sut: wallet_solution
  role: relying_party
  section: interaction.metadata
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
  - title: OpenID for Verifiable Presentations 1.0
    section: "5.9.3"
    url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
evidence:
  request_evidence:
    from: pipeline.wallet.metadata.did-empty.outputs.request_evidence
  request_object:
    from: pipeline.wallet.metadata.did-empty.outputs.request_object
  dcql_exchange:
    from: pipeline.wallet.metadata.did-empty.outputs.dcql_exchange
  visual_evidence:
    from: pipeline.wallet.metadata.did-empty.outputs.visual_evidence
assertions:
  - id: did_key_verifies_request_object
    validator: oid4vp.did_signed_request
    input: evidence.request_evidence
  - id: request_contains_exactly_empty_client_metadata
    validator: jwt.payload_field_equals
    input: evidence.request_object
    params: {field: client_metadata, value: {}}
  - id: empty_client_metadata_returns_invalid_request
    validator: dcql.response_satisfies_constraints
    input: evidence.dcql_exchange
    params: {mode: invalid_request_generic}
  - id: rejection_has_visual_evidence
    validator: evidence.non_empty
    input: evidence.visual_evidence
verdict: {pass_when: all_assertions_pass}
