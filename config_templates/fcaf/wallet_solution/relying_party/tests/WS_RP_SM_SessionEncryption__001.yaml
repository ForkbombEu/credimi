id: WS_RP_SM_SessionEncryption__001
title: Encrypt the Authorization Response as an unsigned JWE.
source:
  path: SecurityMechanisms/SessionEncryption/WS_RP_SM_SessionEncryption__001.md
suite:
  sut: wallet_solution
  role: relying_party
  section: security_mechanisms.session_encryption
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: '8'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
- title: JSON Web Token (JWT)
  section: '5.2'
  url: https://www.rfc-editor.org/rfc/rfc7519
- ref: pipeline.dcql.session-encryption
evidence:
  dcql_exchange:
    from: pipeline.dcql.session-encryption.outputs.dcql_exchange
  encrypted_response:
    from: pipeline.dcql.session-encryption.outputs.encrypted_response
  visual_evidence:
    from: pipeline.dcql.session-encryption.outputs.visual_evidence
assertions:
- id: request_used_direct_post_jwt_response_mode
  validator: json.field_equals
  input: evidence.dcql_exchange
  params: {field: response_mode, value: direct_post.jwt}
- id: response_is_a_compact_jwe
  validator: jose.jwe_encrypted_response
  input: evidence.encrypted_response
- id: response_carries_content_encryption_header
  validator: jose.jwe_protected_header
  input: evidence.encrypted_response
  params: {field: enc, present: true}
- id: response_is_not_nested_signed_jwt
  validator: jose.jwe_protected_header
  input: evidence.encrypted_response
  params: {field: cty, present: false}
- id: wallet_processing_has_visual_evidence
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
