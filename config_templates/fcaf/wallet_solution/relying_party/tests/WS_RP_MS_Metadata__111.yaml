id: WS_RP_MS_Metadata__111
title: Process a signed X.509-hash Request Object.
source:
  path: MessageStructure/Metadata/WS_RP_MS_Metadata__111.md
suite:
  sut: wallet_solution
  role: relying_party
  section: message_structure.metadata
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
  - title: OpenID for Verifiable Presentations 1.0
    section: "5.9.3"
    url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
evidence:
  signed_request_object:
    from: pipeline.wallet.metadata.signed-x509-hash.outputs.signed_request_object
  visual_evidence:
    from: pipeline.wallet.metadata.signed-x509-hash.outputs.visual_evidence
assertions:
  - id: request_object_signature_is_valid
    validator: jose.jws_signed_request
    input: evidence.signed_request_object
  - id: client_id_matches_x509_leaf_hash
    validator: oid4vp.x509_hash_client_id
    input: evidence.signed_request_object
  - id: wallet_proceeds_with_signed_request
    validator: evidence.non_empty
    input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
