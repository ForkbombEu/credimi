id: WS_RP_MS_ProtocolMessages__066
title: Reject a DCQL query with a duplicate credential id.
source:
  path: MessageStructure/ProtocolMessages/WS_RP_MS_ProtocolMessages__066.md
suite:
  sut: wallet_solution
  role: relying_party
  section: message_structure.protocol_messages
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: '6.1'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
- ref: pipeline.dcql.protocol-messages
evidence:
  dcql_exchange:
    from: pipeline.dcql.credential-id-duplicate.outputs.dcql_exchange
  visual_evidence:
    from: pipeline.dcql.credential-id-duplicate.outputs.visual_evidence
assertions:
# The source accepts any of: an invalid_request error with details, an error
# without details, or discontinuation of the interaction, so the assertion
# accepts any error code and is engagement-guarded (a pass needs the Wallet to
# have retrieved the request). A silent discontinuation leaves no protocol
# evidence behind, which is why no screenshot is required here.
- id: ws_rp_ms_protocolmessages__066_dcql_protocol_valid
  validator: dcql.response_satisfies_constraints
  input: evidence.dcql_exchange
  params:
    mode: request_rejected
- id: ws_rp_ms_protocolmessages__066_visual_evidence_stored
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
