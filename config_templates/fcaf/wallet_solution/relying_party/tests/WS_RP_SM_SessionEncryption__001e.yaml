id: WS_RP_SM_SessionEncryption__001e
title: Decrypt the encrypted Authorization Response.
source: { path: SecurityMechanisms/SessionEncryption/WS_RP_SM_SessionEncryption__001e.md }
suite: { sut: wallet_solution, role: relying_party, section: security_mechanisms.session_encryption }
applicability: { profile: EUDI_generic, presentation_flow: redirects }
normative_references:
  - { title: OpenID for Verifiable Presentations 1.0, section: "6.1", url: "https://openid.net/specs/openid-4-verifiable-presentations-1_0.html" }
evidence:
  session_checks: { from: pipeline.dcql.session-encryption.outputs.session_checks }
  encrypted_response: { from: pipeline.dcql.session-encryption.outputs.encrypted_response }
  encryption_evidence: { from: pipeline.dcql.session-encryption.outputs.encryption_evidence }
assertions:
  - { id: capture_decrypted_and_verified_response, validator: json.field_equals, input: evidence.session_checks, params: { field: presentation_valid, value: true } }
  - { id: authorization_response_is_a_compact_jwe, validator: jose.jwe_encrypted_response, input: evidence.encrypted_response }
  # Decryption by the Verifier proves the key; the kid match additionally proves
  # the Wallet selected the key published in the request's client_metadata.
  - { id: jwe_is_encrypted_to_the_client_metadata_key, validator: oid4vp.response_encryption, input: evidence.encryption_evidence, params: { match_metadata_kid: true } }
verdict: { pass_when: all_assertions_pass }
