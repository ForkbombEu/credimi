id: WS_RP_SM_SessionBinding__002
title: FCAF WS_RP_SM_SessionBinding__002
source:
  path: SecurityMechanisms/SessionBinding/WS_RP_SM_SessionBinding__002.md
suite:
  sut: wallet_solution
  role: relying_party
  section: security_mechanisms.session_binding
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: '6.1'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
- ref: pipeline.session-binding.missing-nonce
evidence:
  capture_session:
    from: pipeline.session-binding.missing-nonce.outputs.capture_session
  request_object:
    from: pipeline.session-binding.missing-nonce.outputs.request_object
  visual_evidence:
    from: pipeline.session-binding.missing-nonce.outputs.visual_evidence
assertions:
- id: signed_request_omits_nonce
  validator: jwt.payload_field_presence
  input: evidence.request_object
  params: {field: nonce, present: false}
- id: wallet_returned_invalid_request_without_a_presentation
  validator: oid4vp.error_response_required
  input: evidence.capture_session
  params: {code: invalid_request}
- id: wallet_processing_has_visual_evidence
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
