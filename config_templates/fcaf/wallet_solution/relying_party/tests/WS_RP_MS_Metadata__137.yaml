id: WS_RP_MS_Metadata__137
title: Omit Request Object signing algorithms for the redirect_uri prefix
source:
  path: MessageStructure/Metadata/WS_RP_MS_Metadata__137.md
suite:
  sut: wallet_solution
  role: relying_party
  section: message_structure.metadata
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: '5.10'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
evidence:
  session: { from: pipeline.protocol.client-id-prefix-controls.outputs.signed_redirect_uri_session }
  outer_request: { from: pipeline.protocol.client-id-prefix-controls.outputs.signed_redirect_uri_outer_request }
  request_uri_payload: { from: pipeline.protocol.client-id-prefix-controls.outputs.signed_redirect_uri_request_uri_payload }
  visual_evidence: { from: pipeline.protocol.client-id-prefix-controls.outputs.signed_redirect_uri_visual_evidence }
assertions:
- id: outer_request_uses_redirect_uri_prefix
  validator: json.field_string_prefix
  input: evidence.outer_request
  params: { field: client_id, prefix: "redirect_uri:" }
- id: outer_request_asks_for_post_retrieval
  validator: json.field_equals
  input: evidence.outer_request
  params: { field: request_uri_method, value: post }
- id: wallet_retrieves_request_object_with_post
  validator: oid4vp.request_uri_retrieval
  input: evidence.session
  params: { method: POST }
- id: wallet_metadata_omits_signing_algorithms
  validator: oid4vp.wallet_metadata
  input: evidence.request_uri_payload
  params: { absent: [request_object_signing_alg_values_supported] }
- id: visual_evidence_is_stored
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
