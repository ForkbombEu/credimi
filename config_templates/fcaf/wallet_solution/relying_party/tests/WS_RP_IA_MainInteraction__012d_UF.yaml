id: WS_RP_IA_MainInteraction__012d_UF
title: Reject an unavailable mdoc data element.
source:
  path: Interaction/MainInteraction/WS_RP_IA_MainInteraction__012d_UF.md
suite:
  sut: wallet_solution
  role: relying_party
  section: interaction.main_interaction
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
  credential_format: iso_mdoc
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: '6.4'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
- ref: pipeline.interaction.pid-mdoc-missing-element
evidence:
  dcql_exchange:
    from: pipeline.interaction.pid-mdoc-missing-element.outputs.dcql_exchange
  visual_evidence:
    from: pipeline.interaction.pid-mdoc-missing-element.outputs.visual_evidence
  possession_exchange:
    from: pipeline.interaction.pid-mdoc-two-elements.outputs.dcql_exchange
assertions:
# Precondition: the Wallet holds default_credential_A, the mdoc PID the absent
# data element is looked up in. The scenario's two-element presentation shares
# that PID (its CBOR proves the element is disclosed), so an empty Wallet cannot
# pass the probe below.
- id: wallet_holds_the_pid_mdoc_the_request_targets
  validator: dcql.response_satisfies_constraints
  input: evidence.possession_exchange
  params:
    mode: mdoc_claim_path_presentation
    expected_claim_path:
    - eu.europa.ec.eudi.pid.1
    - given_name
- id: only_the_unavailable_mdoc_element_is_requested
  validator: oid4vp.dcql_requested_claim_paths
  input: evidence.dcql_exchange
  params:
    format: mso_mdoc
    paths:
    - - eu.europa.ec.eudi.pid.1
      - unavailable_element
- id: unavailable_mdoc_element_is_requested
  validator: dcql.response_satisfies_constraints
  input: evidence.dcql_exchange
  params:
    mode: mdoc_claim_path_no_match
    expected_claim_path:
    - eu.europa.ec.eudi.pid.1
    - unavailable_element
- id: wallet_rejects_or_discontinues_the_unavailable_mdoc_element_request
  validator: dcql.response_satisfies_constraints
  input: evidence.dcql_exchange
  params:
    mode: request_rejected
- id: unavailable_mdoc_element_request_has_visual_evidence
  validator: evidence.screenshot_named
  input: evidence.visual_evidence
  params: { name: request-refused }
verdict:
  pass_when: all_assertions_pass
