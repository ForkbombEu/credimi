id: WS_RP_MS_Metadata__108
title: Process verifier metadata exclusively from client_metadata.
source:
  path: MessageStructure/Metadata/WS_RP_MS_Metadata__108.md
suite:
  sut: wallet_solution
  role: relying_party
  section: message_structure.metadata
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
  - title: OpenID for Verifiable Presentations 1.0
    section: "5.1, 5.9.3"
    url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
evidence:
  request_object:
    from: pipeline.wallet.protocol.request-object-by-value.outputs.request_object
  wallet_response:
    from: pipeline.wallet.protocol.request-object-by-value.outputs.wallet_response
  visual_evidence:
    from: pipeline.wallet.protocol.request-object-by-value.outputs.visual_evidence
assertions:
  - id: verifier_metadata_is_exclusive_to_client_metadata
    validator: oid4vp.verifier_metadata_exclusive
    input: evidence.request_object
  - id: wallet_processes_client_metadata
    validator: json.field_required
    input: evidence.wallet_response
    params:
      field: vp_token
  - id: successful_flow_has_visual_evidence
    validator: evidence.minimum_items
    input: evidence.visual_evidence
    params:
      min_items: 2
verdict:
  pass_when: all_assertions_pass
