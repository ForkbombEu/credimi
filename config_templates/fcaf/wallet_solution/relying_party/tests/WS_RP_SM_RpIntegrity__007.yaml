id: WS_RP_SM_RpIntegrity__007
title: Reject a DID Request Object signed by a key the DID document does not list
source:
  path: SecurityMechanisms/RpIntegrity/WS_RP_SM_RpIntegrity__007.md
suite:
  sut: wallet_solution
  role: relying_party
  section: security_mechanisms.rp_integrity
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
normative_references:
- title: OpenID for Verifiable Presentations 1.0
  section: '5.9.3'
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html
evidence:
  session: { from: pipeline.protocol.client-id-binding-controls.outputs.did_unlisted_key_session }
  did_request: { from: pipeline.protocol.client-id-binding-controls.outputs.did_unlisted_key_evidence }
  visual_evidence: { from: pipeline.protocol.client-id-binding-controls.outputs.did_unlisted_key_visual_evidence }
assertions:
- id: no_did_verification_method_verifies_the_signature
  validator: oid4vp.did_signing_key_unlisted
  input: evidence.did_request
- id: wallet_retrieves_request_object_with_post
  validator: oid4vp.request_uri_retrieval
  input: evidence.session
  params: { method: POST }
- id: wallet_returns_invalid_request
  validator: oid4vp.error_response_required
  input: evidence.session
  params: { code: invalid_request }
- id: visual_evidence_is_stored
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
