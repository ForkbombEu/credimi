id: WS_RP_MS_Metadata__099
title: Reject a COSE Referenced Token whose status_list uri is malformed.
source:
  path: MessageStructure/Metadata/WS_RP_MS_Metadata__099.md
suite:
  sut: wallet_solution
  role: relying_party
  section: message_structure.metadata
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
  credential_format: iso_mdoc
normative_references:
- title: Token Status List
  section: '6.3'
  url: https://www.ietf.org/archive/id/draft-ietf-oauth-status-list-13.html
evidence:
  issuance_session:
    from: pipeline.fixtures.status-reference.mdoc.outputs.malformed_uri_issuance
  probe_exchange:
    from: pipeline.fixtures.status-reference.mdoc.outputs.malformed_uri_probe
  visual_evidence:
    from: pipeline.fixtures.status-reference.mdoc.outputs.malformed_uri_visual_evidence
assertions:
- id: issuer_offered_the_malformed_status_reference
  validator: json.field_equals
  input: evidence.issuance_session
  params: { field: status_reference, value: malformed_uri }
- id: issuer_used_the_identifying_claim_fixture
  validator: json.field_equals
  input: evidence.issuance_session
  params: { field: fixture_id, value: pid_locality_no_diacritics }
- id: issuer_offered_an_mdoc_pid
  validator: json.field_equals
  input: evidence.issuance_session
  params: { field: credential_configuration_id, value: urn:eu.europa.ec.eudi:pid:1.mdoc.key-attestation-required }
# The source lists five malformed-URI shapes; Capture's malformed_uri issues
# only the unparseable one, the same gap WS_RP_MS_Metadata__089 records.
- id: wallet_retained_no_mdoc_carrying_the_malformed_status
  validator: oid4vp.malformed_status_credential_absent
  input: evidence.probe_exchange
  params:
    doctype: eu.europa.ec.eudi.pid.1
    namespace: eu.europa.ec.eudi.pid.1
    claim: document_number
    value: CREDIMI-DEMO-NOUMLAUT
    shape: malformed_uri
- id: rejection_visual_evidence_is_stored
  validator: evidence.non_empty
  input: evidence.visual_evidence
verdict:
  pass_when: all_assertions_pass
