id: WS_RP_MS_Metadata__099
title: Reject a COSE Referenced Token whose status_list uri is malformed.
source:
  path: MessageStructure/Metadata/WS_RP_MS_Metadata__099.md
suite:
  sut: wallet_solution
  role: relying_party
  section: message_structure.metadata
applicability:
  profile: EUDI_generic
  presentation_flow: redirects
  credential_format: iso_mdoc
normative_references:
- title: Token Status List
  section: '6.3'
  url: https://www.ietf.org/archive/id/draft-ietf-oauth-status-list-13.html
# One issuance and one probe per malformed uri: the source's five steps plus the
# unparseable uri the objective also covers. Each issuance carries its own
# document_number, and its probe asks for that number alone.
evidence:
  malformed_uri_issuance_session:
    from: pipeline.fixtures.status-reference.mdoc.outputs.malformed_uri_issuance
  malformed_uri_probe_exchange:
    from: pipeline.fixtures.status-reference.mdoc.outputs.malformed_uri_probe
  malformed_uri_visual_evidence:
    from: pipeline.fixtures.status-reference.mdoc.outputs.malformed_uri_visual_evidence
  uri_missing_scheme_issuance_session:
    from: pipeline.fixtures.status-reference.mdoc.outputs.uri_missing_scheme_issuance
  uri_missing_scheme_probe_exchange:
    from: pipeline.fixtures.status-reference.mdoc.outputs.uri_missing_scheme_probe
  uri_missing_scheme_visual_evidence:
    from: pipeline.fixtures.status-reference.mdoc.outputs.uri_missing_scheme_visual_evidence
  uri_space_in_host_issuance_session:
    from: pipeline.fixtures.status-reference.mdoc.outputs.uri_space_in_host_issuance
  uri_space_in_host_probe_exchange:
    from: pipeline.fixtures.status-reference.mdoc.outputs.uri_space_in_host_probe
  uri_space_in_host_visual_evidence:
    from: pipeline.fixtures.status-reference.mdoc.outputs.uri_space_in_host_visual_evidence
  uri_invalid_percent_encoding_issuance_session:
    from: pipeline.fixtures.status-reference.mdoc.outputs.uri_invalid_percent_encoding_issuance
  uri_invalid_percent_encoding_probe_exchange:
    from: pipeline.fixtures.status-reference.mdoc.outputs.uri_invalid_percent_encoding_probe
  uri_invalid_percent_encoding_visual_evidence:
    from: pipeline.fixtures.status-reference.mdoc.outputs.uri_invalid_percent_encoding_visual_evidence
  uri_illegal_characters_issuance_session:
    from: pipeline.fixtures.status-reference.mdoc.outputs.uri_illegal_characters_issuance
  uri_illegal_characters_probe_exchange:
    from: pipeline.fixtures.status-reference.mdoc.outputs.uri_illegal_characters_probe
  uri_illegal_characters_visual_evidence:
    from: pipeline.fixtures.status-reference.mdoc.outputs.uri_illegal_characters_visual_evidence
  uri_empty_issuance_session:
    from: pipeline.fixtures.status-reference.mdoc.outputs.uri_empty_issuance
  uri_empty_probe_exchange:
    from: pipeline.fixtures.status-reference.mdoc.outputs.uri_empty_probe
  uri_empty_visual_evidence:
    from: pipeline.fixtures.status-reference.mdoc.outputs.uri_empty_visual_evidence
assertions:
# unparseable uri
- id: malformed_uri_issuer_offered_the_status_shape
  validator: json.field_equals
  input: evidence.malformed_uri_issuance_session
  params: { field: status_reference, value: malformed_uri }
- id: malformed_uri_issuer_issued_the_probed_document_number
  validator: json.field_equals
  input: evidence.malformed_uri_issuance_session
  params: { field: document_number, value: CREDIMI-MDOC-MALFORMED-URI }
- id: malformed_uri_issuer_offered_an_mdoc_pid
  validator: json.field_equals
  input: evidence.malformed_uri_issuance_session
  params: { field: credential_configuration_id, value: "urn:eu.europa.ec.eudi:pid:1.mdoc.key-attestation-required" }
- id: malformed_uri_wallet_matched_nothing_for_the_refused_document_number
  validator: dcql.response_satisfies_constraints
  input: evidence.malformed_uri_probe_exchange
  params:
    mode: claims_values_no_match
    expected_claim_path: [eu.europa.ec.eudi.pid.1, document_number]
    expected_value: CREDIMI-MDOC-MALFORMED-URI
- id: malformed_uri_wallet_reaction_is_recorded
  validator: evidence.non_empty
  input: evidence.malformed_uri_visual_evidence
# step 1, no scheme
- id: uri_missing_scheme_issuer_offered_the_status_shape
  validator: json.field_equals
  input: evidence.uri_missing_scheme_issuance_session
  params: { field: status_reference, value: uri_missing_scheme }
- id: uri_missing_scheme_issuer_issued_the_probed_document_number
  validator: json.field_equals
  input: evidence.uri_missing_scheme_issuance_session
  params: { field: document_number, value: CREDIMI-MDOC-URI-MISSING-SCHEME }
- id: uri_missing_scheme_issuer_offered_an_mdoc_pid
  validator: json.field_equals
  input: evidence.uri_missing_scheme_issuance_session
  params: { field: credential_configuration_id, value: "urn:eu.europa.ec.eudi:pid:1.mdoc.key-attestation-required" }
- id: uri_missing_scheme_wallet_matched_nothing_for_the_refused_document_number
  validator: dcql.response_satisfies_constraints
  input: evidence.uri_missing_scheme_probe_exchange
  params:
    mode: claims_values_no_match
    expected_claim_path: [eu.europa.ec.eudi.pid.1, document_number]
    expected_value: CREDIMI-MDOC-URI-MISSING-SCHEME
- id: uri_missing_scheme_wallet_reaction_is_recorded
  validator: evidence.non_empty
  input: evidence.uri_missing_scheme_visual_evidence
# step 2, unencoded space in the host
- id: uri_space_in_host_issuer_offered_the_status_shape
  validator: json.field_equals
  input: evidence.uri_space_in_host_issuance_session
  params: { field: status_reference, value: uri_space_in_host }
- id: uri_space_in_host_issuer_issued_the_probed_document_number
  validator: json.field_equals
  input: evidence.uri_space_in_host_issuance_session
  params: { field: document_number, value: CREDIMI-MDOC-URI-SPACE-IN-HOST }
- id: uri_space_in_host_issuer_offered_an_mdoc_pid
  validator: json.field_equals
  input: evidence.uri_space_in_host_issuance_session
  params: { field: credential_configuration_id, value: "urn:eu.europa.ec.eudi:pid:1.mdoc.key-attestation-required" }
- id: uri_space_in_host_wallet_matched_nothing_for_the_refused_document_number
  validator: dcql.response_satisfies_constraints
  input: evidence.uri_space_in_host_probe_exchange
  params:
    mode: claims_values_no_match
    expected_claim_path: [eu.europa.ec.eudi.pid.1, document_number]
    expected_value: CREDIMI-MDOC-URI-SPACE-IN-HOST
- id: uri_space_in_host_wallet_reaction_is_recorded
  validator: evidence.non_empty
  input: evidence.uri_space_in_host_visual_evidence
# step 3, invalid percent-encoding
- id: uri_invalid_percent_encoding_issuer_offered_the_status_shape
  validator: json.field_equals
  input: evidence.uri_invalid_percent_encoding_issuance_session
  params: { field: status_reference, value: uri_invalid_percent_encoding }
- id: uri_invalid_percent_encoding_issuer_issued_the_probed_document_number
  validator: json.field_equals
  input: evidence.uri_invalid_percent_encoding_issuance_session
  params: { field: document_number, value: CREDIMI-MDOC-URI-INVALID-PERCENT-ENCODING }
- id: uri_invalid_percent_encoding_issuer_offered_an_mdoc_pid
  validator: json.field_equals
  input: evidence.uri_invalid_percent_encoding_issuance_session
  params: { field: credential_configuration_id, value: "urn:eu.europa.ec.eudi:pid:1.mdoc.key-attestation-required" }
- id: uri_invalid_percent_encoding_wallet_matched_nothing_for_the_refused_document_number
  validator: dcql.response_satisfies_constraints
  input: evidence.uri_invalid_percent_encoding_probe_exchange
  params:
    mode: claims_values_no_match
    expected_claim_path: [eu.europa.ec.eudi.pid.1, document_number]
    expected_value: CREDIMI-MDOC-URI-INVALID-PERCENT-ENCODING
- id: uri_invalid_percent_encoding_wallet_reaction_is_recorded
  validator: evidence.non_empty
  input: evidence.uri_invalid_percent_encoding_visual_evidence
# step 4, illegal characters <, > and |
- id: uri_illegal_characters_issuer_offered_the_status_shape
  validator: json.field_equals
  input: evidence.uri_illegal_characters_issuance_session
  params: { field: status_reference, value: uri_illegal_characters }
- id: uri_illegal_characters_issuer_issued_the_probed_document_number
  validator: json.field_equals
  input: evidence.uri_illegal_characters_issuance_session
  params: { field: document_number, value: CREDIMI-MDOC-URI-ILLEGAL-CHARACTERS }
- id: uri_illegal_characters_issuer_offered_an_mdoc_pid
  validator: json.field_equals
  input: evidence.uri_illegal_characters_issuance_session
  params: { field: credential_configuration_id, value: "urn:eu.europa.ec.eudi:pid:1.mdoc.key-attestation-required" }
- id: uri_illegal_characters_wallet_matched_nothing_for_the_refused_document_number
  validator: dcql.response_satisfies_constraints
  input: evidence.uri_illegal_characters_probe_exchange
  params:
    mode: claims_values_no_match
    expected_claim_path: [eu.europa.ec.eudi.pid.1, document_number]
    expected_value: CREDIMI-MDOC-URI-ILLEGAL-CHARACTERS
- id: uri_illegal_characters_wallet_reaction_is_recorded
  validator: evidence.non_empty
  input: evidence.uri_illegal_characters_visual_evidence
# step 5, empty string
- id: uri_empty_issuer_offered_the_status_shape
  validator: json.field_equals
  input: evidence.uri_empty_issuance_session
  params: { field: status_reference, value: uri_empty }
- id: uri_empty_issuer_issued_the_probed_document_number
  validator: json.field_equals
  input: evidence.uri_empty_issuance_session
  params: { field: document_number, value: CREDIMI-MDOC-URI-EMPTY }
- id: uri_empty_issuer_offered_an_mdoc_pid
  validator: json.field_equals
  input: evidence.uri_empty_issuance_session
  params: { field: credential_configuration_id, value: "urn:eu.europa.ec.eudi:pid:1.mdoc.key-attestation-required" }
- id: uri_empty_wallet_matched_nothing_for_the_refused_document_number
  validator: dcql.response_satisfies_constraints
  input: evidence.uri_empty_probe_exchange
  params:
    mode: claims_values_no_match
    expected_claim_path: [eu.europa.ec.eudi.pid.1, document_number]
    expected_value: CREDIMI-MDOC-URI-EMPTY
- id: uri_empty_wallet_reaction_is_recorded
  validator: evidence.non_empty
  input: evidence.uri_empty_visual_evidence
verdict:
  pass_when: all_assertions_pass
