appId: eu.europa.ec.euidi
name: FCAF debug - obtain PID from local emulator API
tags:
  - fcaf
  - debug
  - emulator
---
- launchApp:
    stopApp: false
    clearState: false
- openLink:
    link: ${DEEPLINK}
    autoVerify: false
    browser: false
- runFlow:
    when:
      visible: "EUDI Wallet"
    commands:
      - tapOn:
          text: "EUDI Wallet"
          optional: true
- runFlow:
    when:
      visible: "Just once"
    commands:
      - tapOn:
          text: "Just once"
          optional: true
- extendedWaitUntil:
    visible: "Welcome back|Continue|Accept|Add document|Add|Credential"
    timeout: 120000
- runFlow:
    when:
      visible: "Welcome back"
    commands:
      - tapOn:
          point: "11%,40%"
      - inputText: "123456"
      - hideKeyboard
      - tapOn:
          point: "50%,10%"
- tapOn:
    text: "(?i)(continue|accept|add document|add|save)"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: fcaf-debug-pid-obtained
