[project]
name = "credimi-action-author"
version = "0.1.0"
description = "Experimental Temporal Agent Harness agent that authors Maestro wallet actions (local proof of concept)"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = [
    # Pre-1.0 and experimental: APIs change between releases, so the version is pinned exactly.
    # `ui`: the packaged web UI (`temporal-agent-harness serve` / `session-manager`).
    "temporal-agent-harness[openai-agents,ui]==0.8.0",
    "httpx>=0.28",
    "fastapi>=0.115",
    "pyyaml>=6.0",
    "pyjwt[crypto]>=2.10",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credimi_action_author"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
